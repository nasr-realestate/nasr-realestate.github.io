name = "nasr-properties-sync"
main = "properties-sync-worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "nasr-market-db"
database_id = "ace5c9a2-c6b1-47b3-adf1-77e84ac50abf"

# Cron: كل ساعة عند الدقيقة 17
[triggers]
crons = ["17 * * * *"]

# ملاحظات:
#  • GITHUB_TOKEN (اختياري): يرفع حد GitHub API من 60 لـ5000 طلب/ساعة. المستودع عام
#    والقراءة من raw.githubusercontent لا تحتاج توكن، فالتوكن اختياري تمامًا.
#  • SYNC_TOKEN (اختياري لكن مُستحسن): لو مضبوط، لازم يُرسل كـ
#    Authorization: Bearer <token> أو ?token=<token> مع POST /sync.
#  • SYNC_FETCH_BUDGET (اختياري): أقصى عدد ملفات تُقرأ في التشغيل الواحد (الافتراضي 40).
#  • SYNC_ALLOW_DDL=0 (اختياري): يمنع إنشاء جدول الحالة properties_sync_state.
#  • LISTINGS_TABLE / STATE_TABLE / GITHUB_BRANCH (اختياري): تجاوز أسماء الجداول أو الفرع
#    بدون تعديل الكود (يمر على تنقية صارمة للأسماء).

# (last reviewed: 2026-10-05)
