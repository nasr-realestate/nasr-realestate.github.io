# Isolated CRM test Worker configuration only. It binds only the dedicated
# synthetic-data D1. No route or Access host is configured; do not deploy until
# the owner-only Access application and verified test hostname are ready.
name = "nasr-crm-api-test"
main = "crm-worker.js"
compatibility_date = "2026-09-04"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "nasr-crm-test-db"
database_id = "65bfcb14-4b48-423b-916f-00eefdb9ae1e"
migrations_dir = "migrations"

# The private Arabic UI is served by this same Worker origin, behind the same
# Access application. Static files stay under _worker/ and are not published by Jekyll.
[assets]
directory = "crm-ui"
binding = "ASSETS"

# Do not set ACCESS_TEAM_DOMAIN, ACCESS_AUD, ADMIN_EMAIL, CRM_ALLOWED_ORIGIN,
# CRM_SITE_SOURCE_ID, or CRM_NASR_AREA_IDS until the test Access application,
# hostname, UI origin, and synthetic listing scope are created and verified.

[observability]
enabled = true
