name = "nasr-crm-api-test"
main = "crm-worker.js"
compatibility_date = "2025-11-17"
workers_dev = true
preview_urls = false

[assets]
directory = "crm-ui"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "nasr-crm-test-db-v2"
database_id = "760079c6-85f9-4a30-aa19-9a66f95d421a"
migrations_dir = "migrations"

[vars]
CRM_ALLOWED_ORIGIN = "https://nasr-crm-api-test.footcai-555.workers.dev"
CRM_SITE_SOURCE_ID = "9009"
CRM_NASR_AREA_IDS = "90001"

[triggers]
crons = ["*/15 * * * *"]

# Required secrets (store ONLY as Cloudflare Worker Secrets; NEVER commit to git, JS, or logs):
# - CRM_SESSION_SECRET        (>= 32 random chars; HMAC-SHA256 pepper for session/CSRF/IP hashes)
# - CRM_ACCESS_CODE_VERIFIER  (preferred: pbkdf2-sha256$<iterations>$<salt_b64url>$<hash_b64url>)
#   OR CRM_ACCESS_CODE        (>= 24 non-whitespace random chars)
