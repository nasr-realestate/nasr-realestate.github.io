#
# الإعدادات الحيّة الفعلية لـ royal-snow-ea32 (run 38052254442):
#   compatibility_date = 2026-09-04   ← ليس 2026-09-01 (كان هذا الملف يخالف الإنتاج)
#   bindings:
#     d1              DB                → nasr-market-db (ace5c9a2-c6b1-47b3-adf1-77e84ac50abf)
#     plain_text      GEMINI_MODEL      (متغيّر قائم — يُحافظ عليه ولا يُحذف)
#     secret_text     GEMINI_API_KEY
#     secret_text     IMGBB_API_KEY
#     kv_namespace    PUSH_SUBS         → nasr-push-subs (6987204b82e146c897127283daa7bea5)
#     secret_text     VAPID_PRIVATE_KEY   (خاص — لا يُطبع ولا يُخزَّن في Git)
#     secret_text     VAPID_PUBLIC_KEY
#     secret_text     PUSH_SEND_SECRET
name = "royal-snow-ea32"
main = "worker.js"
