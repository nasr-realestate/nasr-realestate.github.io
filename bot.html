<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سمسار طلبك | المساعد العقاري الذكي</title>
    
    <!-- خط Cairo للهوية العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
        }

        /* ============ الهيدر ============ */
        .header-elite {
            height: 70px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid #d4af37;
            position: relative;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }

        .header-elite .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-elite img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
        }

        .header-elite .brand-text {
            display: flex;
            flex-direction: column;
        }

        .header-elite .brand-text .main-title {
            color: #d4af37;
            font-weight: 900;
            font-size: 1.1rem;
            line-height: 1.2;
        }

        .header-elite .brand-text .sub-title {
            color: #888;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .back-btn {
            background: #d4af37;
            color: #0a0a0a;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .back-btn:hover {
            background: #f0c94a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }

        /* ============ حاوية البوت ============ */
        #bot-frame-container {
            width: 100%;
            height: calc(100% - 120px);
            background: #0a0a0a;
            position: relative;
        }

        /* ============ الشريط السفلي ============ */
        .elite-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #d4af37;
            font-size: 0.75rem;
            font-weight: 700;
            border-top: 1px solid #2a2a2a;
        }

        .elite-footer .dot {
            width: 6px;
            height: 6px;
            background: #d4af37;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ============ تحميل ============ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #1a1a1a;
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #d4af37;
            font-weight: 900;
            margin-top: 20px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- شاشة التحميل -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">جاري تجهيز سمسار طلبك...</div>
    </div>

    <!-- الهيدر السيادي -->
    <div class="header-elite">
        <div class="brand">
            <img src="assets/img/logo.webp" 
                 onerror="this.src='https://nasr-realestate.github.io/assets/img/logo.webp'" 
                 alt="سمسار طلبك">
            <div class="brand-text">
                <span class="main-title">سمسار طلبك</span>
                <span class="sub-title">المساعد العقاري الذكي</span>
            </div>
        </div>
        <a href="index.html" class="back-btn">
            <span>✕</span>
            <span>إغلاق</span>
        </a>
    </div>

    <!-- حاوية البوت -->
    <div id="bot-frame-container">
        <!-- كود تضمين JotForm Agent الخاص بك -->
        <script src='https://cdn.jotfor.ms/agent/embedjs/019d95efcafa75be955b3a9f5775be53337b/embed.js'></script>
    </div>

    <!-- الشريط السفلي -->
    <div class="elite-footer">
        <span class="dot"></span>
        <span>سمسار طلبك جاهز لخدمتك - خزانة النخبة ٢٠٢٦</span>
        <span class="dot"></span>
    </div>

    <script>
        // إخفاء شاشة التحميل عند اكتمال تحميل الصفحة
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1500);
        });

        // ضبط أبعاد iframe عند إنشائه
        const observer = new MutationObserver(function(mutations) {
            const iframe = document.querySelector('iframe');
            if (iframe) {
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.style.minHeight = '500px';
            }
        });

        observer.observe(document.getElementById('bot-frame-container'), {
            childList: true,
            subtree: true
        });
    </script>

</body>
</html>
