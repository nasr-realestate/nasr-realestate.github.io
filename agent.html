<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الوكيل الذكي | أ. طارق طنطاوي</title>

  <!-- الخطوط والأيقونات -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --gold: #d4af37;
      --gold-hover: #b8962d;
      --dark-bg: #111111;
      --dark-card: #1a1a1a;
      --text-light: #f5f5f5;
      --text-muted: #aaa;
      --ok: #23c16b;
      --warn: #f0b429;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--dark-bg);
      font-family: 'Cairo', sans-serif;
      overflow: hidden;
    }

    .agent-app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 650px;
      margin: 0 auto;
      background: var(--dark-card);
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
    }

    /* الهيدر الخاص بالوكيل */
    .agent-header {
      background: linear-gradient(135deg, #0d0d0d, #222222);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      z-index: 10;
    }

    .agent-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    .agent-info h1 {
      color: #ffffff;
      font-size: 1.05rem;
      margin: 0;
      font-weight: 900;
    }

    .agent-info p {
      color: var(--gold);
      font-size: 0.78rem;
      margin: 2px 0 0 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #2ecc71;
    }

    /* شريط مؤشر التأهيل */
    .qual-box {
      background: #161616;
      border-bottom: 1px solid rgba(212, 175, 55, 0.12);
      padding: 10px 16px;
      color: #ddd;
      font-size: 13px;
    }

    .qual-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .qual-label strong { color: var(--gold); }
    .qual-state.wait { color: var(--warn); font-weight: 700; }
    .qual-state.ready { color: var(--ok); font-weight: 800; }

    .progress-track {
      height: 8px;
      background: #2a2a2a;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.35s ease;
      background: linear-gradient(90deg, var(--gold), var(--ok));
    }

    /* منطقة الرسائل */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #141414;
      padding-bottom: 80px;
    }

    .msg {
      max-width: 84%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-bot {
      background: #222222;
      color: var(--text-light);
      align-self: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top-right-radius: 4px;
    }

    .msg-user {
      background: linear-gradient(135deg, var(--gold), var(--gold-hover));
      color: #000;
      align-self: flex-end;
      font-weight: 700;
      border-top-left-radius: 4px;
    }

    .typing-indicator-box {
      display: none;
      align-self: flex-start;
      background: #222222;
      padding: 10px 14px;
      border-radius: 14px;
      border-top-right-radius: 4px;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* الفوتر الخاص بالوكيل (زر تصفح الكتالوج العائم) */
    .agent-custom-footer {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(17, 17, 17, 0.92);
      border: 1px solid var(--gold);
      border-radius: 30px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(8px);
      text-decoration: none;
      transition: transform 0.2s;
    }

    .agent-custom-footer:hover {
      transform: translateX(-50%) scale(1.03);
    }

    .semsar-logo-img { width: 24px; height: 24px; border-radius: 50%; }
    .semsar-bar-text { color: var(--gold); font-size: 0.85rem; font-weight: 700; }

    /* حقل الإدخال السفلي مع زر الإرسال الصريح */
    .chat-input-area {
      background: #1a1a1a;
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      z-index: 5;
    }

    #user-input {
      flex: 1;
      background: #262626;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 25px;
      padding: 10px 16px;
      color: #fff;
      outline: none;
      font-size: 14px;
      font-family: 'Cairo', sans-serif;
      transition: 0.3s;
    }

    #user-input:focus {
      border-color: var(--gold);
      background: #2d2d2d;
    }

    #send-btn {
      background: var(--gold);
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 16px;
      transition: 0.2s ease;
      flex-shrink: 0;
    }

    #send-btn:hover {
      transform: rotate(-12deg) scale(1.05);
      background: var(--gold-hover);
    }

    /* زر الواتساب لتأكيد الصفقة */
    .deal-btn-wrapper {
      padding: 0 12px 12px 12px;
      background: #1a1a1a;
    }

    .deal-btn {
      width: 100%;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 800;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      transition: 0.25s;
    }

    .deal-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: #333;
      color: #888;
    }
  </style>
</head>
<body>

<div class="agent-app-container">
  
  <!-- هيدر الوكيل -->
  <header class="agent-header">
    <div class="agent-profile">
      <!-- يمكنك تغيير مسار الصورة هنا إلى أي رابط تفضله -->
      <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي" class="agent-avatar" onerror="this.src='https://nasr-realestate.github.io/assets/img/social-home.webp'">
      <div class="agent-info">
        <h1>طارق طنطاوي</h1>
        <p><span class="status-dot"></span> تأهيل ذكي لعملاء مدينة نصر وهليوبوليس</p>
      </div>
    </div>
  </header>

  <!-- شريط مؤشر التأهيل -->
  <div class="qual-box">
    <div class="qual-row">
      <div>مؤشر التأهيل: <strong id="qual-score">0/5</strong></div>
      <div id="qual-state" class="qual-state wait">نجمع بيانات أكثر</div>
    </div>
    <div class="progress-track"><div id="qual-progress" class="progress-fill"></div></div>
  </div>

  <!-- منطقة المحادثة والرسائل -->
  <div class="chat-area" id="chat-messages">
    <div id="tarek-typing" class="typing-indicator-box">جاري تحضير الرد...</div>
  </div>

  <!-- الفوتر المخصص للوكيل: زر الانتقال للكتالوج الرئيسي -->
  <a href="/" class="agent-custom-footer">
    <img src="https://nasr-realestate.github.io/assets/img/logo.webp" class="semsar-logo-img" alt="سمسار طلبك" onerror="this.src='https://via.placeholder.com/24'">
    <span class="semsar-bar-text">تصفح المعرض والكتالوج 🏛️</span>
  </a>

  <!-- منطقة الإدخال وزر الإرسال الصريح -->
  <div class="chat-input-area">
    <input type="text" id="user-input" placeholder="اكتب استفسارك هنا..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button id="send-btn" onclick="sendMsg()" aria-label="إرسال">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>

  <!-- زر حسم الصفقة عبر الواتساب -->
  <div class="deal-btn-wrapper">
    <button id="dealBtn" class="deal-btn disabled" onclick="openDealWhatsApp()">
      <i class="fab fa-whatsapp" style="font-size: 18px;"></i>
      <span id="dealBtnText">يفتح بعد التأهيل أو بطلبك المباشر</span>
    </button>
  </div>

</div>

<script>
  const WORKER_URL = "https://royal-snow-ea32.footcai-555.workers.dev/";
  const WHATSAPP_URL = "https://wa.me/201147758857";
  const STORAGE_KEY = "tarek_agent_chat_memory_v1";

  let chatHistory = [];
  let qualificationScore = 0;
  let canShareWhatsapp = false;

  function normalizeText(s) {
    return String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
  }

  function detectDirectContactRequest(text) {
    const t = normalizeText(text);
    const keys = ["واتساب", "whatsapp", "رقم", "تواصل", "اتصال", "كلم", "مكالمة", "معاينة", "احجز"];
    return keys.some(k => t.includes(k));
  }

  function computeQualification(history) {
    const userText = history
      .filter(m => m.type === "user")
      .map(m => m.text)
      .join(" \n ")
      .toLowerCase();

    const hasIntent = /(اشتري|شراء|بدور|عايز شقة|عايز شقه|محتاج شقة|بيع|بائع|اعرض عقار)/i.test(userText);
    const hasBudget = /(ميزانية|ميزانيه|مليون|الف|ألف|جنيه|سعر|budget|k|m)/i.test(userText);
    const hasLocation = /(مدينة نصر|مدينه نصر|عباس العقاد|مكرم عبيد|مصطفى النحاس|الحي السابع|الحي الثامن|زهراء مدينة نصر|المنطقة التاسعة|الواحة|مصر الجديدة|هليوبوليس)/i.test(userText);
    const hasSpecs = /(متر|غرف|غرفة|حمام|دور|تشطيب|فيو|واجهة|واجهه|مصعد|اسانسير)/i.test(userText);
    const hasTimeline = /(جاهز|خلال|الشهر|فوري|أسبوع|اسبوع|وقت|ميعاد|موعد)/i.test(userText);

    const score = [hasIntent, hasBudget, hasLocation, hasSpecs, hasTimeline].filter(Boolean).length;
    return { score, qualified: score >= 4 };
  }

  function updateQualificationUI() {
    const scoreEl = document.getElementById("qual-score");
    const stateEl = document.getElementById("qual-state");
    const fillEl = document.getElementById("qual-progress");
    const dealBtn = document.getElementById("dealBtn");
    const dealBtnText = document.getElementById("dealBtnText");

    scoreEl.textContent = `${qualificationScore}/5`;
    fillEl.style.width = `${Math.max(0, Math.min(100, (qualificationScore / 5) * 100))}%`;

    if (canShareWhatsapp) {
      stateEl.className = "qual-state ready";
      stateEl.textContent = "جاهز للتواصل المباشر 🎯";
      dealBtn.classList.remove("disabled");
      dealBtnText.textContent = "حسم الصفقة عبر الواتساب المباشر";
    } else {
      stateEl.className = "qual-state wait";
      stateEl.textContent = "نجمع بيانات أكثر";
      dealBtn.classList.add("disabled");
      dealBtnText.textContent = "يفتح بعد التأهيل أو بطلبك المباشر";
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      chatHistory,
      qualificationScore,
      canShareWhatsapp
    }));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!Array.isArray(data.chatHistory)) return false;

      chatHistory = data.chatHistory.slice(-24);
      qualificationScore = Number(data.qualificationScore || 0);
      canShareWhatsapp = Boolean(data.canShareWhatsapp);
      return true;
    } catch {
      return false;
    }
  }

  function clearMessagesAndRehydrate() {
    const container = document.getElementById("chat-messages");
    const typingBox = document.getElementById("tarek-typing");

    Array.from(container.querySelectorAll(".msg")).forEach((n) => n.remove());
    chatHistory.forEach(msg => renderMsg(msg.text, msg.type));
    container.appendChild(typingBox);
    scrollBottom();
  }

  function openDealWhatsApp() {
    if (!canShareWhatsapp) return;
    window.open(WHATSAPP_URL, "_blank");
  }

  function renderMsg(text, type) {
    const container = document.getElementById("chat-messages");
    const typingBox = document.getElementById("tarek-typing");

    const div = document.createElement("div");
    div.className = `msg msg-${type}`;
    div.innerText = text;

    container.insertBefore(div, typingBox);
    scrollBottom();
    return div;
  }

  function scrollBottom() {
    const container = document.getElementById("chat-messages");
    container.scrollTop = container.scrollHeight;
  }

  function pushHistory(text, type) {
    chatHistory.push({ text, type, ts: Date.now() });
    if (chatHistory.length > 24) chatHistory.shift();

    const q = computeQualification(chatHistory);
    qualificationScore = q.score;
    if (q.qualified) canShareWhatsapp = true;

    saveState();
    updateQualificationUI();
  }

  async function sendMsg() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    renderMsg(text, "user");
    pushHistory(text, "user");

    if (detectDirectContactRequest(text)) {
      canShareWhatsapp = true;
      updateQualificationUI();
      saveState();
    }

    input.value = "";

    const typing = document.getElementById("tarek-typing");
    typing.style.display = "block";
    scrollBottom();

    try {
      const historyForApi = chatHistory
        .filter(m => m.type === "user" || m.type === "bot")
        .slice(-10)
        .map(m => ({ role: m.type === "bot" ? "assistant" : "user", message: m.text }));

      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: historyForApi })
      });

      const data = await res.json();
      typing.style.display = "none";

      const botReply = data.response || "تعذر تنفيذ الطلب الآن. حاول بعد قليل.";

      if (typeof data.qualificationScore === "number") {
        qualificationScore = data.qualificationScore;
      }
      if (typeof data.canShareWhatsapp === "boolean") {
        canShareWhatsapp = data.canShareWhatsapp;
      }
      if (typeof data.qualified === "boolean" && data.qualified) {
        canShareWhatsapp = true;
      }

      renderMsg(botReply, "bot");
      pushHistory(botReply, "bot");
      updateQualificationUI();
    } catch (e) {
      typing.style.display = "none";
      const fallback = "في مشكلة اتصال مؤقتة. كمّل معايا بياناتك (المنطقة/المساحة/السعر) وأنا أتابع معاك هنا.";
      renderMsg(fallback, "bot");
      pushHistory(fallback, "bot");
    }
  }

  window.onload = () => {
    const hasState = loadState();
    if (!hasState) {
      chatHistory = [
        {
          text: "أهلاً بك، معاك طارق طنطاوي. خلّيني أفلترلك أفضل فرص مدينة نصر وهليوبوليس — بتشتري ولا بتبيع؟",
          type: "bot",
          ts: Date.now()
        }
      ];
      qualificationScore = 0;
      canShareWhatsapp = false;
      saveState();
    }

    clearMessagesAndRehydrate();
    updateQualificationUI();
  };
</script>

</body>
</html>
