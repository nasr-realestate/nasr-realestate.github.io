<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta property="og:title" content="الوكيل الذكي | أ. طارق طنطاوي - سمسار طلبك" />
  <meta property="og:description" content="تحدث مع طارق طنطاوي، خبير العقارات في مدينة نصر بخبرة من 2014. استشارة فورية وعقارات نخبوية." />
  <meta property="og:image" content="https://nasr-realestate.github.io/assets/img/team/tareq.webp" />
  <title>الوكيل الذكي | أ. طارق طنطاوي - سمسار طلبك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; background: #0a0a0a; font-family: 'Cairo', sans-serif; overflow: hidden; }
    :root {
      --wa-header: #075e54;
      --wa-bg: #efeae2;
      --wa-msg-in: #ffffff;
      --wa-msg-out: #dcf8c6;
      --wa-green: #25d366;
    }
    .agent-app {
      max-width: 650px; height: 100vh; height: 100dvh; margin: 0 auto; background: var(--wa-bg); display: flex; flex-direction: column;
      box-shadow: 0 0 50px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.4s ease; position: relative;
    }
    .agent-app.show { opacity: 1; }
    .agent-header {
      background: var(--wa-header); padding: 10px 16px; display: flex; align-items: center; gap: 12px; color: #fff;
      flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 10;
    }
    .agent-header img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }
    .agent-header .info { flex: 1; }
    .agent-header .info h1 { font-size: 0.95rem; }
    .agent-header .info p { font-size: 0.65rem; opacity: 0.9; display: flex; align-items: center; gap: 4px; }
    .agent-header .info p .dot { width: 7px; height: 7px; background: #2ecc71; border-radius: 50%; display: inline-block; }
    .agent-header .logo-link { color: #fff; font-size: 1.2rem; text-decoration: none; }

    /* تم إخفاء شريط التأهيل تماماً (التأهيل الخفي) لتبدو التجربة بشرية وطبيعية */
    .qual-bar {
      display: none !important;
    }

    .chat-area {
      flex: 1; overflow-y: auto; padding: 14px 14px 110px 14px; display: flex; flex-direction: column; gap: 10px;
      background: var(--wa-bg); background-image: radial-gradient(#cbd5e1 0.8px, transparent 0); background-size: 12px 12px;
    }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.6; box-shadow: 0 1px 2px rgba(0,0,0,0.04); animation: fadeIn 0.2s ease; word-break: break-word; }
    .msg-bot { background: var(--wa-msg-in); align-self: flex-start; border-top-right-radius: 4px; color: #111; }
    .msg-user { background: var(--wa-msg-out); align-self: flex-end; border-top-left-radius: 4px; font-weight: 600; }
    .msg a { color: #075e54; font-weight: 700; text-decoration: underline; }
    .msg-time { font-size: 9px; color: #888; margin-top: 4px; text-align: left; }
    .typing { display: none; align-self: flex-start; background: #fff; padding: 10px 14px; border-radius: 14px; border-top-right-radius: 4px; font-size: 12px; color: #888; }

    .bottom-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #eae6df;
      border-top: 1px solid #d1d7db;
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }

    .input-area {
      padding: 8px 12px; display: flex; gap: 8px; width: 100%; align-items: center;
    }
    .input-area input {
      flex: 1; border: 1px solid #cbd5e1; border-radius: 24px; padding: 10px 16px; background: #fff; font-family: 'Cairo', sans-serif;
      font-size: 14px; outline: none;
    }
    .input-area input:focus { border-color: var(--wa-green); box-shadow: 0 0 0 2px rgba(37,211,102,0.2); }
    .input-area button {
      background: var(--wa-green); border: none; border-radius: 50%; width: 40px; height: 40px; color: #fff;
      font-size: 15px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }

    .deal-wrapper { padding: 4px 12px 10px 12px; width: 100%; }
    .deal-btn {
      width: 100%; background: #25d366; color: #ffffff; border: none; padding: 13px; border-radius: 12px;
      font-weight: 800; font-family: 'Cairo', sans-serif; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 10px; font-size: 1rem; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.5);
      animation: pulseGlow 1.8s infinite;
    }
    .deal-btn:hover { background: #1ebe5d; }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="agent-app" id="app">
  <div class="agent-header">
    <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي">
    <div class="info">
      <h1>طارق طنطاوي</h1>
      <p><span class="dot"></span> خبرة عقارية من 2014</p>
    </div>
    <a href="/" class="logo-link"><i class="fas fa-home"></i></a>
  </div>

  <!-- شريط التأهيل المخفي تماماً عن العميل -->
  <div class="qual-bar">
    <span>التأهيل: <span class="score" id="qualScore">0/5</span></span>
    <div class="progress"><div class="fill" id="qualProgress"></div></div>
    <span class="state wait" id="qualState">جمع بيانات</span>
  </div>

  <div class="chat-area" id="chatMessages">
    <div class="typing" id="typingIndicator">طارق بيكتب...</div>
  </div>

  <div class="bottom-dock">
    <div class="deal-wrapper" id="dealWrapper" style="display: none;">
      <button class="deal-btn" onclick="openWhatsApp()">
        <i class="fab fa-whatsapp" style="font-size: 1.4rem;"></i> <span>تواصل مع أ. طارق عبر واتساب الآن</span>
      </button>
    </div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="اكتب استفسارك هنا..." onkeypress="if(event.key==='Enter' && !isSending) sendMsg()">
      <button id="sendBtn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
  const WORKER_URL = "https://royal-snow-ea32.footcai-555.workers.dev/";
  const CORRECT_PHONE = "201147758857";

  const STORAGE_KEY = "tarek_chat_v14";
  const SCORE_KEY = "tarek_score_v14";
  const WA_KEY = "tarek_wa_v14";
  const LEAD_KEY = "tarek_lead_v14";

  let history = [];
  let score = parseInt(localStorage.getItem(SCORE_KEY) || "0");
  let canShare = localStorage.getItem(WA_KEY) === "true";
  let currentLeadData = JSON.parse(localStorage.getItem(LEAD_KEY) || "{}");
  let isSending = false;

  const chat = document.getElementById('chatMessages');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typingIndicator');
  const dealWrapper = document.getElementById('dealWrapper');

  function getTime() { return new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }); }
  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    localStorage.setItem(SCORE_KEY, score.toString());
    localStorage.setItem(WA_KEY, canShare ? "true" : "false");
    localStorage.setItem(LEAD_KEY, JSON.stringify(currentLeadData));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { history = JSON.parse(raw); }
      score = parseInt(localStorage.getItem(SCORE_KEY) || "0");
      canShare = localStorage.getItem(WA_KEY) === "true";
      currentLeadData = JSON.parse(localStorage.getItem(LEAD_KEY) || "{}");
      return true;
    } catch { return false; }
  }

  function updateUI() {
    // تحليل المحادثة الحالية في الخلفية بصمت تام
    const analysis = analyzeChatHistory();
    const dataComplete = hasCompleteLeadData(analysis);

    // ظهور زر الواتساب يعتمد على اكتمال البيانات أو وصول السكور للحد المطلوب خفياً
    if ((score >= 5 || canShare) && dataComplete) {
      dealWrapper.style.display = 'block';
    } else {
      dealWrapper.style.display = 'none';
    }
    saveState();
  }

  function renderMsg(text, type, time) {
    const div = document.createElement('div');
    div.className = `msg msg-${type}`;
    if (type === 'bot') {
      div.innerHTML = marked.parse(text);
    } else {
      div.innerText = text;
    }
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.innerText = time || getTime();
    div.appendChild(t);
    chat.insertBefore(div, typing);
    scroll();
  }

  function rehydrate() {
    chat.querySelectorAll('.msg').forEach(el => el.remove());
    history.forEach(m => renderMsg(m.text, m.type, m.time));
    updateUI();
  }

  function analyzeChatHistory() {
    const userMessages = history.filter(m => m.type === 'user').map(m => m.text).join(' ');
    let type = "استفسار عقاري";
    let budget = "غير محدد";
    let rooms = "غير محدد";
    let location = "مدينة نصر";
    let notes = "";

    if (/(شراء|تمليك|اشترى|buy)/i.test(userMessages)) {
      type = "شراء";
    } else if (/(إيجار|ايجار|إجار|أجار|استئجار|rent)/i.test(userMessages)) {
      type = "إيجار";
    }

    const priceMatches = userMessages.match(/(\d{3,})\s*(?:ألف|الف|k|K)?|(\d+)\s*(?:ألف|الف)/g);
    if (priceMatches) {
      const lastPrice = priceMatches[priceMatches.length - 1];
      const num = parseInt(lastPrice.replace(/[^0-9]/g, ''));
      if (num && num >= 1000) {
        budget = `${num.toLocaleString('en-US')} جنيه`;
      } else if (num && num > 0 && num <= 100) {
        budget = `${num} ألف جنيه`;
      }
    }

    const roomsMatch = userMessages.match(/(\d+)\s*(?:غرف|غرفة|اوض|أوض|غرفه|حجرات)/);
    if (roomsMatch) {
      const num = parseInt(roomsMatch[1]);
      if (!isNaN(num) && num > 0) rooms = `${num} غرف`;
    } else if (/غرفتين/.test(userMessages)) {
      rooms = "غرفتين";
    } else if (/غرفة واحدة|اوضة واحدة|أوضة واحدة/.test(userMessages)) {
      rooms = "غرفة واحدة";
    }

    if (/بنتهاوس|بنت هوس/i.test(userMessages)) notes += "يفضل شقة بنتهاوس. ";
    if (/متشطبة|تشطيب|نضيفة|سوبر لوكس/.test(userMessages)) notes += "يرغب في تشطيب جيد. ";

    if (currentLeadData && currentLeadData.type && currentLeadData.type !== "استعلام عقاري عام") {
      type = currentLeadData.type;
    }
    if (currentLeadData && currentLeadData.price && currentLeadData.price !== "حسب المعاينة / الاتفاق") {
      budget = currentLeadData.price;
    }

    notes = notes.trim() || "يرجى الاستفسار عن المزيد من التفاصيل.";
    return { type, budget, rooms, location, notes };
  }

  function hasCompleteLeadData(a) {
    const requiredFields = ['type', 'budget', 'rooms'];
    let filledCount = 0;
    if (a.type && a.type !== 'استفسار عقاري' && a.type !== 'غير محدد') filledCount++;
    if (a.budget && a.budget !== 'غير محدد') filledCount++;
    if (a.rooms && a.rooms !== 'غير محدد') filledCount++;
    return filledCount >= 3;
  }

  function buildProfessionalLeadMessage(a) {
    return `أستاذ طارق، تحية طيبة،

تواصلت معك عبر منصة "الوكيل الذكي"، ويسعدني أن أشارككم ملخص طلبي:

- نوع العملية: ${a.type}
- المنطقة المرغوبة: ${a.location}
- الميزانية: ${a.budget}
- عدد الغرف: ${a.rooms}
- ملاحظات إضافية: ${a.notes}

أتمنى التواصل معي لاستكمال التفاصيل، وشكراً لوقتك.`;
  }

  function openWhatsApp() {
    const analysis = analyzeChatHistory();
    const leadMessage = buildProfessionalLeadMessage(analysis);
    const whatsappUrl = `https://wa.me/${CORRECT_PHONE}?text=${encodeURIComponent(leadMessage)}`;
    window.open(whatsappUrl, '_blank');
  }

  async function sendMsg() {
    const text = input.value.trim();
    if (!text || isSending) return;
    input.value = '';
    isSending = true;
    sendBtn.disabled = true;

    renderMsg(text, 'user');
    history.push({ text, type: 'user', time: getTime() });
    saveState();

    typing.style.display = 'block';
    scroll();

    try {
      const historyForApi = history.slice(-8).map(m => ({ role: m.type === 'bot' ? 'assistant' : 'user', message: m.text }));
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history: historyForApi,
          qualificationScore: score,
          canShareWhatsapp: canShare
        })
      });
      const data = await res.json();
      typing.style.display = 'none';

      if (data) {
        if (data.qualificationScore !== undefined) score = data.qualificationScore;
        if (data.canShareWhatsapp !== undefined) canShare = data.canShareWhatsapp;
        if (data.leadData) {
          currentLeadData = data.leadData;
        } else {
          currentLeadData = analyzeChatHistory();
        }

        if (score >= 5 || data.canShareWhatsapp) {
          canShare = true;
        }

        updateUI();
        const reply = data.response || data.reply || 'معاك طارق، إزاي أقدر أساعدك؟';
        renderMsg(reply, 'bot');
        history.push({ text: reply, type: 'bot', time: getTime() });
        saveState();
      }
    } catch (err) {
      typing.style.display = 'none';
      renderMsg('عذراً، حدث عطل مؤقت. حاول مرة أخرى أو تواصل عبر واتساب.', 'bot');
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  (function init() {
    document.getElementById('app').classList.add('show');
    loadState();
    if (history.length > 0) {
      rehydrate();
    } else {
      const welcome = `أهلاً بيك، معاك طارق طنطاوي. بتدور على إيه، شراء ولا إيجار؟ وفي أي منطقة؟`;
      renderMsg(welcome, 'bot');
      history.push({ text: welcome, type: 'bot', time: getTime() });
      saveState();
    }
    updateUI();
  })();

  window.sendMsg = sendMsg;
  window.openWhatsApp = openWhatsApp;
</script>
</body>
</html>
