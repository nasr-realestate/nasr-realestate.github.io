<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>الوكيل الذكي | أ. طارق طنطاوي</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0b1120;
      font-family: system-ui, -apple-system, blinkmacsystemfont, 'Segoe UI', roboto, oxygen, ubuntu, cantarell, sans-serif;
      overflow: hidden;
    }

    .agent-app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 600px;
      margin: 0 auto;
      background: #1e293b;
      position: relative;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.6);
    }

    /* هيدر الوكيل الخاص */
    .agent-header {
      background: #0f172a;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      z-index: 10;
    }

    .agent-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .agent-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      object-fit: cover;
    }

    .agent-info h1 {
      color: #ffffff;
      font-size: 0.98rem;
      margin: 0;
      font-weight: 700;
    }

    .agent-info p {
      color: #38bdf8;
      font-size: 0.75rem;
      margin: 2px 0 0 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
    }

    /* شريط مؤشر التأهيل */
    .qual-bar-container {
      background: #182232;
      padding: 8px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
    }

    .qual-text { color: #94a3b8; }
    .qual-score { color: #d4af37; font-weight: bold; }

    .qual-progress-bg {
      width: 100px;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }

    .qual-progress-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #d4af37, #22c55e);
      transition: width 0.4s ease;
    }

    /* منطقة الشات والرسائل */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #0f172a;
      padding-bottom: 75px;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-agent {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      align-self: flex-start;
      border-bottom-right-radius: 2px;
    }

    .msg-user {
      background: #1e3a8a;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-left-radius: 2px;
    }

    /* الفوتر الخاص بالوكيل (زر تصفح الكتالوج العائم) */
    .agent-custom-footer {
      position: absolute;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #d4af37;
      border-radius: 30px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(8px);
      text-decoration: none;
      transition: transform 0.2s;
    }

    .agent-custom-footer:hover {
      transform: translateX(-50%) scale(1.03);
    }

    .semsar-logo-img { width: 24px; height: 24px; border-radius: 50%; }
    .semsar-bar-text { color: #d4af37; font-size: 0.82rem; font-weight: 600; }

    /* حقل الإدخال السفلي */
    .chat-input-wrapper {
      background: #1e293b;
      padding: 12px;
      border-top: 1px solid #334155;
      position: relative;
      z-index: 5;
    }

    .input-row { display: flex; gap: 8px; }

    .chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }

    .chat-input:focus { border-color: #d4af37; }

    .btn-send {
      background: #d4af37;
      border: none;
      color: #000;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .wa-direct-link {
      display: none;
      background: #25d366;
      color: #fff;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      margin-top: 8px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="agent-app-container">
  
  <!-- هيدر الوكيل -->
  <header class="agent-header">
    <div class="agent-profile">
      <img src="/assets/img/social-home.webp" alt="أ. طارق طنطاوي" class="agent-avatar" onerror="this.src='https://via.placeholder.com/44'">
      <div class="agent-info">
        <h1>الوكيل الذكي | طارق طنطاوي</h1>
        <p><span class="status-dot"></span> التأهيل والفرز العقاري المباشر</p>
      </div>
    </div>
  </header>

  <!-- شريط مؤشر التأهيل -->
  <div class="qual-bar-container">
    <span class="qual-text">مؤشر جاهزية الطلب:</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="qual-progress-bg">
        <div class="qual-progress-fill" id="qualFill"></div>
      </div>
      <span class="qual-score" id="qualScore">1/5</span>
    </div>
  </div>

  <!-- منطقة الرسائل -->
  <div class="chat-area" id="chatArea">
    <div class="msg-bubble msg-agent">
      أهلاً بك.. معك الوكيل الذكي لـ <strong>أ. طارق طنطاوي</strong>.
      <br><br>
      لتوفير وقتك وتوجيهك للفرصة الأنسب فوراً، يرجى توضيح غرضك: (شراء / عرض عقار للبيع / إيجار / إداري)؟
    </div>
  </div>

  <!-- الفوتر المخصص للوكيل: زر "سمسار طلبك" للانتقال للموقع الرئيسي -->
  <a href="/" class="agent-custom-footer">
    <img src="/assets/img/logo.webp" class="semsar-logo-img" alt="سمسار طلبك" onerror="this.src='https://via.placeholder.com/24'">
    <span class="semsar-bar-text">تصفح المعرض والكتالوج 🏛️</span>
  </a>

  <!-- حقل الإدخال والتحويل -->
  <div class="chat-input-wrapper">
    <div class="input-row">
      <input type="text" id="userInput" class="chat-input" placeholder="اكتب تفاصيل طلبك هنا..." onkeypress="handleKey(event)">
      <button class="btn-send" onclick="sendMsg()">إرسال</button>
    </div>
    <a href="#" id="waLink" class="wa-direct-link" target="_blank">تحويل مباشر لـ أ. طارق طنطاوي (تم التأهيل 🎯)</a>
  </div>

</div>

<script>
let currentStep = 1;
let leadDetails = { intent: "", location: "", budget: "", timeline: "" };

function updateQual(score) {
  document.getElementById('qualScore').innerText = `${score}/5`;
  document.getElementById('qualFill').style.width = `${(score / 5) * 100}%`;
}

function handleKey(e) { if (e.key === 'Enter') sendMsg(); }

function sendMsg() {
  const input = document.getElementById('userInput');
  const txt = input.value.trim();
  if (!txt) return;

  const chat = document.getElementById('chatArea');
  const userBubble = document.createElement('div');
  userBubble.className = 'msg-bubble msg-user';
  userBubble.innerText = txt;
  chat.appendChild(userBubble);
  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  if (currentStep === 1) {
    leadDetails.intent = txt;
    currentStep = 2;
    updateQual(2);
    setTimeout(() => { addAgentMsg("ممتاز. حدد لي **المنطقة المفضلة** (مثلاً: مكرم عبيد / المنطقة السادسة / مصر الجديدة) و**المساحة المطلوبة**."); }, 500);
  } else if (currentStep === 2) {
    leadDetails.location = txt;
    currentStep = 3;
    updateQual(3);
    setTimeout(() => { addAgentMsg("تمام جداً. ما هي **الميزانية المحددة للتنفيذ الفوري** وطريقة الدفع (كاش / تمويل)؟"); }, 500);
  } else if (currentStep === 3) {
    leadDetails.budget = txt;
    currentStep = 4;
    updateQual(4);
    setTimeout(() => { addAgentMsg("ما هو **المدى الزمني لتحديد المعاينة والتنفيذ**؟"); }, 500);
  } else if (currentStep === 4) {
    leadDetails.timeline = txt;
    currentStep = 5;
    updateQual(5);
    setTimeout(() => {
      addAgentMsg("<strong>تم تأهيل الطلب بنجاح! 🎯</strong><br>بياناتك مكتملة تماماً. اضغط الزر الأخضر للتحويل المباشر لـ أ. طارق طنطاوي لجدولة الخطوة التنفيذية.");
      
      const waLink = document.getElementById('waLink');
      const textURI = encodeURIComponent(
        `السلام عليكم أ. طارق طنطاوي، تم تأهيل طلبي عبر الوكيل الذكي:\n` +
        `• الغرض: ${leadDetails.intent}\n` +
        `• المنطقة والمساحة: ${leadDetails.location}\n` +
        `• الميزانية والدفع: ${leadDetails.budget}\n` +
        `• المدى الزمني: ${leadDetails.timeline}`
      );
      waLink.href = `https://wa.me/201147758857?text=${textURI}`;
      waLink.style.display = 'block';
    }, 500);
  }
}

function addAgentMsg(htmlContent) {
  const chat = document.getElementById('chatArea');
  const b = document.createElement('div');
  b.className = 'msg-bubble msg-agent';
  b.innerHTML = htmlContent;
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
  </html>
