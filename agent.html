<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta property="og:title" content="الوكيل الذكي | أ. طارق طنطاوي - سمسار طلبك" />
  <meta property="og:description" content="تحدث مع طارق طنطاوي، خبير العقارات في مدينة نصر بخبرة من 2014. استشارة فورية وعقارات نخبوية." />
  <meta property="og:image" content="https://nasr-realestate.github.io/assets/img/team/tareq.webp" />
  <title>الوكيل الذكي | أ. طارق طنطاوي - سمسار طلبك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; background: #0a0a0a; font-family: 'Cairo', sans-serif; overflow: hidden; }
    :root {
      --wa-header: #075e54;
      --wa-bg: #efeae2;
      --wa-msg-in: #ffffff;
      --wa-msg-out: #dcf8c6;
      --wa-green: #25d366;
    }
    .agent-app {
      max-width: 650px; height: 100vh; margin: 0 auto; background: var(--wa-bg); display: flex; flex-direction: column;
      box-shadow: 0 0 50px rgba(0,0,0,0.9); opacity: 0; transition: opacity 0.6s ease;
    }
    .agent-app.show { opacity: 1; }
    .agent-header {
      background: var(--wa-header); padding: 12px 16px; display: flex; align-items: center; gap: 12px; color: #fff;
      flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .agent-header img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }
    .agent-header .info { flex: 1; }
    .agent-header .info h1 { font-size: 1rem; }
    .agent-header .info p { font-size: 0.7rem; opacity: 0.9; display: flex; align-items: center; gap: 4px; }
    .agent-header .info p .dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; display: inline-block; }
    .agent-header .logo-link { color: #fff; font-size: 1.4rem; text-decoration: none; }
    .qual-bar {
      background: #fff; padding: 8px 14px; border-bottom: 1px solid #e9edef; display: flex; align-items: center;
      justify-content: space-between; font-size: 12px; flex-shrink: 0;
    }
    .qual-bar .score { font-weight: 700; color: #075e54; }
    .qual-bar .progress { height: 4px; background: #e9edef; border-radius: 999px; flex: 1; margin: 0 10px; overflow: hidden; }
    .qual-bar .progress .fill { height: 100%; width: 0%; background: var(--wa-green); transition: width 0.4s ease; }
    .qual-bar .state { font-weight: 700; font-size: 11px; }
    .qual-bar .state.wait { color: #f0b429; }
    .qual-bar .state.ready { color: #23c16b; }
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
      background: var(--wa-bg); background-image: radial-gradient(#cbd5e1 0.8px, transparent 0); background-size: 12px 12px;
    }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.6; box-shadow: 0 1px 2px rgba(0,0,0,0.04); animation: fadeIn 0.2s ease; }
    .msg-bot { background: var(--wa-msg-in); align-self: flex-start; border-top-right-radius: 4px; color: #111; }
    .msg-user { background: var(--wa-msg-out); align-self: flex-end; border-top-left-radius: 4px; font-weight: 600; }
    .msg a { color: #075e54; font-weight: 700; text-decoration: underline; }
    .msg-time { font-size: 9px; color: #888; margin-top: 4px; text-align: left; }
    .typing { display: none; align-self: flex-start; background: #fff; padding: 10px 14px; border-radius: 14px; border-top-right-radius: 4px; font-size: 12px; color: #888; }
    .input-area {
      background: #f0f0f0; padding: 10px 12px; display: flex; gap: 8px; border-top: 1px solid #e9edef; flex-shrink: 0;
    }
    .input-area input {
      flex: 1; border: none; border-radius: 24px; padding: 10px 16px; background: #fff; font-family: 'Cairo', sans-serif;
      font-size: 14px; outline: none;
    }
    .input-area input:focus { box-shadow: 0 0 0 2px var(--wa-green); }
    .input-area input:disabled { opacity: 0.6; }
    .input-area button {
      background: var(--wa-green); border: none; border-radius: 50%; width: 42px; height: 42px; color: #fff;
      font-size: 16px; cursor: pointer; transition: 0.2s; flex-shrink: 0;
    }
    .input-area button:hover { background: #128c7e; transform: scale(1.04); }
    .deal-wrapper { padding: 0 12px 12px 12px; background: #f0f0f0; flex-shrink: 0; }
    .deal-btn {
      width: 100%; background: var(--wa-green); color: #fff; border: none; padding: 12px; border-radius: 12px;
      font-weight: 800; font-family: 'Cairo', sans-serif; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; font-size: 0.95rem; transition: 0.25s;
    }
    .deal-btn.disabled { opacity: 0.4; cursor: not-allowed; background: #ccc; color: #888; }
    .deal-btn:not(.disabled):hover { background: #128c7e; transform: scale(1.01); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="agent-app" id="app">
  <div class="agent-header">
    <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي">
    <div class="info">
      <h1>طارق طنطاوي</h1>
      <p><span class="dot"></span> خبرة عقارية من 2014</p>
    </div>
    <a href="/" class="logo-link"><i class="fas fa-home"></i></a>
  </div>
  <div class="qual-bar">
    <span>التأهيل: <span class="score" id="qualScore">0/5</span></span>
    <div class="progress"><div class="fill" id="qualProgress"></div></div>
    <span class="state wait" id="qualState">جمع بيانات</span>
  </div>
  <div class="chat-area" id="chatMessages">
    <div class="typing" id="typingIndicator">طارق بيكتب...</div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب استفسارك..." onkeypress="if(event.key==='Enter' && !isSending) sendMsg()">
    <button id="sendBtn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
  </div>
  <div class="deal-wrapper">
    <button class="deal-btn disabled" id="dealBtn" onclick="openWhatsApp()">
      <i class="fab fa-whatsapp"></i> <span id="dealText">يفتح بعد التأكيد</span>
    </button>
  </div>
</div>
<script>
  const WORKER_URL = "https://royal-snow-ea32.footcai-555.workers.dev/";
  const CORRECT_PHONE = "201147758857"; // رقمك المباشر الصحيح

  const STORAGE_KEY = "tarek_chat_v10";
  const SCORE_KEY = "tarek_score_v10";
  const WA_KEY = "tarek_wa_v10";
  const LEAD_KEY = "tarek_lead_v10";

  let history = [];
  let score = parseInt(localStorage.getItem(SCORE_KEY) || "0");
  let canShare = localStorage.getItem(WA_KEY) === "true";
  let currentLeadData = JSON.parse(localStorage.getItem(LEAD_KEY) || "{}");
  let isSending = false;

  const chat = document.getElementById('chatMessages');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typingIndicator');
  const scoreEl = document.getElementById('qualScore');
  const progress = document.getElementById('qualProgress');
  const stateEl = document.getElementById('qualState');
  const dealBtn = document.getElementById('dealBtn');
  const dealText = document.getElementById('dealText');

  function getTime() { return new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }); }
  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    localStorage.setItem(SCORE_KEY, score.toString());
    localStorage.setItem(WA_KEY, canShare ? "true" : "false");
    localStorage.setItem(LEAD_KEY, JSON.stringify(currentLeadData));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { history = JSON.parse(raw); }
      score = parseInt(localStorage.getItem(SCORE_KEY) || "0");
      canShare = localStorage.getItem(WA_KEY) === "true";
      currentLeadData = JSON.parse(localStorage.getItem(LEAD_KEY) || "{}");
      return true;
    } catch { return false; }
  }

  function updateUI() {
    scoreEl.textContent = `${score}/5`;
    progress.style.width = `${Math.min(100, (score / 5) * 100)}%`;
    if (canShare) {
      stateEl.className = 'state ready';
      stateEl.textContent = 'جاهز للتأكيد ✅';
      dealBtn.classList.remove('disabled');
      dealText.textContent = 'تواصل مع طارق مباشرة';
    } else {
      stateEl.className = 'state wait';
      stateEl.textContent = 'جمع بيانات';
      dealBtn.classList.add('disabled');
      dealText.textContent = 'أكمل التأهيل أولاً';
    }
    saveState();
  }

  function renderMsg(text, type, time) {
    const div = document.createElement('div');
    div.className = `msg msg-${type}`;
    if (type === 'bot') {
      div.innerHTML = marked.parse(text);
    } else {
      div.innerText = text;
    }
    const t = document.createElement('div');
    t.className = 'msg-time';
    t.innerText = time || getTime();
    div.appendChild(t);
    chat.insertBefore(div, typing);
    scroll();
  }

  function rehydrate() {
    chat.querySelectorAll('.msg').forEach(el => el.remove());
    history.forEach(m => renderMsg(m.text, m.type, m.time));
    updateUI();
  }

  function openWhatsApp() {
    if (!canShare) return;

    const leadType = currentLeadData.type || "استعلام عقاري";
    const leadPrice = currentLeadData.price || "غير محدد";
    const lastUserMsg = currentLeadData.userInput || "مهتم بعقارات مدينة نصر";

    const dynamicMessage = `أهلاً طارق، تحدثت معك عبر الوكيل الذكي وهذه تفاصيل طلبي:
- نوع الطلب: ${leadType}
- التفاصيل: ${leadPrice}
- آخر استفسار: ${lastUserMsg}

أنتظر ردكم الكريم.`;

    const whatsappUrl = `https://wa.me/${CORRECT_PHONE}?text=${encodeURIComponent(dynamicMessage)}`;
    window.open(whatsappUrl, '_blank');
  }

  async function sendMsg() {
    const text = input.value.trim();
    if (!text || isSending) return;
    input.value = '';
    isSending = true;
    sendBtn.disabled = true;

    renderMsg(text, 'user');
    history.push({ text, type: 'user', time: getTime() });
    saveState();

    typing.style.display = 'block';
    scroll();

    try {
      const historyForApi = history.slice(-8).map(m => ({ role: m.type === 'bot' ? 'assistant' : 'user', message: m.text }));
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history: historyForApi,
          qualificationScore: score,
          canShareWhatsapp: canShare
        })
      });
      const data = await res.json();
      typing.style.display = 'none';

      if (data) {
        if (data.qualificationScore !== undefined) score = data.qualificationScore;
        if (data.canShareWhatsapp !== undefined) canShare = data.canShareWhatsapp;
        if (data.leadData) currentLeadData = data.leadData;

        updateUI();
        const reply = data.response || data.reply || 'معاك طارق، إزاي أقدر أساعدك؟';
        renderMsg(reply, 'bot');
        history.push({ text: reply, type: 'bot', time: getTime() });
        saveState();
      }
    } catch (err) {
      typing.style.display = 'none';
      renderMsg('عذراً، حدث عطل مؤقت. حاول مرة أخرى أو تواصل عبر واتساب.', 'bot');
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  (function init() {
    document.getElementById('app').classList.add('show');
    loadState();
    if (history.length > 0) {
      rehydrate();
    } else {
      const welcome = `أهلاً بيك، معاك طارق طنطاوي. بتدور على إيه، شراء ولا إيجار؟ وفي أي منطقة؟`;
      renderMsg(welcome, 'bot');
      history.push({ text: welcome, type: 'bot', time: getTime() });
      saveState();
    }
    updateUI();
  })();

  window.sendMsg = sendMsg;
  window.openWhatsApp = openWhatsApp;
</script>
</body>
</html>
