<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce205"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8941f"/>
    </linearGradient>
  </defs>

  <!-- ═══ الخلفية الداكنة ═══ -->
  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- ═══ توهج محيطي ذهبي ═══ -->
  <circle cx="1050" cy="100" r="270" fill="#d4af37" opacity="0.05"/>
  <circle cx="150" cy="540" r="290" fill="#d4af37" opacity="0.03"/>

  <!-- ═══ إطار ذهبي ═══ -->
  <rect x="40" y="40" width="1120" height="550" rx="18" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- ═══ شارة السلطة العلوية ═══ -->
  <g transform="translate(600, 85)">
    <rect x="-260" y="-22" width="520" height="44" rx="22" fill="#d4af37" fill-opacity="0.12" stroke="#d4af37" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M -230 -2 l 2.6 5.3 5.9 0.9 -4.3 4.1 1 5.8 -5.2 -2.7 -5.2 2.7 1 -5.8 -4.3 -4.1 5.9 -0.9 z" fill="#d4af37"/>
    <text x="10" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#d4af37" font-size="20" font-weight="700">تقييم فوري · تسويق مجاني · بدون رسوم مبدئية</text>
  </g>

  <!-- ═══ اسم الماركة ═══ -->
  <text x="600" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#b0b0b0" font-size="21" font-weight="600" letter-spacing="3">سـمـسـار طـلـبـك — SEMSAR TALABK</text>

  <!-- ═══ أيقونات ثلاثية (وسط) — قبل العنوان ═══ -->
  <!-- أيقونة المنزل -->
  <g transform="translate(430, 240)">
    <circle cx="0" cy="0" r="32" fill="#d4af37" fill-opacity="0.12" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M -14 2 l 0 -10 l 14 -12 l 14 12 l 0 10 l -6 0 l 0 -6 l -16 0 l 0 6 z" fill="#d4af37"/>
  </g>

  <!-- أيقونة رفع -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="32" fill="#d4af37" fill-opacity="0.12" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4"/>
    <path d="M 0 -14 l 8 8 l -5 0 l 0 10 l -6 0 l 0 -10 l -5 0 z" fill="#d4af37"/>
    <rect x="-12" y="8" width="24" height="3" rx="1.5" fill="#d4af37"/>
  </g>

  <!-- أيقونة تقييم (عملة/ميزان) -->
  <g transform="translate(770, 240)">
    <circle cx="0" cy="0" r="32" fill="#d4af37" fill-opacity="0.12" stroke="#d4af37" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#d4af37" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#d4af37" font-size="16" font-weight="900">$</text>
  </g>

  <!-- ═══ العنوان الرئيسي ═══ -->
  <text x="600" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="url(#goldText)" font-size="82" font-weight="900">اعرض عقارك بذكاء</text>

  <!-- ═══ العنوان الفرعي ═══ -->
  <text x="600" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#f5f5f5" font-size="26" font-weight="600">تقييم احترافي فوري · تسويق مباشر لـ 92 عقار مسجل</text>

  <!-- ═══ شريط الموثوقية ═══ -->
  <g transform="translate(600, 470)">
    <rect x="-390" y="-30" width="780" height="60" rx="14" fill="#111111" stroke="#d4af37" stroke-width="1" stroke-opacity="0.25"/>
    <text x="-280" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#d4af37" font-size="19" font-weight="800">رد خلال 24 ساعة</text>
    <text x="-95" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#f5f5f5" font-size="19" font-weight="800">عمولة 2.5% بعد البيع</text>
    <text x="105" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#d4af37" font-size="19" font-weight="800">16.3M مشاهدة</text>
    <text x="285" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#f5f5f5" font-size="19" font-weight="800">4.7 تقييم</text>
  </g>

  <!-- ═══ زر التواصل السفلي ═══ -->
  <g transform="translate(600, 555)">
    <rect x="-215" y="-24" width="430" height="48" rx="24" fill="url(#goldFill)"/>
    <!-- أيقونة رفع/إضافة -->
    <circle cx="-170" cy="0" r="14" fill="#050505"/>
    <path d="M -170 -6 l 4 4 l -3 0 l 0 6 l -2 0 l 0 -6 l -3 0 z" fill="#d4af37"/>
    <text x="15" y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#050505" font-size="22" font-weight="900">اعرض عقارك الآن — اضغط هنا</text>
  </g>
</svg>
