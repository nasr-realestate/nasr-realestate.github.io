<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce205"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- الخلفية الداكنة -->
  <rect width="1200" height="630" fill="#050505"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- توهج محيطي (بدون blur) -->
  <circle cx="1020" cy="100" r="240" fill="#d4af37" opacity="0.04"/>
  <circle cx="180" cy="530" r="280" fill="#d4af37" opacity="0.03"/>

  <!-- إطار ذهبي رفيع -->
  <rect x="40" y="40" width="1120" height="550" rx="18" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- شارة السلطة (أعلى الصورة) -->
  <g transform="translate(600, 85)">
    <rect x="-215" y="-22" width="430" height="44" rx="22" fill="#d4af37" fill-opacity="0.12" stroke="#d4af37" stroke-width="1" stroke-opacity="0.45"/>
    <!-- نجمة -->
    <path d="M -190 -2 l 2.6 5.3 5.9 0.9 -4.3 4.1 1 5.8 -5.2 -2.7 -5.2 2.7 1 -5.8 -4.3 -4.1 5.9 -0.9 z" fill="#d4af37"/>
    <text x="5" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#d4af37" font-size="20" font-weight="700">خبير عقارات مدينة نصر منذ 2014 · Local Guide 7</text>
  </g>

  <!-- اسم الماركة -->
  <text x="600" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#b0b0b0" font-size="21" font-weight="600" letter-spacing="3">سـمـسـار طـلـبـك — SEMSAR TALABK</text>

  <!-- العنوان الرئيسي (ذهبي) -->
  <text x="600" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="url(#goldText)" font-size="78" font-weight="900">شقق للبيع في مدينة نصر</text>

  <!-- العنوان الفرعي -->
  <text x="600" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#f5f5f5" font-size="27" font-weight="600">تمليك · إيجار · مكاتب · محلات تجارية — استشارات مجانية</text>

  <!-- شريط الموثوقية -->
  <g transform="translate(600, 450)">
    <rect x="-370" y="-30" width="740" height="60" rx="14" fill="#111111" stroke="#d4af37" stroke-width="1" stroke-opacity="0.25"/>
    <text x="-235" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#f5f5f5" font-size="19" font-weight="800">16.3M مشاهدة</text>
    <text x="-75" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#d4af37" font-size="19" font-weight="800">4.7 تقييم</text>
    <text x="95" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#f5f5f5" font-size="19" font-weight="800">المربع الذهبي والعاشرة</text>
    <text x="260" y="8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#d4af37" font-size="19" font-weight="800">عمولة 2.5%</text>
  </g>

  <!-- زر التواصل السفلي -->
  <g transform="translate(600, 545)">
    <rect x="-205" y="-23" width="410" height="46" rx="23" fill="#050505" stroke="#d4af37" stroke-width="2"/>
    <!-- أيقونة هاتف -->
    <path d="M -155 -8 q 0 -3 3 -3 l 4 0 q 2 0 3 2 l 2 5 q 1 2 -1 3 l -2 2 q 3 5 7 9 q 4 4 9 7 l 2 -2 q 1 -2 3 -1 l 5 2 q 2 1 2 3 l 0 4 q 0 3 -3 3 q -15 0 -24 -9 q -9 -9 -9 -24 z" fill="#fce205"/>
    <text x="15" y="6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#fce205" font-size="23" font-weight="800">01147758857 — واتساب مباشر</text>
  </g>
</svg>
