<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">

<title>سمسار طلبك — OG Image</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
}

body {
  background: #202020;
  font-family: "Cairo", sans-serif;
}

/* =========================================================
   OG CARD — 1200 × 630
========================================================= */

.og-card {
  width: 1200px;
  height: 630px;

  position: relative;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 82% 28%,
      rgba(212,175,55,.12) 0,
      rgba(212,175,55,.045) 24%,
      transparent 48%
    ),
    radial-gradient(
      circle at 12% 100%,
      rgba(212,175,55,.10) 0,
      transparent 38%
    ),
    linear-gradient(
      120deg,
      #070b0f 0%,
      #0b1015 48%,
      #0d1319 100%
    );

  color: #fff;
}


/* =========================================================
   BACKGROUND
========================================================= */

.og-card::before {
  content: "";
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,255,255,.015) 50%,
      transparent 100%
    );

  pointer-events: none;
}

.og-card::after {
  content: "";
  position: absolute;
  inset: 18px;

  border: 1px solid rgba(212,175,55,.22);
  border-radius: 3px;

  pointer-events: none;
}


/* =========================================================
   GOLD DECORATIVE LINE
========================================================= */

.gold-line {
  position: absolute;

  right: 610px;
  top: 70px;

  width: 78px;
  height: 3px;

  background: linear-gradient(
    90deg,
    transparent,
    #d4af37
  );

  opacity: .9;
}


/* =========================================================
   BRAND
========================================================= */

.brand {
  position: absolute;

  left: 55px;
  top: 43px;

  z-index: 6;

  display: flex;
  flex-direction: column;

  line-height: 1.15;
}

.brand-main {
  color: #f2f1ed;

  font-size: 17px;
  font-weight: 900;

  letter-spacing: .2px;
}

.brand-sub {
  margin-top: 5px;

  color: #d4af37;

  font-size: 11px;
  font-weight: 700;

  letter-spacing: 1px;
}


/* =========================================================
   PHOTO AREA
========================================================= */

.photo-area {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 500px;
  height: 610px;

  z-index: 2;
}


/* Glow */

.photo-glow {
  position: absolute;

  width: 390px;
  height: 390px;

  left: 45px;
  top: 80px;

  background:
    radial-gradient(
      circle,
      rgba(212,175,55,.17) 0%,
      rgba(212,175,55,.06) 35%,
      transparent 70%
    );

  filter: blur(4px);
}


/* Person */

.photo {
  position: absolute;

  left: 35px;
  bottom: 0;

  width: 420px;
  height: 590px;

  object-fit: cover;
  object-position: top center;

  z-index: 2;

  filter:
    contrast(1.04)
    saturate(.92)
    brightness(.98);

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      #000 0%,
      #000 82%,
      rgba(0,0,0,.85) 91%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to bottom,
      #000 0%,
      #000 82%,
      rgba(0,0,0,.85) 91%,
      transparent 100%
    );
}


/* Gold edge */

.photo-edge {
  position: absolute;

  right: 8px;
  top: 95px;

  width: 1px;
  height: 360px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(212,175,55,.65),
      transparent
    );

  opacity: .6;
}


/* =========================================================
   CONTENT
========================================================= */

.content {
  position: absolute;

  right: 72px;
  top: 72px;

  width: 560px;
  height: 490px;

  z-index: 5;

  display: flex;
  flex-direction: column;
}


/* =========================================================
   BADGE
========================================================= */

.badge {
  display: inline-flex;

  width: fit-content;

  align-items: center;
  gap: 10px;

  padding: 7px 15px;

  border: 1px solid rgba(212,175,55,.30);
  border-radius: 30px;

  background: rgba(212,175,55,.055);

  color: #d4af37;

  font-size: 15px;
  font-weight: 700;

  white-space: nowrap;
}

.badge-dot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: #45d483;

  box-shadow:
    0 0 0 3px rgba(69,212,131,.08),
    0 0 13px rgba(69,212,131,.65);
}


/* =========================================================
   TITLE
========================================================= */

.title {
  margin-top: 27px;

  font-size: 63px;
  line-height: 1.12;

  font-weight: 900;

  letter-spacing: -2px;

  color: #f7f7f5;
}

.title-gold {
  display: block;

  background:
    linear-gradient(
      135deg,
      #f6e8a8 0%,
      #d4af37 48%,
      #b8860b 100%
    );

  -webkit-background-clip: text;
  background-clip: text;

  -webkit-text-fill-color: transparent;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {
  margin-top: 22px;

  width: 520px;

  color: #aeb7c0;

  font-size: 22px;
  line-height: 1.65;

  font-weight: 600;
}

.description strong {
  color: #f1f0ec;
  font-weight: 800;
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom {
  margin-top: auto;

  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}


/* =========================================================
   TRUST
========================================================= */

.trust {
  display: flex;
  align-items: center;

  gap: 22px;
}

.trust-item {
  display: flex;
  align-items: center;
  gap: 7px;

  color: #b5bdc5;

  font-size: 13px;
  font-weight: 600;

  white-space: nowrap;
}

.trust-number {
  color: #d4af37;

  font-size: 16px;
  font-weight: 900;
}


/* =========================================================
   CTA
========================================================= */

.cta {
  display: flex;
  align-items: center;
  gap: 11px;

  padding: 13px 19px;

  background:
    linear-gradient(
      135deg,
      #e1c45c,
      #b9901c
    );

  color: #0a0f13;

  border-radius: 10px;

  font-size: 16px;
  font-weight: 900;

  box-shadow:
    0 12px 30px rgba(212,175,55,.18);

  white-space: nowrap;
}

.cta-arrow {
  font-size: 21px;
  line-height: 1;
}


/* =========================================================
   DECORATIVE MARK
========================================================= */

.mark {
  position: absolute;

  left: 55px;
  bottom: 48px;

  width: 42px;
  height: 2px;

  background: #d4af37;

  opacity: .75;

  z-index: 6;
}
</style>
</head>

<body>

<div class="og-card" id="ogCard">

  <!-- BRAND -->

  <div class="brand">
    <div class="brand-main">سمسار طلبك</div>
    <div class="brand-sub">عقارات مدينة نصر</div>
  </div>


  <!-- DECORATIVE LINE -->

  <div class="gold-line"></div>


  <!-- PHOTO -->

  <div class="photo-area">

    <div class="photo-glow"></div>

    <img
      class="photo"
      src="https://nasr-realestate.github.io/assets/img/team/tareq.webp"
      alt="طارق طنطاوي"
      crossorigin="anonymous"
    >

    <div class="photo-edge"></div>

  </div>


  <!-- CONTENT -->

  <div class="content">

    <div>

      <!-- STATUS -->

      <div class="badge">
        <span class="badge-dot"></span>
        متصل الآن — مدينة نصر فقط
      </div>


      <!-- TITLE -->

      <h1 class="title">
        احكي طلبك
        <span class="title-gold">
          في دقيقة واحدة
        </span>
      </h1>


      <!-- DESCRIPTION -->

      <p class="description">
        الوكيل الذكي <strong>طارق طنطاوي</strong>
        يفهم طلبك، يسألك السؤال الصح،
        ويساعدك تبدأ بخطوة واضحة.
      </p>

    </div>


    <!-- BOTTOM -->

    <div class="bottom">

      <!-- TRUST -->

      <div class="trust">

        <div class="trust-item">
          <span>Google</span>
          <span class="trust-number">7</span>
        </div>

        <div class="trust-item">
          <span class="trust-number">16.3M</span>
          <span>مشاهدة</span>
        </div>

        <div class="trust-item">
          <span class="trust-number">2014</span>
          <span>منذ</span>
        </div>

      </div>


      <!-- CTA -->

      <div class="cta">
        ابدأ المحادثة
        <span class="cta-arrow">←</span>
      </div>

    </div>

  </div>


  <!-- DECORATIVE MARK -->

  <div class="mark"></div>

</div>

</body>
</html>
