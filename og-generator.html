<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>OG Image Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Cairo', sans-serif;
    padding: 20px;
  }

  /* ═══ الـOG Card — 1200×630 بالظبط ═══ */
  .og-card {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(201,169,97,0.12) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 90%, rgba(201,169,97,0.08) 0%, transparent 50%),
      linear-gradient(135deg, #0a0f14 0%, #0f1419 50%, #0a0f14 100%);
    border-radius: 8px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    direction: rtl;
  }

  /* نقشة ذهبية خفيفة */
  .og-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 2px 2px, rgba(201,169,97,0.09) 1px, transparent 0);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* إطار ذهبي رقيق */
  .og-card::after {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(201,169,97,0.28);
    border-radius: 4px;
    pointer-events: none;
  }

  /* ═══ الصورة الشخصية — يسار ═══ */
  .og-photo {
    position: absolute;
    left: 40px;
    bottom: 0;
    width: 380px;
    height: 560px;
    z-index: 3;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .og-photo-inner {
    width: 100%;
    height: 100%;
    background:
      linear-gradient(180deg, rgba(201,169,97,0.15) 0%, transparent 40%),
      radial-gradient(circle at 50% 30%, rgba(201,169,97,0.25) 0%, transparent 60%);
    border-radius: 8px 8px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  /* استبدل الـimg ده بصورتك الفعلية */
  .og-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    border-radius: 8px 8px 0 0;
    filter: contrast(1.05) saturate(0.95);
    mask-image: linear-gradient(180deg, #000 80%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 100%);
  }

  /* ═══ المحتوى — يمين ═══ */
  .og-content {
    position: absolute;
    right: 60px;
    top: 80px;
    bottom: 80px;
    width: 680px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 4;
  }

  /* شارة الخدمة */
  .og-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: rgba(201,169,97,0.1);
    border: 1px solid rgba(201,169,97,0.35);
    border-radius: 999px;
    color: #c9a961;
    font-size: 15px;
    font-weight: 700;
    width: fit-content;
    letter-spacing: 0.3px;
  }
  .og-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 12px #4ade80;
  }

  /* العنوان الرئيسي */
  .og-title {
    font-size: 66px;
    font-weight: 900;
    line-height: 1.1;
    color: #ffffff;
    letter-spacing: -1.5px;
    margin: 0;
  }
  .og-title .gold {
    background: linear-gradient(135deg, #f5e7a3 0%, #c9a961 50%, #b8860b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
  }

  /* السطر الفرعي — الـhook */
  .og-sub {
    font-size: 26px;
    font-weight: 700;
    color: #a8b2bd;
    line-height: 1.4;
    margin-top: 18px;
    max-width: 620px;
  }
  .og-sub strong {
    color: #e8e6e3;
    font-weight: 900;
  }

  /* شريط الثقة */
  .og-trust {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 16px 22px;
    background: rgba(201,169,97,0.06);
    border: 1px solid rgba(201,169,97,0.2);
    border-radius: 14px;
    width: fit-content;
  }
  .og-trust-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #e8e6e3;
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
  }
  .og-trust-item .ico {
    font-size: 20px;
    filter: drop-shadow(0 2px 6px rgba(201,169,97,0.4));
  }
  .og-trust-item .num {
    color: #c9a961;
    font-weight: 900;
    font-size: 17px;
  }

  /* CTA في الركن */
  .og-cta {
    position: absolute;
    bottom: 60px;
    right: 60px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 26px;
    background: linear-gradient(135deg, #c9a961, #b8860b);
    color: #0f1419;
    border-radius: 14px;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 12px 32px rgba(201,169,97,0.35);
    letter-spacing: 0.2px;
    z-index: 5;
  }
  .og-cta .arrow {
    font-size: 22px;
    transform: scaleX(-1);
  }

  /* ملاحظة سفلية — توجيهات لقطة الشاشة */
  .og-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #c9a961;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    padding: 8px 20px;
    border-radius: 8px;
    font-family: 'Cairo', sans-serif;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="og-card" id="ogCard">

    <!-- الصورة الشخصية — استبدل src بصورة طارق -->
    <div class="og-photo">
      <div class="og-photo-inner">
        <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي" crossorigin="anonymous">
      </div>
    </div>

    <!-- المحتوى النصي -->
    <div class="og-content">

      <div>
        <div class="og-badge">
          <span class="dot"></span>
          متصل الآن — مدينة نصر فقط
        </div>

        <h1 class="og-title" style="margin-top: 26px;">
          احكي طلبك<br>
          <span class="gold">في دقيقة واحدة</span>
        </h1>

        <p class="og-sub">
          الوكيل الذكي <strong>طارق طنطاوي</strong> — يفهم طلبك، يسألك السؤال الصح، ويوصلّك للعقار المناسب.
        </p>
      </div>

      <div class="og-trust">
        <div class="og-trust-item">
          <span class="ico">🏆</span>
          Google Level <span class="num">7</span>
        </div>
        <div class="og-trust-item">
          <span class="ico">👁️</span>
          <span class="num">16.3 مليون</span> مشاهدة
        </div>
        <div class="og-trust-item">
          <span class="ico">⭐</span>
          <span class="num">15</span> سنة خبرة
        </div>
      </div>

    </div>

    <!-- CTA -->
    <div class="og-cta">
      ابدأ المحادثة
      <span class="arrow">←</span>
    </div>

  </div>

  <div class="og-hint">
    ⚙️ اقفل أدوات المطوّر (F12) قبل التصوير — استخدم Full Page Screenshot على الأبعاد 1200×630
  </div>

</body>
  </html>
