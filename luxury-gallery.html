    <style>
        /* ═══ Prestige Protector ═══ */
        header, footer, nav, .navbar, .site-footer, 
        #back-to-top, .fixed-call-button,
        .floating-menu-btn, .floating-logo,
        .agent-float-btn, .smart-search-trigger, #enableNotif,
        .floating-menu-overlay, .floating-menu-panel {
            display: none !important;
        }
        
        :root { 
            --gold: #d4af37; 
            --gold-light: #fce205;
            --bg: #0a0a0a; 
            --white: #ffffff; 
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* ✅ الحل الجذري: 100dvh + position fixed */
        html, body { 
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden !important; 
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg); 
            color: var(--white); 
            font-family: 'Cairo', sans-serif; 
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ═══ Overlay العلوي ═══ */
        .ui-overlay { 
            position: fixed; 
            top: calc(20px + env(safe-area-inset-top, 0px));
            left: 16px; 
            right: 16px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 9999; 
            pointer-events: none;
        }
        
        .ui-brand { 
            color: var(--gold); 
            font-weight: 900; 
            font-size: 1rem; 
            text-shadow: 0 2px 8px #000; 
            pointer-events: auto;
        }
        
        .ui-exit { 
            color: var(--gold) !important; 
            text-decoration: none !important; 
            background: rgba(0,0,0,0.75); 
            padding: 8px 16px; 
            border-radius: 50px; 
            border: 1px solid rgba(212,175,55,0.5); 
            font-weight: 700; 
            font-size: 0.78rem; 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.2s;
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .ui-exit:hover {
            background: rgba(212,175,55,0.2);
            transform: scale(1.05);
        }

        /* ═══ شاشة الترحيب ═══ */
        #introLayer { 
            position: fixed; 
            inset: 0; 
            background: var(--bg); 
            z-index: 10000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 40px; 
            transition: opacity 0.5s ease; 
        }
        
        .intro-h { 
            color: var(--gold); 
            font-size: 2.8rem; 
            font-weight: 900; 
            margin-bottom: 12px;
            line-height: 1.2;
        }
        
        .intro-sub {
            color: #888;
            font-size: 1rem;
            margin-bottom: 8px;
        }
        
        .load-indicator { 
            width: 120px; 
            height: 1px; 
            background: #222; 
            margin-top: 35px; 
            position: relative; 
            overflow: hidden; 
        }
        
        .load-indicator::after { 
            content: ''; 
            position: absolute; 
            left: 0; 
            top: 0; 
            height: 100%; 
            width: 50%; 
            background: var(--gold); 
            animation: animLoad 1.5s infinite; 
        }
        
        @keyframes animLoad { 
            0% { left: -100%; } 
            100% { left: 100%; } 
        }

        /* ═══ السلايدر ═══ */
        .stage { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            overflow: hidden;
        }
        
        .track { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1); 
        }
        
        .slide { 
            min-width: 100%; 
            width: 100%;
            height: 100%; 
            position: relative; 
            overflow: hidden; 
            flex-shrink: 0;
        }
        
        .slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 12s linear;
            display: block;
        }
        
        .slide.active img { transform: scale(1.15); }
        
        .slide-overlay { 
            position: absolute; 
            inset: 0; 
            background: linear-gradient(to top, rgba(0,0,0,1) 20%, rgba(0,0,0,0.4) 55%, transparent 90%); 
            z-index: 2; 
            pointer-events: none;
        }
        
        /* ✅ ضبط موضع بيانات العقار */
        .prop-data { 
            position: absolute; 
            bottom: calc(70px + var(--safe-bottom)); 
            right: 24px; 
            left: 24px; 
            z-index: 5; 
            max-width: 700px;
            pointer-events: auto;
        }
        
        .prop-data h2 { 
            color: var(--gold); 
            font-size: 2rem; 
            font-weight: 900; 
            margin-bottom: 10px; 
            text-shadow: 0 2px 8px #000;
            line-height: 1.3;
        }
        
        .prop-data p {
            color: #ddd;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 14px;
        }
        
        .prop-price { 
            font-size: 2rem; 
            font-weight: 900; 
            color: #fff; 
            margin-bottom: 20px; 
            display: inline-block; 
            border-right: 4px solid var(--gold); 
            padding-right: 14px; 
            text-shadow: 0 2px 8px #000;
            line-height: 1.1;
        }
        
        .btn-link { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000; 
            padding: 16px 32px; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: 800;
            font-size: 1rem;
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
            pointer-events: auto;
            cursor: pointer;
        }
        .btn-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 36px rgba(212,175,55,0.6);
        }
        .btn-link:active {
            transform: scale(0.97);
        }
        
        /* ✅ شريط التقدم — z-index أعلى + ظل ذهبي */
        .progress-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 0%; 
            height: 5px; 
            background: var(--gold); 
            z-index: 99999; 
            transition: width 0.1s linear;
            box-shadow: 0 0 12px var(--gold), 0 0 24px rgba(212, 175, 55, 0.5);
            border-radius: 0 3px 0 0;
            pointer-events: none;
        }

        /* ═══ Responsive ═══ */
        @media (max-width: 640px) {
            .intro-h { font-size: 1.6rem; }
            
            .prop-data { 
                bottom: calc(60px + var(--safe-bottom)); 
                right: 16px; 
                left: 16px; 
            }
            .prop-data h2 { 
                font-size: 1.25rem; 
                margin-bottom: 6px;
            }
            .prop-data p { 
                font-size: 0.82rem; 
                line-height: 1.5;
                margin-bottom: 10px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            .prop-price { 
                font-size: 1.35rem; 
                margin-bottom: 14px;
                padding-right: 12px;
            }
            .btn-link { 
                padding: 13px 22px; 
                font-size: 0.88rem; 
                width: 100%; 
                justify-content: center;
                border-radius: 12px;
            }
            .ui-brand { font-size: 0.85rem; }
            .ui-exit { padding: 7px 14px; font-size: 0.72rem; }
        }

        /* شاشات صغيرة جداً */
        @media (max-width: 380px) {
            .prop-data h2 { font-size: 1.1rem; }
            .prop-data p { display: none; }
            .prop-price { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="ui-brand">
            <i class="fas fa-crown"></i> سمسار طلبك | ELITE
        </div>
        <a href="/" class="ui-exit">
            <i class="fas fa-times"></i> إغلاق
        </a>
    </div>

    <div id="introLayer">
        <i class="fas fa-gem" style="font-size: 3.5rem; color: var(--gold); margin-bottom: 22px;"></i>
        <h1 class="intro-h">بوابة النخبة العقارية</h1>
        <p class="intro-sub">تجربة سينمائية لأفخم العقارات</p>
        <div class="load-indicator"></div>
    </div>

    <main class="stage">
        <div class="track" id="mainTrack"></div>
    </main>

    <div class="progress-bar" id="progressBar"></div>

    <script>
        // ═══ بيانات العقارات ═══
        const properties = [
            { 
                title: "أيقونة المنطقة العاشرة | 180م", 
                price: "3,700,000 ج.م", 
                img: "apartment-180m-nasr-city.webp", 
                desc: "فخامة الترا سوبر لوكس، دور ثالث واجهة رئيسية بقلب مدينة نصر.", 
                url: "/properties/10th-district-180m/" 
            },
            { 
                title: "جوهرة ميدان رابعة | 135م", 
                price: "5,000,000 ج.م", 
                img: "raba-nasr.webp", 
                desc: "تشطيب مهندس شامل التكييفات والمطبخ في أرقى عمارات طريق النصر.", 
                url: "/properties/rabaa-square-135m-lux/" 
            },
            { 
                title: "فيلا دوبلكس حي الأندلس", 
                price: "إيجار إداري 55,000 ج.م", 
                img: "duplex-andalus.webp", 
                desc: "مدخل خاص وحديقة 65م أمام ماونتن فيو مباشرة بالتجمع الخامس.", 
                url: "/properties/andalus1-duplex-285m/" 
            },
            { 
                title: "إطلالة شارع الطيران | 225م", 
                price: "8,000,000 ج.م", 
                img: "al-Tayaranstreet.webp", 
                desc: "مباني حديثة 2014، فيو مفتوح للأبد، تشطيب الترا سوبر لوكس.", 
                url: "/properties/tayaran-main-225m-luxury/" 
            },
            { 
                title: "دوبلكس استثماري | حي السفارات", 
                price: "4,850,000 ج.م", 
                img: "elsfarat-duplex.webp", 
                desc: "فرصة بعائد فوري، مؤجر حالياً لطلاب أجانب بزيادة سنوية.", 
                url: "/properties/duplex-safarat-invest-220m/" 
            },
            { 
                title: "تحفة المنطقة الأولى | 225م", 
                price: "7,500,000 ج.م", 
                img: "zuhair-sabri.webp", 
                desc: "تشطيب قصور بموقع راقٍ خلف المحلاوي.", 
                url: "/properties/zone1-luxury-225m/" 
            },
            { 
                title: "فرصة زهراء مدينة نصر | 86م", 
                price: "1,650,000 ج.م", 
                img: "zahraa-thirdfloor.webp", 
                desc: "سكن اقتصادي في موقع حيوي، دور ثالث مميز، فيو مفتوح.", 
                url: "/properties/zahraa-nasr-86m/" 
            },
            { 
                title: "ناصية توفيق البكري | 250م", 
                price: "5,000,000 ج.م", 
                img: "tawfiqal-Bakri-st.webp", 
                desc: "شقة صحية بليفينج 30م، مسجلة شهر عقاري خلف مستشفى حسبو.", 
                url: "/properties/tawfik-al-bakry-250m/" 
            },
            { 
                title: "لقطة حسن المأمون | للشباب", 
                price: "1,650,000 ج.م", 
                img: "tawnit.webp", 
                desc: "عمارات التعاونيات، موقع استراتيجي قرب الخدمات والمواصلات.", 
                url: "/properties/taawuniyat-hassan-maamoun/" 
            },
            { 
                title: "أبراج صن رايز | 288م", 
                price: "7,000,000 ج.م", 
                img: "sunrise.webp", 
                desc: "حي السفارات، فيو بحري 100%، تشطيب مودرن فاخر.", 
                url: "/properties/sunrise-towers-288m/" 
            }
        ];

        let currentIdx = 0, progress = 0;
        const SLIDE_DURATION = 6000;
        let autoPlayTimer = null;

        function build() {
            const track = document.getElementById('mainTrack');
            properties.forEach((p, i) => {
                const slide = document.createElement('article');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                slide.innerHTML = `
                    <img src="/assets/img/properties/${p.img}" 
                         alt="${p.title}" 
                         loading="${i === 0 ? 'eager' : 'lazy'}"
                         onerror="this.src='/assets/img/logo.webp';this.style.objectFit='contain';this.style.padding='40px';">
                    <div class="slide-overlay"></div>
                    <div class="prop-data">
                        <h2>${p.title}</h2>
                        <p>${p.desc}</p>
                        <strong class="prop-price">${p.price}</strong>
                        <div>
                            <a href="${p.url}" class="btn-link">
                                <i class="fas fa-arrow-left"></i>
                                اكتشف التحفة العقارية
                            </a>
                        </div>
                    </div>
                `;
                track.appendChild(slide);
            });
            
            setTimeout(() => {
                const intro = document.getElementById('introLayer');
                if (intro) {
                    intro.style.opacity = '0';
                    setTimeout(() => { 
                        intro.style.display = 'none'; 
                        startEngine(); 
                    }, 500);
                }
            }, 1200);
        }

        function startEngine() {
            autoPlayTimer = setInterval(() => {
                progress += (100 / (SLIDE_DURATION / 100));
                document.getElementById('progressBar').style.width = progress + '%';
                if (progress >= 100) {
                    progress = 0;
                    goToSlide(currentIdx + 1);
                }
            }, 100);
        }

        function goToSlide(idx) {
            currentIdx = (idx + properties.length) % properties.length;
            document.getElementById('mainTrack').style.transform = `translateX(${currentIdx * 100}%)`;
            document.querySelectorAll('.slide').forEach((s, i) => {
                s.classList.toggle('active', i === currentIdx);
            });
            progress = 0;
            document.getElementById('progressBar').style.width = '0%';
        }

        // ═══ دعم التنقل بالسحب ═══
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    goToSlide(currentIdx + 1);
                } else {
                    goToSlide(currentIdx - 1);
                }
            }
        }, { passive: true });

        // ═══ دعم لوحة المفاتيح ═══
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.location.href = '/';
            if (e.key === 'ArrowLeft') goToSlide(currentIdx + 1);
            if (e.key === 'ArrowRight') goToSlide(currentIdx - 1);
        });

        window.onload = build;
    </script>
</body>
</html>
