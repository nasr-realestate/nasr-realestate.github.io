<body class="page-luxury">

    <div class="ui-overlay">
        <div class="ui-brand">
            <i class="fas fa-crown"></i> سمسار طلبك | ELITE
        </div>
        <a href="/" class="ui-exit">
            <i class="fas fa-times"></i> إغلاق
        </a>
    </div>

    <div id="introLayer">
        <i class="fas fa-gem lx-gate-ico"></i>
        <h1 class="intro-h">بوابة النخبة العقارية</h1>
        <p class="intro-sub">تجربة سينمائية لأفخم العقارات</p>
        <div class="load-indicator"></div>
    </div>

    <main class="stage">
        <div class="track" id="mainTrack"></div>
    </main>

    <div class="progress-bar" id="progressBar"></div>

    <script>
        // ═══ بيانات العقارات ═══
        const properties = [
            { 
                title: "أيقونة المنطقة العاشرة | 180م", 
                price: "3,700,000 ج.م", 
                img: "apartment-180m-nasr-city.webp", 
                desc: "فخامة الترا سوبر لوكس، دور ثالث واجهة رئيسية بقلب مدينة نصر.", 
                url: "/properties/10th-district-180m/" 
            },
            { 
                title: "جوهرة ميدان رابعة | 135م", 
                price: "5,000,000 ج.م", 
                img: "raba-nasr.webp", 
                desc: "تشطيب مهندس شامل التكييفات والمطبخ في أرقى عمارات طريق النصر.", 
                url: "/properties/rabaa-square-135m-lux/" 
            },
            { 
                title: "فيلا دوبلكس حي الأندلس", 
                price: "إيجار إداري 55,000 ج.م", 
                img: "duplex-andalus.webp", 
                desc: "مدخل خاص وحديقة 65م أمام ماونتن فيو مباشرة بالتجمع الخامس.", 
                url: "/properties/andalus1-duplex-285m/" 
            },
            { 
                title: "إطلالة شارع الطيران | 225م", 
                price: "8,000,000 ج.م", 
                img: "al-Tayaranstreet.webp", 
                desc: "مباني حديثة 2014، فيو مفتوح للأبد، تشطيب الترا سوبر لوكس.", 
                url: "/properties/tayaran-main-225m-luxury/" 
            },
            { 
                title: "دوبلكس استثماري | حي السفارات", 
                price: "4,850,000 ج.م", 
                img: "elsfarat-duplex.webp", 
                desc: "فرصة بعائد فوري، مؤجر حالياً لطلاب أجانب بزيادة سنوية.", 
                url: "/properties/duplex-safarat-invest-220m/" 
            },
            { 
                title: "تحفة المنطقة الأولى | 225م", 
                price: "7,500,000 ج.م", 
                img: "zuhair-sabri.webp", 
                desc: "تشطيب قصور بموقع راقٍ خلف المحلاوي.", 
                url: "/properties/zone1-luxury-225m/" 
            },
            { 
                title: "فرصة زهراء مدينة نصر | 86م", 
                price: "1,650,000 ج.م", 
                img: "zahraa-thirdfloor.webp", 
                desc: "سكن اقتصادي في موقع حيوي، دور ثالث مميز، فيو مفتوح.", 
                url: "/properties/zahraa-nasr-86m/" 
            },
            { 
                title: "ناصية توفيق البكري | 250م", 
                price: "5,000,000 ج.م", 
                img: "tawfiqal-Bakri-st.webp", 
                desc: "شقة صحية بليفينج 30م، مسجلة شهر عقاري خلف مستشفى حسبو.", 
                url: "/properties/tawfik-al-bakry-250m/" 
            },
            { 
                title: "لقطة حسن المأمون | للشباب", 
                price: "1,650,000 ج.م", 
                img: "tawnit.webp", 
                desc: "عمارات التعاونيات، موقع استراتيجي قرب الخدمات والمواصلات.", 
                url: "/properties/taawuniyat-hassan-maamoun/" 
            },
            { 
                title: "أبراج صن رايز | 288م", 
                price: "7,000,000 ج.م", 
                img: "sunrise.webp", 
                desc: "حي السفارات، فيو بحري 100%، تشطيب مودرن فاخر.", 
                url: "/properties/sunrise-towers-288m/" 
            }
        ];

        let currentIdx = 0, progress = 0;
        const SLIDE_DURATION = 6000;
        let autoPlayTimer = null;

        function build() {
            const track = document.getElementById('mainTrack');
            properties.forEach((p, i) => {
                const slide = document.createElement('article');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                slide.innerHTML = `
                    <img src="/assets/img/properties/${p.img}" 
                         alt="${p.title}" 
                         loading="${i === 0 ? 'eager' : 'lazy'}"
                         onerror="this.src='/assets/img/logo.webp';this.style.objectFit='contain';this.style.padding='40px';">
                    <div class="slide-overlay"></div>
                    <div class="prop-data">
                        <h2>${p.title}</h2>
                        <p>${p.desc}</p>
                        <strong class="prop-price">${p.price}</strong>
                        <div>
                            <a href="${p.url}" class="btn-link">
                                <i class="fas fa-arrow-left"></i>
                                اكتشف التحفة العقارية
                            </a>
                        </div>
                    </div>
                `;
                track.appendChild(slide);
            });
            
            setTimeout(() => {
                const intro = document.getElementById('introLayer');
                if (intro) {
                    intro.style.opacity = '0';
                    setTimeout(() => { 
                        intro.style.display = 'none'; 
                        startEngine(); 
                    }, 500);
                }
            }, 1200);
        }

        function startEngine() {
            autoPlayTimer = setInterval(() => {
                progress += (100 / (SLIDE_DURATION / 100));
                document.getElementById('progressBar').style.width = progress + '%';
                if (progress >= 100) {
                    progress = 0;
                    goToSlide(currentIdx + 1);
                }
            }, 100);
        }

        function goToSlide(idx) {
            currentIdx = (idx + properties.length) % properties.length;
            document.getElementById('mainTrack').style.transform = `translateX(${currentIdx * 100}%)`;
            document.querySelectorAll('.slide').forEach((s, i) => {
                s.classList.toggle('active', i === currentIdx);
            });
            progress = 0;
            document.getElementById('progressBar').style.width = '0%';
        }

        // ═══ دعم التنقل بالسحب ═══
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        
        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    goToSlide(currentIdx + 1);
                } else {
                    goToSlide(currentIdx - 1);
                }
            }
        }, { passive: true });

        // ═══ دعم لوحة المفاتيح ═══
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.location.href = '/';
            if (e.key === 'ArrowLeft') goToSlide(currentIdx + 1);
            if (e.key === 'ArrowRight') goToSlide(currentIdx - 1);
        });

        window.onload = build;
    </script>
</body>
</html>
