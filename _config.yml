# --- تحسين الأداء والاستثناءات ---
sass:
  style: compressed

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  blanklines: false

# ملفات تبقى في المخرجات حتى لو لم يولّدها Jekyll
# (2026-10-10 — ترحيل الإشعارات: كان المسار قديمًا assets/js/firebase-messaging-sw.js
#  بينما الملف الفعلي في الجذر. يُصحَّح المسار الآن، ويُحذف الإدخال لاحقًا
#  عند إزالة تكامل Firebase بعد التأكد من نجاح نظام Web Push الجديد.)
# 2026-10-16 — طبقة الذكاء الاصطناعي (scripts/build-ai-artifacts.mjs) تُكتب
# داخل _site بعد jekyll build. الإدخالات أدناه تحمي المخرجات لو أُعيد بناء
# Jekyll في نفس مجلد الوجهة (بلا clean)، فلا يختفي الـ API أو .well-known.
keep_files:
  - search-data.json
  - firebase-messaging-sw.js
  - ai-feed.json
  - llms-full.txt
  - api
  - .well-known

# تصحيح 2026-10-16: النشر الفعلي على Pages يأتي من بناء الفرع (master/الجذر)
# لا من مخرَج Actions، لذلك تُحفظ ملفات طبقة الذكاء في الجذر أيضًا. وJekyll
# يتجاهل ما يبدأ بنقطة إلا إذا صُرّح به في include — وهذا ما يلزم لـ .well-known.
include:
  - .well-known

# ملاحظة: Jekyll يتجاهل أي ملف أو مجلد يبدأ بنقطة، لذلك .well-known لا يمكن
# أن يُولَّد من داخل Jekyll أصلًا — وهو ما يجعله من مسؤولية المُولّد أعلاه.

exclude:
  - _worker
  - assets/css/style.css.orig
  - CSS-UNIFICATION-REPORT.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - .github
  - .jekyll-cache
  - .jekyll-metadata
  - README.md
  - node_modules
  - package.json
  - package-lock.json
  - .gitignore
  - .vscode
  - .DS_Store
  - scripts

# ⚠️ 2026-10-16 (اكتشاف من CI في verify-ai-layer.yml) — المضيدة الرابعة:
# GitHub Pages تُفعّل تلقائيًا الإضافة jekyll-optional-front-matter (انظر
# DEFAULT_PLUGINS في github/pages-gem v231)، وهي تحوّل **كل** ملف Markdown بلا
# front matter إلى «صفحة» لها رابط pretty. النتيجة على طبقة الذكاء: ملفات
# api/properties/*.md تُنشر مرتين — نسخة حرفية صحيحة (لأن الأصل يُحتفظ به
# افتراضيًا) **و102 صفحة HTML مكرّرة** على /api/properties/<slug>/index.html
# تدخل sitemap.xml، فيتقدّم HTML على واجهة JSON/Markdown التي نعد بها النماذج.
# إيقافها صريحًا يجعل شجرة api/ ملفات ساكنة تُنشر بايتًا ببايت.
# ملاحظة: لا نستعمل المفتاح require_front_matter لإسكاتها، لأنه يُفعّل معها
# remove_originals فتُحذف النسخ الأصلية من _site بدل أن تُنشر حرفيًا.
optional_front_matter:
  enabled: false
