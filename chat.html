<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النخبة | طارق طنطاوي</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: #0B0B0B; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        /* الشريط العلوي السيادي */
        .header-bar {
            height: 60px; background: #1A1A1B; display: flex;
            align-items: center; justify-content: space-between;
            padding: 0 20px; border-bottom: 2px solid #C5A059;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; z-index: 10;
        }
        .logo-section { display: flex; align-items: center; gap: 10px; }
        .logo-section img { width: 40px; border-radius: 50%; border: 1px solid #C5A059; }
        .logo-section span { color: #C5A059; font-weight: bold; font-size: 1.1rem; }
        
        .close-btn {
            background: #C5A059; color: #000; border: none;
            padding: 8px 15px; border-radius: 5px; cursor: pointer;
            font-weight: bold; text-decoration: none; font-size: 0.9rem;
        }
        /* حاوية البوت لملء الشاشة */
        .bot-container {
            width: 100%; height: calc(100% - 60px); position: relative;
        }
        /* إخفاء تذييل Jotform بقدر الإمكان عبر التغطية البصرية */
        .overlay-mask {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 40px; background: #0B0B0B; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 10px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="logo-section">
            <img src="https://nasr-realestate.github.io/logo.png" alt="سمسار طلبك">
            <span>خزانة العقارات | طارق طنطاوي</span>
        </div>
        <a href="index.html" class="close-btn">إغلاق العودة للموقع</a>
    </div>

    <div class="bot-container">
        <!-- ضع كود التضمين (Embed Code) الخاص بـ Jotform هنا بالأسفل -->
        
        <script src="https://agent.jotform.com/019d95efcafa75be955b3a9f5775be53337b/embed.js"></script>

        <!-- هذه الطبقة تحل محل التذييل وتظهر هويتك أنت -->
        <div class="overlay-mask">
            جميع الحقوق محفوظة © سمسار طلبك ٢٠٢٦
        </div>
    </div>

</body>
</html>
