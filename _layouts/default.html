<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  {% if page.image_file %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
  {% else %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
  {% endif %}

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#075e54">
  <meta name="google-site-verification" content="ozxUgrS2657mo8HYSvgjhYSeYv1FCcc8ig_3wjmSoGA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-5BTRF7NP');</script>

  <style>
    :root {
      --wa-header: #075e54;
      --wa-bg: #efeae2;
      --wa-msg-in: #ffffff;
      --wa-msg-out: #dcf8c6;
      --wa-text: #111111;
      --wa-time: #667781;
    }

    #elite-chat-bubble {
      position: fixed;
      bottom: 25px;
      left: 25px;
      width: 62px;
      height: 62px;
      background: #25d366;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }
    #elite-chat-bubble:hover {
      transform: scale(1.08);
    }
    #elite-chat-bubble img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    #elite-chat-window {
      position: fixed;
      bottom: 95px;
      left: 25px;
      width: 380px;
      max-width: 92vw;
      height: 560px;
      background: var(--wa-bg);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      font-family: 'Cairo', sans-serif;
    }
    #elite-chat-window.open {
      display: flex;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-header {
      background: var(--wa-header);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }
    .chat-header img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .chat-header div { flex: 1; }
    .chat-header h4 {
      color: #fff;
      margin: 0;
      font-size: 0.98rem;
      font-weight: 700;
    }
    .chat-header p {
      color: #e0f2f1;
      margin: 2px 0 0;
      font-size: 0.72rem;
    }
    .chat-header button {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 20px;
      opacity: 0.85;
    }
    .chat-header button:hover { opacity: 1; }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--wa-bg);
      background-image: radial-gradient(#cbd5e1 1px, transparent 0);
      background-size: 12px 12px;
    }

    .msg {
      max-width: 82%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.6;
      word-break: break-word;
      position: relative;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }
    .msg-bot {
      background: var(--wa-msg-in);
      color: var(--wa-text);
      align-self: flex-start;
      border-top-right-radius: 0;
    }
    .msg-user {
      background: var(--wa-msg-out);
      color: var(--wa-text);
      align-self: flex-end;
      border-top-left-radius: 0;
    }

    .msg-time {
      font-size: 10px;
      color: var(--wa-time);
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
    }

    .msg-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 7px 12px;
      background: #075e54;
      color: #fff !important;
      text-decoration: none !important;
      font-weight: 700;
      border-radius: 6px;
      font-size: 12px;
      transition: background 0.2s;
    }
    .msg-link-btn:hover {
      background: #054840;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      background: var(--wa-msg-in);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }

    .chat-input-area {
      background: #f0f0f0;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #user-input {
      flex: 1;
      background: #fff;
      border: none;
      border-radius: 20px;
      padding: 9px 14px;
      color: #000;
      outline: none;
      font-size: 13.5px;
    }
    #user-input:disabled {
      background: #e9ecef;
    }
    #send-btn {
      background: #075e54;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
      transition: background 0.2s;
    }
    #send-btn:hover {
      background: #054840;
    }
    #send-btn:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  {% include navbar.html %}
  <main>{{ content }}</main>
  {% include footer.html %}

  <div id="elite-chat-bubble" onclick="toggleChat()" aria-label="فتح المحادثة">
    <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي">
  </div>

  <div id="elite-chat-window">
    <div class="chat-header">
      <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي">
      <div>
        <h4>طارق طنطاوي</h4>
        <p>متصل الآن</p>
      </div>
      <button onclick="toggleChat()" aria-label="إغلاق">✕</button>
    </div>

    <div id="chat-messages">
      <div id="tarek-typing" class="typing-indicator">جاري الكتابة...</div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter' && !isSending) sendMsg()">
      <button id="send-btn" onclick="sendMsg()" aria-label="إرسال">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://royal-snow-ea32.footcai-555.workers.dev/";
    const STORAGE_KEY = "tarek_whatsapp_chat_v3";
    const SCORE_KEY = "tarek_qual_score";
    const WA_KEY = "tarek_can_wa";

    let chatHistory = [];
    let qualificationScore = parseInt(localStorage.getItem(SCORE_KEY) || "0");
    let canShareWhatsapp = localStorage.getItem(WA_KEY) === "true";
    let isSending = false;

    function toggleChat() {
      const windowEl = document.getElementById("elite-chat-window");
      windowEl.classList.toggle("open");
      if (windowEl.classList.contains("open")) {
        scrollBottom();
        document.getElementById("user-input").focus();
      }
    }

    function getTimeString() {
      const now = new Date();
      return now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
      localStorage.setItem(SCORE_KEY, qualificationScore.toString());
      localStorage.setItem(WA_KEY, canShareWhatsapp ? "true" : "false");
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) return false;
        chatHistory = data;
        return true;
      } catch {
        return false;
      }
    }

    function clearMessagesAndRehydrate() {
      const container = document.getElementById("chat-messages");
      const typingBox = document.getElementById("tarek-typing");

      Array.from(container.querySelectorAll(".msg")).forEach((n) => n.remove());
      chatHistory.forEach(msg => renderMsg(msg.text, msg.type, msg.time));
      if (typingBox) container.appendChild(typingBox);
      scrollBottom();
    }

    function parseMarkdown(text) {
      let parsed = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      const linkRegex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
      parsed = parsed.replace(linkRegex, function(_, label, url) {
        const isWa = /wa\.me\//i.test(url);
        return `<br><a href="${url}" target="_blank" class="msg-link-btn">${isWa ? '<i class="fab fa-whatsapp"></i> ' : '<i class="fas fa-link"></i> '}${label}</a>`;
      });
      return parsed.replace(/\n/g, '<br>');
    }

    function renderMsg(text, type, timeStr) {
      const container = document.getElementById("chat-messages");
      const typingBox = document.getElementById("tarek-typing");

      const div = document.createElement("div");
      div.className = `msg msg-${type}`;

      const t = timeStr || getTimeString();
      const checkMarks = type === "user" ? ' <i class="fas fa-check-double" style="color:#53bdeb;"></i>' : '';

      let formattedText = type === "bot" ? parseMarkdown(text) : text.replace(/\n/g, '<br>');

      div.innerHTML = `<div>${formattedText}</div><div class="msg-time">${t}${checkMarks}</div>`;

      if (typingBox) {
        container.insertBefore(div, typingBox);
      } else {
        container.appendChild(div);
      }
      scrollBottom();
    }

    function scrollBottom() {
      const container = document.getElementById("chat-messages");
      if (container) container.scrollTop = container.scrollHeight;
    }

    function setControlsDisabled(disabled) {
      isSending = disabled;
      document.getElementById("user-input").disabled = disabled;
      document.getElementById("send-btn").disabled = disabled;
    }

    function updateQualificationLocally(text) {
      if (/ميزانية|جنيه|مليون|كاش|تقسيط/i.test(text)) qualificationScore += 1;
      if (/مدينة نصر|مصر الجديدة|القاهرة الجديدة|التجمع/i.test(text)) qualificationScore += 1;
      if (/شراء|جاهز|معاينة|شقة|فيلا/i.test(text)) qualificationScore += 1;
      if (qualificationScore >= 3) canShareWhatsapp = true;
    }

    async function sendMsg() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text || isSending) return;

      setControlsDisabled(true);
      const time = getTimeString();
      
      updateQualificationLocally(text);
      renderMsg(text, "user", time);
      chatHistory.push({ text, type: "user", time });
      saveState();

      input.value = "";

      const typing = document.getElementById("tarek-typing");
      if (typing) typing.style.display = "block";
      scrollBottom();

      // اقتطاع آخر 4 رسائل فقط لحماية الحصة المجانية
      const recentMessages = chatHistory.slice(-4).map(h => ({
        role: h.type === "bot" ? "assistant" : "user",
        message: h.text,
        text: h.text,
        type: h.type
      }));

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            message: text,
            history: recentMessages,
            messages: recentMessages,
            qualificationScore: qualificationScore,
            canShareWhatsapp: canShareWhatsapp
          })
        });

        const data = await res.json();
        if (typing) typing.style.display = "none";

        if (typeof data.qualificationScore === "number") {
          qualificationScore = Math.max(qualificationScore, data.qualificationScore);
        }
        if (data.canShareWhatsapp || qualificationScore >= 3) {
          canShareWhatsapp = true;
        }

        const botReply = data.response || data.reply || "عذراً، حدث خطأ في معالجة طلبك.";
        const botTime = getTimeString();

        renderMsg(botReply, "bot", botTime);
        chatHistory.push({ text: botReply, type: "bot", time: botTime });
        saveState();
      } catch (e) {
        if (typing) typing.style.display = "none";
        const fallback = "في مشكلة اتصال مؤقتة. أرسل بيانات طلبك وأنا هتابع معاك هنا بنفسي.";
        const botTime = getTimeString();
        renderMsg(fallback, "bot", botTime);
        chatHistory.push({ text: fallback, type: "bot", time: botTime });
        saveState();
      } finally {
        setControlsDisabled(false);
        document.getElementById("user-input").focus();
      }
    }

    window.onload = () => {
      const hasState = loadState();
      if (!hasState || chatHistory.length === 0) {
        chatHistory = [
          {
            text: "أهلاً يا فندم، معاك طارق طنطاوي. بتدور على شقة في مدينة نصر ولا حابب تعرض عقارك للبيع؟",
            type: "bot",
            time: getTimeString()
          }
        ];
        saveState();
      }

      clearMessagesAndRehydrate();
    };
  </script>
</body>
</html>
