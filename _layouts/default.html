<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075e54" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#054d44" media="(prefers-color-scheme: dark)">

  {% seo %}

  <!-- ⬇️⬇️⬇️ السطر الجديد ⬇️⬇️⬇️ -->
  {% include schema-global.html %}
  <!-- ⬆️⬆️⬆️ نهاية السطر الجديد ⬆️⬆️⬆️ -->

  {% if page.image_file %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
  {% else %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
  {% endif %}

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="google-site-verification" content="ozxUgrS2657mo8HYSvgjhYSeYv1FCcc8ig_3wjmSoGA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
  <link rel="preload" as="image" href="{{ '/assets/img/logo.webp' | relative_url }}" fetchpriority="high">
  
  <style>
    :root { --color-primary: #d4af37; --color-text-primary: #f5f5f5; --color-border-light: #333; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: var(--color-text-primary); }
    body { font-family: Arial, sans-serif; }
    .navbar { background: rgba(5,5,5,.9); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--color-border-light); }
    .navbar-logo img { max-height: 50px; width: auto; display: block; }
    .navbar-links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: flex-end; }
    .nav-link { display: flex; align-items: center; color: var(--color-text-primary); text-decoration: none; font-weight: 700; }
    @media (max-width: 768px) { .navbar { padding: 1rem; flex-wrap: wrap; justify-content: center; } }
    @media (max-width: 420px) { .navbar-links { gap: .75rem; justify-content: center; width: 100%; margin-top: .75rem; } .navbar-logo { width: 100%; text-align: center; margin-bottom: .5rem; } }
  </style>
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></noscript>

  <script>
    window.addEventListener('load', function () {
      var loadGtm = function () {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-5BTRF7NP';
        document.head.appendChild(script);
      };
      window.setTimeout(loadGtm, 10000);
    }, { once: true });
  </script>
</head>

<body>
  {{ content }}

  <!-- ═══ زر الوكيل الذكي ═══ -->
  <a href="/agent.html"
     class="agent-float-btn"
     aria-label="تواصل مع طارق طنطاوي — الوكيل الذكي"
     title="تحدث مع طارق طنطاوي الآن">
    <img src="{{ '/assets/img/team/tareq.webp' | relative_url }}"
         alt="طارق طنطاوي"
         loading="lazy">
    <span class="badge-level">7</span>
    <span class="badge-wa">
      <i class="fab fa-whatsapp"></i>
    </span>
    <span class="status-badge">
      <span class="status-dot"></span>
      متصل
    </span>
    <span class="tooltip">تحدث مع طارق 👋</span>
  </a>
</body>
</html>
