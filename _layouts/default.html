<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  {% if page.image_file %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
  {% else %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
  {% endif %}

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#d4af37">
  <meta name="google-site-verification" content="ozxUgrS2657mo8HYSvgjhYSeYv1FCcc8ig_3wjmSoGA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-5BTRF7NP');</script>

  <style>
    :root { --gold: #d4af37; --light-gold: #fcf8e3; --royal-white: #ffffff; --text-gray: #444; }

    /* ========== أيقونة طارق الوامضة (يسار) ========== */
    #elite-chat-bubble {
      position: fixed; bottom: 30px; left: 30px; width: 75px; height: 75px;
      background: var(--royal-white); border: 3px solid var(--gold); border-radius: 50%;
      cursor: pointer; z-index: 10000; box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: center; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #elite-chat-bubble:hover { transform: scale(1.1) rotate(5deg); }
    #elite-chat-bubble img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    /* الهالة الذهبية النابضة */
    #elite-chat-bubble::after {
      content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
      border: 4px solid var(--gold); animation: goldenPulse 2s infinite; opacity: 0;
    }
    @keyframes goldenPulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* ========== نافذة طارق الاحترافية (لايت) ========== */
    #elite-chat-window {
      position: fixed; bottom: 120px; left: 30px; width: 380px; max-width: 90vw; height: 550px;
      background: var(--royal-white); border: 1px solid #e0e0e0; border-radius: 25px;
      display: none; flex-direction: column; z-index: 9999; box-shadow: 0 25px 80px rgba(0,0,0,0.15);
      overflow: hidden; font-family: 'Cairo', sans-serif;
    }
    #elite-chat-window.open { display: flex; animation: slideUp 0.4s ease; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .chat-header { background: linear-gradient(135deg, #111, #333); padding: 20px; display: flex; align-items: center; gap: 15px; }
    .chat-header img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--gold); }
    .chat-header div { flex: 1; }
    .chat-header div h4 { color: #fff; margin: 0; font-size: 0.95rem; font-weight: 900; }
    .chat-header div p { color: var(--gold); margin: 0; font-size: 0.75rem; }
    .chat-header button { background: none; border: none; color: #fff; cursor: pointer; font-size: 24px; opacity: 0.7; }

    #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background: #fafafa; }
    
    .msg { max-width: 80%; padding: 12px 18px; border-radius: 18px; font-size: 14px; line-height: 1.7; position: relative; }
    .msg-bot { background: #fff; color: var(--text-gray); align-self: flex-start; border: 1px solid #eee; border-top-right-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    .msg-user { background: var(--gold); color: #000; align-self: flex-end; font-weight: 700; border-top-left-radius: 5px; box-shadow: 0 4px 10px rgba(212,175,55,0.2); }

    .typing-indicator { font-style: italic; font-size: 12px; color: var(--gold); display: none; margin-bottom: 10px; }

    .chat-input-area { background: #fff; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #eee; }
    #user-input { flex: 1; background: #f5f5f5; border: 1px solid #eee; border-radius: 30px; padding: 12px 20px; color: #333; outline: none; font-size: 14px; }
    #user-input:focus { border-color: var(--gold); background: #fff; }
    #send-btn { background: var(--gold); border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #000; font-size: 18px; transition: 0.3s; }
    #send-btn:hover { transform: rotate(-20deg); background: #b8962d; }

    /* القائمة اليمنى المعهودة */
    .fab-container { position: fixed; bottom: 30px; right: 30px; z-index: 10000; }
    .fab-main { background: #111; color: var(--gold); border: 2px solid var(--gold); padding: 15px 30px; border-radius: 50px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
  </style>
</head>

<body>
  {% include navbar.html %}
  <main>{{ content }}</main>
  {% include footer.html %}

  <!-- بوابة النخبة: أيقونة طارق (يسار) -->
  <div id="elite-chat-bubble" onclick="toggleChat()">
    <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي">
  </div>

  <!-- نافذة المحادثة المريحة -->
  <div id="elite-chat-window">
    <div class="chat-header">
        <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي">
        <div>
            <h4>طارق طنطاوي</h4>
            <p id="tarek-status">متصل الآن</p>
        </div>
        <button onclick="toggleChat()">×</button>
    </div>
    <div id="chat-messages">
        <div class="msg msg-bot">أهلاً بك يا فندم.. معاك طارق طنطاوي. تحت أمرك في أي استشارة عقارية في مدينة نصر.</div>
    </div>
    <div id="tarek-typing" class="typing-indicator" style="padding-right: 20px;">طارق يكتب الآن...</div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="اكتب استفسارك هنا..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button id="send-btn" onclick="sendMsg()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
  </div>

  <!-- مركز طلبك (يمين) -->
  <div class="fab-container" id="fabContainer">
    <button class="fab-main" onclick="location.href='https://wa.me/201147758857'">
      <i class="fab fa-whatsapp"></i>
      <span>حسم الصفقة واتساب</span>
    </button>
  </div>

  <script>
    const WORKER_URL = "https://royal-snow-ea32.footcai-555.workers.dev/";
    let chatHistory = JSON.parse(localStorage.getItem('tarek_chat_memory')) || [];

    function toggleChat() {
      document.getElementById('elite-chat-window').classList.toggle('open');
    }

    // استرجاع المحادثة عند الفتح
    window.onload = () => {
        chatHistory.forEach(msg => renderMsg(msg.text, msg.type));
    };

    async function sendMsg() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      renderMsg(text, 'user');
      saveToMemory(text, 'user');
      input.value = '';

      // تغيير الحالة إلى "طارق يكتب"
      const status = document.getElementById('tarek-status');
      const typing = document.getElementById('tarek-typing');
      status.innerText = "يكتب الآن...";
      typing.style.display = "block";

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: chatHistory })
        });
        const data = await res.json();
        
        status.innerText = "متصل الآن";
        typing.style.display = "none";

        renderMsg(data.response, 'bot');
        saveToMemory(data.response, 'bot');

      } catch (e) {
        status.innerText = "متصل الآن";
        typing.style.display = "none";
        renderMsg("يا فندم حصل ضغط على الشبكة، برجاء إرسال رسالتك مرة تانية.", 'bot');
      }
    }

    function renderMsg(text, type) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `msg msg-${type}`;
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function saveToMemory(text, type) {
        chatHistory.push({ text, type });
        if (chatHistory.length > 20) chatHistory.shift();
        localStorage.setItem('tarek_chat_memory', JSON.stringify(chatHistory));
    }
  </script>
</body>
</html>
