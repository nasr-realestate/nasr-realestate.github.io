<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  {% if page.image_file %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
  {% else %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
  {% endif %}

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#d4af37">
  <meta name="google-site-verification" content="ozxUgrS2657mo8HYSvgjhYSeYv1FCcc8ig_3wjmSoGA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-5BTRF7NP');</script>

  <style>
    :root {
      --gold: #d4af37;
      --gold-hover: #b8962d;
      --dark-bg: #111111;
      --dark-card: #1a1a1a;
      --royal-white: #ffffff;
      --text-light: #f5f5f5;
      --text-muted: #aaa;
      --ok: #23c16b;
      --warn: #f0b429;
    }

    #elite-chat-bubble {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 70px;
      height: 70px;
      background: var(--dark-bg);
      border: 2.5px solid var(--gold);
      border-radius: 50%;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #elite-chat-bubble:hover {
      transform: scale(1.1) rotate(-5deg);
      box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
    }
    #elite-chat-bubble img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    #elite-chat-bubble::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--gold);
      animation: goldenPulse 2.2s infinite ease-out;
      opacity: 0;
    }
    @keyframes goldenPulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    #elite-chat-window {
      position: fixed;
      bottom: 115px;
      left: 30px;
      width: 390px;
      max-width: 92vw;
      height: 560px;
      background: rgba(26, 26, 26, 0.97);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 24px;
      display: none;
      flex-direction: column;
      z-index: 9999;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      font-family: 'Cairo', sans-serif;
    }
    #elite-chat-window.open {
      display: flex;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(40px) scale(0.95); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .chat-header {
      background: linear-gradient(135deg, #0d0d0d, #222222);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }
    .chat-header img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }
    .chat-header div { flex: 1; }
    .chat-header h4 {
      color: #fff;
      margin: 0;
      font-size: 1rem;
      font-weight: 900;
    }
    .chat-header p {
      color: var(--gold);
      margin: 2px 0 0;
      font-size: 0.74rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #2ecc71;
    }
    .chat-header button {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 22px;
      transition: 0.2s;
    }
    .chat-header button:hover { color: #fff; }

    .qual-box {
      background: #161616;
      border-bottom: 1px solid rgba(212, 175, 55, 0.12);
      padding: 10px 14px;
      color: #ddd;
      font-size: 12px;
    }
    .qual-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }
    .qual-label strong { color: #fff; }
    .qual-state.wait { color: var(--warn); font-weight: 700; }
    .qual-state.ready { color: var(--ok); font-weight: 800; }

    .progress-track {
      height: 8px;
      background: #2a2a2a;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.35s ease;
      background: linear-gradient(90deg, #d4af37, #23c16b);
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #141414;
    }

    .msg {
      max-width: 84%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 13.3px;
      line-height: 1.7;
      word-break: break-word;
    }
    .msg-bot {
      background: #222;
      color: var(--text-light);
      align-self: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top-right-radius: 4px;
    }
    .msg-user {
      background: linear-gradient(135deg, #d4af37, #b8962d);
      color: #000;
      align-self: flex-end;
      font-weight: 700;
      border-top-left-radius: 4px;
    }

    .msg-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
      padding: 8px 14px;
      background: #1f2937;
      color: #fff !important;
      text-decoration: none !important;
      font-weight: 800;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.15);
      transition: 0.25s ease;
    }
    .msg-link-btn:hover {
      transform: translateY(-1px);
      background: #374151;
    }
    .msg-link-btn.whatsapp {
      background: #25d366;
      border-color: #25d366;
    }
    .msg-link-btn.whatsapp:hover {
      background: #1ebd56;
    }

    .typing-indicator-box {
      display: none;
      align-self: flex-start;
      background: #222;
      padding: 10px 14px;
      border-radius: 14px;
      border-top-right-radius: 4px;
      margin-bottom: 4px;
      color: #ddd;
      font-size: 12px;
    }

    .chat-input-area {
      background: #1a1a1a;
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    #user-input {
      flex: 1;
      background: #262626;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 25px;
      padding: 10px 16px;
      color: #fff;
      outline: none;
      font-size: 13.5px;
      transition: 0.3s;
    }
    #user-input:focus {
      border-color: var(--gold);
      background: #2d2d2d;
    }
    #send-btn {
      background: var(--gold);
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 16px;
      transition: 0.2s ease;
    }
    #send-btn:hover {
      transform: rotate(-12deg) scale(1.05);
      background: var(--gold-hover);
    }

    .fab-container { position: fixed; bottom: 30px; right: 30px; z-index: 10000; }
    .fab-main {
      background: #111;
      color: var(--gold);
      border: 2px solid var(--gold);
      padding: 13px 20px;
      border-radius: 50px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 9px;
      transition: 0.25s;
    }
    .fab-main:hover { background: var(--gold); color: #000; }
    .fab-main.disabled {
      opacity: 0.55;
      cursor: not-allowed;
      border-color: #777;
      color: #bbb;
      background: #1a1a1a;
    }
    .fab-main.disabled:hover {
      background: #1a1a1a;
      color: #bbb;
      transform: none;
    }
  </style>
</head>

<body>
  {% include navbar.html %}
  <main>{{ content }}</main>
  {% include footer.html %}

  <div id="elite-chat-bubble" onclick="toggleChat()" aria-label="فتح المحادثة">
    <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي">
  </div>

  <div id="elite-chat-window">
    <div class="chat-header">
      <img src="https://nasr-realestate.github.io/assets/img/team/tareq.webp" alt="طارق طنطاوي">
      <div>
        <h4>طارق طنطاوي</h4>
        <p><span class="status-dot"></span> تأهيل ذكي لعملاء مدينة نصر</p>
      </div>
      <button onclick="toggleChat()" aria-label="إغلاق">✕</button>
    </div>

    <div class="qual-box">
      <div class="qual-row">
        <div class="qual-label">مؤشر التأهيل: <strong id="qual-score">0/5</strong></div>
        <div id="qual-state" class="qual-state wait">نجمع بيانات أكثر</div>
      </div>
      <div class="progress-track"><div id="qual-progress" class="progress-fill"></div></div>
    </div>

    <div id="chat-messages">
      <div id="tarek-typing" class="typing-indicator-box">جاري التحضير...</div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="user-input" placeholder="اكتب استفسارك في مدينة نصر فقط..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button id="send-btn" onclick="sendMsg()" aria-label="إرسال">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <div class="fab-container" id="fabContainer">
    <button id="dealBtn" class="fab-main disabled" onclick="openDealWhatsApp()">
      <i class="fab fa-whatsapp" style="font-size: 19px;"></i>
      <span id="dealBtnText">يفتح بعد التأهيل أو بطلبك المباشر</span>
    </button>
  </div>

  <script>
    const WORKER_URL = "https://royal-snow-ea32.footcai-555.workers.dev/";
    const WHATSAPP_URL = "https://wa.me/201147758857";
    const STORAGE_KEY = "tarek_chat_memory_v2";

    let chatHistory = [];
    let qualificationScore = 0;
    let canShareWhatsapp = false;

    function toggleChat() {
      document.getElementById("elite-chat-window").classList.toggle("open");
    }

    function normalizeText(s) {
      return String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
    }

    function detectDirectContactRequest(text) {
      const t = normalizeText(text);
      const keys = ["واتساب", "whatsapp", "رقم", "تواصل", "اتصال", "كلم", "مكالمة", "معاينة", "احجز"];
      return keys.some(k => t.includes(k));
    }

    function computeQualification(history) {
      const userText = history
        .filter(m => m.type === "user")
        .map(m => m.text)
        .join(" \n ")
        .toLowerCase();

      const hasIntent = /(اشتري|شراء|بدور|عايز شقة|عايز شقه|محتاج شقة|بيع|بائع|اعرض عقار)/i.test(userText);
      const hasBudget = /(ميزانية|ميزانيه|مليون|الف|ألف|جنيه|سعر|budget|k|m)/i.test(userText);
      const hasLocation = /(مدينة نصر|مدينه نصر|عباس العقاد|مكرم عبيد|مصطفى النحاس|الحي السابع|الحي الثامن|زهراء مدينة نصر|المنطقة التاسعة|الواحة)/i.test(userText);
      const hasSpecs = /(متر|غرف|غرفة|حمام|دور|تشطيب|فيو|واجهة|واجهه|مصعد|اسانسير)/i.test(userText);
      const hasTimeline = /(جاهز|خلال|الشهر|فوري|أسبوع|اسبوع|وقت|ميعاد|موعد)/i.test(userText);

      const score = [hasIntent, hasBudget, hasLocation, hasSpecs, hasTimeline].filter(Boolean).length;
      return { score, qualified: score >= 4 };
    }

    function updateQualificationUI() {
      const scoreEl = document.getElementById("qual-score");
      const stateEl = document.getElementById("qual-state");
      const fillEl = document.getElementById("qual-progress");
      const dealBtn = document.getElementById("dealBtn");
      const dealBtnText = document.getElementById("dealBtnText");

      scoreEl.textContent = `${qualificationScore}/5`;
      fillEl.style.width = `${Math.max(0, Math.min(100, (qualificationScore / 5) * 100))}%`;

      if (canShareWhatsapp) {
        stateEl.className = "qual-state ready";
        stateEl.textContent = "العميل متأهل للتواصل المباشر";
        dealBtn.classList.remove("disabled");
        dealBtnText.textContent = "حسم الصفقة واتساب";
      } else {
        stateEl.className = "qual-state wait";
        stateEl.textContent = "نجمع بيانات أكثر";
        dealBtn.classList.add("disabled");
        dealBtnText.textContent = "يفتح بعد التأهيل أو بطلبك المباشر";
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        chatHistory,
        qualificationScore,
        canShareWhatsapp
      }));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!Array.isArray(data.chatHistory)) return false;

        chatHistory = data.chatHistory.slice(-24);
        qualificationScore = Number(data.qualificationScore || 0);
        canShareWhatsapp = Boolean(data.canShareWhatsapp);
        return true;
      } catch {
        return false;
      }
    }

    function clearMessagesAndRehydrate() {
      const container = document.getElementById("chat-messages");
      const typingBox = document.getElementById("tarek-typing");

      Array.from(container.querySelectorAll(".msg")).forEach((n) => n.remove());
      chatHistory.forEach(msg => renderMsg(msg.text, msg.type));
      container.appendChild(typingBox);
      scrollBottom();
    }

    function openDealWhatsApp() {
      if (!canShareWhatsapp) return;
      window.open(WHATSAPP_URL, "_blank");
    }

    function parseMarkdownLinks(text) {
      const regex = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
      return text.replace(regex, function(_, label, url) {
        const isWa = /wa\.me\//i.test(url);
        return `<br><a href="${url}" target="_blank" class="msg-link-btn ${isWa ? "whatsapp" : ""}">${isWa ? '<i class="fab fa-whatsapp"></i>' : '<i class="fas fa-link"></i>'} ${label}</a>`;
      });
    }

    function renderMsg(text, type) {
      const container = document.getElementById("chat-messages");
      const typingBox = document.getElementById("tarek-typing");

      const div = document.createElement("div");
      div.className = `msg msg-${type}`;

      if (type === "bot" && /\[[^\]]+\]\(https?:\/\//.test(text)) {
        div.innerHTML = parseMarkdownLinks(text);
      } else {
        div.innerText = text;
      }

      container.insertBefore(div, typingBox);
      scrollBottom();
      return div;
    }

    function scrollBottom() {
      const container = document.getElementById("chat-messages");
      container.scrollTop = container.scrollHeight;
    }

    function pushHistory(text, type) {
      chatHistory.push({ text, type, ts: Date.now() });
      if (chatHistory.length > 24) chatHistory.shift();

      const q = computeQualification(chatHistory);
      qualificationScore = q.score;
      if (q.qualified) canShareWhatsapp = true;

      saveState();
      updateQualificationUI();
    }

    async function sendMsg() {
      const input = document.getElementById("user-input");
      const text = input.value.trim();
      if (!text) return;

      renderMsg(text, "user");
      pushHistory(text, "user");
      if (detectDirectContactRequest(text)) {
        canShareWhatsapp = true;
        updateQualificationUI();
        saveState();
      }

      input.value = "";

      const typing = document.getElementById("tarek-typing");
      typing.style.display = "block";
      scrollBottom();

      try {
        const historyForApi = chatHistory
          .filter(m => m.type === "user" || m.type === "bot")
          .slice(-10)
          .map(m => ({ role: m.type === "bot" ? "assistant" : "user", message: m.text }));

        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: historyForApi })
        });

        const data = await res.json();
        typing.style.display = "none";

        const botReply = data.response || "تعذر تنفيذ الطلب الآن. حاول بعد قليل.";

        if (typeof data.qualificationScore === "number") {
          qualificationScore = data.qualificationScore;
        }
        if (typeof data.canShareWhatsapp === "boolean") {
          canShareWhatsapp = data.canShareWhatsapp;
        }
        if (typeof data.qualified === "boolean" && data.qualified) {
          canShareWhatsapp = true;
        }

        renderMsg(botReply, "bot");
        pushHistory(botReply, "bot");
        updateQualificationUI();
      } catch (e) {
        typing.style.display = "none";
        const fallback = "في مشكلة اتصال مؤقتة. كمّل معايا بياناتك (المنطقة/المساحة/السعر) وأنا أتابع معاك هنا.";
        renderMsg(fallback, "bot");
        pushHistory(fallback, "bot");
      }
    }

    window.onload = () => {
      const hasState = loadState();
      if (!hasState) {
        chatHistory = [
          {
            text: "أهلاً يا فندم، معاك طارق طنطاوي. خلّيني أفلترلك أفضل فرص مدينة نصر — بتشتري ولا بتبيع؟",
            type: "bot",
            ts: Date.now()
          }
        ];
        qualificationScore = 0;
        canShareWhatsapp = false;
        saveState();
      }

      clearMessagesAndRehydrate();
      updateQualificationUI();
    };
  </script>
</body>
</html>
