<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075e54" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#054d44" media="(prefers-color-scheme: dark)">

  {% seo %}

  {% if page.image_file %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
  {% else %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
  {% endif %}

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="google-site-verification" content="ozxUgrS2657mo8HYSvgjhYSeYv1FCcc8ig_3wjmSoGA">

  <!-- ⬇️⬇️⬇️ السطر الجديد — Schema Global في كل الصفحات ⬇️⬇️⬇️ -->
  {% include schema-global.html %}
  <!-- ⬆️⬆️⬆️ نهاية السطر الجديد ⬆️⬆️⬆️ -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Load the font without blocking first paint; the fallback stack preserves layout while it loads. -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"></noscript>
  <!-- Font Awesome is needed for controls below the fold, not for the first paint. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
  <link rel="preload" as="image" href="{{ '/assets/img/logo.webp' | relative_url }}" fetchpriority="high">
  
  <style>
    :root { --color-primary: #d4af37; --color-text-primary: #f5f5f5; --color-border-light: #333; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; background: #000; color: var(--color-text-primary); }
    body { font-family: Arial, sans-serif; }
    .navbar { background: rgba(5,5,5,.9); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--color-border-light); }
    .navbar-logo img { max-height: 50px; width: auto; display: block; }
    .navbar-links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: flex-end; }
    .nav-link { display: flex; align-items: center; color: var(--color-text-primary); text-decoration: none; font-weight: 700; }
    @media (max-width: 768px) { .navbar { padding: 1rem; flex-wrap: wrap; justify-content: center; } }
    @media (max-width: 420px) { .navbar-links { gap: .75rem; justify-content: center; width: 100%; margin-top: .75rem; } .navbar-logo { width: 100%; text-align: center; margin-bottom: .5rem; } }
  </style>
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></noscript>

  <!-- Analytics is intentionally idle-loaded so third-party JavaScript cannot delay LCP/FCP. -->
  <script>
    window.addEventListener('load', function () {
      var loadGtm = function () {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-5BTRF7NP';
        document.head.appendChild(script);
      };
      window.setTimeout(loadGtm, 10000);
    }, { once: true });
  </script>

  <style>
    /* ═══════════════════════════════════════════════
       FLOATING AGENT BUTTON — WhatsApp Green
       ═══════════════════════════════════════════════ */
    .agent-float-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      border-radius: 50%;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4),
                  0 2px 8px rgba(0, 0, 0, 0.2);
      z-index: 999;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: none;
      outline: none;
      padding: 0;
      text-decoration: none;
      animation: agentPulse 2.5s infinite;
    }

    @keyframes agentPulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4), 0 2px 8px rgba(0,0,0,0.2); }
      50% { box-shadow: 0 4px 28px rgba(37, 211, 102, 0.7), 0 2px 8px rgba(0,0,0,0.2); }
    }

    .agent-float-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 32px rgba(37, 211, 102, 0.7),
                  0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .agent-float-btn:active {
      transform: scale(0.96);
    }

    .agent-float-btn img {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      object-fit: cover;
      box-shadow: 0 0 0 2px rgba(37, 211, 102, 0.3);
      display: block;
    }

    .agent-float-btn .badge-level {
      position: absolute;
      top: -2px;
      right: -2px;
      background: linear-gradient(135deg, #fce205, #d4af37);
      color: #054d44;
      font-size: 10px;
      font-weight: 900;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cairo', sans-serif;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      line-height: 1;
    }

    .agent-float-btn .badge-wa {
      position: absolute;
      top: -2px;
      left: -2px;
      background: #25d366;
      color: #ffffff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .agent-float-btn .status-badge {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      background: #075e54;
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 10px;
      border: 1.5px solid #ffffff;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      font-family: 'Cairo', sans-serif;
      letter-spacing: 0.2px;
    }

    .agent-float-btn .status-dot {
      width: 5px;
      height: 5px;
      background: #25d366;
      border-radius: 50%;
      display: inline-block;
      animation: agentDotPulse 1.5s infinite;
    }

    @keyframes agentDotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
    }

    .agent-float-btn .tooltip {
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: #075e54;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-family: 'Cairo', sans-serif;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .agent-float-btn .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 6px 6px 0 6px;
      border-color: #075e54 transparent transparent transparent;
    }

    .agent-float-btn:hover .tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (prefers-color-scheme: dark) {
      .agent-float-btn {
        background: linear-gradient(135deg, #25d366 0%, #054d44 100%);
      }
      .agent-float-btn .status-badge {
        background: #054d44;
      }
      .agent-float-btn .tooltip {
        background: #054d44;
      }
      .agent-float-btn .tooltip::after {
        border-color: #054d44 transparent transparent transparent;
      }
    }

    @media (max-width: 480px) {
      .agent-float-btn {
        width: 56px;
        height: 56px;
        bottom: 16px;
        left: 16px;
      }
      .agent-float-btn img {
        width: 46px;
        height: 46px;
      }
      .agent-float-btn .badge-level,
      .agent-float-btn .badge-wa {
        width: 20px;
        height: 20px;
        font-size: 9px;
      }
      .agent-float-btn .status-badge {
        font-size: 8.5px;
        padding: 2px 6px;
      }
      .agent-float-btn .tooltip {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .agent-float-btn {
        animation: none;
      }
      .agent-float-btn .status-dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  {{ content }}

  <!-- ═══ زر الوكيل الذكي ═══ -->
  <a href="/agent.html"
     class="agent-float-btn"
     aria-label="تواصل مع طارق طنطاوي — الوكيل الذكي"
     title="تحدث مع طارق طنطاوي الآن">

    <img src="{{ '/assets/img/team/tareq.webp' | relative_url }}"
         alt="طارق طنطاوي"
         loading="lazy">

    <span class="badge-level">7</span>

    <span class="badge-wa">
      <i class="fab fa-whatsapp"></i>
    </span>

    <span class="status-badge">
      <span class="status-dot"></span>
      متصل
    </span>

    <span class="tooltip">تحدث مع طارق 👋</span>
  </a>
</body>
</html>
