<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  {% if page.image_file %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/properties/{{ page.image_file }}">
  {% else %}
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/social-home.webp">
  {% endif %}

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#050505">
  <meta name="google-site-verification" content="ozxUgrS2657mo8HYSvgjhYSeYv1FCcc8ig_3wjmSoGA">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-5BTRF7NP');</script>

  <style>
    /* ========== التصميم السيادي (أسود وذهبي) ========== */
    :root { --gold: #d4af37; --black: #050505; --dark-gray: #121212; }
    
    #prestigeSplash {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--black); display: flex; align-items: center; justify-content: center;
      z-index: 100000; animation: splashFadeOut 0.5s ease 1.2s forwards;
      pointer-events: none;
    }
    @keyframes splashFadeOut { to { opacity: 0; visibility: hidden; } }

    /* ========== بوابة النخبة: فقاعة الشات (يسار) ========== */
    #elite-chat-bubble {
      position: fixed; bottom: 24px; left: 24px; width: 65px; height: 65px;
      background: var(--black); border: 2px solid var(--gold); border-radius: 50%;
      cursor: pointer; z-index: 9999; box-shadow: 0 4px 25px rgba(212,175,55,0.4);
      display: flex; align-items: center; justify-content: center; transition: 0.3s;
    }
    #elite-chat-bubble::after {
      content: ''; position: absolute; width: 100%; height: 100%;
      border-radius: 50%; border: 1px solid var(--gold); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
    #elite-chat-bubble:hover { transform: scale(1.1); }
    #elite-chat-bubble img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    /* ========== نافذة المحادثة ========== */
    #elite-chat-window {
      position: fixed; bottom: 100px; left: 24px; width: 360px; max-width: 90vw; height: 500px;
      background: var(--black); border: 1px solid var(--gold); border-radius: 18px;
      display: none; flex-direction: column; z-index: 9998; box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      overflow: hidden; font-family: 'Cairo', sans-serif;
    }
    #elite-chat-window.open { display: flex; }

    .chat-header { background: var(--dark-gray); padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--gold); }
    .chat-header img { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--gold); }
    .chat-header span { color: var(--gold); font-weight: 900; font-size: 0.9rem; flex: 1; }
    .chat-header button { background: none; border: none; color: #fff; cursor: pointer; font-size: 20px; }

    #chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; position: relative; }
    .msg-bot { background: #1a1a1a; color: #eee; align-self: flex-start; border-bottom-right-radius: 2px; }
    .msg-user { background: var(--gold); color: #000; align-self: flex-end; font-weight: 700; border-bottom-left-radius: 2px; }

    .chat-input-area { background: var(--dark-gray); padding: 12px; display: flex; gap: 8px; border-top: 1px solid #222; }
    #user-input { flex: 1; background: #000; border: 1px solid #333; border-radius: 8px; padding: 8px 12px; color: #fff; outline: none; font-family: inherit; }
    #user-input:focus { border-color: var(--gold); }
    #send-btn { background: var(--gold); border: none; border-radius: 8px; width: 40px; height: 40px; cursor: pointer; display: grid; place-items: center; }

    /* ========== FAB القائمة العائمة (يمين) ========== */
    .fab-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9996; display: none; backdrop-filter: blur(5px); }
    .fab-backdrop.active { display: block; }
    .fab-container { position: fixed; bottom: 24px; right: 24px; z-index: 9997; display: flex; flex-direction: column; align-items: flex-end; }
    .fab-main { background: var(--black); border: 2px solid var(--gold); color: var(--gold); padding: 12px 25px; border-radius: 50px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 20px rgba(212,175,55,0.3); }
    .fab-menu { display: none; flex-direction: column; gap: 10px; margin-bottom: 15px; width: 280px; }
    .fab-container.active .fab-menu { display: flex; }
    .fab-item { background: #111; border: 1px solid #222; padding: 12px; border-radius: 15px; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
    .fab-item:hover { border-color: var(--gold); transform: translateX(-5px); }
  </style>
</head>

<body class="{{ page.body_class | default: 'default-page' }}">
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5BTRF7NP" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div id="prestigeSplash">
    <img src="{{ '/assets/img/logo.webp' | relative_url }}" alt="خزانة العقارات" width="280">
  </div>

  {% include navbar.html %}
  <main>{{ content }}</main>
  {% include footer.html %}

  <!-- ========== بوابة النخبة: الشات الذكي لطارق طنطاوي ========== -->
  <div id="elite-chat-bubble" onclick="toggleChat()">
    <img src="{{ '/assets/img/logo.webp' | relative_url }}" alt="طارق طنطاوي">
  </div>

  <div id="elite-chat-window">
    <div class="chat-header">
        <img src="{{ '/assets/img/logo.webp' | relative_url }}" alt="T">
        <span>خزانة العقارات | طارق طنطاوي</span>
        <button onclick="toggleChat()">×</button>
    </div>
    <div id="chat-messages">
        <div class="msg msg-bot">أهلاً بك يا فندم.. معاك طارق طنطاوي. اؤمرني طلبك إيه في مدينة نصر؟</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="اكتب طلبك هنا..." onkeypress="if(event.key==='Enter') sendMsg()">
        <button id="send-btn" onclick="sendMsg()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
  </div>

  <!-- ========== مركز طلبك: القائمة العائمة ========== -->
  <div class="fab-backdrop" id="fabBackdrop"></div>
  <div class="fab-container" id="fabContainer">
    <div class="fab-menu">
      <a href="{{ '/add-your-property.html' | relative_url }}" class="fab-item">
        <i class="fas fa-plus" style="color:var(--gold)"></i>
        <span><strong>أضف عقارك للعرض</strong></span>
      </a>
      <a href="https://wa.me/201147758857" class="fab-item">
        <i class="fab fa-whatsapp" style="color:#25d366"></i>
        <span><strong>حسم الصفقة (واتساب)</strong></span>
      </a>
    </div>
    <button class="fab-main" onclick="toggleFab()">
      <i class="fas fa-bars"></i>
      <span>مركز طلبك</span>
    </button>
  </div>

  <script>
    // رابط الوكيل الجديد في Cloudflare
    const WORKER_URL = "https://wakily.footcai-555.workers.dev";

    function toggleChat() {
      document.getElementById('elite-chat-window').classList.toggle('open');
    }

    async function sendMsg() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      renderMsg(text, 'user');
      input.value = '';

      // إظهار رسالة تفكير مؤقتة
      const loadingDiv = renderMsg("جاري التفكير...", 'bot');

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        
        // إزالة رسالة التحميل ووضع الرد الحقيقي
        loadingDiv.remove();
        renderMsg(data.response, 'bot');
      } catch (e) {
        loadingDiv.innerText = "فيه ضغط على الشبكة، جرب تاني يا غالي.";
      }
    }

    function renderMsg(text, type) {
      const container = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `msg msg-${type}`;
      div.innerText = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function toggleFab() {
      document.getElementById('fabContainer').classList.toggle('active');
      document.getElementById('fabBackdrop').classList.toggle('active');
    }
  </script>
</body>
</html>
