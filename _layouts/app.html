<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <title>{{ page.title | default: site.title }}</title>
  {% seo %}

  <!-- ═══ Favicons — أيقونة الموقع ═══ -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/img/favicons/favicon-96x96.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest' | relative_url }}">

  {% include schema-global.html %}

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <style>
    /* ═══ Floating Menu ═══ */
    .floating-menu-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #111b21;
      font-size: 20px;
      cursor: pointer;
      z-index: 99999;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .floating-menu-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }
    .floating-menu-btn:active {
      transform: scale(0.95);
    }

    /* ═══ Menu Dropdown ═══ */
    .floating-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 99998;
    }
    .floating-menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .floating-menu-panel {
      position: fixed;
      top: 72px;
      left: 16px;
      min-width: 240px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      padding: 8px;
      z-index: 99999;
      opacity: 0;
      transform: translateY(-10px) scale(0.95);
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top left;
    }
    .floating-menu-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .floating-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: #111b21;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-align: right;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .floating-menu-item:hover {
      background: rgba(0, 168, 132, 0.1);
      color: #00a884;
    }
    .floating-menu-item i {
      width: 22px;
      font-size: 17px;
      text-align: center;
      color: #667781;
    }
    .floating-menu-item:hover i {
      color: #00a884;
    }

    .floating-menu-sep {
      height: 1px;
      background: rgba(0, 0, 0, 0.06);
      margin: 6px 12px;
    }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      .floating-menu-btn {
        background: rgba(30, 45, 61, 0.9);
        color: #e9edef;
        border-color: rgba(255, 255, 255, 0.1);
      }
      .floating-menu-panel {
        background: #202c33;
      }
      .floating-menu-item {
        color: #e9edef;
      }
      .floating-menu-item i {
        color: #8696a0;
      }
      .floating-menu-sep {
        background: rgba(255, 255, 255, 0.08);
      }
    }
  </style>

  {{ page.extra_head }}
</head>
<body>

  <!-- ═══ Floating Menu Button ═══ -->
  <button class="floating-menu-btn" id="floatingMenuBtn" onclick="toggleFloatingMenu(event)" aria-label="القائمة">
    <i class="fas fa-bars" id="floatingMenuIcon"></i>
  </button>

  <!-- ═══ Overlay ═══ -->
  <div class="floating-menu-overlay" id="floatingMenuOverlay" onclick="closeFloatingMenu()"></div>

  <!-- ═══ Menu Panel ═══ -->
  <div class="floating-menu-panel" id="floatingMenuPanel">
    <a href="{{ '/' | relative_url }}" class="floating-menu-item">
      <i class="fas fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a href="{{ '/properties/' | relative_url }}" class="floating-menu-item">
      <i class="fas fa-building"></i>
      <span>عقارات</span>
    </a>
    <a href="{{ '/requests/' | relative_url }}" class="floating-menu-item">
      <i class="fas fa-clipboard-list"></i>
      <span>طلبات</span>
    </a>
    <div class="floating-menu-sep"></div>
    <a href="{{ '/add-your-property.html' | relative_url }}" class="floating-menu-item">
      <i class="fas fa-plus-circle"></i>
      <span>اعرض عقارك</span>
    </a>
    <a href="{{ '/agent.html' | relative_url }}" class="floating-menu-item">
      <i class="fas fa-comments"></i>
      <span>الوكيل الذكي</span>
    </a>
    <a href="{{ '/property-images.html' | relative_url }}" class="floating-menu-item">
      <i class="fas fa-images"></i>
      <span>معرض الصور</span>
    </a>
    <div class="floating-menu-sep"></div>
    <a href="https://wa.me/201147758857" target="_blank" rel="noopener" class="floating-menu-item">
      <i class="fab fa-whatsapp"></i>
      <span>تواصل واتساب</span>
    </a>
  </div>

  <!-- ═══ المحتوى ═══ -->
  {{ content }}

  <script>
    function toggleFloatingMenu(e) {
      if (e) e.stopPropagation();
      const panel = document.getElementById('floatingMenuPanel');
      const overlay = document.getElementById('floatingMenuOverlay');
      const icon = document.getElementById('floatingMenuIcon');
      
      const isOpen = panel.classList.contains('open');
      if (isOpen) {
        closeFloatingMenu();
      } else {
        panel.classList.add('open');
        overlay.classList.add('open');
        icon.className = 'fas fa-times';
      }
    }
    
    function closeFloatingMenu() {
      const panel = document.getElementById('floatingMenuPanel');
      const overlay = document.getElementById('floatingMenuOverlay');
      const icon = document.getElementById('floatingMenuIcon');
      
      panel.classList.remove('open');
      overlay.classList.remove('open');
      icon.className = 'fas fa-bars';
    }

    // Close on Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeFloatingMenu();
    });
  </script>

  {{ page.extra_scripts }}
</body>
</html>
