<!DOCTYPE html>
<html lang="ar" dir="rtl" class="{{ page.body_class | default: 'app-page' }} layout-app">
<head>
  <meta charset="UTF-8">
  <!-- ⚠️ إصلاح: كان maximum-scale=1, user-scalable=no يمنع التكبير/التصغير (مخالف لـ WCAG 1.4.4) -->
  <!-- ⭐ إصلاح لوحة المفاتيح (2026-10-11): كروم أندرويد من إصدار 108 بقى — بالافتراضي —
       ما بيصغّرش الصفحة لما الكيبورد يفتح (زي سفاري آيفون)، فقاع الشاشة (وخانة الكتابة
       وآخر رسالة) بيتغطّوا بالكيبورد و100dvh ما بتتحركش. الكلمة المفتاحية دي بترجّع السلوك
       الأصلي: الكيبورد يصغّر الصفحة والـdvh تتبعها — من غير أي JavaScript.
       ⚠️ لا تحذفها: صفحة الوكيل (agent.html) وصفحة إضافة العقار بيّعتمدوا عليها.
       المرجع: https://developer.chrome.com/blog/viewport-resize-behavior/ -->
  <!-- ⭐ (2026-10-12) تخصيص الصفحة: لو الصفحة حاطة `custom_viewport: true` في
       الـfront matter (صفحة الوكيل agent.html) فهي اللي بتحط وسم <viewport>
       خاص بيها داخل <head> عبر extra_head — فما نطبعش الوسم الافتراضي مرتين
       (أول وسم viewport بس هو اللي المتصفح بياخده). باقي صفحات هذا القالب
       بتأخد الوسم الافتراضي بالظبط — مفيش أي تغيير في خرجها. -->
  {% unless page.custom_viewport %}
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  {% endunless %}
  <!-- ⚠️ إصلاح PWA (2026-09-26): كان #075e54 (تركواز واتساب) — صار #0a3d2e
       (أخضر الهوية) ليطابق manifest.json في شريط حالة التطبيق المثبّت. -->
  <meta name="theme-color" content="#0a3d2e">

  <!-- ═══ PWA — مانيفست + Service Worker (2026-09-26)
       صفحة الوكيل الذكي هي start_url للتطبيق، وكانت بلا تسجيل Service Worker
       وبلا وسم مانيفست سليم. الوسوم والتسجيل كلها في _includes/pwa.html ═══ -->
  {% include pwa.html %}

  {% seo %}

  <!-- ═══ Favicons — وسوم موحّدة من _includes/favicon.html (2026-09-25) ═══ -->
  {% include favicon.html %}

  {% include schema-global.html %}

  <!-- ملف الأنماط الموحّد (v4.0) — أقسام هذه الصفحة مُنطَّقة بـ body class -->
  <!-- ⚠️ أداء (2026-10-02): النسخة المُصغَّرة style.min.css (ملف مُولَّد من style.css) -->
  <link rel="stylesheet" href="{{ '/assets/css/style.min.css' | relative_url }}">

  <!-- ═══════════════════════════════════════════════
       ⚠️ إصلاح (2026-09-24):
       كان هذا القالب يُصدِر <title> ثم قالب SEO (jekyll-seo-tag) يُصدِر <title> ثانياً،
       ومعه og:title / og:description / og:image / og:url / og:type مكرّرة.
       الآن قالب SEO (jekyll-seo-tag) هو المصدر الوحيد لكل وسوم الـ <head> التعريفية.
       ═══════════════════════════════════════════════ -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  {{ page.extra_head }}
</head>
<body class="{{ page.body_class | default: 'app-page' }} layout-app">

  <!-- ═══ القائمة الموحدة (مشتركة مع default.html) ═══ -->
  {% include floating-menu.html %}

  <!-- ═══ المحتوى ═══ -->
  {{ content }}

  {{ page.extra_scripts }}
</body>
</html>
