<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- ⚠️ إصلاح: كان maximum-scale=1, user-scalable=no يمنع التكبير/التصغير (مخالف لـ WCAG 1.4.4) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">

  {% seo %}

  <!-- ═══ Favicons — أيقونة الموقع ═══ -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/img/favicons/favicon-96x96.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest' | relative_url }}">

  {% include schema-global.html %}

  <!-- ═══════════════════════════════════════════════
       ⚠️ إصلاح (2026-09-24):
       كان هذا القالب يُصدِر <title> ثم قالب SEO (jekyll-seo-tag) يُصدِر <title> ثانياً،
       ومعه og:title / og:description / og:image / og:url / og:type مكرّرة.
       الآن قالب SEO (jekyll-seo-tag) هو المصدر الوحيد لكل وسوم الـ <head> التعريفية.
       ═══════════════════════════════════════════════ -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- ═══════════════════════════════════════════════
       هوية الموقع الموحدة — خلفية داكنة + ذهبي
       تُطبَّق على كل صفحات app
       ═══════════════════════════════════════════════ -->
  <style>
    /* ═══ متغيرات الهوية ═══ */
    :root {
      --color-primary: #d4af37;
      --color-secondary: #fce205;
      --color-text-primary: #f5f5f5;
      --color-text-secondary: #b0b0b0;
      --color-surface-1: #0a0a0a;
      --color-surface-2: #1a1a1a;
      --color-surface-3: #222222;
      --color-border: #333333;
      --color-border-light: #1a1a1a;
    }

    /* ═══ الخلفية الأساسية ═══ */
    html, body {
      margin: 0;
      padding: 0;
      background: #050505;
      color: var(--color-text-primary);
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* ═══ الروابط العامة ═══ */
    a {
      color: var(--color-primary);
      text-decoration: none;
    }
    a:hover {
      opacity: 0.9;
    }

    /* ═══ حقول الإدخال — هوية موحدة ═══ */
    input, textarea, select, button {
      font-family: inherit;
    }
  </style>

  {{ page.extra_head }}
</head>
<body>

  <!-- ═══ القائمة الموحدة (مشتركة مع default.html) ═══ -->
  {% include floating-menu.html %}

  <!-- ═══ المحتوى ═══ -->
  {{ content }}

  {{ page.extra_scripts }}
</body>
</html>
