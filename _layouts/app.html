<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <title>{{ page.title | default: site.title }}</title>
  {% seo %}

  <!-- ═══ Favicons — أيقونة الموقع ═══ -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/img/favicons/favicon-96x96.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/img/favicons/site.webmanifest' | relative_url }}">

  {% include schema-global.html %}

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  {{ page.extra_head }}
</head>
<body>

  <!-- ═══ القائمة الموحدة (مشتركة مع default.html) ═══ -->
  {% include floating-menu.html %}

  <!-- شريط التنقل — مُزال (القائمة ☰ تكفي) -->

  <!-- ═══ المحتوى ═══ -->
  {{ content }}

  {{ page.extra_scripts }}
</body>
</html>
