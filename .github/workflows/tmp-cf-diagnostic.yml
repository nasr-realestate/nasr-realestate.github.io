# Temporary diagnostic workflow — deleted after use.
name: TMP Cloudflare Diagnostic

on:
  push:
    paths:
      - '.github/workflows/tmp-cf-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a10d3e-nasr-realestate-github-io

      - name: Diagnostics → report file
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p _diag
          R=_diag/cf-diagnostic-report.txt
          {
            echo "=== secrets present (names only) ==="
            for n in CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL CLOUDFLARE_ACCOUNT_ID; do
              v="$(eval echo \$$n)"
              if [ -n "$v" ]; then echo "PRESENT:$n"; else echo "MISSING:$n"; fi
            done
            echo
            echo "=== wrangler whoami ==="
            npx --yes wrangler@4 whoami 2>&1 || true
            echo
            echo "=== d1 list ==="
            npx --yes wrangler@4 d1 list 2>&1 | head -30 || true
            echo
            echo "=== schema: sqlite_master ==="
            npx --yes wrangler@4 d1 execute nasr-market-db --remote --json \
              --command "SELECT type, name, sql FROM sqlite_master WHERE type IN ('table','index','view') ORDER BY type, name" 2>&1 || true
          } >> "$R" 2>&1

      - name: Commit report to branch
        run: |
          git config user.name "Arena Diagnostic Bot"
          git config user.email "bot@nasr-realestate.com"
          git add -f _diag/cf-diagnostic-report.txt
          git commit -m "chore(diag): Cloudflare credential + D1 schema report [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/01a10d3e-nasr-realestate-github-io || echo "push failed"

