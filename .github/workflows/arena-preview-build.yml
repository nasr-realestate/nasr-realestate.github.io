# ⚠️ ملف مؤقّت (جلسة Arena): يبني الموقع بـJekyll، يتأكد إن الصفحات خرجت سليمة،
# ويرفع نسخة الصفحات المبنية على الفرع للمعاينة. بيتشال من الفرع قبل الدمج/النشر.
name: Arena preview build (temporary)

on:
  push:
    branches:
      - arena/f904aa87-nasr-realestate-github-io

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Assert the built pages are complete
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          A=_site/agent.html
          P=_site/add-your-property.html
          test -f "$A" || fail "agent.html was not built"
          test -f "$P" || fail "add-your-property.html was not built"

          head -1 "$A" | grep -q '<!DOCTYPE html>' || fail "agent.html has no DOCTYPE"
          grep -q '<html lang="ar" dir="rtl" class="page-agent layout-app">' "$A" || fail "agent.html has no html/body class"
          grep -q '<meta charset="UTF-8">' "$A" || fail "agent.html has no charset"
          grep -q '<link rel="stylesheet" href="/assets/css/style.min.css">' "$A" || fail "agent.html is missing style.min.css"
          grep -q 'هوية طارق طنطاوي' "$A" || fail "agent.html lost the navy+gold identity style block"
          grep -q -- '--brand-accent' "$A" || fail "agent.html lost the brand tokens"
          grep -q 'id="app"' "$A" || fail "agent.html has no #app markup"
          grep -q 'id="chatArea"' "$A" || fail "agent.html has no chat area"
          grep -q 'const WORKER_URL' "$A" || fail "agent.html lost its script"
          grep -q 'royal-snow-ea32.footcai-555.workers.dev' "$A" || fail "agent.html lost the Worker URL"
          grep -q '</html>' "$A" || fail "agent.html is truncated"
          ! grep -q '{{ page\.\|{{ site\.\|{%' "$A" || fail "agent.html still has unrendered Liquid"
          test "$(wc -c < "$A")" -gt 70000 || fail "agent.html is too small ($(wc -c < "$A") bytes)"

          head -1 "$P" | grep -q '<!DOCTYPE html>' || fail "add-your-property.html has no DOCTYPE"
          grep -q '<html lang="ar" dir="rtl" class="page-add layout-app">' "$P" || fail "add-your-property.html has no html/body class"
          grep -q '<link rel="stylesheet" href="/assets/css/style.min.css">' "$P" || fail "add-your-property.html is missing style.min.css"
          grep -q 'id="businessType"' "$P" || fail "add-your-property.html lost its form"
          grep -q '</html>' "$P" || fail "add-your-property.html is truncated"
          ! grep -q '{{ page\.\|{{ site\.\|{%' "$P" || fail "add-your-property.html still has unrendered Liquid"
          echo "OK: both app-layout pages were built complete"

      - name: Publish the built pages for preview
        run: |
          set -euo pipefail
          mkdir -p _arena-preview
          for f in _site/*.html; do cp "$f" _arena-preview/; done
          for d in properties requests; do
            [ -f "_site/$d/index.html" ] && cp "_site/$d/index.html" "_arena-preview/$d-index.html"
          done
          {
            echo "# Jekyll build verification"
            echo
            echo "commit: $GITHUB_SHA  run: $GITHUB_RUN_ID  date: $(date -u)"
            echo
            for f in _site/agent.html _site/add-your-property.html _site/index.html; do
              echo "- $f — $(wc -c < "$f") bytes — md5 $(md5sum "$f" | cut -d' ' -f1)"
            done
          } > _arena-preview/REPORT.md
          git config user.name "arena-preview-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f _arena-preview
          git commit -m "ci-preview: الصفحات المبنية للمعاينة [skip ci]"
          git push
