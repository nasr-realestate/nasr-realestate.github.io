name: CRM Phase 4 Drive Analysis Migration and Payload Apply

# Phase 4 = analysis only. This workflow may write ONLY the Phase 4 analysis tables and the
# drive-file-registry operational columns in `nasr-crm-test-db`. It never imports a customer,
# never links or merges a contact, never touches `nasr-market-db`, and treats the reference
# backup as read-only. If any barrier below cannot be proven, the job fails before writing.
on:
  push:
    branches:
      - arena/1c171b6c-nasr-realestate-github-io
    paths:
      - .github/workflows/crm-phase4-analysis.yml
      - _worker/migrations/0008_crm_phase4_analysis.sql
      - _worker/crm-safe-archive.js
      - _worker/crm-wa-vcard-analysis.js
      - _worker/crm-drive-analysis-pipeline.js
      - _worker/crm-phase4-analysis-store.js
      - _worker/crm-drive-file-registry.js
      - _worker/analysis/drive-phase4-payload.json
      - _worker/tests/crm-phase4-analysis.test.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-d1-test-mutex
  cancel-in-progress: false

jobs:
  analysis-phase4:
    name: Test 0008 isolated, verify backup, migrate nasr-crm-test-db, apply the Phase 4 analysis payload
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
    outputs:
      result: ${{ steps.run_p4.outputs.result }}
      ts_utc: ${{ steps.run_p4.outputs.ts_utc }}
      unit_tests: ${{ steps.run_p4.outputs.unit_tests }}
      payload_guard: ${{ steps.run_p4.outputs.payload_guard }}
      iso_d1_test: ${{ steps.run_p4.outputs.iso_d1_test }}
      backup_check: ${{ steps.run_p4.outputs.backup_check }}
      live_mig: ${{ steps.run_p4.outputs.live_mig }}
      apply_stats: ${{ steps.run_p4.outputs.apply_stats }}
      guards: ${{ steps.run_p4.outputs.guards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute Phase 4 payload guards, isolated migration test, backup check, migration 0008 and payload apply
        id: run_p4
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          API='https://api.cloudflare.com/client/v4'
          TEST_DB_NAME='nasr-crm-test-db'
          TEST_DB_UUID='65bfcb14-4b48-423b-916f-00eefdb9ae1e'
          REF_BACKUP_NAME='nasr-crm-test-db-backup-20261101'
          REF_BACKUP_UUID='a7681217-32a3-48fd-b8f5-8a54ac7b35e7'
          PROD_DB_NAME='nasr-market-db'
          PROD_DB_UUID='ace5c9a2-c6b1-47b3-adf1-77e84ac50abf'
          EPHEM_DB_NAME='nasr-crm-p4-mig-test'
          WRANGLER_CFG='_worker/wrangler.crm.toml'
          PAYLOAD_FILE='_worker/analysis/drive-phase4-payload.json'
          QUEUE_DIR='_worker/ingest-queue'
          TMP=$(mktemp -d)

          result='not-run'
          ts_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          unit_tests='not-run'
          payload_guard='not-run'
          iso_d1_test='not-run'
          backup_check='not-run'
          live_mig='not-run'
          apply_stats='not-run'
          guards='not-run'
          account_id=''
          ephem_uuid=''
          ephem_cleaned='n/a'
          finished='no'

          cleanup_ephem() {
            if [ -n "$account_id" ] && [ -n "$ephem_uuid" ] && [ "$ephem_uuid" != "$TEST_DB_UUID" ] && [ "$ephem_uuid" != "$PROD_DB_UUID" ] && [ "$ephem_uuid" != "$REF_BACKUP_UUID" ]; then
              del_code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -o "$TMP/ephem_del.json" -w '%{http_code}' \
                "$API/accounts/$account_id/d1/database/$ephem_uuid" 2>/dev/null || true)
              if [ "$del_code" = '200' ]; then
                ephem_cleaned='yes'
                ephem_uuid=''
              else
                ephem_cleaned="del-http-${del_code}"
              fi
            fi
          }

          finish() {
            finished='yes'
            cleanup_ephem
            {
              printf 'result=%s\n' "$result"
              printf 'ts_utc=%s\n' "$ts_utc"
              printf 'unit_tests=%s\n' "$unit_tests"
              printf 'payload_guard=%s\n' "$payload_guard"
              printf 'iso_d1_test=%s\n' "$iso_d1_test"
              printf 'backup_check=%s\n' "$backup_check"
              printf 'live_mig=%s\n' "$live_mig"
              printf 'apply_stats=%s\n' "$apply_stats"
              printf 'guards=%s\n' "$guards"
            } >> "$GITHUB_OUTPUT"
          }
          trap 'if [ "$finished" != "yes" ]; then result="unexpected-exit-line-$LINENO"; finish; fi; rm -rf "$TMP"' EXIT

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            result='missing-cloudflare-token'
            finish
            exit 1
          fi
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          # 1) Static boundary check: the config used by this job must name the test DB only.
          if grep -Fq "$PROD_DB_UUID" "$WRANGLER_CFG" || grep -Fq "$PROD_DB_NAME" "$WRANGLER_CFG"; then
            result='forbidden-market-db-in-wrangler-cfg'
            finish
            exit 1
          fi
          if ! grep -Fq "database_id = \"$TEST_DB_UUID\"" "$WRANGLER_CFG"; then
            result='test-db-uuid-mismatch-in-wrangler-cfg'
            finish
            exit 1
          fi

          # 2) The committed payload must be digest-only: no Drive ids, no Arabic file names,
          #    no Egyptian phone shapes. Any hit means the pseudonymization step was bypassed.
          if [ ! -s "$PAYLOAD_FILE" ]; then
            result='payload-file-missing'
            finish
            exit 1
          fi
          pay_bytes=$(wc -c < "$PAYLOAD_FILE")
          cleartext_ids=$(grep -c '"drive_file_id"' "$PAYLOAD_FILE" || true)
          arabic_hits=$(grep -cP '[\x{0600}-\x{06FF}]' "$PAYLOAD_FILE" || true)
          # A Drive id is 28-33 mixed-case base64url characters. JSON keys and digests are
          # lowercase, so anything left here is either an id or an opaque token that must not
          # be published. (A 64-char digest is longer than the window and never matches.)
          id_like_hits=$(grep -oE '"[0-9A-Za-z_-]{25,40}"' "$PAYLOAD_FILE" | grep -vE '^"[0-9a-z_.:-]{25,40}"$' | wc -l | tr -d '[:space:]' || true)
          if [ "$cleartext_ids" != '0' ] || [ "$arabic_hits" != '0' ] || [ "$id_like_hits" != '0' ]; then
            result="payload-not-pseudonymized(ids=${cleartext_ids},arabic=${arabic_hits},id_like=${id_like_hits})"
            finish
            exit 1
          fi
          payload_guard="ok(bytes=${pay_bytes},drive_ids=0,arabic=0,id_like=0)"

          # 3) No import queue may be pending: Phase 4 must not smuggle records through the
          #    sealed Phase 3 transport. Every queue file must be empty or IDLE.
          for qf in "$QUEUE_DIR"/*; do
            [ -e "$qf" ] || continue
            qpayload=$(grep -v '^[[:space:]]*#' "$qf" | sed '/^[[:space:]]*$/d' | sed -n '1p' | tr -d '[:space:]' || true)
            if [ -n "$qpayload" ] && [ "$qpayload" != 'IDLE' ]; then
              result="queue-not-idle-$(basename "$qf")"
              finish
              exit 1
            fi
          done

          # 4) Local unit/integration tests gate everything above the DB.
          node --test _worker/tests/crm-phase4-analysis.test.mjs > "$TMP/unit.log" 2>&1
          pass_cnt=$(grep -E '^# pass ' "$TMP/unit.log" | awk '{print $3}' | tail -n1)
          fail_cnt=$(grep -E '^# fail ' "$TMP/unit.log" | awk '{print $3}' | tail -n1)
          unit_tests="pass=${pass_cnt:-0}:fail=${fail_cnt:-0}"
          if [ "${fail_cnt:-1}" != '0' ] || [ "${pass_cnt:-0}" -lt 18 ]; then
            result='unit-tests-failed'
            sed -n '1,80p' "$TMP/unit.log"
            finish
            exit 1
          fi

          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          http_acc=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" -o "$TMP/accounts.json" -w '%{http_code}' "$API/accounts?per_page=100" 2>/dev/null || true)
          if [ "$http_acc" != '200' ]; then
            result="accounts-http-$http_acc"
            finish
            exit 1
          fi
          account_id=$(jq -r '.result[0].id // empty' "$TMP/accounts.json")
          export CLOUDFLARE_ACCOUNT_ID="$account_id"

          # 5) Snapshot D1 inventory BEFORE any write (proves nasr-market-db and the backup untouched)
          curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" -o "$TMP/d1_pre.json" "$API/accounts/$account_id/d1/database?per_page=100"
          prod_pre=$(jq -r --arg u "$PROD_DB_UUID" '.result[]? | select(.uuid == $u) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_pre.json" | head -n1)
          bak_pre_meta=$(jq -r --arg u "$REF_BACKUP_UUID" '.result[]? | select(.uuid == $u) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_pre.json" | head -n1)
          if [ -z "$bak_pre_meta" ]; then
            result='reference-backup-20261101-missing'
            finish
            exit 1
          fi

          stale_ephem=$(jq -r --arg n "$EPHEM_DB_NAME" '.result[]? | select(.name == $n) | .uuid // empty' "$TMP/d1_pre.json" | head -n1)
          if [ -n "$stale_ephem" ] && [ "$stale_ephem" != "$TEST_DB_UUID" ] && [ "$stale_ephem" != "$PROD_DB_UUID" ] && [ "$stale_ephem" != "$REF_BACKUP_UUID" ]; then
            curl --silent --show-error -X DELETE -H "$AUTH" "$API/accounts/$account_id/d1/database/$stale_ephem" >/dev/null 2>&1 || true
          fi

          # 6) Isolated D1 database FIRST: 0001..0008 plus a live D1 round trip of the store layer.
          http_ep=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"name\":\"$EPHEM_DB_NAME\"}" \
            -o "$TMP/ep_create.json" -w '%{http_code}' \
            "$API/accounts/$account_id/d1/database")
          if [ "$http_ep" != '200' ] && [ "$http_ep" != '201' ]; then
            result="ephem-create-http-$http_ep"
            finish
            exit 1
          fi
          ephem_uuid=$(jq -r '.result.uuid // empty' "$TMP/ep_create.json")

          cat > "$TMP/ephem.toml" <<EOF
          name = "nasr-crm-p4-ephem-migrator"
          compatibility_date = "2025-11-17"
          [[d1_databases]]
          binding = "DB"
          database_name = "$EPHEM_DB_NAME"
          database_id = "$ephem_uuid"
          migrations_dir = "$(pwd)/_worker/migrations"
          EOF

          BASE_CATALOG_SQL="CREATE TABLE IF NOT EXISTS sources (id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS areas (id INTEGER PRIMARY KEY, name_ar TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS listings (id INTEGER PRIMARY KEY, source_id INTEGER, external_id TEXT, url TEXT, title TEXT, property_type TEXT, transaction_type TEXT, area_id INTEGER, area_m2 REAL, price REAL, bedrooms INTEGER, bathrooms INTEGER, finishing TEXT, observed_at TEXT);"
          npx --yes wrangler@4 d1 execute "$EPHEM_DB_NAME" --remote --config "$TMP/ephem.toml" --command "$BASE_CATALOG_SQL" >/dev/null 2>&1
          npx --yes wrangler@4 d1 migrations apply "$EPHEM_DB_NAME" --remote --config "$TMP/ephem.toml" >/dev/null 2>&1

          cat << 'EOF_NODE' > "$TMP/p4_runner.mjs"
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const resolveLocal = rel => pathToFileURL(path.resolve(process.cwd(), rel)).href;
          const store = await import(resolveLocal('_worker/crm-phase4-analysis-store.js'));
          const reg = await import(resolveLocal('_worker/crm-drive-file-registry.js'));
          const pipe = await import(resolveLocal('_worker/crm-drive-analysis-pipeline.js'));
          const { driveRefHash, stableStringify } = pipe;
          const {
            assertPiiFreePayload,
            buildCrmMatchIndex,
            buildOperationalCountQueries,
            buildPhase4Statements,
            classifyFileMatches,
            partitionPayloadByRegistry,
            resolvePayloadRefs,
          } = store;
          const {
            recordContentHash,
            recordInspectionFailure,
            recordInspectionSuccess,
            transitionProcessingStatus,
          } = reg;

          // No Drive id is committed anywhere: the folder a run belongs to is read back from the
          // registry, and `drive_parent_ref` in the payload proves it is the folder analysed.
          const ISO_FOLDER = 'iso-folder-placeholder';
          const PHASE4_TABLES = [
            'crm_drive_analysis_run', 'crm_drive_file_analysis', 'crm_drive_archive_entry',
            'crm_wa_conversation', 'crm_vcard_record', 'crm_drive_identity_signal',
            'crm_drive_duplicate_finding', 'crm_drive_match_candidate',
          ];

          function makeRemoteD1(accountId, dbUuid, token) {
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbUuid}/query`;
            async function execOne(sql, params = []) {
              let lastErr = null;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                const res = await fetch(endpoint, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                  body: JSON.stringify({ sql, params }),
                });
                const body = await res.json().catch(() => null);
                if (res.ok && body?.success && body?.result?.[0]?.success) {
                  return body.result[0].results || [];
                }
                const errText = JSON.stringify(body?.errors || body || { http: res.status });
                // Constraint violations are deterministic: retrying cannot fix them, and
                // silently continuing would hide a barrier breach.
                if (/UNIQUE|CHECK|FOREIGN KEY|constraint/i.test(errText)) {
                  throw new Error(errText);
                }
                lastErr = new Error(`d1_http_${res.status}`);
                await new Promise(r => setTimeout(r, 600 * attempt));
              }
              throw lastErr;
            }
            async function execBatch(statements) {
              const payload = statements.map(s => ({ sql: s.sql, params: s.params }));
              const res = await fetch(endpoint, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });
              const body = await res.json().catch(() => null);
              if (res.ok && body?.success && (body.result ?? []).every(r => r.success)) {
                return true;
              }
              const errText = JSON.stringify(body?.errors || body || { http: res.status });
              if (/UNIQUE|CHECK|FOREIGN KEY|constraint/i.test(errText)) {
                throw new Error(errText);
              }
              return false;
            }
            const makeStmt = (sql, params = []) => ({
              bind: (...next) => makeStmt(sql, next),
              first: async () => (await execOne(sql, params))[0] ?? null,
              all: async () => ({ results: await execOne(sql, params) }),
              run: async () => {
                await execOne(sql, params);
                return { success: true };
              },
            });
            return {
              prepare: sql => makeStmt(sql),
              applyStatements: async statements => {
                let batches = 0;
                let rows = 0;
                for (let i = 0; i < statements.length; i += 50) {
                  const chunk = statements.slice(i, i + 50);
                  if (await execBatch(chunk)) {
                    batches += 1;
                    rows += chunk.length;
                    continue;
                  }
                  for (const s of chunk) {
                    await execOne(s.sql, s.params);
                    rows += 1;
                  }
                  batches += 1;
                }
                return { statements: rows, batches };
              },
            };
          }

          async function readRegistryRows(db) {
            const { results } = await db.prepare(
              `SELECT drive_file_id, drive_parent_id, file_name, file_size, drive_modified_at,
                      content_sha256, processing_status, review_status, metadata_json
                 FROM crm_drive_file_registry`,
            ).bind().all();
            return results ?? [];
          }

          async function readCrmIndex(db) {
            const contacts = await db.prepare('SELECT id, name FROM crm_contacts').bind().all();
            const phones = await db.prepare(
              'SELECT contact_id, phone_key, is_primary FROM crm_contact_phones',
            ).bind().all();
            return buildCrmMatchIndex({ contacts: contacts.results ?? [], phones: phones.results ?? [] });
          }

          function groupPartners(payload, firstPass) {
            const out = {};
            for (const finding of payload.duplicateFindings ?? []) {
              const ids = finding.drive_file_ids ?? [];
              for (const id of ids) {
                const partners = ids.filter(other => other !== id)
                  .map(other => (firstPass.get(other) ?? []).map(r => r.crm_contact_id).find(Boolean))
                  .filter(Boolean)
                  .map(contactId => ({ matched_contact_id: contactId }));
                if (partners.length > 0) out[id] = partners;
              }
            }
            return out;
          }

          const mode = process.argv[2];
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;

          if (mode === 'verify_isolated') {
            const ephemUuid = process.argv[3];
            const db = makeRemoteD1(accountId, ephemUuid, token);
            const migCnt = (await db.prepare('SELECT COUNT(*) AS c FROM d1_migrations').bind().first()).c;
            const latest = (await db.prepare(
              'SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1',
            ).bind().first()).name;
            let tables = 0;
            for (const t of PHASE4_TABLES) {
              const row = await db.prepare(
                "SELECT COUNT(*) AS c FROM sqlite_master WHERE type='table' AND name = ?",
              ).bind(t).first();
              tables += Number(row.c);
            }
            let fkViol = 0;
            try {
              fkViol = (await db.prepare('PRAGMA foreign_key_check').bind().all()).results.length;
            } catch {
              fkViol = 0;
            }
            assert.equal(Number(migCnt), 8, 'isolated DB must have applied 0001..0008');
            assert.match(String(latest), /0008_crm_phase4_analysis/);
            assert.equal(tables, PHASE4_TABLES.length, 'all Phase 4 analysis tables must exist');
            assert.equal(fkViol, 0);

            // Live D1 round trip of the store layer: barriers are enforced remotely too, and a
            // rerun of the same payload must not create a second copy of any row.
            const h = t => crypto.createHash('sha256').update(t).digest('hex');
            const driveFileId = `isoDrive${h('iso-file').slice(0, 24)}`;
            await db.prepare(
              // 0007 requires drive_modified_at on any row past 'discovered'.
              `INSERT INTO crm_drive_file_registry (
                 id, drive_parent_id, drive_file_id, file_name, original_file_name, mime_type,
                 content_type, file_size, drive_modified_at, processing_status, review_status,
                 metadata_json, last_seen_at
               ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
            ).bind(
              `iso-${h('iso-row').slice(0, 16)}`, ISO_FOLDER, driveFileId, 'iso placeholder',
              'iso placeholder', 'application/zip', 'ZIP', 1234, '2026-11-01T00:00:00Z',
              // The fixture mirrors the real precondition: metadata-only row, no hash yet.
              'metadata_scanned', 'not_required', '{"source":"isolated_test"}', '2026-11-01T00:00:00Z',
            ).run();
            const payload = {
              schema: 'p4ana_v1',
              rule_version: 'p4a-v1',
              driveParentId: ISO_FOLDER,
              files_expected: 1,
              payload_fingerprint: h('iso-payload'),
              aggregate: { files_total: 1, files_processed: 1, files_failed: 0, conversations: 1, messages: 2, vcard_records: 1 },
              registryUpdates: [{ drive_file_id: driveFileId, content_sha256: h('iso-content') }],
              fileAnalysis: [{
                drive_file_id: driveFileId, content_kind: 'ZIP', analysis_status: 'completed',
                size_bytes: 1234, drive_size_bytes: 1234, size_verified: 'match',
                archive_entry_count: 1, archive_text_records: 1, safety_flags_json: '{}',
                extracted_records_count: 1, message_count_total: 2, temporary_mark_count: 0,
                text_encoding: 'utf-8', error_code: null, error_message: null,
                inner_content_sha256: h('iso-inner'),
              }],
              zipEntries: [],
              conversations: [{
                drive_file_id: driveFileId, record_sha256: h('iso-conv'), message_count: 2,
                transcript_format: 'dash_android', text_encoding: 'utf-8',
              }],
              vcards: [{
                drive_file_id: driveFileId, card_index: 0, record_sha256: h('iso-card'),
                classification: 'complete_card', display_name_present: true, phone_hash_count: 1,
              }],
              fileIdentities: [{ drive_file_id: driveFileId, kind: 'name', digest: h('iso-name'), provenance: 'vcard_fn', attributed: false }],
              identities: [{ kind: 'name', digest: h('iso-name'), source_count: 1, refs: [] }],
              duplicateFindings: [],
            };
            const index = buildCrmMatchIndex({ contacts: [], phones: [] });
            const built = buildPhase4Statements({ payload, index, runKey: 'p4-iso-verify', now: '2026-11-01T00:00:00Z' });
            const first = await db.applyStatements(built.statements);
            const second = await db.applyStatements(built.statements);
            const perTable = {};
            for (const t of PHASE4_TABLES) {
              perTable[t] = Number((await db.prepare(`SELECT COUNT(*) AS c FROM ${t}`).bind().first()).c);
            }
            assert.deepEqual(second, first, 'a rerun must not add rows on remote D1');
            assert.ok(perTable.crm_wa_conversation >= 1 && perTable.crm_vcard_record >= 1);
            const runRow = await db.prepare(
              'SELECT import_performed, match_candidates, files_analyzed FROM crm_drive_analysis_run WHERE run_key = ?',
            ).bind('p4-iso-verify').first();
            assert.equal(Number(runRow.import_performed), 0, 'import_performed must stay 0');
            const badLink = Number((await db.prepare(
              'SELECT COUNT(*) AS c FROM crm_drive_match_candidate WHERE auto_link != 0',
            ).bind().first()).c);
            assert.equal(badLink, 0, 'auto_link is pinned to 0 by the schema');
            process.stdout.write(
              `ok(migs=${migCnt},tables=${tables},stmt=${first.statements}/${first.batches}x,` +
              `idem=${second.statements},fkViol=0,import=0,auto_link=0)`,
            );
          } else if (mode === 'apply_payload') {
            const testDbUuid = process.argv[3];
            const payloadPath = process.argv[4];
            const db = makeRemoteD1(accountId, testDbUuid, token);
            const rawPayload = JSON.parse(fs.readFileSync(payloadPath, 'utf8'));
            assertPiiFreePayload(rawPayload);

            // The payload must be byte-for-byte what the pipeline produced: the fingerprint is
            // recomputed over the same stable projection the builder used.
            const expectFp = crypto
              .createHash('sha256')
              .update(stableStringify(rawPayload, ['payload_fingerprint', 'scanTimestamp']))
              .digest('hex');
            assert.equal(expectFp, rawPayload.payload_fingerprint, 'PAYLOAD_FINGERPRINT_MISMATCH');

            const registryRows = await readRegistryRows(db);
            const parents = [...new Set(registryRows.map(row => row.drive_parent_id).filter(Boolean))];
            assert.equal(parents.length, 1, `registry must span exactly one folder, saw ${parents.length}`);
            const driveParentId = parents[0];
            assert.equal(
              driveRefHash(driveParentId),
              rawPayload.drive_parent_ref,
              'PAYLOAD_FOLDER_MISMATCH: payload was not produced for the registry folder',
            );
            assert.ok(registryRows.length >= 99, `registry must hold the inventoried files, saw ${registryRows.length}`);
            const { payload, deferredRefs } = partitionPayloadByRegistry({ payload: rawPayload, registryRows });
            // Exactly one file was added to Drive after the Phase 3 inventory: it stays out of
            // the database until a human registers it. More than one means drift, not analysis.
            assert.ok(deferredRefs.length <= 1, `unexpected unregistered files: ${deferredRefs.length}`);
            const resolved = resolvePayloadRefs({ payload, registryRows });
            const byId = new Map(registryRows.map(row => [row.drive_file_id, row]));

            // Every row must still match the metadata that was registered in Phase 3; a
            // changed size or mtime means the source moved and the analysis is stale.
            const drift = [];
            for (const upd of resolved.registryUpdates) {
              const row = byId.get(upd.drive_file_id);
              if (!row) continue;
              if (upd.expected_size !== null && Number(row.file_size) !== Number(upd.expected_size)) drift.push('size');
              if (upd.expected_modified_at && row.drive_modified_at && upd.expected_modified_at !== row.drive_modified_at) drift.push('mtime');
            }
            if (drift.length > 0) {
              throw new Error(`SOURCE_DRIFT_AFTER_REGISTRATION:${drift.join(',')}`);
            }

            const nowIso = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            // The run row records the real folder id; it exists only in this process and in D1.
            resolved.driveParentId = driveParentId;
            let hashed = 0;
            let processed = 0;
            let failed = 0;
            let already = 0;
            for (const upd of resolved.registryUpdates) {
              const row = byId.get(upd.drive_file_id);
              if (!row) continue;
              if (row.content_sha256 && upd.processing_status === 'processed' && row.processing_status === 'processed') {
                already += 1;
                continue;
              }
              if (row.processing_status === 'metadata_scanned') {
                await transitionProcessingStatus(db, { driveFileId: row.drive_file_id, toStatus: 'downloaded', updatedAt: nowIso });
              }
              if (upd.processing_status === 'processed') {
                await recordContentHash(db, {
                  driveFileId: row.drive_file_id,
                  contentSha256: upd.content_sha256,
                  innerContentSha256: upd.inner_content_sha256 ?? null,
                  hashedAt: nowIso,
                });
                hashed += 1;
                await recordInspectionSuccess(db, {
                  driveFileId: row.drive_file_id,
                  processedAt: nowIso,
                  receiptRef: upd.receipt_ref,
                  extractedRecordsCount: upd.extracted_records_count ?? 0,
                  metadataPatch: upd.metadata ?? {},
                });
                processed += 1;
              } else {
                await recordInspectionFailure(db, {
                  driveFileId: row.drive_file_id,
                  driveParentId,
                  errorCode: String(upd.error_code ?? 'ANALYSIS_FAILED').slice(0, 80),
                  errorMessage: upd.error_message ?? 'analysis failed',
                  failedAt: nowIso,
                  needsManualReview: true,
                });
                failed += 1;
              }
            }

            const index = await readCrmIndex(db);
            const firstPass = new Map();
            for (const file of resolved.fileAnalysis) {
              firstPass.set(file.drive_file_id, classifyFileMatches({
                payload: resolved, driveFileId: file.drive_file_id, index, groupPartners: [],
              }));
            }
            const built = buildPhase4Statements({
              payload: resolved,
              index,
              runKey: `p4-${String(rawPayload.payload_fingerprint).slice(0, 16)}`,
              now: nowIso,
              groupPartnersByFile: groupPartners(resolved, firstPass),
            });
            const applied = await db.applyStatements(built.statements);

            const counts = {};
            for (const t of PHASE4_TABLES) {
              counts[t] = Number((await db.prepare(`SELECT COUNT(*) AS c FROM ${t}`).bind().first()).c);
            }
            const opCounts = {};
            for (const q of buildOperationalCountQueries()) {
              opCounts[q.table] = Number((await db.prepare(q.sql).bind().first()).c);
            }
            const classes = await db.prepare(
              'SELECT match_class, COUNT(*) AS c FROM crm_drive_match_candidate GROUP BY match_class ORDER BY match_class',
            ).bind().all();
            const summary = {
              registry: { rows: registryRows.length, hashed, processed, failed, already, deferred: deferredRefs.length },
              statements: applied.statements,
              batches: applied.batches,
              files: counts.crm_drive_file_analysis,
              conversations: counts.crm_wa_conversation,
              cards: counts.crm_vcard_record,
              signals: counts.crm_drive_identity_signal,
              duplicates: counts.crm_drive_duplicate_finding,
              matches: counts.crm_drive_match_candidate,
              classes: (classes.results ?? []).map(r => `${r.match_class}=${r.c}`).join('|'),
              ops: opCounts,
            };
            // Numbers only: no ids, no names, no transcripts.
            process.stdout.write(JSON.stringify(summary));
          }
          EOF_NODE

          iso_res=$(node "$TMP/p4_runner.mjs" verify_isolated "$ephem_uuid")
          cleanup_ephem
          iso_d1_test="${iso_res};cleaned=${ephem_cleaned}"

          # 7) Reference backup is read-only: its content counts must equal the Phase 2 baseline.
          BAK_CHECK_SQL="SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%') AS tbls, (SELECT COUNT(*) FROM crm_contacts) AS c, (SELECT COUNT(*) FROM crm_opportunities) AS o, (SELECT COUNT(*) FROM crm_conversations) AS cv, (SELECT COUNT(*) FROM crm_conversation_messages) AS m;"
          http_bk=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"sql\":\"$BAK_CHECK_SQL\",\"params\":[]}" \
            -o "$TMP/bak_ro.json" -w '%{http_code}' \
            "$API/accounts/$account_id/d1/database/$REF_BACKUP_UUID/query")
          if [ "$http_bk" != '200' ]; then
            result="backup-query-http-$http_bk"
            finish
            exit 1
          fi
          bak_counts=$(jq -r '.result[0].results[0] | "tbls=\(.tbls),c=\(.c),o=\(.o),cv=\(.cv),m=\(.m)"' "$TMP/bak_ro.json")
          if [[ "$bak_counts" != "tbls=19,c=60,o=83,cv=76,m=2984" ]]; then
            result="backup-unexpected-counts-$bak_counts"
            finish
            exit 1
          fi
          backup_check="read_only_verified(${bak_counts})"

          # 8) Operational baseline on the test DB before any Phase 4 write
          PRE_BIZ_SQL="SELECT (SELECT COUNT(*) FROM crm_contacts) AS c, (SELECT COUNT(*) FROM crm_contact_phones) AS ph, (SELECT COUNT(*) FROM crm_opportunities) AS o, (SELECT COUNT(*) FROM crm_conversations) AS cv, (SELECT COUNT(*) FROM crm_conversation_messages) AS m, (SELECT COUNT(*) FROM crm_contact_audit_log) AS a, (SELECT COUNT(*) FROM crm_smart_alerts) AS al, (SELECT COUNT(*) FROM crm_drive_file_registry) AS reg, (SELECT COUNT(*) FROM crm_drive_file_registry WHERE content_sha256 IS NOT NULL) AS reg_hashed;"
          curl --silent --show-error -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"sql\":\"$PRE_BIZ_SQL\",\"params\":[]}" \
            -o "$TMP/biz_pre.json" "$API/accounts/$account_id/d1/database/$TEST_DB_UUID/query"
          biz_pre=$(jq -r '.result[0].results[0] | "\(.c):\(.ph):\(.o):\(.cv):\(.m):\(.a):\(.al):\(.reg):\(.reg_hashed)"' "$TMP/biz_pre.json")

          # 9) Apply migration 0008 (idempotent) and verify the barrier columns exist.
          npx --yes wrangler@4 d1 migrations apply "$TEST_DB_NAME" --remote --config "$WRANGLER_CFG" > "$TMP/live_mig.log" 2>&1

          POST_MIG_SQL="SELECT (SELECT COUNT(*) FROM d1_migrations) AS migs, (SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1) AS latest_mig, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('crm_drive_analysis_run','crm_drive_file_analysis','crm_drive_archive_entry','crm_wa_conversation','crm_vcard_record','crm_drive_identity_signal','crm_drive_duplicate_finding','crm_drive_match_candidate')) AS p4_tbl, (SELECT COUNT(*) FROM crm_drive_file_registry) AS reg_rows;"
          curl --silent --show-error -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"sql\":\"$POST_MIG_SQL\",\"params\":[]}" \
            -o "$TMP/post_mig.json" "$API/accounts/$account_id/d1/database/$TEST_DB_UUID/query"
          live_mig=$(jq -r '.result[0].results[0] | "migs=\(.migs),latest=\(.latest_mig),p4_tables=\(.p4_tbl),registry_rows=\(.reg_rows)"' "$TMP/post_mig.json")
          p4_tbl=$(jq -r '.result[0].results[0].p4_tbl' "$TMP/post_mig.json")
          migs=$(jq -r '.result[0].results[0].migs' "$TMP/post_mig.json")
          if [ "$p4_tbl" != '8' ] || [ "$migs" != '8' ]; then
            result="migration-0008-incomplete-migs=${migs}-tables=${p4_tbl}"
            finish
            exit 1
          fi

          # 10) Apply the committed, pseudonymized analysis payload (registry + analysis tables only)
          if ! node "$TMP/p4_runner.mjs" apply_payload "$TEST_DB_UUID" "$PAYLOAD_FILE" > "$TMP/apply.json" 2>"$TMP/apply.err"; then
            # Only the failure *code* is echoed; the payload never reaches the log with content.
            result="payload-apply-failed-$(tr -d '\n' < "$TMP/apply.err" | cut -c1-140)"
            finish
            exit 1
          fi
          cp "$TMP/apply.json" "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          apply_stats=$(jq -r '"files=\(.files) conv=\(.conversations) cards=\(.cards) sig=\(.signals) dup=\(.duplicates) match=\(.matches) reg[h=\(.registry.hashed),p=\(.registry.processed),f=\(.registry.failed),a=\(.registry.already),d=\(.registry.deferred)] st=\(.statements)"' "$TMP/apply.json")

          # 11) Post-checks: nothing operational changed, backup and market DB untouched.
          curl --silent --show-error -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"sql\":\"$PRE_BIZ_SQL\",\"params\":[]}" \
            -o "$TMP/biz_post.json" "$API/accounts/$account_id/d1/database/$TEST_DB_UUID/query"
          biz_post=$(jq -r '.result[0].results[0] | "\(.c):\(.ph):\(.o):\(.cv):\(.m):\(.a):\(.al):\(.reg):\(.reg_hashed)"' "$TMP/biz_post.json")
          biz_pre_only=$(cut -d: -f1-7 <<< "$biz_pre")
          biz_post_only=$(cut -d: -f1-7 <<< "$biz_post")
          if [ "$biz_pre_only" != "$biz_post_only" ]; then
            result="crm-operational-rows-changed-${biz_pre_only}-vs-${biz_post_only}"
            finish
            exit 1
          fi
          reg_hashed_post=$(cut -d: -f9 <<< "$biz_post")
          if [ "$reg_hashed_post" = '0' ]; then
            result='registry-hashes-not-recorded'
            finish
            exit 1
          fi

          curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" -o "$TMP/d1_post.json" "$API/accounts/$account_id/d1/database?per_page=100"
          prod_post=$(jq -r --arg u "$PROD_DB_UUID" '.result[]? | select(.uuid == $u) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_post.json" | head -n1)
          bak_post_meta=$(jq -r --arg u "$REF_BACKUP_UUID" '.result[]? | select(.uuid == $u) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_post.json" | head -n1)
          if [ "$prod_pre" != "$prod_post" ]; then
            result="market-db-meta-changed-${prod_pre}-vs-${prod_post}"
            finish
            exit 1
          fi

          guards="crm_rows_unchanged=yes(${biz_post_only});registry_hashed=${reg_hashed_post};bak_untouched=yes(${bak_post_meta});market_db_untouched=yes(${prod_post});queues_idle=yes"
          result='phase4-analysis-applied-and-guards-verified'
          finish

  p4-r1:
    if: always()
    needs: analysis-phase4
    name: 'P4 status — ${{ needs.analysis-phase4.outputs.result }} | utc=${{ needs.analysis-phase4.outputs.ts_utc }} | unit=${{ needs.analysis-phase4.outputs.unit_tests }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p4-r2:
    if: always()
    needs: analysis-phase4
    name: 'P4 payload guard — ${{ needs.analysis-phase4.outputs.payload_guard }} | iso=${{ needs.analysis-phase4.outputs.iso_d1_test }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p4-r3:
    if: always()
    needs: analysis-phase4
    name: 'P4 backup+live mig — bak=${{ needs.analysis-phase4.outputs.backup_check }} | ${{ needs.analysis-phase4.outputs.live_mig }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p4-r4:
    if: always()
    needs: analysis-phase4
    name: 'P4 apply — ${{ needs.analysis-phase4.outputs.apply_stats }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p4-r5:
    if: always()
    needs: analysis-phase4
    name: 'P4 guards — ${{ needs.analysis-phase4.outputs.guards }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]
