# TEMPORARY, READ-ONLY probe — post-deploy-attempt state check (round 4, trigger) — created by an Arena session to compare GitHub against the
# *deployed* state of the agent Worker (royal-snow-ea32).
#
# Everything here is unauthenticated and read-only: public HTTPS GET/OPTIONS probes of the
# three production Workers, one plain chat POST per worker (a normal visitor action, it
# mutates nothing), and fetches of the live GitHub Pages files. No deploy, no rollback, no
# version/deployment deletion, no D1/secrets/webhook changes.
#
# The Cloudflare API section only runs if a Cloudflare credential resolves (it currently
# does not — see the credential matrix in the report).
name: TMP Cloudflare read-only probe

on:
  push:
    paths:
      - ".github/workflows/arena-cf-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      C_T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      C_T2: ${{ secrets.CLOUDFLARE_TOKEN }}
      C_T3: ${{ secrets.CLOUDFLARE_API_KEY }}
      C_T4: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      C_T5: ${{ secrets.CF_API_TOKEN }}
      C_T6: ${{ secrets.CF_TOKEN }}
      C_A1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      C_A2: ${{ secrets.CF_ACCOUNT_ID }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Live fingerprints (public, read-only)
        continue-on-error: true
        run: |
          set +e
          mkdir -p _diag
          RID="${GITHUB_RUN_ID}"
          R=_diag/live-probe.txt
          AGENT=https://royal-snow-ea32.footcai-555.workers.dev
          VAL=https://noisy-bush-fd84.footcai-555.workers.dev
          SYNC=https://nasr-properties-sync.footcai-555.workers.dev
          SITE=https://nasr-realestate.github.io

          sk() { jq -c '{status: 0} + .' 2>/dev/null; }
          # one chat turn: prints the keys the UI depends on + the worker's own _version stamp
          chat() { # chat <label> <json>
            echo "--- $1 ---"
            curl -sS -m 45 -o /tmp/c.json -D /tmp/c.hdr -w "http=%{http_code} time=%{time_total}s\n" -X POST "$AGENT/" \
              -H "Origin: $SITE" -H "Content-Type: application/json" -d "$2"
            echo "resp-headers:"; grep -iE "access-control|content-type|cache-control|x-content|referrer|vary|server" /tmp/c.hdr | sed 's/^/  /'
            jq -c '{keys:(keys), response:((.response // "")|.[0:180]), formState_version:(.formState._version // null),
                     lifecycle:(.formState.lifecycle // null), active:(.formState.active // null),
                     flowType:(.formState.flowType // null), stepIndex:(.formState.stepIndex // null),
                     options:((.options // [])|length), typingDelay:(.typingDelay // null),
                     done:(.done // null), canShareWhatsapp:(.canShareWhatsapp // null),
                     whatsappUrl:((.whatsappUrl // "")|.[0:60]), valuationCta:(.valuationCta // null), error:(.error // null)}' /tmp/c.json 2>/dev/null \
              || { echo "  raw:"; head -c 400 /tmp/c.json; echo; }
          }

          {
            echo "=== LIVE FINGERPRINTS (public, read-only) ==="
            echo "when: $(date -u +%FT%TZ)  run: ${RID}  ref: ${BRANCH}"
            echo
            echo "=== 1) agent worker: transport + CORS ==="
            echo "--- OPTIONS / (preflight from the site origin) ---"
            curl -sS -m 20 -o /dev/null -D - -X OPTIONS "$AGENT/" \
              -H "Origin: $SITE" -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type" | sed -n '1,14p'
            echo "--- GET / ---"
            curl -sS -m 20 -o /tmp/g.txt -w "http=%{http_code}\n" "$AGENT/"
            head -c 300 /tmp/g.txt; echo
            echo "--- GET /health, /version, /status (do they exist?) ---"
            for p in health version status; do
              printf 'GET /%-8s → %s  ' "$p" "$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "$AGENT/$p")"
              curl -sS -m 15 "$AGENT/$p" | head -c 120; echo
            done
            echo
            echo "=== 2) agent worker: who is deployed? (its own _version stamp) ==="
            chat "greeting (empty formState)" '{"message":"السلام عليكم","formState":{},"history":[]}'
            chat "identity question"          '{"message":"انت مين؟","formState":{},"history":[]}'
            chat "off-topic"                  '{"message":"الجو حلو النهاردة","formState":{},"history":[]}'
            echo
            echo "=== 3) agent worker: which form version does it expect? (stale-state probe) ==="
            for V in v87 v92 v93 v90; do
              chat "active owner flow with _version=$V" \
                "{\"message\":\"💰 أبيع\",\"formState\":{\"active\":true,\"lifecycle\":\"active\",\"type\":\"sale\",\"flowType\":\"owner\",\"stepIndex\":0,\"awaitingQ\":true,\"imageUrls\":[],\"_version\":\"$V\",\"data\":{\"propertyType\":\"شقة\"}},\"history\":[]}"
            done
            echo
            echo "=== 4) agent worker: upload endpoint contract ==="
            printf 'POST /upload-images (text/plain) → %s  ' "$(curl -sS -m 20 -o /tmp/u.txt -w '%{http_code}' -X POST "$AGENT/upload-images" -H 'Content-Type: text/plain' -d '{}')"; head -c 160 /tmp/u.txt; echo
            printf 'POST /upload-images (json, no images) → %s  ' "$(curl -sS -m 20 -o /tmp/u2.txt -w '%{http_code}' -X POST "$AGENT/upload-images" -H 'Content-Type: application/json' -d '{}')"; head -c 160 /tmp/u2.txt; echo
            echo
            echo "=== 5) valuation worker ==="
            curl -sS -m 25 "$VAL/areas" | jq -c '{service, status, version, api_contract, valuation_method, areas: ((.available_areas // []) | length), first_area: (.available_areas[0] // null)}' 2>/dev/null
            echo
            echo "=== 6) sync worker ==="
            curl -sS -m 25 "$SYNC/" | jq -c '{service, status, worker_version, version, write_ready, scheduler, cron}' 2>/dev/null
            echo
            echo "=== 7) live site pages (GitHub Pages) vs the repository ==="
            for p in agent.html add-your-property.html; do
              curl -sS -m 25 -o /tmp/p.html -w "$p: http=%{http_code} bytes=%{size_download}\n" "$SITE/$p"
              echo "  FORM_VERSION:   $(grep -m1 -oE 'const FORM_VERSION[[:space:]]*=[[:space:]]*"[^"]+"' /tmp/p.html)"
              echo "  WORKER_URL:     $(grep -m1 -oE 'https://[a-z0-9.-]+\.workers\.dev/?' /tmp/p.html)"
              echo "  STORAGE_KEY:    $(grep -m1 -oE 'const STORAGE_KEY[[:space:]]*=[[:space:]]*"[^"]+"' /tmp/p.html)"
              echo "  sha256(live):   $(sha256sum /tmp/p.html | cut -d' ' -f1)"
              echo "  sha256(repo):   $(sha256sum "$p" | cut -d' ' -f1)"
              echo "  byte delta:     live=$(wc -c < /tmp/p.html) repo=$(wc -c < "$p")"
              echo "  identical:      $(cmp -s /tmp/p.html "$p" && echo YES || echo NO)"
              echo "  whatsapp markers: wa.me=$(grep -c 'wa\.me' /tmp/p.html) webhook=$(grep -ci 'webhook' /tmp/p.html) cloud_api=$(grep -c 'graph\.facebook\.com' /tmp/p.html)"
            done
            echo
            echo "=== 8) live index/ai-feed sanity ==="
            curl -sS -m 20 -o /dev/null -w "index.html http=%{http_code}\n" "$SITE/"
            curl -sS -m 20 "$SITE/ai-feed.json" | jq -c '{keys:(keys), properties:((.properties // [])|length), updated:(.updated // .generated_at // null)}' 2>/dev/null
            echo
            echo "=== 9) credential matrix (Cloudflare API access) ==="
            TOKEN=""
            for v in "$C_T1" "$C_T2" "$C_T3" "$C_T5" "$C_T6" "$C_T4"; do [ -n "$v" ] && { TOKEN="$v"; break; }; done
            ACCOUNT="$C_A1"; [ -z "$ACCOUNT" ] && ACCOUNT="$C_A2"
            [ -n "$C_T1" ] && echo "PRESENT:CLOUDFLARE_API_TOKEN" || echo "MISSING:CLOUDFLARE_API_TOKEN"
            [ -n "$C_T2" ] && echo "PRESENT:CLOUDFLARE_TOKEN"    || echo "MISSING:CLOUDFLARE_TOKEN"
            [ -n "$C_T3" ] && echo "PRESENT:CLOUDFLARE_API_KEY"  || echo "MISSING:CLOUDFLARE_API_KEY"
            [ -n "$C_T4" ] && echo "PRESENT:CLOUDFLARE_D1_TOKEN" || echo "MISSING:CLOUDFLARE_D1_TOKEN"
            [ -n "$C_T5" ] && echo "PRESENT:CF_API_TOKEN"        || echo "MISSING:CF_API_TOKEN"
            [ -n "$C_T6" ] && echo "PRESENT:CF_TOKEN"            || echo "MISSING:CF_TOKEN"
            [ -n "$C_A1" ] && echo "PRESENT:CLOUDFLARE_ACCOUNT_ID" || echo "MISSING:CLOUDFLARE_ACCOUNT_ID"
            [ -n "$C_A2" ] && echo "PRESENT:CF_ACCOUNT_ID"       || echo "MISSING:CF_ACCOUNT_ID"
            echo "last known-good: 2026-10-06 (arena/7f9b48da run 37458158722 and master run 37459940870 → credential PRESENT)"
            if [ -z "$TOKEN" ]; then
              echo "→ Cloudflare API is NOT reachable from Actions right now (no credential resolves)."
            else
              echo "→ credential present: querying the read-only API"
              API=https://api.cloudflare.com/client/v4; AUTH="Authorization: Bearer ${TOKEN}"
              g() { curl -sS -m 30 -H "$AUTH" "$API$1"; }
              [ -z "$ACCOUNT" ] && ACCOUNT=$(g "/accounts" | jq -r '.result[0].id // empty' 2>/dev/null)
              echo "account: ${ACCOUNT:-<none>}"
              echo "--- scripts ---"; g "/accounts/${ACCOUNT}/workers/scripts" | jq -c '{success, errors, scripts: [.result[]? | {id, created_on, modified_on, etag}]}' 2>/dev/null
              echo "--- royal-snow-ea32 metadata ---"; g "/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32" | jq -c '{success, errors, result:(.result|if . then {id, created_on, modified_on, etag} else null end)}' 2>/dev/null
              echo "--- deployments ---"; g "/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/deployments" | jq -c '{success, errors, deployments:[.result.deployments[]? | {id, number, created_on, source, author_email, versions:[.versions[]?|{version_id,percentage}]}]}' 2>/dev/null
              echo "--- versions ---"; g "/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/versions" | jq -c '{success, errors, versions:[.result[]? | {id, number, created_on, author_email}]}' 2>/dev/null
              echo "--- deployed source ---"
              curl -sS -m 60 -H "$AUTH" -o _diag/live-agent-worker.js -w "content/v2 http=%{http_code} bytes=%{size_download}\n" \
                "$API/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/content/v2"
              if [ -s _diag/live-agent-worker.js ]; then
                echo "sha256(cloudflare): $(sha256sum _diag/live-agent-worker.js | cut -d' ' -f1)"
                echo "sha256(repo):       $(sha256sum _worker/worker.js | cut -d' ' -f1)"
                grep -m1 -oE 'FORM_VERSION[[:space:]]*=[[:space:]]*"[^"]+"' _diag/live-agent-worker.js
                diff -u _worker/worker.js _diag/live-agent-worker.js > _diag/live-vs-repo.diff 2>&1
                echo "hunks: $(grep -c '^@@' _diag/live-vs-repo.diff) added: $(grep -c '^+' _diag/live-vs-repo.diff) removed: $(grep -c '^-' _diag/live-vs-repo.diff)"
              fi
            fi
            echo
            echo "=== 10) repo-side reference (what GitHub master declares) ==="
            grep -m1 -oE 'FORM_VERSION[[:space:]]*=[[:space:]]*"[^"]+"' _worker/worker.js
            grep -m1 -oE 'const FORM_VERSION[[:space:]]*=[[:space:]]*"[^"]+"' agent.html
            sha256sum _worker/worker.js agent.html
          } > "$R" 2>&1

          echo "--- report lines: $(wc -l < "$R") ---"

      - name: LIVE production flow (public endpoint, read-only)
        if: always()
        continue-on-error: true
        run: |
          set +e
          RID="${GITHUB_RUN_ID}"
          node _diag/evidence/live-flow.mjs 2>&1 | tee _diag/live-flow-$RID.txt
          echo
          echo "=== credential matrix (names only) ==="
          TOKEN=""
          for v in "$C_T1" "$C_T2" "$C_T3" "$C_T5" "$C_T6" "$C_T4"; do [ -n "$v" ] && { TOKEN="$v"; break; }; done
          [ -n "$C_T1" ] && echo "PRESENT:CLOUDFLARE_API_TOKEN" || echo "MISSING:CLOUDFLARE_API_TOKEN"
          [ -n "$C_T2" ] && echo "PRESENT:CLOUDFLARE_TOKEN"    || echo "MISSING:CLOUDFLARE_TOKEN"
          [ -n "$C_T4" ] && echo "PRESENT:CLOUDFLARE_D1_TOKEN" || echo "MISSING:CLOUDFLARE_D1_TOKEN"
          [ -n "$C_T5" ] && echo "PRESENT:CF_API_TOKEN"        || echo "MISSING:CF_API_TOKEN"
          [ -n "$TOKEN" ] && echo "→ a Cloudflare credential IS available" || echo "→ NO Cloudflare credential available"
          echo "DEPLOY_GATE_CREDENTIAL=$([ -n "$TOKEN" ] && echo yes || echo no)" >> "$GITHUB_ENV"
          exit 0
      - name: Publish live-flow output
        if: always()
        continue-on-error: true
        run: |
          set +e
          RID="${GITHUB_RUN_ID}"
          f="_diag/live-flow-$RID.txt"
          [ -s "$f" ] || { echo "no live-flow output"; exit 0; }
          B64=$(base64 -w0 "$f")
          jq -n --arg m "live-flow $RID [skip ci]" --arg c "$B64" --arg b "$BRANCH" '{message:$m,content:$c,branch:$b}' \
            | gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/_diag/live-flow-$RID.txt" --input - >/dev/null 2>&1 \
            && echo "published" || echo "publish failed"
          S=$(tr '\n' '~' < "$f" | head -c 34000)
          i=0
          while [ -n "$S" ] && [ $i -lt 12 ]; do
            chunk=$(printf '%s' "$S" | cut -c1-3400); S=$(printf '%s' "$S" | cut -c3401-)
            i=$((i+1)); echo "::error title=LIVEFLOW_${i}::${chunk}"
          done

      - name: Publish results (Contents API + annotations)
        if: always()
        continue-on-error: true
        run: |
          set +e
          RID="${GITHUB_RUN_ID}"
          put() {
            local f="$1" p="$2"
            [ -s "$f" ] || { echo "skip $f"; return; }
            B64=$(base64 -w0 "$f")
            jq -n --arg m "probe artifact ${p} (run ${RID}) [skip ci]" --arg c "$B64" --arg b "$BRANCH" \
              '{message:$m, content:$c, branch:$b}' | gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${p}" --input - >/dev/null 2>&1 \
              && echo "PUT ok: ${p}" || echo "PUT failed: ${p}"
          }
          put _diag/live-probe.txt       "_diag/probe-${RID}-live-probe.txt"
          put _diag/live-agent-worker.js "_diag/probe-${RID}-live-agent-worker.js"
          put _diag/live-vs-repo.diff    "_diag/probe-${RID}-live-vs-repo.diff"

          S=$(tr '\n' '~' < _diag/live-probe.txt 2>/dev/null)
          i=0
          while [ -n "$S" ] && [ $i -lt 14 ]; do
            chunk=$(printf '%s' "$S" | cut -c1-3400); S=$(printf '%s' "$S" | cut -c3401-)
            i=$((i+1)); echo "::error title=LIVEPROBE_${i}::${chunk}"
          done

      - name: Upload artifacts (fallback channel)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: live-probe-${{ github.run_id }}
          path: "_diag/live-probe.txt"
          if-no-files-found: warn
          retention-days: 7
# round 3: live-flow diagnostics (run started 2026-10-08T16:44:07Z)
