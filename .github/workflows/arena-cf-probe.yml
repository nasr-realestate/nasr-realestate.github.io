# TEMPORARY, READ-ONLY Cloudflare probe — created by an Arena session to compare GitHub
# against the *deployed* state of the agent Worker (royal-snow-ea32).
#
# GET requests only. Never deploys, never rolls back, never deletes a version or a
# deployment, never touches D1, secrets or webhooks. Credential VALUES are never printed:
# the workflow prints the *names* of the available secrets/vars and nothing else.
name: TMP Cloudflare read-only probe

on:
  push:
    paths:
      - ".github/workflows/arena-cf-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      # every credential name this repository has ever used for Cloudflare (values are
      # referenced but never echoed)
      C_T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      C_T2: ${{ secrets.CLOUDFLARE_TOKEN }}
      C_T3: ${{ secrets.CLOUDFLARE_API_KEY }}
      C_T4: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      C_T5: ${{ secrets.CF_API_TOKEN }}
      C_T6: ${{ secrets.CF_TOKEN }}
      C_A1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      C_A2: ${{ secrets.CF_ACCOUNT_ID }}
      BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Which credential names still exist (names only) + read-only Cloudflare probe
        id: probe
        continue-on-error: true
        run: |
          set +e
          mkdir -p _diag
          RID="${GITHUB_RUN_ID}"
          R=_diag/cf-agent-probe.txt
          N=_diag/secret-names.txt

          {
            echo "=== credential PRESENCE (names only — values never printed) ==="
            echo "when: $(date -u +%FT%TZ)  ref: ${BRANCH}  run: ${RID}"
          } > "$N" 2>&1

          # explicit PRESENT/MISSING matrix (no values)
          {
            echo "--- candidate matrix ---"
            [ -n "$C_T1" ] && echo "PRESENT:CLOUDFLARE_API_TOKEN" || echo "MISSING:CLOUDFLARE_API_TOKEN"
            [ -n "$C_T2" ] && echo "PRESENT:CLOUDFLARE_TOKEN"    || echo "MISSING:CLOUDFLARE_TOKEN"
            [ -n "$C_T3" ] && echo "PRESENT:CLOUDFLARE_API_KEY"  || echo "MISSING:CLOUDFLARE_API_KEY"
            [ -n "$C_T4" ] && echo "PRESENT:CLOUDFLARE_D1_TOKEN" || echo "MISSING:CLOUDFLARE_D1_TOKEN"
            [ -n "$C_T5" ] && echo "PRESENT:CF_API_TOKEN"        || echo "MISSING:CF_API_TOKEN"
            [ -n "$C_T6" ] && echo "PRESENT:CF_TOKEN"            || echo "MISSING:CF_TOKEN"
            [ -n "$C_A1" ] && echo "PRESENT:CLOUDFLARE_ACCOUNT_ID" || echo "MISSING:CLOUDFLARE_ACCOUNT_ID"
            [ -n "$C_A2" ] && echo "PRESENT:CF_ACCOUNT_ID"       || echo "MISSING:CF_ACCOUNT_ID"
          } >> "$N" 2>&1

          # pick the first token that exists, and the account id if any
          TOKEN=""
          for v in "$C_T1" "$C_T2" "$C_T3" "$C_T5" "$C_T6" "$C_T4"; do
            [ -n "$v" ] && { TOKEN="$v"; break; }
          done
          ACCOUNT="$C_A1"; [ -z "$ACCOUNT" ] && ACCOUNT="$C_A2"

          {
            echo "=== TMP Cloudflare read-only probe ==="
            echo "when:        $(date -u +%FT%TZ)"
            echo "run:         ${RID}"
            echo "commit:      ${GITHUB_SHA}"
            echo "ref:         ${BRANCH}"
            echo "token:       $([ -n "$TOKEN" ] && echo PRESENT || echo MISSING)"
            echo "account env: ${ACCOUNT:-<unset>}"
            echo
          } > "$R"

          if [ -z "$TOKEN" ]; then
            echo "no Cloudflare credential resolves for this repository/branch right now." >> "$R"
            echo "last known-good: run 37458158722 (arena/7f9b48da) and 37459940870 (master) on 2026-10-06 reported credential PRESENT." >> "$R"
            exit 0
          fi

          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer ${TOKEN}"
          g() { curl -sS -m 30 -H "$AUTH" "$API$1"; }
          if [ -z "$ACCOUNT" ]; then
            ACCOUNT=$(g "/accounts" | jq -r '.result[0].id // empty' 2>/dev/null)
          fi
          echo "ACCOUNT=${ACCOUNT}" >> "$R"

          {
            echo "=== 1) token verify ==="; g "/user/tokens/verify" | jq -c '{success, errors}' 2>/dev/null
            echo; echo "=== 2) accounts ==="; g "/accounts" | jq -c '{success, errors, accounts: [.result[]? | {id, name}]}' 2>/dev/null
            echo; echo "=== 3) ALL workers scripts (id, created_on, modified_on, etag) ==="
            g "/accounts/${ACCOUNT}/workers/scripts" | jq -c '{success, errors, scripts: [.result[]? | {id, created_on, modified_on, etag, handlers}]}' 2>/dev/null
            echo; echo "=== 4) royal-snow-ea32 metadata ==="
            g "/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32" | jq -c '{success, errors, result: (.result | if . then {id, created_on, modified_on, etag, usage_model, handlers, compatibility_date} else null end)}' 2>/dev/null
            echo; echo "=== 5) royal-snow-ea32 settings ==="
            g "/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/settings" | jq -c '{success, errors, result: (.result | if . then {bindings, compatibility_date, compatibility_flags} else null end)}' 2>/dev/null
            echo; echo "=== 6) schedules ==="; g "/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/schedules" | jq -c '{success, errors, result}' 2>/dev/null
            echo; echo "=== 7) deployments (scripts endpoint) ==="
            g "/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/deployments" | jq -c '{success, errors, deployments: [.result.deployments[]? | {id, number, created_on, source, strategy, author_email, versions: [.versions[]? | {version_id, percentage}], annotations}]}' 2>/dev/null
            echo; echo "=== 8) deployments (services/environments endpoint) ==="
            g "/accounts/${ACCOUNT}/workers/services/royal-snow-ea32/environments/production/deployments" | jq -c '{success, errors, deployments: [.result.deployments[]? | {id, number, created_on, source, strategy, author_email, versions: [.versions[]? | {version_id, percentage}], annotations}]}' 2>/dev/null
            echo; echo "=== 9) versions ==="
            g "/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/versions" | jq -c '{success, errors, versions: [.result[]? | {id, number, created_on, author_email, annotations}]}' 2>/dev/null
            echo; echo "=== 10) services metadata ==="
            g "/accounts/${ACCOUNT}/workers/services/royal-snow-ea32" | jq -c '{success, errors, result: (.result | if . then {id, default_environment: (.default_environment // {} | {environment, script: (.script // {} | {id, created_on, modified_on, etag})})} else null end)}' 2>/dev/null
            echo; echo "=== 11) other production Workers ==="
            for s in noisy-bush-fd84 nasr-properties-sync; do
              echo "--- $s ---"
              g "/accounts/${ACCOUNT}/workers/scripts/${s}" | jq -c '{success, errors, result: (.result | if . then {id, created_on, modified_on, etag} else null end)}' 2>/dev/null
            done
            echo; echo "=== 12) workers.dev subdomain ==="; g "/accounts/${ACCOUNT}/workers/subdomain" | jq -c '{success, errors, result}' 2>/dev/null
          } >> "$R" 2>&1

          echo -e "\n=== 13) royal-snow-ea32 deployed source ===" >> "$R"
          curl -sS -m 60 -H "$AUTH" -o _diag/live-agent-worker.js -w "content/v2 http=%{http_code} bytes=%{size_download}\n" \
            "$API/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/content/v2" >> "$R" 2>&1
          if [ "$(wc -c < _diag/live-agent-worker.js 2>/dev/null | tr -d ' ')" -lt 200 ]; then
            rm -f _diag/live-agent-worker.js
            curl -sS -m 60 -H "$AUTH" -o _diag/live-agent-worker-raw.bin -w "content(v1) http=%{http_code} bytes=%{size_download}\n" \
              "$API/accounts/${ACCOUNT}/workers/scripts/royal-snow-ea32/content" >> "$R" 2>&1
          fi
          if [ -s _diag/live-agent-worker.js ]; then
            {
              echo "bytes:  $(wc -c < _diag/live-agent-worker.js)   lines: $(wc -l < _diag/live-agent-worker.js)"
              echo "sha256: $(sha256sum _diag/live-agent-worker.js | cut -d' ' -f1)"
              echo "repo worker.js sha256: $(sha256sum _worker/worker.js | cut -d' ' -f1)"
              echo "--- first 3 lines of deployed source ---"; head -3 _diag/live-agent-worker.js
              echo "--- FORM_VERSION in deployed source ---"
              grep -m1 -oE 'FORM_VERSION[[:space:]]*=[[:space:]]*"[^"]+"' _diag/live-agent-worker.js
              echo "--- version-like markers (top 12) ---"
              grep -oE 'v[0-9]+\.[0-9]+[A-Za-z0-9._-]*' _diag/live-agent-worker.js | sort | uniq -c | sort -rn | head -12
              echo "--- marker counts in deployed source (0 = absent) ---"
              for m in redactPII scrubAddresses initAgentState waURL upload-images webhook hub.challenge X-Hub-Signature phone_number_id verify_token twilio ultramsg callmebot 360dialog WATI; do
                printf '%-20s %s\n' "$m" "$(grep -c -- "$m" _diag/live-agent-worker.js)"
              done
              echo "--- diff repo → deployed ---"
              diff -u _worker/worker.js _diag/live-agent-worker.js > _diag/live-vs-repo.diff 2>&1
              echo "hunks: $(grep -c '^@@' _diag/live-vs-repo.diff)  added: $(grep -c '^+' _diag/live-vs-repo.diff)  removed: $(grep -c '^-' _diag/live-vs-repo.diff)"
              grep -E '^[-+]' _diag/live-vs-repo.diff | grep -vE '^(\+\+\+|---)' | grep -oE '^[-+].{0,60}' | sed 's/[[:space:]]\+/ /g' | sort | uniq -c | sort -rn | head -20
            } >> "$R" 2>&1
          fi

          {
            echo; echo "=== 14) public endpoint probes ==="
            echo "--- OPTIONS / ---"
            curl -sS -m 20 -i -X OPTIONS https://royal-snow-ea32.footcai-555.workers.dev/ \
              -H "Origin: https://nasr-realestate.github.io" -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type" | sed -n '1,12p'
            echo "--- GET / ---"
            curl -sS -m 20 -o /tmp/get.txt -w "http=%{http_code}\n" https://royal-snow-ea32.footcai-555.workers.dev/
            head -c 300 /tmp/get.txt; echo
            echo "--- POST / one greeting ---"
            curl -sS -m 40 -o /tmp/post.json -w "http=%{http_code}\n" -X POST \
              https://royal-snow-ea32.footcai-555.workers.dev/ \
              -H "Origin: https://nasr-realestate.github.io" -H "Content-Type: application/json" \
              -d '{"message":"السلام عليكم","formState":{},"history":[]}'
            jq -c '{keys: (keys), response: ((.response // "") | .[0:160]), formState_version: (.formState._version // null), typingDelay: (.typingDelay // null), options: ((.options // []) | length), error: (.error // null)}' /tmp/post.json 2>/dev/null || head -c 400 /tmp/post.json
            echo
            echo "--- valuation worker GET /areas ---"
            curl -sS -m 20 https://noisy-bush-fd84.footcai-555.workers.dev/areas | jq -c '{service, status, version, api_contract, areas: ((.available_areas // []) | length)}' 2>/dev/null
            echo "--- sync worker GET / ---"
            curl -sS -m 20 https://nasr-properties-sync.footcai-555.workers.dev/ | jq -c '{service, status, worker_version, version}' 2>/dev/null
          } >> "$R" 2>&1

          echo "--- report lines: $(wc -l < "$R") ---"

      - name: Publish results (Contents API + annotations + artifacts)
        if: always()
        continue-on-error: true
        run: |
          set +e
          RID="${GITHUB_RUN_ID}"
          put() {
            local f="$1" p="$2"
            [ -s "$f" ] || { echo "skip $f (missing/empty)"; return; }
            B64=$(base64 -w0 "$f")
            BODY=$(jq -n --arg m "probe artifact ${p} (run ${RID}) [skip ci]" --arg c "$B64" --arg b "$BRANCH" \
              '{message:$m, content:$c, branch:$b}')
            printf '%s' "$BODY" | gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${p}" --input - >/dev/null 2>&1 && echo "PUT ok: ${p}" || echo "PUT failed: ${p}"
          }
          put _diag/secret-names.txt        "_diag/probe-${RID}-secret-names.txt"
          put _diag/cf-agent-probe.txt      "_diag/probe-${RID}-report.txt"
          put _diag/live-agent-worker.js    "_diag/probe-${RID}-live-agent-worker.js"
          put _diag/live-vs-repo.diff       "_diag/probe-${RID}-live-vs-repo.diff"

          S=$(sed -n '1,300p' _diag/cf-agent-probe.txt 2>/dev/null | tr '\n' '~')
          i=0; n=0
          while [ -n "$S" ] && [ $n -lt 10 ]; do
            chunk=$(printf '%s' "$S" | cut -c1-3500); S=$(printf '%s' "$S" | cut -c3501-)
            i=$((i+1)); n=$((n+1)); echo "::error title=CFPROBE_${i}::${chunk}"
          done
          K=$(sed -n '1,60p' _diag/secret-names.txt 2>/dev/null | tr '\n' '~')
          [ -n "$K" ] && echo "::error title=CFKEYS::${K:0:3400}"

      - name: Upload artifacts (fallback channel)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cf-probe-${{ github.run_id }}
          path: |
            _diag/cf-agent-probe.txt
            _diag/secret-names.txt
            _diag/live-agent-worker.js
            _diag/live-vs-repo.diff
          if-no-files-found: warn
          retention-days: 7
