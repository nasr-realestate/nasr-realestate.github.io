name: D1 schema read-only audit

on:
  workflow_dispatch:
  # One-time controlled run on the active Arena branch. Limited to this file so
  # ordinary site changes never query production D1. Remove after the audit.
  push:
    branches:
      - arena/7414ed79-nasr-realestate-github-io
    paths:
      - .github/workflows/d1-readonly-audit.yml

permissions:
  contents: write

concurrency:
  group: d1-readonly-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Inspect nasr-market-db schema only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 717c46b0d78a6f06589b8367a1a3cc5b
      D1_DATABASE_ID: ace5c9a2-c6b1-47b3-adf1-77e84ac50abf
      D1_DATABASE_NAME: nasr-market-db
    steps:
      - name: Checkout public encryption key
        uses: actions/checkout@v4
      - name: Query schema and encrypt report before upload
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "ARENA_CLOUDFLARE_TOKEN is not configured as a repository Actions secret." >&2
            exit 1
          fi
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          SQL="SELECT type, name, tbl_name, sql FROM sqlite_schema WHERE type IN ('table','index','view','trigger') ORDER BY type, name"
          CODE=$(curl -sS --connect-timeout 10 --max-time 30 -H "$AUTH" -H 'content-type: application/json' \
            -X POST --data "$(jq -n --arg sql "$SQL" '{sql:$sql}')" -o /tmp/d1-schema.json -w '%{http_code}' "$API")
          if [ "$CODE" != 200 ] || [ "$(jq -r '.success // false' /tmp/d1-schema.json 2>/dev/null || echo false)" != true ]; then
            echo "D1 schema query failed: HTTP $CODE. Check the secret and its D1 query permission." >&2
            jq -r '.errors[]?.message // empty' /tmp/d1-schema.json 2>/dev/null | head -5 >&2 || true
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const schema = fs.readFileSync('/tmp/d1-schema.json');
          const parsed = JSON.parse(schema);
          const key = crypto.randomBytes(32);
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
          const ciphertext = Buffer.concat([cipher.update(schema), cipher.final()]);
          const publicKey = fs.readFileSync('.github/workflows/d1-audit-public.pem');
          const wrappedKey = crypto.publicEncrypt({key: publicKey, padding: crypto.constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256'}, key);
          const report = {v:1, wrappedKey:wrappedKey.toString('base64'), iv:iv.toString('base64'), tag:cipher.getAuthTag().toString('base64'), ciphertext:ciphertext.toString('base64')};
          fs.writeFileSync('/tmp/d1-schema-encrypted.json', JSON.stringify(report));
          fs.rmSync('/tmp/d1-schema.json', {force:true});
          const count = parsed.result?.[0]?.results?.length ?? 0;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## D1 schema audit\nDatabase: ${process.env.D1_DATABASE_NAME}\nSchema objects found: ${count}\nReport uploaded encrypted to the agent's public-key envelope; no customer rows queried.\n`);
          console.log(`Schema-only query succeeded; ${count} schema objects. Plaintext removed before artifact upload.`);
          NODE
      - name: Upload encrypted schema envelope
        uses: actions/upload-artifact@v4
        with:
          name: d1-schema-${{ github.run_id }}
          path: /tmp/d1-schema-encrypted.json
          retention-days: 1
          if-no-files-found: error
      - name: Store encrypted envelope on this temporary branch for the agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "arena/7414ed79-nasr-realestate-github-io"
          mkdir -p .arena-d1-audit
          cp /tmp/d1-schema-encrypted.json ".arena-d1-audit/schema-${GITHUB_RUN_ID}.enc.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .arena-d1-audit
          git commit -m "chore: encrypted temporary D1 schema audit envelope"
          git push origin "HEAD:${GITHUB_REF_NAME}"
