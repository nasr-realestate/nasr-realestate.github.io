# ⚠️ سير عمل مؤقت (تدقيق الصور 2026-10-17) — يُحذف قبل الدمج
# الهدف: التحقق أن تعديلات الصور تُبنى بنجاح بـ Jekyll الحقيقي (نسخة GitHub Pages)
# قبل الدمج في master. لا ينشر شيئًا ولا يعدّل شيئًا — بناء وفحص فقط.
name: TMP image-audit Jekyll build check

on:
  push:
    branches: ["arena/82038d17-nasr-realestate-github-io"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jekyll-build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Jekyll (github-pages gem)
        run: bundle install

      - name: Build with Jekyll (as production)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify image outputs in the real build
        run: |
          set -u
          FAIL=0
          note(){ echo "::notice title=تحقق::$1"; echo "[note] $1"; }
          fail(){ echo "::error title=فشل التحقق::$1"; echo "[FAIL] $1"; FAIL=1; }

          echo "── بنية _site/properties"
          PROP_PAGES=$(find _site/properties -name 'index.html' 2>/dev/null | wc -l || true)
          note "صفحات العقارات المبنية: $PROP_PAGES"
          find _site/properties -name 'index.html' 2>/dev/null | head -3 || true

          echo "── 1) نسخ البطاقات وOG"
          CARDS=$(find _site/assets/img/properties/cards -name '*.webp' 2>/dev/null | wc -l || true)
          OGS=$(find _site/assets/img/properties/og -name '*.jpg' 2>/dev/null | wc -l || true)
          note "cards=$CARDS og=$OGS"
          [ "$CARDS" -eq 103 ] || fail "cards=$CARDS والمتوقع 103"
          [ "$OGS" -eq 103 ] || fail "og=$OGS والمتوقع 103"

          echo "── 2) الإطار المتكيف في صفحات العقارات"
          NAT=$(grep -rl 'pp-gallery-main--natural' _site/properties 2>/dev/null | wc -l || true)
          note "صفحات بالإطار المتكيف: $NAT"
          [ "$NAT" -ge 100 ] || fail "صفحات الإطار المتكيف $NAT < 100"

          echo "── 3) og:image الجديدة"
          OGC=$(grep -rl '/assets/img/properties/og/' _site/properties 2>/dev/null | wc -l || true)
          note "صفحات تشير لـ og/: $OGC"
          [ "$OGC" -eq 103 ] || fail "صفحات og=$OGC != 103"

          echo "── 4) لا مرجعيات صور مكسورة في HTML المبني"
          if python3 .github/scripts/tmp_verify_images.py; then
            note "فحص المسارات سليم"
          else
            fail "يوجد مسارات صور مكسورة في HTML المبني"
          fi

          echo "── 5) الأيتام المؤرشفة خارج ناتج البناء"
          if [ -d _site/_diag ]; then fail "_diag موجود في ناتج البناء"; else note "_diag مستثنى من البناء"; fi

          echo "── عيّنة من صفحة عقار (للتشخيص)"
          SAMPLE=$(find _site/properties -name 'index.html' 2>/dev/null | head -1)
          if [ -n "$SAMPLE" ]; then
            grep -o 'class="pp-gallery-main[^"]*"' "$SAMPLE" | head -2 || echo "لا يوجد pp-gallery-main في العينة!"
            grep -o 'og:image" content="[^"]*"' "$SAMPLE" | head -1 || true
          fi

          exit $FAIL

      - name: Quick summary
        if: always()
        run: echo "انتهى فحص بناء Jekyll المؤقت"
