    branches: ['arena/83fa2ae4-nasr-realestate-github-io']
    paths: ['.github/workflows/verify-audio-pages.yml']
  workflow_dispatch: # post-deploy HTTP smoke test on master; never deploys anything
  pull_request:
    paths:
      # batch 1–2 (unchanged reference + five ads)
      - '_properties/2026-10-10-apartment-helmy-abdel-aaty-seraj-230m.md'
      - '_properties/2026-10-06-furnished-apartment-rent-hayat-compound-safarat-200m.md'
