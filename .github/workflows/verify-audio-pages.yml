      - '_properties/rent-waha-50th-street-163m.md'
      - '_properties/makram-ebid-177m.md'
      - '_properties/2026-09-09-apartment-makarif-6th-district-130m.md'
      - '_properties/2026-09-09-apartment-rabaa-investment-165m.md'
      - '_properties/2026-09-09-unfurnished-apartment-rent-abdel-hamid-lotfy-tayaran.md'
      - '_properties/2026-07-17-apartment-abdul-halim-abdullah-195m.md'
      - '_properties/2026-06-02-shop-rent-nozha-st-190m.md'
      - '_properties/2026-03-07-villa-rehab-gate9-model-h.md'
      - 'assets/audio/properties/administrative-unit-rent-nasr-city-41m.mp3'
      - 'assets/audio/properties/apartment-rent-gamal-dewidar-enppi-nasr-city-160m.mp3'
      - 'assets/audio/properties/rent-waha-50th-street-163m.mp3'
      - 'assets/audio/properties/makram-ebid-177m.mp3'
      - 'assets/audio/properties/apartment-sale-makarif-6th-district-130m.mp3'
      - 'assets/audio/properties/apartment-sale-rabaa-investment-abbas-elakkad-165m.mp3'
      - 'assets/audio/properties/rent-abdel-hamid-lotfy-tayaran-150m.mp3'
      - 'assets/audio/properties/apartment-sale-abdul-halim-abdullah-195m.mp3'
      - 'assets/audio/properties/commercial-shop-for-rent-nozha-street-nasr-city.mp3'
      - 'assets/audio/properties/rehab-villa-model-h-gate9.mp3'
