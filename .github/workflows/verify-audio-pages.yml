      - '_requests/2026-10-09-shop-rent-request-beauty-center-nasr-city.md'
      - '_requests/2026-10-10-apartment-rent-art-studio-70m.md'
      - '_requests/2026-10-11-request-garage-40-buses-ismail-qabbani.md'
      - 'assets/audio/requests/shop-rent-request-beauty-center-nasr-city.mp3'
      - '_includes/request-audio.html'
      - '_layouts/request_page.html'
      # checks & this workflow (build-only, never publishes)
      - '_diag/check-audio-batch2.mjs'
      - '_diag/check-audio-batch3.mjs'
      - '_diag/check-audio-requests.mjs'
      - '_diag/check-audio-production.mjs'
      - '_diag/audio-check-utils.mjs'
      - '.github/workflows/verify-audio-pages.yml'

permissions:
  contents: read

jobs:
  build-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; same as existing SonarCloud workflow
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1, pinned to full commit SHA
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned to full commit SHA
        with:
          node-version: '22'
      - name: Build with the site's existing Jekyll and Gemfile (no publication)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify the 26 existing property audio pages and all other property pages
        run: node _diag/check-audio-batch3.mjs
      - name: Verify the request audio page and the two unchanged request pages
        run: node _diag/check-audio-requests.mjs

  production-http:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify real production pages, MP3 GET/Range/MIME and checksum
        run: |
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            const url = "https://nasr-realestate.github.io/assets/audio/requests/shop-rent-request-beauty-center-nasr-city.mp3";
            const res = await fetch(url);
            const bytes = Buffer.from(await res.arrayBuffer());
            const range = await fetch(url, { headers: { Range: "bytes=0-1023" } });
            const hash = createHash("sha256").update(bytes).digest("hex");
            console.log(`::notice title=Live audio response::GET=${res.status}, MIME=${res.headers.get("content-type")}, bytes=${bytes.length}, SHA=${hash}, Range=${range.status}, CR=${range.headers.get("content-range")}`);
          '
          node _diag/check-audio-production.mjs > /tmp/audio-production-check.log 2>&1 && exit 0
          cat /tmp/audio-production-check.log
          error=$(grep -m1 -E 'AssertionError|TypeError|Error:' /tmp/audio-production-check.log || true)
          echo "::error title=Production HTTP smoke failure::${error:-Unknown error; see job log}"
          exit 1
