permissions:
  contents: read

jobs:
  build-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; same as existing SonarCloud workflow
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1, pinned to full commit SHA
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned to full commit SHA
        with:
          node-version: '22'
      # 🎙️ بوابة مواصفة الصوت الموثقة قبل أي بناء: تعمل على المصدر فقط وبلا حزم
      #    خارجية، فتُسقط PR يغيّر المرجع أو إعدادات الصوت أو يستبدل ملفًا
      #    منشورًا أو ينتج إعلانًا خارج مسار الإنتاج الموحّد.
      - name: Verify the audio voice identity gate (reference, production log, every MP3)
        run: node scripts/audio/verify-voice-identity.mjs
      - name: Test the voice identity pipeline, gate and MPEG/ID3 tooling
        run: node --test scripts/tests/voice-identity.test.mjs
      - name: Build with the site's existing Jekyll and Gemfile (no publication)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify the 44 property audio pages and all other property pages
        run: node _diag/check-audio-batch3.mjs
      - name: Verify the request audio page and the two unchanged request pages
        run: node _diag/check-audio-requests.mjs

  production-http:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify real production pages, MP3 GET/Range/MIME and checksum
        run: node _diag/check-audio-production.mjs
