name: CRM isolated Worker deploy and live auth E2E

# DEPLOY GATE (added with the 0009 review workflow, 2026-11-01).
#
# This workflow used to fire on `push` to master AND to `arena/**`. That is not compatible with a
# review process in which an approval is a human act: a push to a working branch could reach the test
# database and the test Worker with nobody deciding anything. The push trigger is therefore gone, and
# a run needs all three of:
#   1. the exact string `DEPLOY-TEST-DB-and-WORKER`, typed into the dispatch form (job-level `if`, so
#      an unauthorised run never even gets a runner or the secrets);
#   2. the `crm-test-deploy` GitHub Environment — its required-reviewer rule is the only control that
#      makes a human approve PER RUN, because re-running a past workflow run replays its stored inputs;
#   3. a ref of `master`, so no branch push can ever qualify.
# Migrations are NEVER applied by this workflow. Before any deploy it verifies, read-only, that
# `nasr-crm-test-db-v2` already carries exactly the expected `_worker/migrations/*.sql` sequence and the
# A5 schema/triggers/FKs. Applying migrations stays in the separate, already-approved CI channel.
# Worker secrets are never created, updated, rotated, displayed, or guessed: missing required names stop
# the deploy with a clear message. Only `nasr-crm-test-db-v2` and the read-only reference backup
# `nasr-crm-test-db-backup-20261101` are queried; no database, backup, or stage DB is created, imported,
# or deleted. The production `nasr-market-db` is measured as unchanged before and after, never written.
on:
  workflow_dispatch:
    inputs:
      authorize_deploy:
        description: 'Type DEPLOY-TEST-DB-and-WORKER to let this run mutate the test D1 and the test Worker. Anything else stops before any secret is read.'
        required: true
        type: string
      environment_protection_attested:
        description: 'Only if the runner cannot read the environment: type ENV-PROTECTED-BY-REVIEWERS-AND-WAIT-TIMER and also fill the two fields below. Never needed when the environment is readable.'
        required: false
        default: ''
        type: string
      environment_required_reviewers:
        description: 'Reviewer logins actually configured on crm-test-deploy, comma separated. Deliberately not written anywhere in this repo, so it cannot be copied out of a file.'
        required: false
        default: ''
        type: string
      environment_wait_timer_seconds:
        description: 'Wait timer configured on crm-cloudflare deploy environment, in seconds (600 or more).'
        required: false
        default: ''
        type: string
      a5_write_decision:
        description: 'none = read-only (default, nine live checks). noted = record one non-state-changing noted row on the test DB AND enable the tenth live check: a run-local, secret-free expiry of only this run''s synthetic session (proof of 0014 on real D1).'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - noted
      reason:
        description: 'Why this deploy is happening. Free text, kept out of the job: no customer data, no names, no codes.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: crm-d1-test-mutex
  cancel-in-progress: false

jobs:
  env-protection-audit:
    # A deploy is only as safe as the rule that makes a person say yes to THIS run. That rule lives in
    # the repository settings, not in this file, so it is measured here before any job that holds a
    # secret is allowed to start. Read-only: no Cloudflare API, no token, no write, no artifact.
    name: 'Deploy gate — crm-test-deploy environment protection audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dispatch only: a push must never reach this workflow, and a skipped audit must not leave the
    # deploy job needing something that silently passed. `administration` is not a permission a
    # workflow token can request, so no read scope is claimed here at all.
    if: >-
      github.repository == 'nasr-realestate/nasr-realestate.github.io'
      && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      protection: ${{ steps.audit.outputs.protection }}
      detail: ${{ steps.audit.outputs.detail }}
    steps:
      - name: The environment must exist and must force a per-run approval
        id: audit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          ATTEST: ${{ inputs.environment_protection_attested }}
          REVIEWERS: ${{ inputs.environment_required_reviewers }}
          TIMER: ${{ inputs.environment_wait_timer_seconds }}
        run: |
          set -euo pipefail
          raw=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -w '\n%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${API}/repos/${REPO}/environments/crm-test-deploy")
          code=$(tail -n1 <<< "$raw")
          body=$(sed '$d' <<< "$raw")
          if [ "$code" = '404' ]; then
            echo "::error::environment crm-test-deploy does not exist, so NO per-run approval is in force." \
              "Create it (Settings → Environments → crm-test-deploy) with at least one required reviewer and" \
              "a wait timer before any deploy. Absent protection cannot be substituted by a typed string."
            echo "protection=absent" >> "$GITHUB_OUTPUT"
            echo "detail=http-404" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$code" != '200' ]; then
            # A blind spot is not a pass. The token cannot request read access to repository
            # administration metadata, so the state may be unreadable; then the dispatcher has to supply
            # two values that exist nowhere in this repository (the reviewer logins and the timer) --
            # something only a person who opened the settings page can type. 404 never lands here: an
            # absent environment is refused even with attestations, because that is the exact hole.
            n_rev=$(tr ',' '\n' <<< "${REVIEWERS:-}" | sed '/^ *$/d' | wc -l | tr -d ' ')
            timer="${TIMER:-0}"
            case "$timer" in ''|*[!0-9]*) timer=0 ;; esac
            if [ "${ATTEST:-}" = 'ENV-PROTECTED-BY-REVIEWERS-AND-WAIT-TIMER' ] \
               && [ "$n_rev" -ge 1 ] && [ "$timer" -ge 600 ]; then
              echo "::warning::environment state unreadable (http ${code}); proceeding on the dispatcher's" \
                "attestation of ${n_rev} reviewer(s) and a ${timer}s wait timer. That is a claim, not a" \
                "measurement: the run only truly waits for a human approval if the required-reviewer rule" \
                "is really configured on crm-test-deploy."
              echo "protection=attested" >> "$GITHUB_OUTPUT"
              echo "detail=http-${code}-attested(claims=${n_rev}reviewers,${timer}s)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::environment state unreadable (http ${code}) and no attestation was typed, so the" \
              "deploy gate refuses: it will not assume protection it cannot see."
            echo "protection=unreadable" >> "$GITHUB_OUTPUT"
            echo "detail=http-${code}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # GitHub's GET does not list who the reviewers are, only that the rule exists (and its
          # bypass actors), so the audit asks whether a required-reviewer rule is present at all and
          # how long the wait is. Both rule spellings are accepted: `required_reviewers` is what the
          # API returns, `reviewers` is what older responses used.
          has_rev=$(jq -r '[.protection_rules[]? | select(.type == "required_reviewers" or .type == "reviewers")] | length > 0' <<< "$body")
          # The timer has been reported at the rule level and inside `params`, depending on the API
          # version; scan every rule and take the largest number found, so a correctly configured
          # environment is never refused because of a shape change.
          wait_timer=$(jq -r '[.protection_rules[]? | (.wait_timer // .params.wait_timer // 0)] | max // 0' <<< "$body")
          case "$wait_timer" in ''|*[!0-9]*) wait_timer=0 ;; esac
          # GitHub reports the environment wait_timer in MINUTES (0..43200); the attestation field and
          # the threshold below are in SECONDS. Normalise either shape so a correctly configured
          # 10-minute timer is measured as 600s, not refused as "10s".
          wait_seconds=$wait_timer
          if [ "$wait_seconds" -lt 600 ]; then wait_seconds=$((wait_seconds * 60)); fi
          # jq's `//` also replaces `false`, so it must NEVER be used on a boolean: it used to turn a
          # correct `can_admins_bypass:false` into "unknown" and let an unmeasurable flag pass silently.
          # Derive the diagnostic from `type`, and gate on a strict boolean comparison below.
          bypass=$(jq -r 'if (.can_admins_bypass | type) == "boolean" then (.can_admins_bypass | tostring) else "unreadable" end' <<< "$body")
          detail="required_reviewers=${has_rev};wait_timer=${wait_timer}min(${wait_seconds}s);can_admins_bypass=${bypass}"
          echo "measured: $detail"
          if [ "$has_rev" != 'true' ]; then
            echo "::error::crm-test-deploy has no required reviewer: a deploy would need no human approval."
            echo "protection=weak" >> "$GITHUB_OUTPUT"
            echo "detail=${detail}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$wait_seconds" -lt 600 ]; then
            echo "::error::crm-test-deploy wait timer is ${wait_seconds}s; at least 600s is required so an" \
              "approval cannot be rubber-stamped the instant a run appears."
            echo "protection=weak" >> "$GITHUB_OUTPUT"
            echo "detail=${detail}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! jq -e '.can_admins_bypass == false' <<< "$body" >/dev/null; then
            echo "::error::crm-test-deploy can_admins_bypass is not measurably false (measured=${bypass}); the approval would be" \
              "optional for exactly the people who can change it, and an unreadable flag is never assumed to be false."
            echo "protection=weak" >> "$GITHUB_OUTPUT"
            echo "detail=${detail}" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "protection=verified" >> "$GITHUB_OUTPUT"
          echo "detail=${detail}" >> "$GITHUB_OUTPUT"

  deploy-and-verify:
    name: Deploy nasr-crm-api-test and run live auth E2E
    needs: env-protection-audit
    runs-on: ubuntu-latest
    environment: crm-test-deploy
    # A5 L2: `actions: read` is a READ-ONLY addition needed to fetch the previous run's published
    # result ledger for A→B re-verification. No write permission, no protection/approval change.
    permissions:
      contents: read
      actions: read
    if: >-
      github.repository == 'nasr-realestate/nasr-realestate.github.io'
      && inputs.authorize_deploy == 'DEPLOY-TEST-DB-and-WORKER'
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
      OWNER_CRM_ACCESS_CODE: ${{ secrets.CRM_ACCESS_CODE }}
      A5_WRITE_DECISION_INPUT: ${{ github.event.inputs.a5_write_decision }}
      # Must equal `retention-days` on the a5-l2-ledger artifact below (pinned by an offline test).
      A5_L2_RETENTION_DAYS: '90'
    outputs:
      result: ${{ steps.e2e.outputs.result }}
      phase: ${{ steps.e2e.outputs.phase }}
      deployed: ${{ steps.e2e.outputs.deployed }}
      login_and_crud: ${{ steps.e2e.outputs.login_and_crud }}
      mobile_browser: ${{ steps.e2e.outputs.mobile_browser }}
      unauth_rejected: ${{ steps.e2e.outputs.unauth_rejected }}
      code_source: ${{ steps.e2e.outputs.code_source }}
      backup_contacts: ${{ steps.e2e.outputs.backup_contacts }}
      stage_test: ${{ steps.e2e.outputs.stage_test }}
      a5_live: ${{ steps.e2e.outputs.a5_live }}
    steps:
      # The job `if` above is what keeps the secrets away; this step is what keeps the failure legible
      # (a skipped job tells nobody why) and is the place the exact-match rule is re-asserted with the
      # value delivered through `env:`, never interpolated into the script body.
      - name: Approval gate — exact match, no shell truthiness, ref must be master
        shell: bash
        env:
          AUTHORIZE_DEPLOY: ${{ inputs.authorize_deploy }}
          REF: ${{ github.ref_name }}
          PROTECTION: ${{ needs.env-protection-audit.outputs.protection }}
        run: |
          set -euo pipefail
          if [ "${AUTHORIZE_DEPLOY:-}" != 'DEPLOY-TEST-DB-and-WORKER' ]; then
            echo "::error::not authorised: the dispatch form must contain the exact string" \
              "DEPLOY-TEST-DB-and-WORKER (no extra whitespace, right case, nothing appended)."
            exit 1
          fi
          if [ "${REF}" != 'master' ]; then
            echo "::error::not authorised: deploys run from master only, not from ${REF}."
            exit 1
          fi
          if [ "${PROTECTION:-}" != 'verified' ] && [ "${PROTECTION:-}" != 'attested' ]; then
            echo "::error::the environment audit did not clear the deploy (protection=${PROTECTION:-missing}):" \
              "no deploy, no test-database mutation."
            exit 1
          fi
          echo "authorised by the typed confirmation string; a re-run of this run would replay the same" \
            "inputs, so the crm-test-deploy Environment approval is the per-run control (see §4 of" \
            " CRM_PHASE4_REVIEW_SQL_APPROVAL.md)."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium for live mobile browser verification
        run: npm install --no-save playwright@1.52.0 && npx playwright install --with-deps chromium

      # Read-only inventory. It deliberately names missing secrets/config and stops; it never calls
      # `wrangler secret put`, never generates a key/code/session secret, and never writes to a database.
      - name: Preflight isolation, required-secret inventory, and read-only reference backup
        id: preflight
        shell: bash
        env:
          API: https://api.cloudflare.com/client/v4
          TEST_DB_NAME: nasr-crm-test-db-v2
          TEST_DB_UUID: 760079c6-85f9-4a30-aa19-9a66f95d421a
          REF_BACKUP_NAME: nasr-crm-test-db-backup-20261101
          REF_BACKUP_UUID: a7681217-32a3-48fd-b8f5-8a54ac7b35e7
          PROD_DB_NAME: nasr-market-db
          PROD_DB_UUID: ace5c9a2-c6b1-47b3-adf1-77e84ac50abf
          WORKER_NAME: nasr-crm-api-test
          WRANGLER_CFG: _worker/wrangler.crm.toml
        run: |
          set -euo pipefail
          umask 077
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::missing GitHub Secret ARENA_CLOUDFLARE_TOKEN; deployment stopped before any request."
            exit 1
          fi
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          if [ -n "${OWNER_CRM_ACCESS_CODE:-}" ]; then echo "::add-mask::${OWNER_CRM_ACCESS_CODE}"; fi

          # Hard local config isolation: never touch nasr-market-db or any non-test Worker.
          if grep -Fq "$PROD_DB_UUID" "$WRANGLER_CFG" || grep -Fq "$PROD_DB_NAME" "$WRANGLER_CFG"; then
            echo "::error::forbidden production DB in $WRANGLER_CFG; deployment stopped."
            exit 1
          fi
          if ! grep -Fq "name = \"$WORKER_NAME\"" "$WRANGLER_CFG" \
             || ! grep -Fq "database_id = \"$TEST_DB_UUID\"" "$WRANGLER_CFG"; then
            echo "::error::wrangler config test-target mismatch; deployment stopped."
            exit 1
          fi

          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" \
            -o "$TMP/accounts.json" -w '%{http_code}' "$API/accounts?per_page=100" 2>/dev/null || true)
          if [ "$status" != 200 ] || [ "$(jq -r '.result | length' "$TMP/accounts.json" 2>/dev/null)" != 1 ]; then
            echo "::error::Cloudflare account inventory unreadable (http=$status); deployment stopped."
            exit 1
          fi
          account_id=$(jq -r '.result[0].id' "$TMP/accounts.json")

          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" \
            -o "$TMP/sub.json" -w '%{http_code}' "$API/accounts/$account_id/workers/subdomain" 2>/dev/null || true)
          subdomain=$(jq -r '.result.subdomain // empty' "$TMP/sub.json" 2>/dev/null || true)
          if [ "$status" != 200 ] || [ -z "$subdomain" ]; then
            echo "::error::Workers subdomain unreadable (http=$status); deployment stopped."
            exit 1
          fi
          BASE_URL="https://${WORKER_NAME}.${subdomain}.workers.dev"
          if ! grep -Fq "CRM_ALLOWED_ORIGIN = \"$BASE_URL\"" "$WRANGLER_CFG"; then
            echo "::error::allowed-origin mismatch in $WRANGLER_CFG; deployment stopped."
            exit 1
          fi

          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" \
            -o "$TMP/d1.json" -w '%{http_code}' "$API/accounts/$account_id/d1/database?per_page=100" 2>/dev/null || true)
          if [ "$status" != 200 ]; then
            echo "::error::D1 database inventory unreadable (http=$status); deployment stopped."
            exit 1
          fi
          if ! jq -e --arg id "$TEST_DB_UUID" --arg n "$TEST_DB_NAME" \
                '.result[] | select(.name == $n and .uuid == $id)' "$TMP/d1.json" >/dev/null; then
            echo "::error::authorised test D1 nasr-crm-test-db-v2 / $TEST_DB_UUID not verified; deployment stopped."
            exit 1
          fi
          ref_backup_uuid=$(jq -r --arg u "$REF_BACKUP_UUID" --arg n "$REF_BACKUP_NAME" \
            '.result[] | select(.uuid == $u and .name == $n) | .uuid' "$TMP/d1.json" | head -n1)
          if [ -z "$ref_backup_uuid" ]; then
            echo "::error::read-only reference backup $REF_BACKUP_NAME / $REF_BACKUP_UUID not verified; deployment stopped."
            exit 1
          fi
          market_pre_sig=$(jq -r --arg id "$PROD_DB_UUID" \
            '.result[] | select(.uuid == $id) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1.json" | head -n1)
          if [ -z "$market_pre_sig" ]; then
            echo "::error::production DB nasr-market-db signature unreadable; deployment stopped."
            exit 1
          fi

          # Read-only count from the one approved backup. No create, import, delete, or DML.
          bak_sql="SELECT COUNT(*) AS cnt FROM crm_contacts WHERE name NOT LIKE 'TEST ONLY%';"
          bak_payload=$(jq -nc --arg sql "$bak_sql" '{sql:$sql}')
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -X POST -H "$AUTH" \
            -H 'Content-Type: application/json' --data "$bak_payload" \
            -o "$TMP/bak.json" -w '%{http_code}' \
            "$API/accounts/$account_id/d1/database/$REF_BACKUP_UUID/query" 2>/dev/null || true)
          backup_contacts=$(jq -r '.result[0].results[0].cnt // empty' "$TMP/bak.json" 2>/dev/null || true)
          if [ "$status" != 200 ] || [ -z "$backup_contacts" ] || [ "$backup_contacts" -lt 1 ]; then
            echo "::error::read-only reference backup verification failed (http=$status); deployment stopped."
            exit 1
          fi

          # Worker secret NAMES only. Missing names stop the run; values are never read, generated, or shown.
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" \
            -o "$TMP/secrets.json" -w '%{http_code}' \
            "$API/accounts/$account_id/workers/scripts/$WORKER_NAME/secrets" 2>/dev/null || true)
          if [ "$status" != 200 ]; then
            echo "::error::Worker secret inventory unreadable (http=$status); deployment stopped."
            exit 1
          fi
          has_name() { jq -e --arg s "$1" '[.result[]?.name] | index($s) != null' "$TMP/secrets.json" >/dev/null; }
          missing=()
          for s in CRM_SESSION_SECRET CRM_INGEST_PRIVATE_KEY CRM_VAPID_PRIVATE_KEY CRM_VAPID_PUBLIC_KEY; do
            has_name "$s" || missing+=("$s")
          done
          has_direct_code=$(jq -r '[.result[]?.name] | index("CRM_ACCESS_CODE") != null' "$TMP/secrets.json")
          has_verifier=$(jq -r '[.result[]?.name] | index("CRM_ACCESS_CODE_VERIFIER") != null' "$TMP/secrets.json")
          owner_code_present=false
          [ -n "${OWNER_CRM_ACCESS_CODE:-}" ] && owner_code_present=true
          auth_mode=''
          if [ "$has_direct_code" = 'true' ]; then
            auth_mode='worker-direct-code'
          elif [ "$has_verifier" = 'true' ] && [ "$owner_code_present" = 'true' ]; then
            auth_mode='github-code-plus-worker-verifier'
          else
            missing+=("AUTH: Worker CRM_ACCESS_CODE OR (Worker CRM_ACCESS_CODE_VERIFIER + GitHub CRM_ACCESS_CODE)")
          fi

          # Public ingest key is a non-secret DB row, not a generated key pair.
          pub_sql="SELECT resource_id AS pub FROM crm_idempotency_receipts WHERE submission_key='system:ingest-public-key-v1' LIMIT 1;"
          pub_payload=$(jq -nc --arg sql "$pub_sql" '{sql:$sql}')
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -X POST -H "$AUTH" \
            -H 'Content-Type: application/json' --data "$pub_payload" \
            -o "$TMP/pub.json" -w '%{http_code}' \
            "$API/accounts/$account_id/d1/database/$TEST_DB_UUID/query" 2>/dev/null || true)
          ingest_public_key=$(jq -r '.result[0].results[0].pub // empty' "$TMP/pub.json" 2>/dev/null || true)
          if [ "$status" != 200 ] || [ -z "$ingest_public_key" ]; then
            missing+=("DB row system:ingest-public-key-v1")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::required Worker secrets/config missing: ${missing[*]}. Deployment stopped; no secret was created, updated, rotated, or displayed."
            exit 1
          fi

          {
            echo "account_id=$account_id"
            echo "base_url=$BASE_URL"
            echo "market_pre_sig=$market_pre_sig"
            echo "backup_contacts=$backup_contacts"
            echo "auth_mode=$auth_mode"
            echo "has_direct_code=$has_direct_code"
            echo "ingest_public_key=$ingest_public_key"
          } >> "$GITHUB_OUTPUT"
          echo "preflight-ok: auth=$auth_mode; backup=read-only($backup_contacts); market-db=unchanged-measured"

      # Replaces the stale `crm_tables == 15` assertion. It is read-only: exact expected migration
      # sequence, A5 tables/views/triggers, FK definitions and required columns. It never applies a
      # migration and never targets any DB other than the authorised test D1.
      - name: Verify expected migrations and A5 schema (read-only)
        id: schema
        shell: bash
        env:
          API: https://api.cloudflare.com/client/v4
          TEST_DB_UUID: 760079c6-85f9-4a30-aa19-9a66f95d421a
          PROD_DB_UUID: ace5c9a2-c6b1-47b3-adf1-77e84ac50abf
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
          MIGRATIONS_DIR: _worker/migrations
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const api = process.env.API;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const testDb = process.env.TEST_DB_UUID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const dir = process.env.MIGRATIONS_DIR;
          if (!api || !account || !testDb || !token || !dir) throw new Error('schema-guard-env-missing');
          if (testDb !== '760079c6-85f9-4a30-aa19-9a66f95d421a') throw new Error('schema-guard-wrong-test-db');

          const expected = readdirSync(dir).filter(f => f.endsWith('.sql')).sort();
          if (expected.length === 0) throw new Error('no-expected-migrations');
          if (expected.at(-1) !== '0014_fix_drive_review_session_expiry_units.sql') {
            throw new Error(`expected-latest-migration-mismatch:${expected.at(-1)}`);
          }

          function d1Query(sql) {
            const payload = JSON.stringify({ sql });
            const out = execFileSync('curl', [
              '--silent', '--show-error', '--connect-timeout', '10', '--max-time', '30',
              '-X', 'POST', '-H', `Authorization: Bearer ${token}`, '-H', 'Content-Type: application/json',
              '--data', payload,
              `${api}/accounts/${account}/d1/database/${testDb}/query`
            ], { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 });
            const parsed = JSON.parse(out);
            const rows = parsed?.result?.[0]?.results;
            if (!Array.isArray(rows)) throw new Error('unexpected-d1-query-response');
            return rows;
          }

          const applied = d1Query('SELECT name FROM d1_migrations ORDER BY id ASC;').map(r => String(r.name));
          const missingMigrations = expected.filter(n => !applied.includes(n));
          const unexpectedMigrations = applied.filter(n => !expected.includes(n));
          const sameOrder = applied.length === expected.length && expected.every((n, i) => applied[i] === n);
          if (missingMigrations.length || unexpectedMigrations.length || !sameOrder) {
            throw new Error(`migration-guard-failed:missing=${missingMigrations.join(',') || '-'};unexpected=${unexpectedMigrations.join(',') || '-'};order=${sameOrder ? 'ok' : 'mismatch'}`);
          }

          const objects = d1Query("SELECT type, name FROM sqlite_schema WHERE type IN ('table','view','trigger') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%';");
          const byType = { table: new Set(), view: new Set(), trigger: new Set() };
          for (const r of objects) if (byType[r.type]) byType[r.type].add(String(r.name));

          const requiredTables = [
            'd1_migrations', 'crm_contacts', 'crm_contact_phones', 'crm_sessions',
            'crm_idempotency_receipts', 'listings', 'crm_opportunities',
            'crm_customer_requests', 'crm_request_status_history', 'crm_request_listing_link',
            'crm_operational_audit_log', 'crm_interactions', 'crm_followups',
            'crm_drive_file_review_case', 'crm_drive_file_review_decision', 'crm_drive_file_review_anchor'
          ];
          const requiredViews = [
            'crm_drive_file_review_state', 'crm_drive_file_review_chain_integrity',
            'crm_drive_file_review_ci_summary', 'crm_drive_file_review_isolation',
            'crm_followups_queue_v', 'crm_requests_unmatched_v',
            'crm_opportunity_stages_v', 'crm_stale_opportunities_v'
          ];
          const requiredTriggers = [
            'trg_review_event_session_live', 'trg_file_review_decision_session_live',
            'trg_file_review_decision_no_delete', 'trg_file_review_decision_no_update',
            'trg_crm_operational_audit_no_delete', 'trg_crm_operational_audit_no_update',
            'trg_crm_request_history_no_delete', 'trg_crm_request_history_no_update',
            'trg_crm_interaction_append_only', 'trg_crm_interaction_no_delete',
            'trg_crm_followup_done_records_interaction', 'trg_crm_followup_no_delete'
          ];
          const absent = [];
          for (const n of requiredTables) if (!byType.table.has(n)) absent.push(`table:${n}`);
          for (const n of requiredViews) if (!byType.view.has(n)) absent.push(`view:${n}`);
          for (const n of requiredTriggers) if (!byType.trigger.has(n)) absent.push(`trigger:${n}`);

          const fkTables = [
            'crm_customer_requests', 'crm_request_status_history', 'crm_request_listing_link',
            'crm_operational_audit_log', 'crm_interactions', 'crm_followups',
            'crm_drive_file_review_decision'
          ];
          const fkRows = d1Query(`SELECT name, sql FROM sqlite_schema WHERE type='table' AND name IN (${fkTables.map(n => `'${n}'`).join(',')});`);
          const sqlByName = new Map(fkRows.map(r => [String(r.name), String(r.sql || '')]));
          const fkRules = [
            ['crm_customer_requests', 'REFERENCES crm_contacts'],
            ['crm_request_status_history', 'REFERENCES crm_customer_requests'],
            ['crm_request_listing_link', 'REFERENCES crm_customer_requests'],
            ['crm_request_listing_link', 'REFERENCES listings'],
            ['crm_operational_audit_log', 'REFERENCES crm_contacts'],
            ['crm_interactions', 'REFERENCES crm_contacts'],
            ['crm_followups', 'REFERENCES crm_contacts'],
            ['crm_followups', 'REFERENCES crm_customer_requests'],
            ['crm_followups', 'REFERENCES crm_opportunities'],
            ['crm_drive_file_review_decision', 'REFERENCES crm_drive_file_review_case']
          ];
          for (const [name, needle] of fkRules) {
            if (!sqlByName.get(name)?.includes(needle)) absent.push(`fk:${name}:${needle}`);
          }

          const columnChecks = [
            ['crm_customer_requests', ['id','contact_id','dedupe_key','status','created_at','updated_at']],
            ['crm_request_status_history', ['request_id','from_status','to_status','actor','changed_at']],
            ['crm_request_listing_link', ['request_id','listing_id','evidence_ref','state','decided_by']],
            ['crm_operational_audit_log', ['entity','entity_id','contact_id','action','actor']],
            ['crm_interactions', ['id','contact_id','kind','summary','dedupe_key','created_at']],
            ['crm_followups', ['id','contact_id','request_id','opportunity_id','due_at','status','dedupe_key']],
            ['crm_drive_file_review_decision', ['case_ref','decision_seq','decision','reviewer','occurred_at']],
            ['crm_sessions', ['id','token_hash','csrf_hash','created_at','expires_at','revoked_at']],
            ['crm_idempotency_receipts', ['submission_key','resource_type','resource_id','received_at']]
          ];
          for (const [table, cols] of columnChecks) {
            const rows = d1Query(`SELECT name FROM pragma_table_info('${table}');`);
            const present = new Set(rows.map(r => String(r.name)));
            for (const c of cols) if (!present.has(c)) absent.push(`column:${table}.${c}`);
          }

          if (absent.length) throw new Error(`a5-schema-guard-failed:missing=${absent.join(',')}`);
          console.log(`schema-guard-ok:migrations=${expected.length};tables=${requiredTables.length};views=${requiredViews.length};triggers=${requiredTriggers.length}`);
          NODE

      # ── A5 L2: the ONLY accepted ownership proof ──────────────────────────────────────────
      # L0 (pre-write intent) and L1 (tag + derived keys) are NOT proofs: every field they use is
      # client-controlled through an ordinary CRM session, and run_tag is public. This step loads
      # the hash-chained result ledgers of EVERY ELIGIBLE prior run (exhaustive pagination; no
      # date/count cutoff), takes a read-only baseline, and STOPS the run (before any write) if any
      # synthetic row in scope — including the documented legacy namespace — is `unknown`, OR if a
      # prior run's eligibility evidence is unreadable, OR if an eligible run's ledger cannot be
      # retrieved. No deletion, no bypass, no "absence of ledger means absence of rows".
      - name: A5 L2 — prior ledgers, read-only baseline, ownership preflight
        id: a5_l2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
        run: |
          set -euo pipefail
          L2_ROOT="$RUNNER_TEMP/a5-l2"
          L2_DIR="$L2_ROOT/current"
          L2_PRIOR="$L2_ROOT/prior"
          mkdir -p "$L2_DIR" "$L2_PRIOR"
          nonce=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(4).toString("hex"));')
          tag="a5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${nonce}"
          # GITHUB_ENV is visible ONLY to LATER steps, not to this one. Without this export,
          # `begin` / `preflight` (here) and `checkpoint` / `finalize` (later) would derive TWO
          # DIFFERENT run_tags, and `preflightCleared()` would fail forever with
          # `a5-l2-preflight-run-tag-mismatch` — an unbreakable stop loop with real, unproven rows.
          export A5_L2_NONCE="$nonce"
          export A5_L2_RUN_TAG="$tag"
          {
            echo "A5_L2_DIR=$L2_DIR"
            echo "A5_L2_PRIOR_DIR=$L2_PRIOR"
            echo "A5_L2_PENDING=$L2_DIR/pending.jsonl"
            echo "A5_L2_NONCE=$nonce"
            echo "A5_L2_RUN_TAG=$tag"
            echo "A5_L2_CHECKPOINT_CMD=node scripts/a5-l2.mjs checkpoint --dir $L2_DIR --ledgers $L2_PRIOR"
          } >> "$GITHUB_ENV"

          # Prior ledgers are pipeline artifacts, never DB rows. `a5-l2-prior-runs.mjs` paginates
          # EVERY completed run of this workflow (per_page=100 until exhaustion) with NO date
          # cutoff and NO count cap (no-date-or-count-cutoff). Eligibility for an L2 ledger is
          # decided from the ACTUAL workflow file at each run's head_sha PLUS that run's own job
          # steps — never from a date, a display name, a conclusion or an arbitrary N runs. If
          # either source is unreadable or the two contradict each other, this is a HARD STOP.
          #   * ELIGIBLE (mechanism present AND the L2 preflight step actually ran), including
          #     old / failed / cancelled runs, MUST supply a readable L2 artifact; missing,
          #     expired, unreadable, corrupt or non-L2 => HARD STOP before any write.
          #   * INELIGIBLE (pre-L2 workflow version, or the L2 step was never reached) owes NO
          #     impossible artifact. Its rows are NOT assumed absent: `a5-l2.mjs preflight`
          #     re-reads the documented legacy synthetic namespace row-by-row (`TEST ONLY A5 ci-*`,
          #     the known synthetic phones, `ci-e2e-ticket:%`, post-deploy synthetic conversations)
          #     and stops on ANY row without per-row L2 evidence. Absence of ledger != absence of data.
          # --retention-days is ONLY the artifact-retention pin, NEVER a filter on run history.
          if ! node scripts/a5-l2-prior-runs.mjs \
                 --prior-dir "$L2_PRIOR" --work-dir "$L2_ROOT/downloads" \
                 --retention-days "${A5_L2_RETENTION_DAYS:-90}" \
                 > "$L2_ROOT/prior-runs.json"; then
            echo "::error::A5 L2: prior run/ledger retrieval failed; run stopped before any write, no deletion, no bypass."
            exit 1
          fi
          jq -c '{ok, pages_fetched, total_count, runs_fetched, eligible_runs, ineligible_runs, ledgers, retention_days, cutoff_is_filter}' "$L2_ROOT/prior-runs.json"
          echo "::notice::A5 L2: fetched $(jq -r '.pages_fetched' "$L2_ROOT/prior-runs.json") page(s) / $(jq -r '.runs_fetched' "$L2_ROOT/prior-runs.json") run(s); eligible=$(jq -r '.eligible_runs' "$L2_ROOT/prior-runs.json"), ineligible=$(jq -r '.ineligible_runs' "$L2_ROOT/prior-runs.json"), ledgers=$(jq -r '.ledgers' "$L2_ROOT/prior-runs.json"). Ineligible runs are NOT assumed to have written no rows; the legacy namespace is verified row-by-row in preflight."

          node scripts/a5-l2.mjs begin --dir "$L2_DIR"
          # Seed a genuine, zero-claim failure ledger BEFORE any write. If this run is hard-killed
          # before any checkpoint/finalize, the always()-upload still publishes evidence. It claims
          # NOTHING about rows (0 events, empty baseline), so it cannot launder ownership.
          node scripts/a5-l2.mjs failure-evidence --dir "$L2_DIR" --reason "run-in-progress-not-finalized"
          if ! node scripts/a5-l2.mjs preflight --dir "$L2_DIR" --ledgers "$L2_PRIOR" \
                 > "$L2_ROOT/preflight.json"; then
            echo "::error::A5 L2 preflight stopped the run (unknown synthetic-row ownership, incl. legacy rows). No write, no deletion, no bypass."
            jq -c '{ok, reason, ledgers, rows, legacy_suspects, verdicts: [.verdicts[] | select(.verdict != "previous-a5-proven" and .verdict != "baseline-origin")]}' \
              "$L2_ROOT/preflight.json"
            # The stop decision must be readable WITHOUT the job log: logs live on blob storage that a
            # reviewing client may not be able to reach, while check-run annotations are public API.
            # Emitted fields are table names, verdicts and synthetic key hashes only — no customer data.
            # Why the extra detail exists: a stop that only says "an unknown row exists" forces a
            # guess, and guessing is how a barrier gets weakened by accident.
            preflight_diag=$(jq -r '
              ([.verdicts[] | select(.verdict | startswith("unknown")) | .verdict]
                 | group_by(.) | map("\(.[0])=x\(length)") | join(",")) as $by_verdict
              | ([.verdicts[] | select(.verdict | startswith("unknown")) | "\(.table):\(.a5_key)"][0:4] | join(" ")) as $keys
              | "reason=\(.reason);rows=\(.rows);ledgers=\(.ledgers);legacy=\(.legacy_suspects);unknown=\(if $by_verdict == "" then "none" else $by_verdict end);keys=\(if $keys == "" then "none" else $keys end)"
            ' "$L2_ROOT/preflight.json" 2>/dev/null || echo "reason=unparsable")
            echo "::error::A5 L2 preflight detail: ${preflight_diag:0:900}"
            exit 1
          fi
          jq -c '{ok, reason, ledgers, rows, legacy_suspects, proven: ([.verdicts[] | select(.verdict == "previous-a5-proven")] | length)}' \
            "$L2_ROOT/preflight.json"
          echo "a5-l2: ownership preflight OK for run_tag=$tag"

      - name: Deploy nasr-crm-api-test and run live A5 E2E
        id: e2e
        shell: bash
        env:
          API: https://api.cloudflare.com/client/v4
          TEST_DB_UUID: 760079c6-85f9-4a30-aa19-9a66f95d421a
          PROD_DB_UUID: ace5c9a2-c6b1-47b3-adf1-77e84ac50abf
          WORKER_NAME: nasr-crm-api-test
          WRANGLER_CFG: _worker/wrangler.crm.toml
          BASE_URL: ${{ steps.preflight.outputs.base_url }}
          BACKUP_CONTACTS: ${{ steps.preflight.outputs.backup_contacts }}
          AUTH_MODE: ${{ steps.preflight.outputs.auth_mode }}
          HAS_DIRECT_CODE: ${{ steps.preflight.outputs.has_direct_code }}
          INGEST_PUBLIC_KEY: ${{ steps.preflight.outputs.ingest_public_key }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
        run: |
          set -euo pipefail
          umask 077
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          printf '%s' "$INGEST_PUBLIC_KEY" > ./ingest-public-key.txt

          result='not-run'
          phase='preflight'
          deployed='no'
          login_and_crud='no'
          mobile_browser='no'
          unauth_rejected='no'
          code_source='existing-worker-secrets'
          backup_contacts="$BACKUP_CONTACTS"
          stage_test='removed-no-stage-db'
          a5_live='not-run'
          finish() {
            {
              printf 'result=%s\n' "$result"
              printf 'phase=%s\n' "$phase"
              printf 'deployed=%s\n' "$deployed"
              printf 'login_and_crud=%s\n' "$login_and_crud"
              printf 'mobile_browser=%s\n' "$mobile_browser"
              printf 'unauth_rejected=%s\n' "$unauth_rejected"
              printf 'code_source=%s\n' "$code_source"
              printf 'backup_contacts=%s\n' "$backup_contacts"
              printf 'stage_test=%s\n' "$stage_test"
              printf 'a5_live=%s\n' "$a5_live"
            } >> "$GITHUB_OUTPUT"
          }

          d1_exec_retry() {
            local n=1
            while true; do
              if "$@"; then return 0; fi
              if [ "$n" -ge 3 ]; then return 1; fi
              sleep $((n * 3))
              n=$((n + 1))
            done
          }

          # The existing GitHub Secret is copied to a 0600 temp file only when the verifier auth mode is
          # in use. No access code, verifier, session secret, VAPID key, or ingest key is ever generated.
          if [ "$AUTH_MODE" = 'github-code-plus-worker-verifier' ]; then
            if [ "${#OWNER_CRM_ACCESS_CODE}" -lt 24 ]; then
              result='github-access-code-too-short'
              finish
              exit 1
            fi
            printf '%s\n' "$OWNER_CRM_ACCESS_CODE" > "$TMP/access_code"
            chmod 600 "$TMP/access_code"
            echo "::add-mask::${OWNER_CRM_ACCESS_CODE}"
          fi

          # A5 live operational verification — unchanged A5 client path, now driven only by secrets
          # that already exist. The 10th check (row-level 0014 proof on real D1) is enabled only when
          # the dispatch form selects a5_write_decision=noted. scripts/a5-live-support.mjs derives
          # csrf_hash = sha256(csrf_token) — a secret-free handle on exactly this run's session — and
          # refuses to UPDATE anything unless precisely one live crm_sessions row matches. It never
          # reads CRM_SESSION_SECRET, never touches the prod DB, and prints to stderr only so the
          # verifier's one-line JSON stays parseable. With a5_write_decision=none (the default) the
          # read-only path is unchanged: nine checks plus logout-then-401, no decision row, no expiry.
          # ── Redaction barrier for anything that can reach a PUBLIC check name ────────────────────
          # On 2026-11-04 this step published a fragment of a Cloudflare API token inside a public
          # check name: `a5=error:onBearer cfat_…`. Cause: Node's execFileSync puts the whole command
          # — including `-H Authorization: Bearer <token>` — into the thrown error message, and the
          # step took the last 40 characters of raw stderr into a name. `::add-mask::` protects the
          # LOG only; it does nothing for a value injected into a run/check name. So: redact first,
          # then shorten. Nothing derived from stderr may reach a name without passing through here.
          redact_err() {
            sed -E 's/[Bb]earer[[:space:]]*[A-Za-z0-9_.=_-]*/Bearer<redacted>/g; s/[A-Za-z0-9_=-]{32,}/<redacted>/g' \
              | tr -cd 'A-Za-z0-9_=<>-'
          }

          run_a5_live() {
            local a5_state="$TMP/a5_session_token" a5_n1 a5_n2 a5_h1 a5_h2 a5_code_env=''
            : > "$a5_state"
            chmod 600 "$a5_state"
            rm -f "$a5_state.csrf"
            if [ -s "$TMP/access_code" ]; then
              a5_code_env="$TMP/access_code"
            else
              a5_n1=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(36).toString("base64url"));')
              a5_n2=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(36).toString("base64url"));')
              echo "::add-mask::${a5_n1}"
              echo "::add-mask::${a5_n2}"
              a5_h1=$(printf '%s' "$a5_n1" | sha256sum | awk '{print $1}')
              a5_h2=$(printf '%s' "$a5_n2" | sha256sum | awk '{print $1}')
              if ! d1_exec_retry npx --yes wrangler@4 d1 execute nasr-crm-test-db-v2 --remote --config "$WRANGLER_CFG" \
                   --command "INSERT INTO crm_idempotency_receipts(submission_key,resource_type,resource_id,received_at) VALUES ('ci-e2e-ticket:${a5_h1}','contact','authorized_pending',strftime('%Y-%m-%dT%H:%M:%fZ','now')), ('ci-e2e-ticket:${a5_h2}','contact','authorized_pending',strftime('%Y-%m-%dT%H:%M:%fZ','now'));" >/dev/null 2>&1; then
                a5_live='ticket-mint-failed'
                return 1
              fi
            fi
            # The 10-check path needs one open review case and a run-local expiry hook. Both are
            # barriers: any failure stops the A5 run with a named reason instead of a silent 9/10.
            if [ "${A5_WRITE_DECISION_INPUT:-none}" = 'noted' ]; then
              if ! node scripts/a5-live-support.mjs ensure-review-case > "$TMP/a5_seed.out" 2> "$TMP/a5_seed.err"; then
                a5_live="review-case-seed-failed:$(redact_err < "$TMP/a5_seed.err" | tail -c 60 || echo unknown)"
                return 1
              fi
              # The hook prints to stderr only; redirect its stdout too so the JSON stays one line.
              export CRM_A5_EXPIRE_CMD='node scripts/a5-live-support.mjs expire-session 1>&2'
            else
              unset CRM_A5_EXPIRE_CMD || true
            fi
            if ! CRM_TEST_BASE_URL="$BASE_URL" CRM_A5_ORIGIN="$BASE_URL" CRM_A5_STATE_FILE="$a5_state" \
                 CRM_A5_TICKET="${a5_n1:-}" \
                 CRM_LIVE_ACCESS_CODE_FILE="${a5_code_env:-}" \
                 CRM_A5_WRITE_DECISION="${A5_WRITE_DECISION_INPUT:-none}" \
                 node _worker/tests/live-a5-verify.mjs --json > "$TMP/live_a5.json" 2> "$TMP/live_a5.err"; then
              a5_live="error:$(redact_err < "$TMP/live_a5.err" | tail -c 40 || echo unknown)"
              return 1
            fi
            a5_live=$(jq -r 'if ([.checks[] | select(.status == "fail")] | length) == 0 then "all-\(.checks | length)-pass" else "fail:" + ([.checks[] | select(.status == "fail") | .id] | join(",")) end' "$TMP/live_a5.json" 2>/dev/null || echo 'unparsable')
            jq -r '.checks[] | "  \(.status) \(.id) \(.evidence // "")"' "$TMP/live_a5.json" 2>/dev/null \
              | sed -E 's/[0-9]{9,}/<digits>/g' | head -14 || true
            # A5 L2: NO cleanup. Every successfully written row is retained together with its
            # hash-chained L2 event so the next run can re-verify it. Deleting synthetic rows —
            # or a broad DELETE that could reach non-synthetic rows — is forbidden.
            echo "::notice::A5 L2: synthetic rows retained with result evidence in $A5_L2_DIR (no cleanup, no deletion)"
            if [ "${a5_live#fail}" != "$a5_live" ]; then return 1; fi
            return 0
          }

          phase='deploy-test-worker'
          if ! npx --yes wrangler@4 deploy --config "$WRANGLER_CFG" > "$TMP/deploy.log" 2>&1; then
            result='worker-deploy-failed'
            finish
            exit 1
          fi
          curl --silent --show-error --connect-timeout 10 --max-time 30 -X POST -H "$AUTH" \
            -H 'Content-Type: application/json' --data '{"enabled":true}' \
            -o "$TMP/enable_sub.json" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain" >/dev/null 2>&1 || true
          deployed='yes'

          # A5 L2: pre-run cleanup REMOVED. The old SQL deleted every revoked session and every
          # crm_auth_attempts row (non-synthetic too), deleted by display-name prefixes, and was
          # the reason a failed run left an unprovable contact that made the next run return 200.
          # Isolation now comes from run-scoped full keys + per-row L2 evidence, not deletion.

          # Non-interference, measured instead of remembered: the row counts are captured HERE, before
          # any live check runs, and compared with the same query afterwards. The previous gate compared
          # against a frozen snapshot (60/64/83/19/76/21/2984/66) which is only true for one historical
          # database state — it made the gate fail on a clean database and would fail again after any
          # legitimate import.
          PRE_CNT_SQL="SELECT (SELECT COUNT(*) FROM crm_contacts WHERE name NOT LIKE 'TEST ONLY%') AS c, (SELECT COUNT(*) FROM crm_contact_phones WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS ph, (SELECT COUNT(*) FROM crm_opportunities WHERE notes NOT LIKE 'TEST ONLY%') AS o, (SELECT COUNT(*) FROM crm_opportunities WHERE contact_id IS NULL AND notes NOT LIKE 'TEST ONLY%') AS cl, (SELECT COUNT(*) FROM crm_conversations WHERE chat_title NOT LIKE 'TEST ONLY%') AS cv, (SELECT COUNT(*) FROM crm_conversations WHERE match_status IN ('unmatched_review','conflict_review') AND chat_title NOT LIKE 'TEST ONLY%') AS unm, (SELECT COUNT(*) FROM crm_conversation_messages WHERE conversation_id NOT IN (SELECT id FROM crm_conversations WHERE chat_title LIKE 'TEST ONLY%')) AS m, (SELECT COUNT(*) FROM crm_smart_alerts WHERE status='open') AS al;"
          if ! d1_exec_retry npx --yes wrangler@4 d1 execute nasr-crm-test-db-v2 --remote --json --config "$WRANGLER_CFG" --command "$PRE_CNT_SQL" > "$TMP/pre_cnt.json" 2>/dev/null; then
            result='pre-verify-counts-query-failed'
            finish
            exit 1
          fi

          ci_n1='' ci_n2='' ci_n3='' ci_h1='' ci_h2='' ci_h3=''
          if [ -s "$TMP/access_code" ]; then
            live10_env="CRM_LIVE_ACCESS_CODE_FILE=$TMP/access_code"
          else
            ci_n1=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(36).toString("base64url"));')
            ci_n2=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(36).toString("base64url"));')
            ci_n3=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(36).toString("base64url"));')
            echo "::add-mask::${ci_n1}"; echo "::add-mask::${ci_n2}"; echo "::add-mask::${ci_n3}"
            ci_h1=$(printf '%s' "$ci_n1" | sha256sum | awk '{print $1}')
            ci_h2=$(printf '%s' "$ci_n2" | sha256sum | awk '{print $1}')
            ci_h3=$(printf '%s' "$ci_n3" | sha256sum | awk '{print $1}')
            TICKET_SQL="INSERT INTO crm_idempotency_receipts(submission_key,resource_type,resource_id,received_at) VALUES ('ci-e2e-ticket:${ci_h1}','contact','authorized_pending',strftime('%Y-%m-%dT%H:%M:%fZ','now')), ('ci-e2e-ticket:${ci_h2}','contact','authorized_pending',strftime('%Y-%m-%dT%H:%M:%fZ','now')), ('ci-e2e-ticket:${ci_h3}','contact','authorized_pending',strftime('%Y-%m-%dT%H:%M:%fZ','now'));"
            if ! d1_exec_retry npx --yes wrangler@4 d1 execute nasr-crm-test-db-v2 --remote --config "$WRANGLER_CFG" --command "$TICKET_SQL" > "$TMP/ci_ticket.log" 2>&1; then
              result='ci-ticket-mint-failed'
              finish
              exit 1
            fi
            # Prove the precondition instead of assuming it. The live check reads the ticket the Worker
            # resolves, so if the mint landed somewhere unexpected, the failure is HERE, named, and not
            # a bare 403 three steps later.
            MINT_CHECK_SQL="SELECT COUNT(*) AS n FROM crm_idempotency_receipts WHERE resource_id='authorized_pending' AND submission_key IN ('ci-e2e-ticket:${ci_h1}','ci-e2e-ticket:${ci_h2}','ci-e2e-ticket:${ci_h3}');"
            if ! d1_exec_retry npx --yes wrangler@4 d1 execute nasr-crm-test-db-v2 --remote --json --config "$WRANGLER_CFG" --command "$MINT_CHECK_SQL" > "$TMP/mint_check.json" 2>/dev/null; then
              result='ci-ticket-mint-unreadable'
              finish
              exit 1
            fi
            mint_n=$(jq -r '.. | objects | select(has("n")) | .n' "$TMP/mint_check.json" 2>/dev/null | head -n1)
            if [ "${mint_n:-0}" != '3' ]; then
              result="ci-ticket-mint-verify-${mint_n:-0}-of-3"
              finish
              exit 1
            fi
            live10_env="CRM_CI_TICKET_NONCES=${ci_n1},${ci_n2},${ci_n3}"
          fi

          phase='live-10-checks-http-and-ui'
          if ! env CRM_TEST_BASE_URL="$BASE_URL" $live10_env node _worker/tests/live-post-deploy-verify.mjs > "$TMP/live10.json" 2> "$TMP/live10.err"; then
            # A5 L2: nothing is deleted on failure. The `if: always()` L2 step publishes the
            # ledger for the rows that WERE proven, so the next run can re-verify them.
            result="live10-$(redact_err < "$TMP/live10.err" | tail -c 52 || echo unknown)"
            finish
            exit 1
          fi
          mobile_browser='desk+mob+pwa'
          unauth_rejected='yes'

          phase='live-a5-operational-verification'
          a5_rc=0
          run_a5_live || a5_rc=$?
          if [ "$a5_rc" != '0' ]; then
            result='live-a5-operational-checks-failed'
            finish
            exit 1
          fi

          if [ -s "$TMP/access_code" ]; then
            phase='legacy-e2e-with-existing-access-code'
            if ! env CRM_TEST_BASE_URL="$BASE_URL" CRM_LIVE_ACCESS_CODE_FILE="$TMP/access_code" \
                    node _worker/tests/live-e2e-runner.mjs > "$TMP/e2e_out.json"; then
              result='legacy-e2e-failed'
              finish
              exit 1
            fi
            if ! env CRM_TEST_BASE_URL="$BASE_URL" CRM_LIVE_ACCESS_CODE_FILE="$TMP/access_code" \
                    node _worker/tests/live-browser-e2e.mjs > "$TMP/browser_out.json"; then
              result='legacy-browser-e2e-failed'
              finish
              exit 1
            fi
          fi

          phase='post-verify-non-interference-invariance'
          # Non-interference PROVEN by difference: these counts exclude `TEST ONLY` display names, so
          # the synthetic rows a run creates cannot move them. Equality pre↔post is the invariant; the
          # absolute values are recorded as evidence and never asserted.
          FINAL_CNT_SQL="SELECT (SELECT COUNT(*) FROM crm_contacts WHERE name NOT LIKE 'TEST ONLY%') AS c, (SELECT COUNT(*) FROM crm_contact_phones WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS ph, (SELECT COUNT(*) FROM crm_opportunities WHERE notes NOT LIKE 'TEST ONLY%') AS o, (SELECT COUNT(*) FROM crm_opportunities WHERE contact_id IS NULL AND notes NOT LIKE 'TEST ONLY%') AS cl, (SELECT COUNT(*) FROM crm_conversations WHERE chat_title NOT LIKE 'TEST ONLY%') AS cv, (SELECT COUNT(*) FROM crm_conversations WHERE match_status IN ('unmatched_review','conflict_review') AND chat_title NOT LIKE 'TEST ONLY%') AS unm, (SELECT COUNT(*) FROM crm_conversation_messages WHERE conversation_id NOT IN (SELECT id FROM crm_conversations WHERE chat_title LIKE 'TEST ONLY%')) AS m, (SELECT COUNT(*) FROM crm_smart_alerts WHERE status='open') AS al;"
          if ! d1_exec_retry npx --yes wrangler@4 d1 execute nasr-crm-test-db-v2 --remote --json --config "$WRANGLER_CFG" --command "$FINAL_CNT_SQL" > "$TMP/final_cnt.json" 2>/dev/null; then
            result='post-verify-counts-query-failed'
            finish
            exit 1
          fi
          if ! jq -n -e --slurpfile pre "$TMP/pre_cnt.json" --slurpfile post "$TMP/final_cnt.json" '
                def cnt($d): $d | .. | objects | select(has("c") and has("cv"));
                (cnt($pre[0])) as $a | (cnt($post[0])) as $b
                | ($a | type) == "object" and ($b | type) == "object"
                and $a.c == $b.c and $a.ph == $b.ph and $a.o == $b.o and $a.cl == $b.cl
                and $a.cv == $b.cv and $a.unm == $b.unm and $a.m == $b.m and $a.al == $b.al' \
              >/dev/null 2>&1; then
            result='post-verify-counts-changed'
            finish
            exit 1
          fi
          al_cnt=$(jq -r '.. | objects | select(has("c") and has("al")) | .al | tostring' "$TMP/final_cnt.json" | head -n1)
          final_401=$(curl --silent --connect-timeout 10 --max-time 15 -o /dev/null -w '%{http_code}' "$BASE_URL/api/contacts" 2>/dev/null || true)
          if [ "$final_401" != '401' ]; then
            result="post-verify-unauth-status-${final_401}"
            finish
            exit 1
          fi
          LOGIN_COUNTS=$(jq -r '.. | objects | select(has("c") and has("cv")) | "\(.c)c-\(.ph)ph-\(.o)o[\(.cl)]-\(.cv)cv[\(.unm)]-\(.m)m-\(.al)al"' "$TMP/final_cnt.json" | head -n1)
          login_and_crud="${LOGIN_COUNTS}-mdb0"
          phase='completed'
          result='deployed-a5-verified'
          finish

      # A5 L2: publish the final, hash-chained result ledger even when the run failed part-way.
      # The partial-failure guarantee is incremental: each completed write batch calls
      # `checkpoint`, so every successfully created row already carries its OWN independent event
      # (row_hash / observed_id / parent / run identity / hash chain). `finalize` closes that
      # ledger; it NEVER claims success when the E2E step failed.
      #
      # Deadlock fix: a `preflight` failure, a missing output, or a `finalize` throw must NOT turn
      # the run into "completed run with no evidence" (which used to stop every later run forever).
      # In those cases `failure-evidence` publishes a genuine, hash-chained, run-identified ledger
      # with conclusion `failure`, ZERO events and an EMPTY baseline: it proves nothing about any
      # row, cannot launder ownership, and contains no retroactive proof. The next eligible run
      # finds a readable artifact and still verifies EVERY row (including the legacy namespace)
      # row-by-row; any `unknown` still stops. There is NO `no-ledger(hard-cancel)` acceptance path.
      - name: A5 L2 — publish final result ledger (always, incl. partial failure)
        if: always()
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
          A5_L2_E2E_OUTCOME: ${{ steps.e2e.outcome }}
          A5_L2_E2E_PHASE: ${{ steps.e2e.outputs.phase }}
        run: |
          set -euo pipefail
          L2_DIR="${A5_L2_DIR:-$RUNNER_TEMP/a5-l2/current}"
          L2_PRIOR="${A5_L2_PRIOR_DIR:-$RUNNER_TEMP/a5-l2/prior}"
          mkdir -p "$L2_DIR" "$L2_PRIOR"
          cleared='no'
          if [ -f "$L2_DIR/preflight.json" ] && jq -e '.ok == true' "$L2_DIR/preflight.json" > /dev/null; then
            cleared='yes'
          fi
          conclusion='failure'
          if [ "${A5_L2_E2E_OUTCOME:-}" = 'success' ]; then conclusion='success'; fi
          if [ "$cleared" = 'yes' ]; then
            if ! node scripts/a5-l2.mjs finalize --dir "$L2_DIR" --ledgers "$L2_PRIOR" \
                   --conclusion "$conclusion" --stopped-at "${A5_L2_E2E_OUTCOME:-unknown}:${A5_L2_E2E_PHASE:-unknown}" \
                   > "$TMP/finalize.out" 2> "$TMP/finalize.err"; then
              # Same reason as the verifier: a stop must carry its cause, not just the command.
              finalize_reason=$(redact_err < "$TMP/finalize.err" | tail -c 160 | tr -d '\n')
              echo "::error::A5 L2: finalize failed (${finalize_reason:-no-stderr}); publishing zero-claim failure evidence instead of a success claim."
              node scripts/a5-l2.mjs failure-evidence --dir "$L2_DIR" --reason "finalize-failed"
              exit 1
            fi
          else
            node scripts/a5-l2.mjs failure-evidence --dir "$L2_DIR" --reason "preflight-not-cleared"
            echo "::error::A5 L2: ownership preflight did not clear (unknown or legacy unproven row). Zero-claim failure evidence published; NO write, NO success claim, NO bypass. The next run still verifies every row."
            exit 1
          fi

      - name: Publish A5 L2 result ledger artifact (digests only, no customer data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a5-l2-ledger
          path: ${{ runner.temp }}/a5-l2/current/a5-l2-*.json
          # A run with NO ledger file is a hard failure, never a silent "warn" and never
          # "treat prior ledgers as absent".
          if-no-files-found: error
          # Kept equal to the job env A5_L2_RETENTION_DAYS (pinned by scripts/tests/a5-l2-result-ledger.test.mjs).
          retention-days: 90

      - name: Verify nasr-market-db invariance (read-only)
        id: invariance
        shell: bash
        env:
          API: https://api.cloudflare.com/client/v4
          PROD_DB_UUID: ace5c9a2-c6b1-47b3-adf1-77e84ac50abf
          EXPECTED_SIG: ${{ steps.preflight.outputs.market_pre_sig }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
        run: |
          set -euo pipefail
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" \
            -o "$TMP/d1_post.json" -w '%{http_code}' \
            "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100" 2>/dev/null || true)
          market_post_sig=$(jq -r --arg id "$PROD_DB_UUID" \
            '.result[] | select(.uuid == $id) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_post.json" 2>/dev/null | head -n1)
          if [ "$status" != '200' ] || [ -z "$EXPECTED_SIG" ] || [ "$EXPECTED_SIG" != "$market_post_sig" ]; then
            echo "::error::nasr-market-db invariance check failed (http=$status, before=${EXPECTED_SIG:-missing}, after=${market_post_sig:-missing}); no further deploy action."
            exit 1
          fi
          echo "market-db-invariance-ok: signature unchanged"

      - name: Publish non-secret RSA-OAEP public key artifact for sealed CRM ingest
        if: always() && hashFiles('ingest-public-key.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: crm-ingest-public-key
          path: ingest-public-key.txt
          retention-days: 5

  report:
    name: 'CRM live E2E — ${{ needs.deploy-and-verify.outputs.result }} (bak=${{ needs.deploy-and-verify.outputs.backup_contacts }}, stg=${{ needs.deploy-and-verify.outputs.stage_test }}, dep=${{ needs.deploy-and-verify.outputs.deployed }}, v=${{ needs.deploy-and-verify.outputs.login_and_crud }}, ui=${{ needs.deploy-and-verify.outputs.mobile_browser }}, 401=${{ needs.deploy-and-verify.outputs.unauth_rejected }}, src=${{ needs.deploy-and-verify.outputs.code_source }}, a5=${{ needs.deploy-and-verify.outputs.a5_live }})'
    needs: deploy-and-verify
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret live E2E summary is encoded in this check name.'
