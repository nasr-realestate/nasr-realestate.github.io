name: CRM Cloudflare write proof (test D1 only, self-cleaning)

# CONTRACT (2026-11-05)
#
# Answers ONE question with evidence: does `ARENA_CLOUDFLARE_TOKEN` actually carry WRITE permission
# on this account — or does it only read? "It has D1 Write in the dashboard" is a claim about a
# policy screen; this workflow is the measurement. It is deliberately the smallest write that can be
# proved and then be gone:
#
#   * Target: ONLY `nasr-crm-test-db` (uuid pinned below AND cross-checked against
#     `scripts/a5-live-support.mjs`, so the two can never drift apart silently). The production
#     `nasr-market-db` is never named as a request target and is asserted absent from every URL.
#   * Write: `CREATE TABLE _cf_probe_write_proof` → `INSERT` one row → `DROP TABLE`, then a separate
#     read proves the table is GONE. One integer in one throwaway table, deleted in the same run.
#     No CRM table is touched, so no synthetic row is ever created anywhere near the A5 ownership
#     audit (that is what the L2 preflight would rightly refuse to forgive later).
#   * Cleanup is not best-effort: an EXIT trap issues `DROP TABLE IF EXISTS` even if a step in the
#     middle fails, and the run FAILS if the post-check still finds the table. A leftover table is
#     reported, never ignored.
#   * Worker write (optional, second typed string): creates `cf-write-proof-<run_id>` and deletes it
#     in the same job, trap included. It never redeploys the CRM Worker — that stays the deploy
#     workflow's job.
#   * The token value is masked on arrival and never echoed, never written to a file, never artifacted.
#
# Refused unless a human types the exact string below: a write probe must not be something a branch
# push or a stale re-run can do on its own.
on:
  workflow_dispatch:
    inputs:
      authorize_d1_write_proof:
        description: 'Type PROVE-CLOUDFLARE-WRITE to run the self-cleaning D1 write proof on nasr-crm-test-db. Anything else stops before any secret is read.'
        required: true
        type: string
      authorize_worker_write_proof:
        description: 'Optional: type PROVE-WORKER-WRITE to also create and immediately delete a scratch Worker script (proves Workers Scripts write). Leave empty to skip.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: crm-cloudflare-write-proof
  cancel-in-progress: false

jobs:
  proof:
    name: 'CF write proof — D1 create/insert/drop on the test database'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.repository == 'nasr-realestate/nasr-realestate.github.io'
      && github.event_name == 'workflow_dispatch'
      && inputs.authorize_d1_write_proof == 'PROVE-CLOUDFLARE-WRITE'
    outputs:
      outcome: ${{ steps.proof.outputs.outcome }}
      d1_write: ${{ steps.proof.outputs.d1_write }}
      cleanup: ${{ steps.proof.outputs.cleanup }}
      ddl_probe: ${{ steps.proof.outputs.ddl_probe }}
      worker_write: ${{ steps.proof.outputs.worker_write }}
    steps:
      - name: Check out the constants this proof is pinned to
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove D1 write, prove cleanup, leave nothing behind
        id: proof
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
          WORKER_PROOF_INPUT: ${{ inputs.authorize_worker_write_proof }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          API='https://api.cloudflare.com/client/v4'
          TMP=$(mktemp -d)
          account_id=''
          scratch_script=''

          outcome='not-run'
          d1_write='not-run'
          cleanup='not-run'
          worker_write='skipped'
          ddl_probe='not-run'

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            outcome='secret-unavailable-to-workflow'
            d1_write='not-requested'
            cleanup='not-requested'
            {
              echo "outcome=$outcome"
              echo "d1_write=$d1_write"
              echo "cleanup=$cleanup"
              echo "ddl_probe=$ddl_probe"
              echo "worker_write=$worker_write"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Masked before the first request in this file — including the cleanup helpers below, which
          # are the first things to define a curl. Order matters: a mask that arrives after a request
          # protects nothing.
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          finish() {
            {
              echo "outcome=$outcome"
              echo "d1_write=$d1_write"
              echo "cleanup=$cleanup"
              echo "worker_write=$worker_write"
            } >> "$GITHUB_OUTPUT"
          }

          # Cleanup is unconditional. `$scratch_script`/`$account_id` are empty unless the run got far
          # enough to create something, so this is safe on every exit path, including an early stop.
          drop_probe_table() {
            [ -n "${account_id:-}" ] || return 0
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --request POST \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data '{"sql":"DROP TABLE IF EXISTS _cf_probe_write_proof"}' \
              --output /dev/null \
              "${API}/accounts/${account_id}/d1/database/${TEST_DB_UUID}/query" 2>/dev/null || true
          }
          delete_scratch_script() {
            [ -n "${scratch_script:-}" ] && [ -n "${account_id:-}" ] || return 0
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --request DELETE \
              --header "$auth_header" \
              --output /dev/null \
              "${API}/accounts/${account_id}/workers/scripts/${scratch_script}" 2>/dev/null || true
          }
          delete_probe_row() {
            [ -n "${probe_key:-}" ] && [ -n "${account_id:-}" ] && [ -n "${TEST_DB_UUID:-}" ] || return 0
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --request POST --header "$auth_header" --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg k "$probe_key" '{sql:("DELETE FROM crm_idempotency_receipts WHERE submission_key = " + ($k|@sh))}')" \
              --output /dev/null \
              "${API}/accounts/${account_id}/d1/database/${TEST_DB_UUID}/query" 2>/dev/null || true
          }
          # Every exit path removes the probe row first: a failed run must not leave the one row it
          # wrote sitting in the table it was only supposed to prove writable.
          trap 'delete_probe_row; delete_scratch_script; drop_probe_table; rm -rf "$TMP"' EXIT

          # One-line, redacted, bounded rendering of a D1 error. The message is the only part of a
          # 400/7500 that means anything, so it is captured — and it is redacted before it can reach a
          # check name, because a leaked token fragment once travelled exactly this path.
          d1_message() {
            jq -r '(.errors[0].message // "no-message")' "$1" 2>/dev/null \
              | sed -E 's/[Bb]earer[[:space:]]*[A-Za-z0-9_.=_-]*/Bearer<redacted>/g; s/[A-Za-z0-9_=-]{32,}/<redacted>/g' \
              | tr -cd 'A-Za-z0-9_=<>:., -' | cut -c1-120
          }
          probe_key=''

          # ── Guard 1: the pinned target must still be the one the A5 code calls the test database ──
          read_const() {
            grep -E "^export const $1 = '[^']*';" scripts/a5-live-support.mjs \
              | head -1 | sed -E "s/^export const $1 = '([^']*)';$/\1/"
          }
          const_uuid=$(read_const TEST_DB_UUID)
          const_name=$(read_const TEST_DB_NAME)
          const_prod_name=$(read_const PROD_DB_NAME)
          const_prod_uuid=$(read_const PROD_DB_UUID)
          if [ "$const_uuid" != '65bfcb14-4b48-423b-916f-00eefdb9ae1e' ] \
             || [ "$const_name" != 'nasr-crm-test-db' ] \
             || [ "$const_prod_name" != 'nasr-market-db' ]; then
            outcome='constants-drift-refused'
            d1_write='refused'
            cleanup='not-needed'
            finish
            echo "::error::The test-database constants no longer match the values this workflow is pinned to. Refusing to write anywhere."
            exit 1
          fi
          TEST_DB_UUID="$const_uuid"

          get_json() {
            local url="$1" destination="$2" code
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "$auth_header" --output "$destination" --write-out '%{http_code}' "$url" 2>/dev/null || true)
            printf '%s' "${code:-000}"
          }

          # ── Guard 2: the token can read the account, and there is exactly one account ────────────
          # `/user/tokens/verify` is NOT called here. It accepts only USER-owned tokens and answers
          # 401 to an account-owned token — which is this one. On 2026-11-05 this guard therefore
          # reported `verify=401, accounts=200` (unusable AND working in the same line) and stopped
          # the run before it wrote anything: a false negative that cost a run and hid the real
          # question. The account read below IS the auth check: it is the same first call the deploy
          # preflight makes, and 403 here is the only answer that means "missing Account Settings: Read".
          accounts_code=$(get_json "$API/accounts?per_page=100" "$TMP/accounts.json")
          if [ "$accounts_code" != 200 ]; then
            outcome="account-read-failed;accounts-http=$accounts_code"
            d1_write='not-attempted'
            cleanup='not-needed'
            finish
            echo "::error::GET /accounts returned $accounts_code; the token cannot read this account (403 here means 'Account Settings: Read' is missing)."
            exit 1
          fi
          account_count=$(jq -r '.result | length' "$TMP/accounts.json")
          if [ "$account_count" != 1 ]; then
            outcome="accounts-not-single;count=$account_count"
            d1_write='not-attempted'
            cleanup='not-needed'
            finish
            echo "::error::Expected exactly one account reachable by this token, found $account_count."
            exit 1
          fi
          account_id=$(jq -r '.result[0].id' "$TMP/accounts.json")

          d1_code=$(get_json "$API/accounts/${account_id}/d1/database?per_page=100" "$TMP/d1.json")
          target_name=$(jq -r --arg u "$TEST_DB_UUID" '.result[]? | select(.uuid == $u) | .name' "$TMP/d1.json" 2>/dev/null | head -1)
          if [ "$d1_code" != 200 ] || [ "$target_name" != 'nasr-crm-test-db' ]; then
            outcome="test-db-not-confirmed;d1-http=$d1_code;name=${target_name:-absent}"
            d1_write='not-attempted'
            cleanup='not-needed'
            finish
            echo "::error::Could not confirm that uuid ${TEST_DB_UUID} is nasr-crm-test-db. Refusing to write."
            exit 1
          fi

          d1_query() {
            local sql="$1" destination="$2" code
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
              --request POST --header "$auth_header" --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" \
              --output "$destination" --write-out '%{http_code}' \
              "${API}/accounts/${account_id}/d1/database/${TEST_DB_UUID}/query" 2>/dev/null || true)
            printf '%s' "${code:-000}"
          }

          # ── Measurement 1 — INFORMATIONAL, never a gate: does this database accept DDL? ──────────
          # Cloudflare's D1 REST endpoint answers 400/7500 for reasons that differ ONLY by the message
          # (SQLITE_AUTH for DDL on one particular database, "exceeded daily row write limit" on the
          # free tier, "exceeded maximum DB size", "incomplete input"). The code alone is worthless —
          # on 2026-11-05 this workflow printed `DENIED … 400/7500` and threw the message away, which
          # is why an afternoon went into guessing. Capture the message; redact it; publish it.
          # This is NOT the gate: the deploy writes DML (ticket rows), so DML is what must be proven.
          ddl_probe='not-run'
          create_code=$(d1_query 'CREATE TABLE _cf_probe_write_proof (x INTEGER)' "$TMP/create.json")
          if [ "$create_code" = 200 ]; then
            drop_ddl=$(d1_query 'DROP TABLE _cf_probe_write_proof' "$TMP/drop-ddl.json")
            if [ "$drop_ddl" = 200 ]; then ddl_probe='ok:created+dropped'; else ddl_probe="ok:created;drop-http=$drop_ddl"; fi
          else
            ddl_probe="blocked:http=$create_code;cf=$(d1_message "$TMP/create.json")"
            case "$create_code" in
              403) ddl_probe="denied-permission:$ddl_probe" ;;
              400) ddl_probe="request-rejected:$ddl_probe" ;;
            esac
          fi

          # ── The gate: a DML write, because DML is what the deploy actually does ─────────────────
          # One row, one key, deleted immediately and proven gone. The key lives in `probe:` — outside
          # every namespace the A5 L2 ownership audit scans (`ci-e2e-ticket:%`, `TEST ONLY%`, the known
          # synthetic phones), so this probe can never become an unprovable legacy row later.
          probe_key="probe:write-proof:${RUN_ID}"
          # `resource_type` is constrained by the schema itself: 0001_crm_opportunities.sql pins
          # CHECK (resource_type IN ('contact','opportunity')). A first attempt wrote 'probe' and D1
          # answered `CHECK constraint failed … SQLITE_CONSTRAINT_CHECK` — a rejection that proved the
          # write path works (a permission failure is 403/SQLITE_AUTH, never a constraint) while still
          # failing the run. The row below mirrors exactly what the deploy writes: contact +
          # authorized_pending.
          insert_code=$(d1_query "INSERT INTO crm_idempotency_receipts (submission_key, resource_type, resource_id, received_at) VALUES ('${probe_key}', 'contact', 'authorized_pending', strftime('%Y-%m-%dT%H:%M:%fZ','now'))" "$TMP/insert.json")
          if [ "$insert_code" != 200 ]; then
            cf_msg=$(d1_message "$TMP/insert.json")
            case "$insert_code" in
              403) d1_write="denied-permission:insert-http=403;cf=$cf_msg" ;;
              400) d1_write="request-rejected:insert-http=400;cf=$cf_msg" ;;
              *)   d1_write="failed:insert-http=$insert_code;cf=$cf_msg" ;;
            esac
            cleanup='nothing-written'
            outcome='write-not-proven'
            finish
            echo "::error::D1 INSERT was rejected (http $insert_code): $cf_msg"
            exit 1
          fi

          del_code=$(d1_query "DELETE FROM crm_idempotency_receipts WHERE submission_key = '${probe_key}'" "$TMP/del.json")
          cnt_code=$(d1_query "SELECT COUNT(*) AS n FROM crm_idempotency_receipts WHERE submission_key = '${probe_key}'" "$TMP/cnt.json")
          residual=$(jq -r '.result[0].results[0].n // "unreadable"' "$TMP/cnt.json" 2>/dev/null || echo unreadable)
          if [ "$del_code" = 200 ] && [ "$cnt_code" = 200 ] && [ "$residual" = 0 ]; then
            d1_write='ok:insert-delete-proven'
            cleanup='verified-absent'
            outcome='write-proven'
          else
            d1_write="inserted:delete-http=$del_code"
            cleanup="residual-check-failed;http=$cnt_code;rows=${residual}"
            outcome='write-proven-but-cleanup-unverified'
          fi

          # ── Optional: prove Workers Scripts write on a scratch script, deleted immediately ──
          if [ "${WORKER_PROOF_INPUT:-}" = 'PROVE-WORKER-WRITE' ]; then
            scratch_script="cf-write-proof-${RUN_ID}"
            printf '%s\n' \
              'export default { async fetch() { return new Response("ok"); } };' > "$TMP/probe.js"
            w_code=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
              --request PUT --header "$auth_header" \
              --header 'Content-Type: application/javascript' \
              --data-binary "@$TMP/probe.js" --output "$TMP/worker.json" --write-out '%{http_code}' \
              "${API}/accounts/${account_id}/workers/scripts/${scratch_script}" 2>/dev/null || true)
            if [ "${w_code:-000}" = 200 ]; then
              worker_write='created'
            else
              worker_write="denied:create-http=${w_code:-000}"
            fi
            d_code=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
              --request DELETE --header "$auth_header" --output /dev/null --write-out '%{http_code}' \
              "${API}/accounts/${account_id}/workers/scripts/${scratch_script}" 2>/dev/null || true)
            if [ "${d_code:-000}" = 200 ]; then
              worker_write="${worker_write};deleted"
              scratch_script=''
            else
              worker_write="${worker_write};delete-http=${d_code:-000}"
            fi
          fi

          finish

          # Every value printed here is a status word or an HTTP code. The token is never echoed and
          # never reaches a check name: that is exactly how a token fragment escaped into a public
          # run name on 2026-11-04 via a raw stderr tail.
          echo "::notice::CF-WRITE-PROOF outcome=${outcome} d1_write=${d1_write} cleanup=${cleanup} ddl=${ddl_probe} worker_write=${worker_write}"
          {
            echo '## CRM Cloudflare write proof — test database only'
            echo '- Target: `nasr-crm-test-db` (uuid pinned in this file and cross-checked against `scripts/a5-live-support.mjs`).'
            echo '- Production `nasr-market-db` was never a request target.'
            echo "- D1 write (DML, the gate): $d1_write"
            echo "- DDL probe (informational): $ddl_probe"
            echo "- Cleanup: $cleanup"
            echo "- Worker write: $worker_write"
            echo "- Outcome: $outcome"
            echo '- The secret was masked on arrival; its value appears in no log, file, artifact or check name.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${outcome}" != 'write-proven' ]; then
            echo "::error::Write proof did not pass cleanly (outcome=$outcome, cleanup=$cleanup)."
            exit 1
          fi

  report:
    name: 'CF write proof — ${{ needs.proof.outputs.outcome }} — d1=${{ needs.proof.outputs.d1_write }} — ddl=${{ needs.proof.outputs.ddl_probe }} — cleanup=${{ needs.proof.outputs.cleanup }}'
    needs: proof
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The non-secret result is encoded in this check name
        run: echo 'Read this check name on a phone; open the log only for the full status words.'
