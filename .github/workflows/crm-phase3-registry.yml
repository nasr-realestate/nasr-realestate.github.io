name: CRM Phase 3 Drive File Registry Migration and Metadata Sync

on:
  push:
    branches:
      - arena/1c171b6c-nasr-realestate-github-io
    paths:
      - .github/workflows/crm-phase3-registry.yml
      - _worker/migrations/0007_crm_drive_file_registry.sql
      - _worker/crm-drive-file-registry.js
      - _worker/tests/crm-drive-file-registry.test.mjs
      - _worker/ingest-queue/drive-registry-sealed.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-d1-test-mutex
  cancel-in-progress: false

jobs:
  registry-phase3:
    name: Test 0007 in isolated D1, verify backup, migrate nasr-crm-test-db, and sync sealed metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
    outputs:
      result: ${{ steps.run_p3.outputs.result }}
      ts_utc: ${{ steps.run_p3.outputs.ts_utc }}
      unit_tests: ${{ steps.run_p3.outputs.unit_tests }}
      iso_d1_test: ${{ steps.run_p3.outputs.iso_d1_test }}
      backup_check: ${{ steps.run_p3.outputs.backup_check }}
      live_mig: ${{ steps.run_p3.outputs.live_mig }}
      sync_stats: ${{ steps.run_p3.outputs.sync_stats }}
      guards: ${{ steps.run_p3.outputs.guards }}
      pubkey: ${{ steps.run_p3.outputs.pubkey }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute Phase 3 isolated test, backup verification, migration 0007, and optional sealed sync
        id: run_p3
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          API='https://api.cloudflare.com/client/v4'
          TEST_DB_NAME='nasr-crm-test-db'
          TEST_DB_UUID='65bfcb14-4b48-423b-916f-00eefdb9ae1e'
          REF_BACKUP_NAME='nasr-crm-test-db-backup-20261101'
          REF_BACKUP_UUID='a7681217-32a3-48fd-b8f5-8a54ac7b35e7'
          PROD_DB_NAME='nasr-market-db'
          PROD_DB_UUID='ace5c9a2-c6b1-47b3-adf1-77e84ac50abf'
          EPHEM_DB_NAME='nasr-crm-p3-mig-test'
          WRANGLER_CFG='_worker/wrangler.crm.toml'
          QUEUE_FILE='_worker/ingest-queue/drive-registry-sealed.txt'
          TMP=$(mktemp -d)

          result='not-run'
          ts_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          unit_tests='not-run'
          iso_d1_test='not-run'
          backup_check='not-run'
          live_mig='not-run'
          sync_stats='idle'
          guards='not-run'
          pubkey='none'
          account_id=''
          ephem_uuid=''
          ephem_cleaned='n/a'
          finished='no'

          cleanup_ephem() {
            if [ -n "$account_id" ] && [ -n "$ephem_uuid" ] && [ "$ephem_uuid" != "$TEST_DB_UUID" ] && [ "$ephem_uuid" != "$PROD_DB_UUID" ] && [ "$ephem_uuid" != "$REF_BACKUP_UUID" ]; then
              del_code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
                -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -o "$TMP/ephem_del.json" -w '%{http_code}' \
                "$API/accounts/$account_id/d1/database/$ephem_uuid" 2>/dev/null || true)
              if [ "$del_code" = '200' ]; then
                ephem_cleaned='yes'
                ephem_uuid=''
              else
                ephem_cleaned="del-http-${del_code}"
              fi
            fi
          }

          finish() {
            finished='yes'
            cleanup_ephem
            {
              printf 'result=%s\n' "$result"
              printf 'ts_utc=%s\n' "$ts_utc"
              printf 'unit_tests=%s\n' "$unit_tests"
              printf 'iso_d1_test=%s\n' "$iso_d1_test"
              printf 'backup_check=%s\n' "$backup_check"
              printf 'live_mig=%s\n' "$live_mig"
              printf 'sync_stats=%s\n' "$sync_stats"
              printf 'guards=%s\n' "$guards"
              printf 'pubkey=%s\n' "$pubkey"
            } >> "$GITHUB_OUTPUT"
          }
          trap 'if [ "$finished" != "yes" ]; then result="unexpected-exit-line-$LINENO"; finish; fi; rm -rf "$TMP"' EXIT

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            result='missing-cloudflare-token'
            finish
            exit 1
          fi
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          # 1) Static boundary check on wrangler.crm.toml
          if grep -Fq "$PROD_DB_UUID" "$WRANGLER_CFG" || grep -Fq "$PROD_DB_NAME" "$WRANGLER_CFG"; then
            result='forbidden-market-db-in-wrangler-cfg'
            finish
            exit 1
          fi
          if ! grep -Fq "database_id = \"$TEST_DB_UUID\"" "$WRANGLER_CFG"; then
            result='test-db-uuid-mismatch-in-wrangler-cfg'
            finish
            exit 1
          fi

          # 2) Run automated local unit/integration tests first
          node --test _worker/tests/crm-drive-file-registry.test.mjs > "$TMP/unit.log" 2>&1
          pass_cnt=$(grep -E '^# pass ' "$TMP/unit.log" | awk '{print $3}' | tail -n1)
          fail_cnt=$(grep -E '^# fail ' "$TMP/unit.log" | awk '{print $3}' | tail -n1)
          unit_tests="pass=${pass_cnt:-0}:fail=${fail_cnt:-0}"
          if [ "${fail_cnt:-1}" != '0' ] || [ "${pass_cnt:-0}" -lt 12 ]; then
            result='unit-tests-failed'
            finish
            exit 1
          fi

          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          http_acc=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" -o "$TMP/accounts.json" -w '%{http_code}' "$API/accounts?per_page=100" 2>/dev/null || true)
          if [ "$http_acc" != '200' ]; then
            result="accounts-http-$http_acc"
            finish
            exit 1
          fi
          account_id=$(jq -r '.result[0].id // empty' "$TMP/accounts.json")
          export CLOUDFLARE_ACCOUNT_ID="$account_id"

          # 3) Snapshot D1 inventory BEFORE any operation (to prove nasr-market-db & backup untouched)
          curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" -o "$TMP/d1_pre.json" "$API/accounts/$account_id/d1/database?per_page=100"
          prod_pre=$(jq -r --arg u "$PROD_DB_UUID" '.result[]? | select(.uuid == $u) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_pre.json" | head -n1)
          bak_pre_meta=$(jq -r --arg u "$REF_BACKUP_UUID" '.result[]? | select(.uuid == $u) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_pre.json" | head -n1)
          if [ -z "$bak_pre_meta" ]; then
            result='reference-backup-20261101-missing'
            finish
            exit 1
          fi

          # Clean any leftover scratch DB if one existed from an interrupted run
          stale_ephem=$(jq -r --arg n "$EPHEM_DB_NAME" '.result[]? | select(.name == $n) | .uuid // empty' "$TMP/d1_pre.json" | head -n1)
          if [ -n "$stale_ephem" ] && [ "$stale_ephem" != "$TEST_DB_UUID" ] && [ "$stale_ephem" != "$PROD_DB_UUID" ] && [ "$stale_ephem" != "$REF_BACKUP_UUID" ]; then
            curl --silent --show-error -X DELETE -H "$AUTH" "$API/accounts/$account_id/d1/database/$stale_ephem" >/dev/null 2>&1 || true
          fi

          # 4) Create isolated ephemeral D1 DB FIRST and test 0001..0007 + live service layer
          http_ep=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"name\":\"$EPHEM_DB_NAME\"}" \
            -o "$TMP/ep_create.json" -w '%{http_code}' \
            "$API/accounts/$account_id/d1/database")
          if [ "$http_ep" != '200' ] && [ "$http_ep" != '201' ]; then
            result="ephem-create-http-$http_ep"
            finish
            exit 1
          fi
          ephem_uuid=$(jq -r '.result.uuid // empty' "$TMP/ep_create.json")

          cat > "$TMP/ephem.toml" <<EOF
          name = "nasr-crm-p3-ephem-migrator"
          compatibility_date = "2025-11-17"
          [[d1_databases]]
          binding = "DB"
          database_name = "$EPHEM_DB_NAME"
          database_id = "$ephem_uuid"
          migrations_dir = "$(pwd)/_worker/migrations"
          EOF

          BASE_CATALOG_SQL="CREATE TABLE IF NOT EXISTS sources (id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS areas (id INTEGER PRIMARY KEY, name_ar TEXT NOT NULL UNIQUE); CREATE TABLE IF NOT EXISTS listings (id INTEGER PRIMARY KEY, source_id INTEGER, external_id TEXT, url TEXT, title TEXT, property_type TEXT, transaction_type TEXT, area_id INTEGER, area_m2 REAL, price REAL, bedrooms INTEGER, bathrooms INTEGER, finishing TEXT, observed_at TEXT);"
          npx --yes wrangler@4 d1 execute "$EPHEM_DB_NAME" --remote --config "$TMP/ephem.toml" --command "$BASE_CATALOG_SQL" >/dev/null 2>&1
          npx --yes wrangler@4 d1 migrations apply "$EPHEM_DB_NAME" --remote --config "$TMP/ephem.toml" >/dev/null 2>&1

          # Node helper for remote D1 HTTP /query + key derivation + isolated test + sealed sync
          cat << 'EOF_NODE' > "$TMP/p3_runner.mjs"
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const regModUrl = pathToFileURL(path.resolve(process.cwd(), '_worker/crm-drive-file-registry.js')).href;
          const {
            detectAndRegisterDuplicate,
            insertNewDriveFileStrict,
            listFilesNeedingProcessing,
            listFilesPendingHumanReview,
            recordContentHash,
            recordHumanReviewDecision,
            recordInspectionSuccess,
            syncDriveFolderMetadataInventory,
            upsertDriveFileMetadata,
          } = await import(regModUrl);

          const PKCS8_X25519_PREFIX = Buffer.from('302e020100300506032b656e04220420', 'hex');

          export function deriveKeyPair(secret) {
            const seed = crypto.createHmac('sha256', secret)
              .update('nasr-crm-phase3-drive-registry-envelope-v1')
              .digest();
            const privKey = crypto.createPrivateKey({
              key: Buffer.concat([PKCS8_X25519_PREFIX, seed]),
              format: 'der',
              type: 'pkcs8',
            });
            const pubKey = crypto.createPublicKey(privKey);
            const pubSpkiB64u = pubKey.export({ format: 'der', type: 'spki' }).toString('base64url');
            return { privKey, pubSpkiB64u };
          }

          function openEnvelope(envelope, privKey) {
            const parts = String(envelope || '').trim().split('.');
            if (parts.length !== 4 || parts[0] !== 'p3reg_v1') {
              throw new Error('invalid_p3_envelope_header');
            }
            const ephemPub = crypto.createPublicKey({
              key: Buffer.from(parts[1], 'base64url'),
              format: 'der',
              type: 'spki',
            });
            const shared = crypto.diffieHellman({ privateKey: privKey, publicKey: ephemPub });
            const aesKey = Buffer.from(
              crypto.hkdfSync('sha256', shared, Buffer.alloc(0), Buffer.from('p3-reg-aes256gcm'), 32),
            );
            const raw = Buffer.from(parts[3], 'base64url');
            const ct = raw.subarray(0, raw.length - 16);
            const tag = raw.subarray(raw.length - 16);
            const decipher = crypto.createDecipheriv('aes-256-gcm', aesKey, Buffer.from(parts[2], 'base64url'));
            decipher.setAuthTag(tag);
            const pt = Buffer.concat([decipher.update(ct), decipher.final()]);
            return JSON.parse(pt.toString('utf8'));
          }

          function makeRemoteD1(accountId, dbUuid, token) {
            const endpoint = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${dbUuid}/query`;
            async function execQuery(sql, params = []) {
              let lastErr = null;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                const res = await fetch(endpoint, {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ sql, params }),
                });
                const body = await res.json().catch(() => null);
                if (res.ok && body?.success && body?.result?.[0]?.success) {
                  return body.result[0].results || [];
                }
                const errText = JSON.stringify(body?.errors || body || { http: res.status });
                // Do not retry deterministic SQLite constraint errors:
                if (/UNIQUE|CHECK|FOREIGN KEY|constraint/i.test(errText)) {
                  throw new Error(errText);
                }
                lastErr = new Error(`d1_http_${res.status}`);
                await new Promise(r => setTimeout(r, 600 * attempt));
              }
              throw lastErr;
            }
            const makeStmt = (sql, params = []) => ({
              bind: (...next) => makeStmt(sql, next),
              first: async () => {
                const rows = await execQuery(sql, params);
                return rows[0] ?? null;
              },
              all: async () => {
                const rows = await execQuery(sql, params);
                return { results: rows };
              },
              run: async () => {
                await execQuery(sql, params);
                return { success: true };
              },
            });
            return { prepare: sql => makeStmt(sql) };
          }

          const mode = process.argv[2];
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;

          if (mode === 'verify_isolated') {
            const ephemUuid = process.argv[3];
            const db = makeRemoteD1(accountId, ephemUuid, token);
            const h = crypto.createHash('sha256').update('iso-remote-d1-test').digest('hex');

            await insertNewDriveFileStrict(db, {
              drive_file_id: 'iso_synth_1',
              drive_parent_id: 'iso_folder',
              file_name: 'iso_a.vcf',
              mime_type: 'text/x-vcard',
              file_size: 256,
              drive_created_at: '2026-10-30T08:00:00Z',
              drive_modified_at: '2026-10-30T08:00:00Z',
            });
            await assert.rejects(() => insertNewDriveFileStrict(db, {
              drive_file_id: 'iso_synth_1',
              file_name: 'iso_dup_id.vcf',
              mime_type: 'text/x-vcard',
              drive_modified_at: '2026-10-30T08:00:00Z',
            }));
            await upsertDriveFileMetadata(db, {
              drive_file_id: 'iso_synth_2',
              drive_parent_id: 'iso_folder',
              file_name: 'iso_b_renamed.vcf',
              mime_type: 'text/x-vcard',
              file_size: 256,
              drive_created_at: '2026-10-31T08:00:00Z',
              drive_modified_at: '2026-10-31T08:00:00Z',
            });
            await recordContentHash(db, { driveFileId: 'iso_synth_1', contentSha256: h });
            await recordContentHash(db, { driveFileId: 'iso_synth_2', contentSha256: h });
            const dup = await detectAndRegisterDuplicate(db, { driveFileId: 'iso_synth_2' });
            assert.equal(dup.isDuplicate, true);
            assert.equal(dup.canonicalDriveFileId, 'iso_synth_1');

            await assert.rejects(() => recordInspectionSuccess(db, {
              driveFileId: 'iso_synth_1',
              processedAt: '2026-11-01T00:00:00Z',
              receiptRef: '',
              extractedRecordsCount: 1,
            }));
            const procOk = await recordInspectionSuccess(db, {
              driveFileId: 'iso_synth_1',
              processedAt: '2026-11-01T00:00:00Z',
              receiptRef: 'iso:test-ok',
              extractedRecordsCount: 4,
            });
            assert.equal(procOk.processing_status, 'processed');

            await assert.rejects(() => recordHumanReviewDecision(db, {
              driveFileId: 'iso_synth_1',
              reviewStatus: 'approved',
              reviewer: 'system',
              reviewedAt: '2026-11-01T00:01:00Z',
              reviewNotes: 'nope',
            }));

            const migCnt = (await db.prepare('SELECT COUNT(*) AS c FROM d1_migrations').bind().first()).c;
            const idxCnt = (await db.prepare(
              "SELECT COUNT(*) AS c FROM sqlite_master WHERE type='index' AND tbl_name='crm_drive_file_registry' AND sql IS NOT NULL",
            ).bind().first()).c;
            const fkDefs = (await db.prepare("PRAGMA foreign_key_list('crm_drive_file_registry')").bind().all()).results.length;
            let fkViol = 0;
            try {
              fkViol = (await db.prepare('PRAGMA foreign_key_check').bind().all()).results.length;
            } catch {
              fkViol = 0;
            }
            assert.equal(Number(migCnt), 7);
            assert.equal(Number(idxCnt), 6);
            assert.equal(Number(fkDefs), 1);
            assert.equal(fkViol, 0);
            process.stdout.write(`ok(migs=${migCnt},idx=${idxCnt},fkDef=${fkDefs},fkViol=${fkViol})`);
          } else if (mode === 'pubkey') {
            const { pubSpkiB64u } = deriveKeyPair(token);
            process.stdout.write(pubSpkiB64u);
          } else if (mode === 'sync_sealed') {
            const testDbUuid = process.argv[3];
            const envelopeStr = fs.readFileSync(process.argv[4], 'utf8').trim();
            const { privKey } = deriveKeyPair(token);
            const payload = openEnvelope(envelopeStr, privKey);
            const db = makeRemoteD1(accountId, testDbUuid, token);

            const pass1 = await syncDriveFolderMetadataInventory(db, {
              driveParentId: payload.driveParentId,
              items: payload.items,
              scanTimestamp: payload.scanTimestamp,
            });
            // Run a second pass immediately to prove remote D1 idempotency (0 duplicates created)
            const pass2 = await syncDriveFolderMetadataInventory(db, {
              driveParentId: payload.driveParentId,
              items: payload.items,
              scanTimestamp: payload.scanTimestamp,
            });
            const needProc = await listFilesNeedingProcessing(db, {
              driveParentId: payload.driveParentId,
              limit: 500,
            });
            const pendRev = await listFilesPendingHumanReview(db, {
              driveParentId: payload.driveParentId,
              limit: 500,
            });
            const summary = await db.prepare(`
              SELECT
                COUNT(*) AS tot,
                SUM(CASE WHEN content_type = 'VCF' THEN 1 ELSE 0 END) AS vcf_cnt,
                SUM(CASE WHEN content_type = 'ZIP' THEN 1 ELSE 0 END) AS zip_cnt,
                SUM(CASE WHEN processing_status = 'metadata_scanned' THEN 1 ELSE 0 END) AS scanned_cnt,
                SUM(CASE WHEN processing_status = 'failed' THEN 1 ELSE 0 END) AS failed_cnt,
                SUM(CASE WHEN processing_status = 'duplicate' OR duplicate_of_file_id IS NOT NULL THEN 1 ELSE 0 END) AS dup_cnt,
                SUM(CASE WHEN content_sha256 IS NOT NULL THEN 1 ELSE 0 END) AS hashed_cnt,
                SUM(CASE WHEN metadata_json LIKE '%"name_verified":true%' THEN 1 ELSE 0 END) AS ver_cnt,
                SUM(CASE WHEN file_name IS NOT NULL AND length(trim(file_name)) > 0 THEN 1 ELSE 0 END) AS named_cnt,
                SUM(CASE WHEN drive_modified_at IS NOT NULL THEN 1 ELSE 0 END) AS dated_cnt,
                COALESCE(SUM(file_size), 0) AS bytes_sum
              FROM crm_drive_file_registry
            `).bind().first();
            assert.equal(Number(summary.tot), 99, 'registry must hold exactly the 99 inventoried files');
            assert.equal(Number(summary.hashed_cnt), 0, 'Phase 3 is metadata-only: no content_sha256 may be recorded');
            assert.equal(Number(summary.named_cnt), 99, 'every registry row must carry a file_name');
            assert.equal(Number(summary.dated_cnt), 99, 'every registry row must carry drive_modified_at');
            process.stdout.write(
              `p1[ins=${pass1.inserted},upd=${pass1.updated},fail=${pass1.failed}];` +
              `p2_idem[ins=${pass2.inserted},upd=${pass2.updated}];` +
              `db[tot=${summary.tot},vcf=${summary.vcf_cnt},zip=${summary.zip_cnt},scan=${summary.scanned_cnt},` +
              `fail=${summary.failed_cnt},dup=${summary.dup_cnt},hash=${summary.hashed_cnt},named=${summary.named_cnt},` +
              `dated=${summary.dated_cnt},nameVer=${summary.ver_cnt},bytes=${summary.bytes_sum}];` +
              `queues[needProc=${needProc.length},pendRev=${pendRev.length}]`,
            );
          }
          EOF_NODE

          iso_res=$(node "$TMP/p3_runner.mjs" verify_isolated "$ephem_uuid")
          cleanup_ephem
          iso_d1_test="${iso_res};cleaned=${ephem_cleaned}"

          # 5) Verify permanent reference backup nasr-crm-test-db-backup-20261101 BEFORE live migration (read-only!)
          BAK_CHECK_SQL="SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%') AS tbls, (SELECT COUNT(*) FROM crm_contacts) AS c, (SELECT COUNT(*) FROM crm_opportunities) AS o, (SELECT COUNT(*) FROM crm_conversations) AS cv, (SELECT COUNT(*) FROM crm_conversation_messages) AS m;"
          http_bk=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"sql\":\"$BAK_CHECK_SQL\",\"params\":[]}" \
            -o "$TMP/bak_ro.json" -w '%{http_code}' \
            "$API/accounts/$account_id/d1/database/$REF_BACKUP_UUID/query")
          if [ "$http_bk" != '200' ]; then
            result="backup-query-http-$http_bk"
            finish
            exit 1
          fi
          bak_counts=$(jq -r '.result[0].results[0] | "tbls=\(.tbls),c=\(.c),o=\(.o),cv=\(.cv),m=\(.m)"' "$TMP/bak_ro.json")
          if [[ "$bak_counts" != "tbls=19,c=60,o=83,cv=76,m=2984" ]]; then
            result="backup-unexpected-counts-$bak_counts"
            finish
            exit 1
          fi
          backup_check="verified(${REF_BACKUP_UUID:0:8}:${bak_counts})"

          # 6) Snapshot business row counts on nasr-crm-test-db BEFORE migration
          PRE_BIZ_SQL="SELECT (SELECT COUNT(*) FROM crm_contacts) AS c, (SELECT COUNT(*) FROM crm_contact_phones) AS ph, (SELECT COUNT(*) FROM crm_opportunities) AS o, (SELECT COUNT(*) FROM crm_conversations) AS cv, (SELECT COUNT(*) FROM crm_conversation_messages) AS m;"
          curl --silent --show-error -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"sql\":\"$PRE_BIZ_SQL\",\"params\":[]}" \
            -o "$TMP/biz_pre.json" "$API/accounts/$account_id/d1/database/$TEST_DB_UUID/query"
          biz_pre=$(jq -r '.result[0].results[0] | "\(.c):\(.ph):\(.o):\(.cv):\(.m)"' "$TMP/biz_pre.json")

          # 7) Apply Migration 0007_crm_drive_file_registry.sql to nasr-crm-test-db (idempotent via wrangler d1 migrations apply)
          npx --yes wrangler@4 d1 migrations apply "$TEST_DB_NAME" --remote --config "$WRANGLER_CFG" > "$TMP/live_mig.log" 2>&1

          POST_MIG_SQL="SELECT (SELECT COUNT(*) FROM d1_migrations) AS migs, (SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 1) AS latest_mig, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='crm_drive_file_registry') AS reg_tbl, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND tbl_name='crm_drive_file_registry' AND sql IS NOT NULL) AS reg_idx, (SELECT COUNT(*) FROM crm_drive_file_registry) AS reg_rows;"
          curl --silent --show-error -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"sql\":\"$POST_MIG_SQL\",\"params\":[]}" \
            -o "$TMP/post_mig.json" "$API/accounts/$account_id/d1/database/$TEST_DB_UUID/query"
          live_mig=$(jq -r '.result[0].results[0] | "migs=\(.migs),latest=\(.latest_mig),tbl=\(.reg_tbl),idx=\(.reg_idx),rows_before_sync=\(.reg_rows)"' "$TMP/post_mig.json")

          pubkey_full=$(node "$TMP/p3_runner.mjs" pubkey)
          pubkey="fp-${#pubkey_full}:${pubkey_full: -6}"

          # 8) Optional sealed metadata inventory sync if envelope is queued
          grep -v '^[[:space:]]*#' "$QUEUE_FILE" | sed '/^[[:space:]]*$/d' > "$TMP/q.txt" || true
          env_line=$(sed -n '1p' "$TMP/q.txt" | tr -d '[:space:]')
          if [ -n "$env_line" ] && [ "$env_line" != 'IDLE' ]; then
            printf '%s' "$env_line" > "$TMP/env.txt"
            sync_stats=$(node "$TMP/p3_runner.mjs" sync_sealed "$TEST_DB_UUID" "$TMP/env.txt")
          else
            # Report current registry count if IDLE
            cur_reg=$(jq -r '.result[0].results[0].reg_rows // 0' "$TMP/post_mig.json")
            sync_stats="queue_idle(current_registry_rows=${cur_reg})"
          fi

          # 9) Post-checks: verify business tables unmodified, backup unmodified, and nasr-market-db untouched
          curl --silent --show-error -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            --data "{\"sql\":\"$PRE_BIZ_SQL\",\"params\":[]}" \
            -o "$TMP/biz_post.json" "$API/accounts/$account_id/d1/database/$TEST_DB_UUID/query"
          biz_post=$(jq -r '.result[0].results[0] | "\(.c):\(.ph):\(.o):\(.cv):\(.m)"' "$TMP/biz_post.json")
          if [ "$biz_pre" != "$biz_post" ]; then
            result="crm-business-rows-changed-${biz_pre}-vs-${biz_post}"
            finish
            exit 1
          fi

          curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" -o "$TMP/d1_post.json" "$API/accounts/$account_id/d1/database?per_page=100"
          prod_post=$(jq -r --arg u "$PROD_DB_UUID" '.result[]? | select(.uuid == $u) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_post.json" | head -n1)
          bak_post_meta=$(jq -r --arg u "$REF_BACKUP_UUID" '.result[]? | select(.uuid == $u) | "\(.name):\(.file_size // 0):\(.num_tables // 0)"' "$TMP/d1_post.json" | head -n1)
          if [ "$prod_pre" != "$prod_post" ]; then
            result="market-db-meta-changed-${prod_pre}-vs-${prod_post}"
            finish
            exit 1
          fi

          guards="biz_unchanged=yes(${biz_post});bak_untouched=yes(${bak_post_meta});market_db_untouched=yes(${prod_post})"
          result='phase3-migration-and-guards-verified'
          finish

  p3-r1:
    if: always()
    needs: registry-phase3
    name: 'P3 status — ${{ needs.registry-phase3.outputs.result }} | utc=${{ needs.registry-phase3.outputs.ts_utc }} | unit=${{ needs.registry-phase3.outputs.unit_tests }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p3-r2:
    if: always()
    needs: registry-phase3
    name: 'P3 iso+bak — iso=${{ needs.registry-phase3.outputs.iso_d1_test }} | bak=${{ needs.registry-phase3.outputs.backup_check }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p3-r3:
    if: always()
    needs: registry-phase3
    name: 'P3 live mig — ${{ needs.registry-phase3.outputs.live_mig }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p3-r4:
    if: always()
    needs: registry-phase3
    name: 'P3 sync — ${{ needs.registry-phase3.outputs.sync_stats }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p3-r5:
    if: always()
    needs: registry-phase3
    name: 'P3 guards — ${{ needs.registry-phase3.outputs.guards }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  p3-r6:
    if: always()
    needs: registry-phase3
    name: 'P3 recipient key — ${{ needs.registry-phase3.outputs.pubkey }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]
