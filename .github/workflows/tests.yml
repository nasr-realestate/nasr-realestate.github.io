# ══════════════════════════════════════════════════════════════════════
# بوابة اختبارات Worker/الصفحة — كانت غائبة تمامًا قبل 2026-10-14
# ────────────────────────────────────────────────────────────────────
# لماذا هذا الملف: لا job واحد في CI كان يشغّل _worker/tests/*.test.mjs
# (فقط properties-sync.test.mjs داخل deploy-properties-sync.yml)، فمرّت
# إخفاقات v9.3 على الصفحة (9 اختبارات) دون أن يوقفها أي شيء قبل النشر.
#
# القاعدة هنا (محدَّثة 2026-10-18):
#   • لا إخفاقات معروفة ولا استثناءات: الإخفاقان القديمان (نص الترحيب
#     وشريط الحالة) أُصلحا في المحور هـ، والسويت كاملة خضراء محليًا
#     (358 اختبارًا، 0 فشل). أي فشل — قديم أو جديد — يُسقط البناء فورًا.
#   • لا نستخدم --test-skip-pattern بعد الآن حتى لا يختفي فشل مستقبلي بصمت.
# ══════════════════════════════════════════════════════════════════════
name: Worker & page tests

on:
  push:
    branches: ["master", "main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # التبعيات هنا للتطوير/الاختبار فقط (server.js واختبار تكافؤ قارئ
      #    front matter) — وخطوة نشر الموقع (deploy.yml) لا تحتاج npm إطلاقًا.
      #    `npm ci` يثبّت الإصدارات من package-lock.json المحفوظ (2026-10-16)
      #    بدلاً من خطوة غير محدودة الإصدارات تُندّد بها SonarCloud (S6505).
      - name: Install dev dependencies for the local renderer
        run: npm ci --no-audit --no-fund --ignore-scripts

      # طبقة الذكاء تُنشر من مخرَج deploy.yml (الذي يعيد توليدها داخل _site)،
      # فهذا الفحص يمنع أن تبقى النسخة المحفوظة في الجذر قديمة بعد أي تعديل على
      # _properties أو على أدوات المُولّد. بلا npm: المُولّد مستقل.
      - name: AI artifacts committed at the root must match the generator
        run: node scripts/check-ai-artifacts-in-sync.mjs

      - name: Blocking suite — every test, no skips
        run: |
          node --test $(ls _worker/tests/*.test.mjs scripts/tests/*.test.mjs | tr '\n' ' ')

      # بوابة منفصلة وحاجزة لطبقة الذكاء الاصطناعي: هذه هي المخرجات التي
      # يقرأها الذكاء الاصطناعي، ولا يجوز أن تُنشر متناقضة مع المصدر.
      - name: AI layer + front-matter parity (blocking, no skips)
        run: |
          node --test _worker/tests/ai-artifacts.test.mjs _worker/tests/mcp-gateway.test.mjs scripts/tests/front-matter.test.mjs
