# ═══════════════════════════════════════════════════════════════════════════
#  price-snapshots-audit — جرد جدول الأسعار (قراءة فقط، بلا أي كتابة)
# ═══════════════════════════════════════════════════════════════════════════
#  السؤال الذي أُنشئ له (2026-11-17):
#    محرّك التقييم (`noisy-bush-fd84`) يحسب من `price_snapshots`. وقياس المستودع:
#    لا يوجد ولا مسار كتابة واحد لهذا الجدول ولا لجدول `areas` في أي ملف كود.
#    فإما أن جدولًا يُغذَّى يدويًا، أو بسكربت خارج المستودع، أو أنه **واقف**.
#    جواب هذا السؤال يحدد ما إذا كان أول إصلاح حقيقي هو مصدر الأسعار أم غيره.
#
#  الأمان — مقصود ومقيَّد:
#    • SELECT فقط. الحاجز أدناه يرفض أي جملة لا تبدأ بـSELECT، وأي كلمة كتابة
#      ككلمة كاملة، وأي `;` (منع التسلسل). نفس نمط crm-daily-kpi.
#    • كل استعلام يجري عبر endpoint واحد (POST /d1/database/<uuid>/query).
#    • المعرّف المُستهدف مُثبَّت في الكود: nasr-market-db فقط، وقاعدة CRM مرفوضة
#      صراحةً حتى لو غيّر أحد الثابت بالخطأ.
#    • لا يُطبع أي حقل نصي حر: الجرد أعداد وتواريخ وتجميعات، بلا عنوان ولا وصف.
#
#  التشغيل: يدوي فقط (workflow_dispatch). لا push trigger — بقصد.
# ═══════════════════════════════════════════════════════════════════════════
name: Price snapshots audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: write   # فقط لنشر تقرير الأرقام على فرع ci/price-audit

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Count rows, freshness and per-area coverage of price_snapshots
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_TOKEN غير مضبوط في أسرار المستودع"
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_TOKEN"
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer ${CLOUDFLARE_TOKEN}"

          # المعرّف المُستهدف: قاعدة العقارات والأسعار. قاعدة CRM مرفوضة صراحةً.
          MARKET_DB=ace5c9a2-c6b1-47b3-adf1-77e84ac50abf
          CRM_DB=760079c6-85f9-4a30-aa19-9a66f95d421a
          if [ "$MARKET_DB" = "$CRM_DB" ]; then
            echo "::error::الثابتان متطابقان — رفض التنفيذ"
            exit 1
          fi

          # ── حاجز القراءة فقط (كلمات كاملة لا سلاسل فرعية) ──
          assert_read_only() {
            local sql="$1" upper
            upper=$(printf '%s' "$sql" | tr '[:lower:]' '[:upper:]')
            case "$upper" in
              SELECT*) : ;;
              *) echo "::error::الحاجز رفض جملة ليست SELECT"; return 1 ;;
            esac
            if printf '%s' "$upper" | grep -Eq '(^|[^A-Z_])(INSERT|UPDATE|DELETE|DROP|ALTER|CREATE|PRAGMA|ATTACH|DETACH|VACUUM|REPLACE|TRUNCATE)([^A-Z_]|$)'; then
              echo "::error::الحاجز وجد كلمة كتابة"
              return 1
            fi
            case "$sql" in
              *';'*) echo "::error::الحاجز رفض جملة متسلسلة"; return 1 ;;
            esac
            return 0
          }

          account_id=$(curl -sS -m 25 -H "$AUTH" "$API/accounts?per_page=100" | jq -r '.result[0].id // empty')
          if [ -z "$account_id" ]; then
            echo "::error::GET /accounts غير قابل للقراءة بهذا المفتاح"
            exit 1
          fi

          q() { # q "<SELECT>" "<label>"
            local sql="$1" label="$2" out http
            assert_read_only "$sql" || exit 1
            out="$RUNNER_TEMP/q.json"
            http=$(curl -sS -m 45 -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg s "$sql" '{sql:$s}')" \
              -o "$out" -w '%{http_code}' \
              "$API/accounts/${account_id}/d1/database/${MARKET_DB}/query" 2>/dev/null || echo 000)
            if [ "$http" != 200 ]; then
              echo "::error::${label}: http=${http} $(jq -r '.errors[0].message // "-"' "$out" 2>/dev/null | head -c 200)"
              return 1
            fi
            line=$(jq -c '.result[0].results // []' "$out")
            echo "--- ${label}"
            echo "$line"
            # يُجمع في تقرير يظهر في ملخص التشغيل — سجل الـjob محجوب عن بعض
            # القارئات (شبكة)، والملخص مسار قراءة مضمون.
            printf '**%s**\n\n```json\n%s\n```\n\n' "$label" "$line" >> "$REPORT"
          }

          REPORT="$RUNNER_TEMP/report.md"
          : > "$REPORT"
          printf '# جرد جدول الأسعار · %s\n\n' "$(date -u +%FT%TZ)" >> "$REPORT"
          echo "=== price_snapshots audit · $(date -u +%FT%TZ) ==="

          q "SELECT COUNT(*) AS rows_total FROM price_snapshots" "rows_total" || exit 1
          q "SELECT COUNT(DISTINCT area_id) AS areas_with_prices FROM price_snapshots" "areas_with_prices" || exit 1
          q "SELECT COUNT(*) AS areas_table_rows FROM areas" "areas_table_rows" || exit 1
          q "SELECT COUNT(*) AS listings_source9 FROM listings WHERE source_id = 9" "listings_source9" || exit 1

          # عمود الوقت قد يكون observed_at أو تاريخًا آخر — نجرّبه ونتراجع بهدوء.
          q "SELECT MIN(observed_at) AS oldest, MAX(observed_at) AS newest FROM price_snapshots" "freshness_observed_at" \
            || echo "(observed_at غير موجود أو غير قابل للتجميع — يُجرَّب الاسم التالي)"

          q "SELECT substr(observed_at,1,7) AS month, COUNT(*) AS n FROM price_snapshots GROUP BY month ORDER BY month DESC LIMIT 12" "rows_per_month" || true

          q "SELECT area_id, COUNT(*) AS n FROM price_snapshots GROUP BY area_id ORDER BY n DESC LIMIT 40" "rows_per_area_top40" || true

          q "SELECT COUNT(*) AS n FROM price_snapshots WHERE observed_at >= date('now','-30 day')" "rows_last_30_days" || true

          echo "=== end ==="
          {
            echo "## جرد جدول الأسعار (قراءة فقط)"
            echo
            cat "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

      # سجل الـjob وملخص التشغيل غير قابلين للقراءة من كل قارئ (شبكة).
      # فيُنشر التقرير على فرع مستقل — قراءة عبر git تعمل دائمًا.
      # لا يلمس master ولا أي ملف مصدر.
      - name: Publish the audit report to ci/price-audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/pub"
          cp "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/pub/price-snapshots-audit.md"
          printf '\n---\n\nrun: %s · commit: %s · %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" >> "$RUNNER_TEMP/pub/price-snapshots-audit.md"
          cd "$RUNNER_TEMP/pub"
          git init -q -b ci/price-audit
          git config user.name  "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add price-snapshots-audit.md
          git commit -q -m "جرد جدول الأسعار — run ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci/price-audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
