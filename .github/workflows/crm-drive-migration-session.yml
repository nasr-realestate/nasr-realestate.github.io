name: CRM Drive Migration Session — 0010 anchor bootstrap and ledger verification

# The execution half of CRM_PHASE2_DRIVE_MIGRATION_PLAN.md. Steps 4-7 (generate the bootstrap, verify it is
# one column, apply it, re-run 0010 §5, require status_without_version = 0) and step 9 (constraints, triggers,
# integrity) run here because this runner is the only place that can reach Cloudflare: the agent sandbox has
# no route to api.cloudflare.com by design.
#
# Why the seed is applied in CI even though it inlines real Drive ids: `wrangler d1 execute --file` echoes the
# statements it runs, and an error path would put customer-owned identifiers in a log that outlives the job.
# So every write log is redirected to a file that is only ever *counted* (never printed), nothing is uploaded
# as an artifact, and the worktree is asserted clean at the end. The human review of the seed's CONTENT is
# replaced by something stronger than eyeballing a 99-line file: the plan's digest (`ref_sha256_of_all_anchored`)
# is recomputed from a fresh export after the write, so the stored anchors are proven equal to the reviewed
# ones without any identifier leaving the database. D1 has no SHA-256, so no engine-side check could do that.
#
# `preflight` is read-only and answers the plan's disqualifiers. `bootstrap` performs steps 4-7. `verify`
# performs step 9. All three hold `crm-d1-test-mutex`, so a migration session cannot interleave with the
# registry/analysis jobs that write to the same database.

# `workflow_dispatch` is the natural trigger for a one-shot session and is kept for a human with the UI.
# It is not reachable from this repository's automation token: POST .../dispatches answers
# 403 "Resource not accessible by integration" (the installation has contents/pull-requests but not Actions),
# so a push is the only execution channel the agent has. `.crm/migration-session-mode` carries the mode:
# one word, reviewable in the diff, and pushing it is the approval gesture. `git revert` of that one-line
# commit is the stop lever, and no mode other than the three below can be requested by file content.
on:
  push:
    # `arena/**`, not one session's branch name. A gate pinned to a name is a gate that goes silent the
    # moment the session that pinned it merges and the next session works on a new branch — which is exactly
    # how this file's isolated D1 verification sat untriggered while its checks still looked green (§2.7 of
    # CRM_PHASE2_DRIVE_MIGRATION_PLAN.md). What bounds this job is not the branch: it is the target-database
    # allowlist, the `nasr-market-db` prohibition, the guards that prove nothing else moved, and the fact
    # that `crm-cloudflare-test-deploy.yml` stays workflow_dispatch-only. So no branch edit can turn this
    # into a deploy, and no branch edit can make it write to production.
    branches:
      - "arena/**"
    paths:
      - .crm/migration-session-mode
      - .github/workflows/crm-drive-migration-session.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight = read-only probes · bootstrap-plan = generate the seed and stop · bootstrap = plan steps 4-7 and apply · verify = plan step 9'
        required: true
        default: 'preflight'
        type: choice
        options:
          - preflight
          - bootstrap-plan
          - bootstrap
          - verify

permissions:
  contents: read

concurrency:
  # One group across every job that can touch nasr-crm-test-db, so nothing interleaves with a write.
  # `cancel-in-progress: false` protects a run that has started; it does nothing for a run that is still
  # waiting. GitHub cancels a *waiting* request in a shared group when it decides another pending request
  # has higher priority — seen on 2026-11-02 at c3cd6c9, where this job and crm-phase4-review were both
  # ended 2 seconds after the push with "Canceling since a higher priority waiting request for
  # crm-d1-test-mutex exists" and no job ever created. Nothing was written by that, because nothing ran,
  # which is the only reason it was harmless. Operationally: a migration session is pushed when the group is
  # idle rather than alongside four other test-db jobs, and a `cancelled` session is read as "it did not
  # happen" — never as a result, and never retried without reading the `Session *` check names first.
  group: crm-d1-test-mutex
  cancel-in-progress: false

jobs:
  session:
    name: Run the migration session against nasr-crm-test-db only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
    outputs:
      result: ${{ steps.session.outputs.result }}
      probe: ${{ steps.session.outputs.probe }}
      seed_plan: ${{ steps.session.outputs.seed_plan }}
      seed_apply: ${{ steps.session.outputs.seed_apply }}
      ledger: ${{ steps.session.outputs.ledger }}
      verify: ${{ steps.session.outputs.verify }}
      guards: ${{ steps.session.outputs.guards }}
      digests: ${{ steps.session.outputs.digests }}
      approval: ${{ steps.session.outputs.approval }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The approval pin is checked with git objects -- `cat-file -e <plan_head>`,
          # `merge-base --is-ancestor`, and `diff --quiet <plan_head> HEAD -- <guarded paths>`. The default
          # `fetch-depth: 1` gives the job one commit, so all three fail for a reason that has nothing to do
          # with the plan: the run at 2dd0469 matched every digest and every counter and was still refused,
          # because the reviewed head was not present to be looked at. Fetching the history is what lets the
          # check answer at all; the check itself is unchanged, and it stays fatal. Only this job needs the
          # history -- the report jobs publish from outputs and never read the repository.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preflight, bootstrap, and verify (one mode per run)
        id: session
        shell: bash
        # `env`, never inline: a property holding an expression is expression-rendered and capped at 21,000
        # characters (run 41517416869 died on exactly that in the sibling backup workflow), and this script
        # is already 20,241 characters long. One more guard written inline would have broken the migration
        # session for a reason that has nothing to do with the migration.
        env:
          SESSION_MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          umask 077
          API='https://api.cloudflare.com/client/v4'
          TEST_DB_NAME='nasr-crm-test-db'
          TEST_DB_UUID='65bfcb14-4b48-423b-916f-00eefdb9ae1e'
          PROD_DB_NAME='nasr-market-db'
          PROD_DB_UUID='ace5c9a2-c6b1-47b3-adf1-77e84ac50abf'
          REF_BACKUP_NAME='nasr-crm-test-db-backup-20261101'
          REF_BACKUP_UUID='a7681217-32a3-48fd-b8f5-8a54ac7b35e7'
          WRANGLER_CFG='_worker/wrangler.crm.toml'
          QUEUE_FILE='_worker/ingest-queue/drive-registry-sealed.txt'
          MODE="$SESSION_MODE_INPUT"
          case "$MODE" in preflight|bootstrap-plan|bootstrap|verify) : ;; *) MODE='' ;; esac
          if [ -z "$MODE" ] && [ -f .crm/migration-session-mode ]; then
            MODE=$(tr -d '[:space:]' < .crm/migration-session-mode)
          fi
          case "$MODE" in
            preflight|bootstrap-plan|bootstrap|verify) : ;;
            *) echo "::error::no usable mode: the dispatch input or .crm/migration-session-mode must say preflight, bootstrap-plan, bootstrap or verify"
               exit 1 ;;
          esac
          TMP=$(mktemp -d)
          export SESSION_TMP="$TMP"
          export SESSION_MODE="$MODE"

          # `d1 execute` is the only command in this job that changes a database. In review mode a call to
          # it is a bug, so the command is watched and counted rather than trusted to be absent: the count
          # is published with the review key, and a non-zero count fails the run. Reads (`d1 export`) are
          # untouched, because the plan is derived from a fresh export and must keep being so.
          d1_writes=0
          if [ "$MODE" = 'bootstrap-plan' ]; then
            npx() {
              case " $* " in
                *"d1 execute"*)
                  d1_writes=$((d1_writes + 1))
                  echo "::error::review mode attempted a database write" >&2
                  return 97
                  ;;
              esac
              command npx "$@"
            }
          fi

          result='not-run'
          probe='not-run'
          seed_plan='not-run'
          seed_apply='not-run'
          ledger='not-run'
          verify='not-run'
          guards='not-run'
          digests='not-run'
          approval='no-write-attempted(review mode)'
          finished='no'

          finish() {
            finished='yes'
            # counts and digests only — never an identifier, never a filename, never a log body
            {
              printf 'result=%s\n' "$result"
              printf 'probe=%s\n' "$probe"
              printf 'seed_plan=%s\n' "$seed_plan"
              printf 'seed_apply=%s\n' "$seed_apply"
              printf 'ledger=%s\n' "$ledger"
              printf 'verify=%s\n' "$verify"
              printf 'guards=%s\n' "$guards"
              printf 'digests=%s\n' "$digests"
              printf 'approval=%s\n' "$approval"
            } >> "$GITHUB_OUTPUT"
            rm -rf "$TMP"
          }
          trap 'if [ "$finished" != "yes" ]; then result="unexpected-exit-line-$LINENO"; finish; fi' EXIT
          fail() {
            # `$1` is a reason code composed by this script, never a captured program output
            echo "::error::${1}"
            result="$1"
            finish
            exit 1
          }

          case "$MODE" in
            preflight|bootstrap-plan|bootstrap|verify) : ;;
            *) fail "unknown-mode" ;;
          esac

          # ---- 0) the boundaries that make this run about the test database and nothing else ----
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            fail "missing-cloudflare-token"
          fi
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          if grep -Fq "$PROD_DB_UUID" "$WRANGLER_CFG" || grep -Fq "$PROD_DB_NAME" "$WRANGLER_CFG"; then
            fail "forbidden-market-db-in-wrangler-cfg"
          fi
          if ! grep -Fq "database_id = \"$TEST_DB_UUID\"" "$WRANGLER_CFG"; then
            fail "test-db-uuid-mismatch-in-wrangler-cfg"
          fi
          for script in scripts/crm/drive-registry-envelope.mjs scripts/crm/seed-drive-file-refs.mjs \
                        scripts/crm/verify-phase3-metadata-boundary.mjs; do
            if ! node "$script" selftest | tail -1 | grep -q ALL_HELD; then
              node "$script" selftest || true
              fail "local-gate-unheld:$(basename "$script")"
            fi
          done
          if [ "$MODE" = 'bootstrap' ] || [ "$MODE" = 'bootstrap-plan' ]; then
            # the plan's first disqualifier: never interleave a schema session with a queued content pass
            if ! node scripts/crm/drive-registry-envelope.mjs inspect --in "$QUEUE_FILE" | grep -q 'IDLE'; then
              fail "sealed-queue-not-idle"
            fi
          fi

          # ---- 1) token → account → the databases this job is allowed to see ----
          account_id=$(curl --silent --show-error --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$API/accounts" | jq -r '.result[0].id // empty')
          [ -n "$account_id" ] || fail "account-id-unreadable"
          export CLOUDFLARE_ACCOUNT_ID="$account_id"
          curl --silent --show-error --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o "$TMP/d1_pre.json" "$API/accounts/$account_id/d1/database?per_page=100"
          if ! jq -e --arg id "$TEST_DB_UUID" --arg n "$TEST_DB_NAME" \
            '.result[] | select(.name == $n and .uuid == $id)' "$TMP/d1_pre.json" > /dev/null; then
            fail "test-db-not-in-account"
          fi
          # `name:file_size` only: the D1 *list* payload does not carry `num_tables`, and printing
          # `nasr-market-db:909312:0` reads as "the production database is empty" when the number is simply
          # not reported. Object counts come from queries (see `verify`), not from an absent field.
          market_pre=$(jq -r --arg u "$PROD_DB_UUID" \
            '.result[] | select(.uuid == $u) | "\(.name):\(.file_size // 0)"' "$TMP/d1_pre.json" | head -n1)
          bak_pre=$(jq -r --arg u "$REF_BACKUP_UUID" \
            '.result[] | select(.uuid == $u) | "\(.name):\(.file_size // 0)"' "$TMP/d1_pre.json" | head -n1)
          [ -n "$market_pre" ] || fail "market-db-meta-unreadable"
          [ -n "$bak_pre" ] || fail "reference-backup-meta-unreadable"

          # ---- 2) the runner: every decision comes from the reviewed modules, not from shell arithmetic ----
          cat > "$TMP/runner.mjs" <<'EOF_NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const TMP = process.env.SESSION_TMP;
          const MODE = process.env.SESSION_MODE;
          const API = 'https://api.cloudflare.com/client/v4';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const dbUuid = '65bfcb14-4b48-423b-916f-00eefdb9ae1e';

          const seedUrl = pathToFileURL(path.resolve(process.cwd(), 'scripts/crm/seed-drive-file-refs.mjs')).href;
          const boundUrl = pathToFileURL(path.resolve(process.cwd(), 'scripts/crm/verify-phase3-metadata-boundary.mjs')).href;
          const {
            buildSeedPlan, extractBackfillSql, renderSeedSql, resolveMigrationPath, summarizeSeed,
          } = await import(seedUrl);
          const {
            evaluatePhase3Boundary, LEDGER_PROBE_SQL, migrationProbeSql, registryProvenanceSql,
          } = await import(boundUrl);

          const ENDPOINT = `${API}/accounts/${account}/d1/database/${dbUuid}/query`;

          // The read path is provably read-only: everything this runner sends must be a SELECT or a PRAGMA.
          // The two writes of the session go through `wrangler d1 execute --file` in the shell above, from
          // files this job can inspect before applying them — so "the runner cannot corrupt anything" is a
          // property of the code, not a promise in a comment.
          function assertReadOnly(sql) {
            const t = String(sql).trim().replace(/;+$/, '');
            if (!/^(SELECT|PRAGMA)\b/i.test(t) || /\b(INSERT|UPDATE|DELETE|DROP|ALTER|ATTACH|REPLACE)\b/i.test(t)) {
              throw new Error('RUNNER_REFUSES_NON_READ_ONLY_SQL');
            }
            return t;
          }

          async function query(sql) {
            const statement = assertReadOnly(sql);
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const res = await fetch(ENDPOINT, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ sql: `${statement};`, params: [] }),
              });
              const body = await res.text();
              if (!res.ok) {
                if (attempt === 3) throw new Error(`D1_QUERY_HTTP_${res.status}`);
                await new Promise(r => setTimeout(r, 1500 * attempt));
                continue;
              }
              const json = JSON.parse(body);
              const failure = (json.errors ?? [])[0];
              if (failure) throw new Error(`D1_QUERY_ERROR_${String(failure.code ?? 'unknown')}`);
              return json.result?.[0]?.results ?? [];
            }
            return [];
          }
          const one = async sql => (await query(sql))[0] ?? {};

          const sha12 = text => createHash('sha256').update(text).digest('hex').slice(0, 12);

          async function probe() {
            // one source of truth for the SQL: scripts/crm/verify-phase3-metadata-boundary.mjs, whose probes
            // are executed against the real schema in _worker/tests/ before this job ever runs
            const ledger = Number((await one(LEDGER_PROBE_SQL)).n ?? 0) > 0;
            const P = migrationProbeSql({ withLedger: ledger });
            const regSql = await one(P.registryHasRef);
            const counts = await one(P.counts);
            const needs = await one(P.needsBootstrap);
            const svv = await one(P.violations);
            const out = {
              ledger, has_ref: Number(regSql.c ?? 0) > 0,
              migs: Number(counts.migs ?? 0), latest: String(counts.latest ?? ''),
              rows_all: Number(counts.rows_all ?? 0), fp: Number(counts.fp ?? 0),
              proc: Number(counts.proc ?? 0), other: Number(counts.other ?? 0),
              needs_bootstrap: Number(needs.n ?? 0),
              svv: Number(svv.status_without_version ?? -1), ctr: Number(svv.counter_mismatches ?? -1),
              dang: Number(svv.dangling_heads ?? -1), gaps: Number(svv.seq_gaps ?? -1),
            };
            // The disqualifiers from §3 of the plan, evaluated on what the database reports right now — not on
            // what this branch's git log suggests. A ledger without the promotion, a promotion without its
            // column, or an empty registry are all reasons to stop before a single write is planned.
            if (out.ledger && !/0010_crm_drive_file_versions/.test(out.latest) && out.migs < 10) {
              throw new Error('LEDGER_PRESENT_WITHOUT_PROMOTION');
            }
            if (out.has_ref && !out.ledger) throw new Error('DRIVE_REF_COLUMN_WITHOUT_LEDGER_TABLE');
            if (out.rows_all === 0) throw new Error('EMPTY_REGISTRY: there is nothing to migrate, and an empty run is not a pass');
            if (out.fp === 0) throw new Error('NO_FINGERPRINTS_YET: 0010 would backfill nothing; the content phase has not run here');
            if (out.fp + out.other !== out.rows_all) {
              throw new Error(`ROW_ACCOUNTING_MISMATCH: ${out.fp}+${out.other} vs ${out.rows_all} — a status outside the known set`);
            }
            fs.writeFileSync(path.join(TMP, 'probe.json'), JSON.stringify(out), { mode: 0o600 });
            console.log(`migs=${out.migs},latest=${out.latest.replace(/\.sql$/, '')},ledger=${out.ledger ? 'yes' : 'no'},`
              + `ref_col=${out.has_ref ? 'yes' : 'no'},rows=${out.rows_all},fp=${out.fp},proc=${out.proc},`
              + `needs_bootstrap=${out.needs_bootstrap}`
              + (out.ledger ? `,svv=${out.svv},ctr=${out.ctr},dang=${out.dang},gaps=${out.gaps}` : ',svv=n/a'));
            // The plan run is held to the same disqualifiers as the apply run: a seed planned against a
            // database that does not have the ledger yet is not a reviewable artifact, it is a mistake that
            // happens to be readable. Review before write only means something if what is reviewed is what
            // would have been written.
            if (MODE === 'bootstrap' || MODE === 'bootstrap-plan') {
              if (!out.ledger) throw new Error('ABORT_BOOTSTRAP_WITHOUT_0010');
              if (out.svv < 0 || out.ctr < 0 || out.dang < 0 || out.gaps < 0) {
                throw new Error('LEDGER_COUNTERS_UNREADABLE');
              }
              if (out.needs_bootstrap === 0 && out.svv > 0) {
                throw new Error(`ANCHORED_BUT_UNREVIEWABLE: ${out.svv} rows still have no version — §5 has not been re-run`);
              }
            }
            return out;
          }

          async function rows() {
            // the four columns the seeder reads, and nothing else — no name, no path, no receipt
            return query(migrationProbeSql({ withLedger: true }).seedRows);
          }

          async function plan() {
            const found = await rows();
            fs.writeFileSync(path.join(TMP, 'reg1.json'), JSON.stringify({ results: found }), { mode: 0o600 });
            const built = buildSeedPlan(found);
            const summary = summarizeSeed(built);
            if (summary.conflicts > 0) throw new Error(`ANCHOR_CONFLICTS_${summary.conflicts}: investigate, never overwrite`);
            if (summary.refused > 0) throw new Error(`ANCHOR_REFUSED_${summary.refused}: a drive_file_id the seeder will not inline`);
            if (summary.anchored === 0 && summary.already_anchored === 0) throw new Error('NOTHING_TO_ANCHOR: the export read zero rows');
            const sqlText = renderSeedSql(built);
            fs.writeFileSync(path.join(TMP, 'seed.sql'), sqlText, { mode: 0o600 });
            fs.writeFileSync(path.join(TMP, 'plan.json'), JSON.stringify({
              digest: summary.ref_sha256_of_all_anchored, anchored_rows: summary.anchored_rows,
              statements: summary.anchored,
              // The full sha of the exact bytes written above. node hashes the string it rendered and the
              // shell hashes the file; the two must agree, and the approval file pins both. A 12-hex
              // prefix can catch accidental drift inside one run, but it cannot be compared across runs
              // and cannot carry an approval -- this can.
              seed_sha256: createHash('sha256').update(sqlText).digest('hex'),
              counters: {
                to_anchor: summary.anchored, already_anchored: summary.already_anchored,
                conflicts: summary.conflicts, refused: summary.refused,
                skipped_without_fingerprint: summary.skipped_without_fingerprint,
              },
            }), { mode: 0o600 });
            console.log(`rows=${found.length},to_anchor=${summary.anchored},already=${summary.already_anchored},`
              + `conflicts=${summary.conflicts},refused=${summary.refused},skipped=${summary.skipped_without_fingerprint},`
              + `anchor_digest=${String(summary.ref_sha256_of_all_anchored ?? 'none').slice(0, 12)},`
              + `seed_sha=${sqlText.length ? sha12(sqlText) : 'none'}`);
          }

          async function reverify() {
            const found = await rows();
            const summary = summarizeSeed(buildSeedPlan(found));
            const expected = JSON.parse(fs.readFileSync(path.join(TMP, 'plan.json'), 'utf8'));
            if (summary.conflicts > 0) throw new Error(`ANCHOR_CONFLICTS_AFTER_WRITE_${summary.conflicts}`);
            if (summary.anchored > 0) throw new Error(`ANCHORS_NOT_ALL_WRITTEN: ${summary.anchored} rows still have no anchor`);
            if (summary.ref_sha256_of_all_anchored !== expected.digest) {
              throw new Error('APPLIED_ANCHORS_DIFFER_FROM_THE_REVIEWED_PLAN');
            }
            if (summary.anchored_rows !== expected.anchored_rows) {
              throw new Error(`ANCHORED_ROW_COUNT_MOVED: ${expected.anchored_rows} -> ${summary.anchored_rows}`);
            }
            const s5 = extractBackfillSql(fs.readFileSync(resolveMigrationPath(), 'utf8'));
            fs.writeFileSync(path.join(TMP, 's5.sql'), s5, { mode: 0o600 });
            console.log(`already=${summary.already_anchored},rows=${found.length},`
              + `digest_match=yes,s5_bytes=${s5.length},s5_sha=${sha12(s5)}`);
          }

          async function counters() {
            const P = migrationProbeSql({ withLedger: true });
            const svv = await one(P.violations);
            const health = await one(P.anchorHealth);
            // the gate itself is the verifier: the same predicate CI enforces, evaluated on the live rows
            const snap = await query(registryProvenanceSql({ withLedger: true }));
            const gate = evaluatePhase3Boundary({ before: snap, after: snap, withLedger: true });
            const bad = [
              ['status_without_version', Number(svv.status_without_version ?? -1)],
              ['counter_mismatches', Number(svv.counter_mismatches ?? -1)],
              ['dangling_heads', Number(svv.dangling_heads ?? -1)],
              ['seq_gaps', Number(svv.seq_gaps ?? -1)],
            ].filter(([, n]) => n !== 0).map(([k, n]) => `${k}=${n}`);
            if (bad.length) throw new Error(`LEDGER_STILL_INCOMPLETE:${bad.join(',')}`);
            if (Number(health.unanchored ?? -1) !== 0) throw new Error(`FINGERPRINTS_WITHOUT_ANCHOR=${health.unanchored}`);
            if (Number(health.orphans ?? -1) !== 0) throw new Error(`VERSION_ROWS_WITHOUT_REGISTRY_ROW=${health.orphans}`);
            if (Number(health.anchored ?? 0) < 1) throw new Error('NO_ANCHORED_ROWS_AT_ALL');
            if (!gate.ok) throw new Error(`PROVENANCE_GATE:${gate.problems.length}`);
            console.log(`svv=0,ctr=0,dang=0,gaps=0,unanchored=0,orphans=0,anchored=${Number(health.anchored ?? 0)},`
              + `gate=ok(rows=${gate.summary.rows},fp=${gate.summary.fingerprinted},ledger=${gate.summary.withLedger ? 'yes' : 'no'})`);
          }

          async function verifyObjects() {
            const files = ['0010_crm_drive_file_versions.sql', '0011_crm_drive_file_intake_review.sql']
              .map(n => ({ n, p: (() => { try { return resolveMigrationPath(n); } catch { return null; } })() }))
              .filter(f => f.p);
            const declared = { table: 0, index: 0, trigger: 0, view: 0 };
            for (const f of files) {
              const src = fs.readFileSync(f.p, 'utf8');
              declared.table += (src.match(/^\s*CREATE TABLE(?: IF NOT EXISTS)?\s/gim) ?? []).length;
              declared.index += (src.match(/^\s*CREATE (?:UNIQUE )?INDEX(?: IF NOT EXISTS)?\s/gim) ?? []).length;
              declared.trigger += (src.match(/^\s*CREATE TRIGGER(?: IF NOT EXISTS)?\s/gim) ?? []).length;
              declared.view += (src.match(/^\s*CREATE VIEW(?: IF NOT EXISTS)?\s/gim) ?? []).length;
            }
            const installed = await one(`SELECT
                (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name LIKE 'crm_drive_%') AS tbl,
                (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND (name LIKE 'trg_%' OR name LIKE 'crm_drive_%')) AS trg,
                (SELECT COUNT(*) FROM sqlite_master WHERE type='view' AND (name LIKE 'crm_drive_%' OR name LIKE 'crm_review_%')) AS vw,
                (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name LIKE 'idx_%' AND tbl_name LIKE 'crm_drive_%') AS idx`);
            let fkViol = -1;
            try {
              fkViol = (await query('PRAGMA foreign_key_check')).length;
            } catch {
              fkViol = -1;
            }
            const migs = await one('SELECT COUNT(*) AS c, MAX(name) AS latest FROM d1_migrations');
            console.log(`migs=${Number(migs.c ?? 0)},latest=${String(migs.latest ?? '').replace(/\.sql$/, '')},`
              + `declared[tbl=${declared.table},idx=${declared.index},trg=${declared.trigger},view=${declared.view}],`
              + `installed[crm_drive_tbl=${Number(installed.tbl ?? 0)},idx=${Number(installed.idx ?? 0)},`
              + `trg=${Number(installed.trg ?? 0)},view=${Number(installed.vw ?? 0)}],fk_check=${fkViol}`);
            if (Number(migs.c ?? 0) < 11) throw new Error(`CHAIN_INCOMPLETE: d1_migrations=${Number(migs.c ?? 0)}`);
            if (declared.trigger > 0 && Number(installed.trg ?? 0) < declared.trigger) {
              throw new Error('TRIGGERS_MISSING: the ledger guards are not all installed');
            }
            if (declared.view > 0 && Number(installed.vw ?? 0) < declared.view) {
              throw new Error('VIEWS_MISSING: the read-only surfaces are not installed');
            }
            if (fkViol > 0) throw new Error(`FOREIGN_KEY_CHECK_FAILED: ${fkViol}`);
            await counters();
          }

          switch (process.argv[2]) {
            case 'probe': await probe(); break;
            case 'plan': await probe(); await plan(); break;
            case 'reverify': await reverify(); break;
            case 'counters': await probe(); await counters(); break;
            case 'verify-objects': await probe(); await verifyObjects(); break;
            default: throw new Error(`UNKNOWN_RUNNER_MODE: ${String(process.argv[2] ?? '').slice(0, 20)}`);
          }
          EOF_NODE

          # Each runner call writes its line to a file, so `fail` always executes in THIS shell: a failure
          # reported from inside $(…) would only exit the subshell and leave the job to die on `set -e`
          # without the reason code. The error file is character-filtered, because a D1 error body can quote
          # the statement that failed — and the statements that fail here are the ones holding identifiers.
          run_runner() {
            local label="$1"; shift
            if ! node "$TMP/runner.mjs" "$@" > "$TMP/out.$label" 2> "$TMP/err.$label"; then
              fail "${label}:$(tr -cd 'A-Za-z0-9_,=:. -' < "$TMP/err.$label" | tail -c 160 | tr -d '\n')"
            fi
          }
          read_out() { cat "$TMP/out.$1" | tr -d '\n'; }

          # The one-column rule, in one place. `bootstrap-plan` checks the shape of the file a human is being
          # asked to approve; `bootstrap` checks the shape of the file it is about to apply. Written twice,
          # those two rules drift, and then the digest under review describes a file that is not the file that
          # gets written — so there is one function, called twice.
          # The review key and the shape tallies are one function used by both `bootstrap-plan` and
          # `bootstrap`. Two copies of a rule drift, and then "what was reviewed" and "what was applied"
          # would be two different claims about two different files -- which is the whole thing the
          # approval exists to prevent.
          measure_seed() {
            anchor_full=$(jq -r '.digest // "none"' "$TMP/plan.json")
            plan_statements=$(jq -r '.statements' "$TMP/plan.json")
            node_seed_sha=$(jq -r '.seed_sha256 // "none"' "$TMP/plan.json")
            plan_counters=$(jq -r '.counters | "to_anchor=\(.to_anchor) already=\(.already_anchored) conflicts=\(.conflicts) refused=\(.refused) skipped=\(.skipped_without_fingerprint)"' "$TMP/plan.json")
            seed_guarded=$(grep -c "AND drive_ref IS NULL;\$" "$TMP/seed.sql" || true)
            seed_full_shape=$(grep -cE "^UPDATE crm_drive_file_registry SET drive_ref = '[0-9a-f]{64}' WHERE drive_file_id = '[A-Za-z0-9_-]{10,128}' AND drive_ref IS NULL;\$" "$TMP/seed.sql" || true)
            seed_unlisted=$(grep -v '^--' "$TMP/seed.sql" | grep -cEv '^$|^BEGIN;$|^COMMIT;$|^UPDATE crm_drive_file_registry SET drive_ref = ' || true)
            seed_forbidden=$(grep -v '^--' "$TMP/seed.sql" | grep -ciE 'DELETE|DROP|ALTER|CREATE|INSERT|TRUNCATE|REPLACE|PRAGMA|GRANT|REVOKE|ATTACH' || true)
            seed_multi_assign=$(grep -v '^--' "$TMP/seed.sql" | grep -c ',' || true)
            # a truncated or absent digest must never be presented as a review key
            if ! printf '%s,%s' "$anchor_full" "$seed_sha" | grep -qE '^[0-9a-f]{64},[0-9a-f]{64}$'; then
              fail "digest-shape-unexpected"
            fi
            # two implementations over the same artifact: the string node rendered, the file sha256sum read
            if [ "$node_seed_sha" != "$seed_sha" ]; then
              fail "node-shell-sha256-disagree"
            fi
            # the sha must describe the file the plan counted, not a file that merely looks alike
            if [ "$seed_statements" != "$plan_statements" ]; then
              fail "seed-line-count-differs-from-plan"
            fi
            # every statement is one drive_ref UPDATE guarded by `drive_ref IS NULL`; no DDL, no delete,
            # no second column, no second table. `assert_one_column_seed` refuses a line it does not know;
            # these tallies are what a human reads next to the digests to see that it was not merely silent.
            if [ "$seed_guarded" != "$seed_statements" ] || [ "$seed_full_shape" != "$seed_statements" ] \
              || [ "$seed_unlisted" != '0' ] || [ "$seed_forbidden" != '0' ] || [ "$seed_multi_assign" != '0' ]; then
              fail "seed-shape-tally-unexpected"
            fi
          }

          assert_one_column_seed() {
            if grep -vE "^--|^BEGIN;$|^COMMIT;$|^UPDATE crm_drive_file_registry SET drive_ref = '[0-9a-f]{64}' WHERE drive_file_id = '[A-Za-z0-9_-]{10,128}' AND drive_ref IS NULL;$|^$" "$1" | grep -q .; then
              fail "seed-shape-unexpected"
            fi
          }

          # ---- 3) preflight: read-only, and the only mode that is safe to run at any time ----
          run_runner probe probe
          probe=$(read_out probe)
          if [ "$MODE" = 'preflight' ]; then
            result='preflight-ok'
            guards="market_pre=${market_pre};ref_backup_pre=${bak_pre}"
            finish
            exit 0
          fi

          # ---- 3b) bootstrap-plan: make step 5's review possible, then stop before any write.
          # `bootstrap` plans and applies in one run, so "the file is available for human review before any
          # write" could not be satisfied by it. This branch runs the same probe and the same plan() over a
          # fresh export, applies the same one-column shape rule, and reports the same digest — and no
          # `wrangler d1 execute` is reachable from it. The absence of a write is stated in the check names
          # (seed_apply=not-run, ledger/verify=not-run) rather than left to be inferred from blank fields.
          if [ "$MODE" = 'bootstrap-plan' ]; then
            run_runner plan plan
            seed_plan=$(read_out plan)
            assert_one_column_seed "$TMP/seed.sql"
            seed_statements=$(grep -c "^UPDATE crm_drive_file_registry SET drive_ref = " "$TMP/seed.sql" || true)
            seed_sha=$(sha256sum "$TMP/seed.sql" | awk '{print $1}')
            measure_seed
            # The file inlines real drive ids, so it is never committed, never uploaded, and never echoed: what
            # a reviewer approves is its sha256 plus the counts and the refusal tally in `seed_plan`, and the
            # copy here dies with $TMP when the job ends.
            rm -f "$TMP/seed.sql"
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              fail "worktree-dirty-after-plan"
            fi
            if find . -name 'drive-ref-seed.sql' -o -name 'seed.sql' | grep -q .; then
              fail "generated-sql-left-in-tree"
            fi
            # The leak rules, measured rather than promised: the generated file was never tracked by git,
            # nothing like it survives in the tree, this workflow has no step that could upload it, and no
            # write command ran. Each is a number a reviewer can compare against a future run.
            seed_in_git=$(git ls-files | grep -c 'seed\.sql\|drive-ref-seed' || true)
            seed_in_tree=$(find . -path ./node_modules -prune -o \( -name 'drive-ref-seed.sql' -o -name 'seed.sql' -o -name 'plan.json' \) -print | grep -c . || true)
            # `- uses:` anchored on purpose: counting the raw string matched the line doing the counting, and
            # the first review run failed on its own measurement. A step that uploads is `- uses:
            # actions/upload-artifact@v4`; a shell comment or grep pattern is not, and only the former leaks.
            artifact_steps=$(grep -cE '^[[:space:]]*-+[[:space:]]+uses:[[:space:]]*actions/upload-artifact' .github/workflows/crm-drive-migration-session.yml || true)
            if [ "$seed_in_git" != '0' ] || [ "$seed_in_tree" != '0' ] || [ "$artifact_steps" != '0' ] || [ "$d1_writes" != '0' ]; then
              fail "plan-channel-not-clean(git=${seed_in_git:-?},tree=${seed_in_tree:-?},artifacts=${artifact_steps:-?},writes=${d1_writes:-?})"
            fi
            digests="anchor=${anchor_full},seed=${seed_sha},statements=${seed_statements},guarded=${seed_guarded},unlisted=${seed_unlisted},forbidden=${seed_forbidden},commas=${seed_multi_assign},writes=${d1_writes}"
            # A check name is truncated in GitHub's UI and a run log cannot be read from a sandbox, so
            # neither is a review medium on its own. The step summary is the durable, human-readable one.
            {
              printf '### A4 review key - bootstrap-plan, no write performed\n\n'
              printf '| measurement | value |\n|---|---|\n'
              printf '| anchor_digest (sha256 over the anchored refs) | `%s` |\n' "$anchor_full"
              printf '| seed_sha256 as computed by node | `%s` |\n' "$node_seed_sha"
              printf '| seed_sha256 as computed by sha256sum | `%s` |\n' "$seed_sha"
              printf '| UPDATE statements in the file | %s |\n' "$seed_statements"
              printf '| UPDATE statements counted by the planner | %s |\n' "$plan_statements"
              printf '| every statement guarded by `drive_ref IS NULL` | %s of %s |\n' "$seed_guarded" "$seed_statements"
              printf '| lines outside the one-column shape | %s |\n' "$seed_unlisted"
              printf '| DDL or destructive words in the file | %s |\n' "$seed_forbidden"
              printf '| commas (a second assignment would need one) | %s |\n' "$seed_multi_assign"
              printf '| plan counters | %s |\n' "$plan_counters"
              printf '| `d1 execute` calls in this run | %s |\n' "$d1_writes"
              printf '| generated SQL tracked in git / left in tree | %s / %s |\n' "$seed_in_git" "$seed_in_tree"
              printf '| upload-artifact steps in this workflow | %s |\n' "$artifact_steps"
              printf '| head the plan was produced from | `%s` |\n' "$GITHUB_SHA"
              printf '| review run | `%s` (workflow `%s`) |\n' "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW"
              printf '\nNo drive ids, no filenames, no SQL text: the file that held them was deleted in this step, and only digests and counts are published here.\n'
              printf '\nWrite paths are unchanged by this run: `bootstrap` refuses to apply anything until `.crm/drive-ref-bootstrap-approval.json` (committed by a human) matches every value above.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            seed_apply="not-run(plan-only,review required)"
            ledger="not-run(plan-only,sha=${seed_sha:0:12},statements=${seed_statements})"
            verify="not-run(plan-only)"
            guards="market_pre=${market_pre};ref_backup_pre=${bak_pre}"
            result="plan-only(statements=${seed_statements},sha=${seed_sha:0:12})"
            finish
            exit 0
          fi

          if [ "$MODE" = 'verify' ]; then
            run_runner verify-objects verify-objects
            verify=$(read_out verify-objects)
            guards="market=${market_pre};ref_backup=${bak_pre}"
            result='verify-ok'
            finish
            exit 0
          fi

          # ---- 4) bootstrap: generate, prove the shape, apply, re-derive from a fresh export ----
          run_runner plan plan
          seed_plan=$(read_out plan)

          # the one-column rule, checked in the shell as well as in the tool: a file that contains anything
          # other than `UPDATE … SET drive_ref = '<64 hex>' WHERE drive_file_id = '<id>' AND drive_ref IS NULL`
          # is not the artifact this plan authorised, and it is not applied.
          assert_one_column_seed "$TMP/seed.sql"
          seed_statements=$(grep -c "^UPDATE crm_drive_file_registry SET drive_ref = " "$TMP/seed.sql" || true)
          seed_sha=$(sha256sum "$TMP/seed.sql" | awk '{print $1}')
          measure_seed

          # ---- 4a) the write is authorised against a reviewed file, not against this run's own plan.
          # Comparing a run with itself proves the write matched the plan that run made -- worth having, it
          # catches drift inside a run -- but it cannot prove the write matches what a human read earlier.
          # The approval file is that pin: digests, counters, the review run, and the head the plan came
          # from. It is committed by a human, and an unfilled template is refused rather than trusted.
          APPROVAL_FILE='.crm/drive-ref-bootstrap-approval.json'
          if [ ! -f "$APPROVAL_FILE" ]; then
            fail "APPROVAL_FILE_MISSING"
          fi
          ap_anchor=$(jq -r '.anchor_digest // empty' "$APPROVAL_FILE")
          ap_seed=$(jq -r '.seed_sha256 // empty' "$APPROVAL_FILE")
          ap_statements=$(jq -r '.counters.update_statements // empty' "$APPROVAL_FILE")
          ap_to_anchor=$(jq -r '.counters.to_anchor // empty' "$APPROVAL_FILE")
          ap_already=$(jq -r '.counters.already_anchored // empty' "$APPROVAL_FILE")
          ap_conflicts=$(jq -r '.counters.conflicts // empty' "$APPROVAL_FILE")
          ap_refused=$(jq -r '.counters.refused // empty' "$APPROVAL_FILE")
          ap_skipped=$(jq -r '.counters.skipped_without_fingerprint // empty' "$APPROVAL_FILE")
          ap_run=$(jq -r '.review_run.run_id // empty' "$APPROVAL_FILE")
          ap_head=$(jq -r '.plan_head // empty' "$APPROVAL_FILE")
          case "${ap_anchor}${ap_seed}${ap_head}${ap_run}${ap_statements}" in
            ''|*REPLACE*) fail "APPROVAL_NOT_FINALISED" ;;
          esac
          mismatch=''
          [ "$ap_anchor" = "$anchor_full" ] || mismatch="${mismatch}anchor_digest "
          [ "$ap_seed" = "$seed_sha" ] || mismatch="${mismatch}seed_sha256 "
          [ "$ap_statements" = "$seed_statements" ] || mismatch="${mismatch}update_statements "
          [ "$plan_counters" = "to_anchor=${ap_to_anchor} already=${ap_already} conflicts=${ap_conflicts} refused=${ap_refused} skipped=${ap_skipped}" ] || mismatch="${mismatch}counters "
          if [ -n "$mismatch" ]; then
            # the refusal is before the first statement, so a mismatched approval never half-applies
            fail "REVIEWED_PLAN_NOT_MATCHED(${mismatch% })"
          fi
          if ! git cat-file -e "$ap_head" 2>/dev/null || ! git merge-base --is-ancestor "$ap_head" HEAD; then
            fail "APPROVAL_HEAD_NOT_AN_ANCESTOR"
          fi
          # the comparison only means something if the thing that computes the plan did not move since
          if ! git diff --quiet "$ap_head" HEAD -- _worker/migrations scripts/crm/seed-drive-file-refs.mjs .github/workflows/crm-drive-migration-session.yml; then
            fail "PLANNER_CHANGED_SINCE_APPROVAL"
          fi
          approval="pinned(run=${ap_run},head=$(git rev-parse --short "$ap_head"))"
          if [ "$seed_statements" = "0" ]; then
            # every fingerprinted row already carries exactly the repo-derived anchor: the session is a no-op,
            # which is what a re-run of this plan is supposed to look like. §5 still has to be asserted below.
            seed_apply="no-op(all-rows-already-anchored,sha=${seed_sha:0:12})"
            rm -f "$TMP/seed.sql"
          else
            if ! npx --yes wrangler@4 d1 execute "$TEST_DB_NAME" --remote --config "$WRANGLER_CFG" \
              --file "$TMP/seed.sql" -y > "$TMP/apply.log" 2>&1; then
              # the log can contain the statements that were applied; count it, never print it
              n_problems=$(grep -ciE 'error|refused|failed' "$TMP/apply.log" || true)
              rm -f "$TMP/seed.sql" "$TMP/apply.log"
              fail "seed-apply-failed(problems=${n_problems},sha=${seed_sha:0:12})"
            fi
            seed_apply="applied(sha=${seed_sha:0:12},statements=${seed_statements})"
            rm -f "$TMP/seed.sql" "$TMP/apply.log"
          fi

          run_runner reverify reverify
          ledger=$(read_out reverify)

          if [ "$(grep -o ';' "$TMP/s5.sql" | wc -l | tr -d '[:space:]')" != "1" ]; then
            fail "backfill-not-one-statement"
          fi
          s5_sha=$(sha256sum "$TMP/s5.sql" | awk '{print $1}')
          if ! npx --yes wrangler@4 d1 execute "$TEST_DB_NAME" --remote --config "$WRANGLER_CFG" \
            --file "$TMP/s5.sql" -y > "$TMP/s5.log" 2>&1; then
            n_problems=$(grep -ciE 'error|refused|failed' "$TMP/s5.log" || true)
            fail "backfill-apply-failed(problems=${n_problems},sha=${s5_sha:0:12})"
          fi
          rm -f "$TMP/s5.sql" "$TMP/s5.log"

          run_runner counters counters
          counters_out=$(read_out counters)
          ledger="$ledger,s5_sha=${s5_sha:0:12}"
          verify="$counters_out"

          # nothing this job generated may survive in the checkout, and nothing may have been written by it
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            fail "worktree-dirty-after-session"
          fi
          if find . -name 'drive-ref-seed.sql' -o -name 'seed.sql' -o -name 's5.sql' | grep -q .; then
            fail "generated-sql-left-in-tree"
          fi

          guards="market=${market_pre};ref_backup=${bak_pre}"
          result="session-$MODE-ok"
          finish

      - name: Confirm the target database is still the only one that moved
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          API='https://api.cloudflare.com/client/v4'
          PROD_DB_UUID='ace5c9a2-c6b1-47b3-adf1-77e84ac50abf'
          REF_BACKUP_UUID='a7681217-32a3-48fd-b8f5-8a54ac7b35e7'
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::no token for the post-check"; exit 1; fi
          account_id=$(curl --silent --show-error --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$API/accounts" | jq -r '.result[0].id // empty')
          [ -n "$account_id" ] || { echo "::error::account unreadable"; exit 1; }
          # this step only *reports*: the authoritative comparison is the one inside the session, where the
          # pre-snapshot exists. A moved reference backup or market DB after the fact is visible in the name.
          curl --silent --show-error --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /tmp/d1_post.json "$API/accounts/$account_id/d1/database?per_page=100"
          jq -r --arg m "$PROD_DB_UUID" --arg b "$REF_BACKUP_UUID" \
            '"post[" + ([.result[] | select(.uuid == $m) | "market:\(.file_size // 0)"] | first // "market:absent") + "," + ([.result[] | select(.uuid == $b) | "bak:\(.file_size // 0)"] | first // "bak:absent") + "]"' \
            /tmp/d1_post.json

  report:
    if: always()
    needs: session
    name: 'Migration ${{ needs.session.outputs.result }}'
    runs-on: ubuntu-latest
    steps:
      - run: echo "reported by the check names"

  r1:
    if: always()
    needs: session
    name: 'Session target — ${{ needs.session.outputs.probe }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  r2:
    if: always()
    needs: session
    name: 'Session seed plan — ${{ needs.session.outputs.seed_plan }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  r3:
    if: always()
    needs: session
    name: 'Session seed apply — ${{ needs.session.outputs.seed_apply }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  r4:
    if: always()
    needs: session
    name: 'Session anchors — ${{ needs.session.outputs.ledger }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  r5:
    if: always()
    needs: session
    name: 'Session ledger — ${{ needs.session.outputs.verify }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  r6:
    if: always()
    needs: session
    name: 'Session guards — ${{ needs.session.outputs.guards }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  # What the write run was pinned against: an approval file that does not exist is a refusal, not a
  # silence. `no-write-attempted(review mode)` is the plan-only answer.
  r8:
    if: always()
    needs: session
    name: 'Session approval — ${{ needs.session.outputs.approval }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  # Digests only — no identifier, no filename, no SQL. This is the name a human compares against the
  # approval they are about to give; the file it hashes is deleted in the same step that made it.
  r7:
    if: always()
    needs: session
    name: 'Session digests — ${{ needs.session.outputs.digests }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]
