# ⚠️ ملف مؤقت للتحقق من الـ PWA على الموقع المنشور — يُحذف بعد انتهاء الفحص.
name: verify-pwa-live

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Headers + content-type للـ sw.js والمانيفست والأيقونات
        run: |
          for p in /sw.js /manifest.json /assets/img/icon-192.png /assets/img/icon-512.png /assets/img/icon-maskable-512.png ; do
            echo "=================== $p"
            curl -sS -o /dev/null -D - "https://nasr-realestate.github.io$p?cb=$GITHUB_RUN_ID" \
              | grep -iE "^HTTP|^content-type|^content-length|^cache-control" || true
          done | tee verify/headers.txt
          echo "=================== أول 12 سطر من sw.js"
          curl -sS "https://nasr-realestate.github.io/sw.js?cb=$GITHUB_RUN_ID" | head -12 | tee -a verify/headers.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Puppeteer
        run: npm i puppeteer@23 --no-audit --no-fund

      - name: اختبار Chromium حقيقي على الموقع المنشور
        run: node verify/live-pwa-test.mjs

      - name: دفع التقرير إلى الفرع ليقرأه المشرف
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f verify/live-report.json verify/headers.txt 2>/dev/null || true
          git commit -m "test(pwa): تقرير التحقق من الموقع المنشور [skip ci]" || echo "لا تغييرات"
          git push || echo "فشل الدفع"
