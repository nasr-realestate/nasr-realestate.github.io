name: CRM review 0009 — local gates (SQL barriers, D1 rehearsal, backup round-trip)

# Read-only, cloud-free verification of the DRAFT migration 0009 (human review workflow) and of the
# backup/restore path it depends on. Three things run here, all against throwaway LOCAL databases in
# the runner's filesystem:
#
#   * the node:sqlite abuse harness  — every barrier must refuse a bad write (113 checks);
#   * the Cloudflare D1 rehearsal    — the same contract on the real D1 engine, plus the reveal↔approve
#                                      binding, the retention rules, and the canonical pre-image
#                                      recomputation through scripts/crm/verify-review-event-chain.mjs;
#   * two further D1 rehearsals      — drafts 0010 (per-version content tracking) and 0011 (contact-less
#                                      file review) on the same engine, including what an out-of-order
#                                      promotion does and whether a rollback is clean;
#   * the version service on D1      — recordVersion() from _worker/crm-drive-file-registry.js driven
#                                      unmodified against a throwaway local database, which is where
#                                      batch atomicity and trigger ordering are actually measured;
#   * the backup/restore rehearsal   — a bundle built by scripts/crm/build-d1-guarded-backup.mjs must
#                                      restore every table, index, trigger and view, and a guard-stripped
#                                      bundle must be shown to be unsafe.
#
# There are deliberately no secrets, no `--remote` wrangler calls, no Cloudflare API and no artifact
# uploads: this workflow cannot read or write a real database, and its logs contain digests and counts
# only. Nothing here deploys or applies anything to `nasr-crm-test-db`; applying 0009 is a separate,
# human-approved act (see CRM_PHASE4_REVIEW_SQL_APPROVAL.md).
on:
  pull_request:
    paths:
      - _worker/migrations/0009_crm_drive_review_workflow.sql
      - _worker/migrations-draft/0009_crm_drive_review_workflow.sql
      - _worker/tests-draft/crm-review-sql-0009.abuse.mjs
      - _worker/tests-draft/crm-review-sql-0009.d1-rehearsal.py
      - _worker/tests-draft/crm-0009-backup-restore.rehearsal.py
      - scripts/crm/review-event-chain.mjs
      - scripts/crm/verify-review-event-chain.mjs
      - scripts/crm/build-d1-guarded-backup.mjs
      - scripts/crm/build-review-case-register.mjs
      - scripts/crm/drive-intake-discovery.mjs
      - scripts/crm/drive-registry-snapshot.mjs
      - .github/workflows/crm-drive-registry-snapshot.yml
      - .github/workflows/crm-review-0009-verify.yml
      - _worker/migrations-draft/0010_crm_drive_file_versions.sql
      - _worker/migrations-draft/0011_crm_drive_file_intake_review.sql
      - _worker/tests-draft/crm-drive-versions-0010.rehearsal.mjs
      - _worker/tests-draft/crm-file-review-0011.rehearsal.mjs
      - _worker/tests-draft/crm-drive-versions-0010.d1-rehearsal.py
      - _worker/tests-draft/crm-file-review-0011.d1-rehearsal.py
      - _worker/crm-drive-file-registry.js
      - _worker/tests/crm-drive-file-versions.test.mjs
      - _worker/tests-draft/crm-drive-file-versions.d1-service.mjs
      - _worker/tests-draft/_scratch.py
  push:
    branches:
      - master
      - 'arena/**'
    paths:
      - _worker/migrations/0009_crm_drive_review_workflow.sql
      - _worker/migrations-draft/0009_crm_drive_review_workflow.sql
      - _worker/tests-draft/crm-review-sql-0009.abuse.mjs
      - _worker/tests-draft/crm-review-sql-0009.d1-rehearsal.py
      - _worker/tests-draft/crm-0009-backup-restore.rehearsal.py
      - scripts/crm/review-event-chain.mjs
      - scripts/crm/verify-review-event-chain.mjs
      - scripts/crm/build-d1-guarded-backup.mjs
      - scripts/crm/build-review-case-register.mjs
      - scripts/crm/drive-intake-discovery.mjs
      - scripts/crm/drive-registry-snapshot.mjs
      - .github/workflows/crm-drive-registry-snapshot.yml
      - .github/workflows/crm-review-0009-verify.yml
      - _worker/migrations-draft/0010_crm_drive_file_versions.sql
      - _worker/migrations-draft/0011_crm_drive_file_intake_review.sql
      - _worker/tests-draft/crm-drive-versions-0010.rehearsal.mjs
      - _worker/tests-draft/crm-file-review-0011.rehearsal.mjs
      - _worker/tests-draft/crm-drive-versions-0010.d1-rehearsal.py
      - _worker/tests-draft/crm-file-review-0011.d1-rehearsal.py
      - _worker/crm-drive-file-registry.js
      - _worker/tests/crm-drive-file-versions.test.mjs
      - _worker/tests-draft/crm-drive-file-versions.d1-service.mjs
      - _worker/tests-draft/_scratch.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-review-0009-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: SQL barriers · D1 rehearsal · backup round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.repository == 'nasr-realestate/nasr-realestate.github.io'
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      NODE_NO_WARNINGS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the toolchain the rehearsals drive (wrangler is the D1 engine; nothing is deployed)
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund wrangler@4.156.0
          ./node_modules/.bin/wrangler --version
          node -e "const {DatabaseSync}=require('node:sqlite');console.log('node:sqlite available')"

      - name: Inventory of the migration chain the review covers (counts only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re
          files = sorted(glob.glob('_worker/migrations/*.sql')) + sorted(glob.glob('_worker/migrations-draft/*.sql'))
          tot = {'table': 0, 'index': 0, 'trigger': 0, 'view': 0}
          for f in files:
              sql = open(f, encoding='utf-8').read()
              # count only statement-leading keywords; a trigger body never contains a CREATE TRIGGER
              kinds = {'table': len(re.findall(r'(?m)^CREATE TABLE', sql)),
                       'index': len(re.findall(r'(?m)^CREATE (?:UNIQUE )?INDEX', sql)),
                       'trigger': len(re.findall(r'(?m)^CREATE TRIGGER', sql)),
                       'view': len(re.findall(r'(?m)^CREATE VIEW', sql))}
              for k, v in kinds.items():
                  tot[k] += v
              if 'review' in f or '0009' in f:
                  print('  %-46s %s' % (f.split('/')[-1], ' '.join('%s=%d' % (k, v) for k, v in kinds.items())))
          print('migrations=%d tables=%d indexes=%d triggers=%d views=%d'
                % (len(files), tot['table'], tot['index'], tot['trigger'], tot['view']))
          PY

      - name: Review register rebuild contract (encrypted output must never reach Git)
        run: |
          set -euo pipefail
          # The register was once a sandbox-local file and was lost with the sandbox. The rebuild is
          # now a command: if it drifts, or starts writing into the repo, this gate goes red.
          node scripts/crm/build-review-case-register.mjs selftest
          OUT="$(mktemp -d)"
          node scripts/crm/build-review-case-register.mjs build --out "$OUT"
          node scripts/crm/build-review-case-register.mjs verify --out "$OUT" > "$RUNNER_TEMP/register-summary.json"
          node -e '
            const j = JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/register-summary.json", "utf8"));
            const bad = [];
            if (j.ok !== true) bad.push("verify reported problems: " + JSON.stringify(j.problems));
            if (j.cases < 100) bad.push("expected at least the 100-file review queue, got " + j.cases);
            if (j.sealed_bytes_stored !== false) bad.push("a register must not hold sealed original bytes");
            if (j.personal_fields_present !== false) bad.push("personal fields must be absent by construction");
            if (typeof j.plaintext_sha256 !== "string" || !/^[0-9a-f]{64}$/.test(j.plaintext_sha256)) bad.push("no plaintext digest");
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
            console.log("register ok: cases=" + j.cases + " digest=" + j.plaintext_sha256.slice(0, 16));
          '
          # the tool must refuse to write inside the checkout at all
          guard_out=$(node scripts/crm/build-review-case-register.mjs build --out . 2>&1 || true)
          case "$guard_out" in
            *'must live outside the repository'*) echo "repo-write guard held" ;;
            *)
              echo "::error::the register tool would write inside the repository"
              exit 1
              ;;
          esac
          # nothing it produced may be left behind in the tree
          if git ls-files --others --exclude-standard | grep -E 'register\.enc|key\.bin|MANIFEST\.json'; then
            echo "::error::register material is present in the working tree"
            exit 1
          fi
          rm -rf "$OUT"

      - name: Existing Worker/site test suite (must stay green)
        run: node --test _worker/tests/*.test.mjs

      - name: node:sqlite abuse harness — every barrier must refuse
        run: node --test _worker/tests-draft/crm-review-sql-0009.abuse.mjs

      - name: Drive version barriers (draft 0010) — content versions cannot be overwritten or faked
        run: |
          set -euo pipefail
          node _worker/tests-draft/crm-drive-versions-0010.rehearsal.mjs | tail -3

      - name: File review barriers (draft 0011) — no link without a human, no lost review records
        run: |
          set -euo pipefail
          node _worker/tests-draft/crm-file-review-0011.rehearsal.mjs | tail -3

      - name: Cloudflare D1 rehearsal — same contract on the real engine, local file only
        env:
          WRANGLER: ${{ github.workspace }}/node_modules/.bin/wrangler
        run: python3 _worker/tests-draft/crm-review-sql-0009.d1-rehearsal.py

      - name: D1 rehearsal for draft 0010 — version tracking on the engine that will run it
        env:
          WRANGLER: ${{ github.workspace }}/node_modules/.bin/wrangler
        run: python3 _worker/tests-draft/crm-drive-versions-0010.d1-rehearsal.py

      - name: D1 rehearsal for draft 0011 — contact-less file review, and the 0010/0011 promotion order
        env:
          WRANGLER: ${{ github.workspace }}/node_modules/.bin/wrangler
        run: python3 _worker/tests-draft/crm-file-review-0011.d1-rehearsal.py

      - name: Version ledger service on D1 — the real recordVersion(), one local file, no Drive anywhere
        # The same module the Worker imports, with no test-only code path: every D1 statement is spawned
        # through `wrangler d1 execute --local` against a scratch database in the runner's tmpfs. The
        # script refuses to spawn anything that is not wrangler, fails if a call lacks --local, and
        # strips every Cloudflare/Google credential from the child environment — so a green check here
        # also proves the service was exercised without a token, a Drive read, or a real database.
        env:
          WRANGLER: ${{ github.workspace }}/node_modules/.bin/wrangler
        timeout-minutes: 25
        run: node _worker/tests-draft/crm-drive-file-versions.d1-service.mjs

      - name: Backup/restore rehearsal — bundle must preserve every object and guard
        env:
          WRANGLER: ${{ github.workspace }}/node_modules/.bin/wrangler
        run: python3 _worker/tests-draft/crm-0009-backup-restore.rehearsal.py

      - name: The CI verifier refuses remote targets and accepts only read-only SQL
        run: |
          set -euo pipefail
          out=$(node scripts/crm/verify-review-event-chain.mjs --remote --db anything || true)
          echo "$out" | grep -q 'remote_refused' || { echo "expected remote_refused, got: $out"; exit 1; }
          out=$(node scripts/crm/verify-review-event-chain.mjs --local --db x --config /dev/null --state /tmp/s || true)
          echo "$out" | grep -Eq 'wrangler_failed|no input|missing' || { echo "unexpected: $out"; exit 1; }
          echo "verified: --remote is refused, and a bogus local target fails closed rather than trying the network"

      - name: No customer data, tokens or access codes in anything this branch adds
        run: |
          set -euo pipefail
          # scoped on purpose: this gate watches the review tooling it belongs to. The repo-wide PII
          # canary lives in _worker/tests (14 checks) and runs in the tests workflow on every push.
          # The list is the whitelist itself, not a diff against a base ref: actions/checkout@v4 with
          # the default depth-1 clone usually has no `origin/master`, and `git diff` then fails into the
          # trailing `|| true`, leaving the sweep to scan zero files and pass. A fixed explicit set is
          # cheap, and the assert below makes an empty list an error instead of a green check mark.
          SWEEP_PATHS='_worker/migrations _worker/migrations-draft _worker/tests-draft
            .github/workflows/crm-review-0009-verify.yml .github/workflows/crm-cloudflare-test-deploy.yml
            .github/workflows/crm-phase4-review.yml scripts/crm/review-event-chain.mjs
            scripts/crm/verify-review-event-chain.mjs scripts/crm/build-d1-guarded-backup.mjs
            scripts/crm/build-review-case-register.mjs scripts/crm/drive-intake-discovery.mjs
            scripts/crm/drive-registry-snapshot.mjs .github/workflows/crm-drive-registry-snapshot.yml'
          { git ls-files -- $SWEEP_PATHS; git ls-files --others --exclude-standard -- $SWEEP_PATHS; } \
            | grep -E '\.(sql|mjs|py|yml)$' | sort -u > /tmp/changed.txt || true
          if [ ! -s /tmp/changed.txt ]; then
            echo "::error::privacy sweep found no files to scan: the whitelist no longer matches the tree"
            exit 1
          fi
          # A line that IS a detector or a labelled synthetic fixture is not a leak. The one exempted
          # number shape 01012345678 (synthetic canary) and any run of 11 zeroes (a filler digest):
          # a real customer number would never appear on a line that says canary/synthetic.
          ALLOW='canary|synthetic|phone_key|database_id|TEST ONLY|00000000000'
          # built at run time so this step does not match its own patterns
          PEM="$(printf -- '-%.0s' 1 2 3 4 5)BEGIN"
          bad=0
          while read -r f; do
            [ -f "$f" ] || continue
            hits=$(grep -nE '[0-9]{11}' "$f" | grep -vE "$ALLOW" || true)
            [ -z "$hits" ] || { echo "::error file=$f::an 11-digit run looks like a phone number"; bad=1; }
            hits=$(grep -nE '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.(com|net|org|eg)' "$f" | grep -vE "$ALLOW" || true)
            [ -z "$hits" ] || { echo "::error file=$f::an e-mail address does not belong in review tooling"; bad=1; }
            hits=$(grep -nE 'AIza[A-Za-z0-9_-]{20,}|ya29\.[A-Za-z0-9_-]{20,}' "$f" || true)
            [ -z "$hits" ] || { echo "::error file=$f::an OAuth/API token"; bad=1; }
            hits=$(grep -nF -- "$PEM" "$f" || true)
            [ -z "$hits" ] || { echo "::error file=$f::private key material"; bad=1; }
            hits=$(grep -nE 'CRM_ACCESS_CODE[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{16,}' "$f" \
                   | grep -vE "$ALLOW" || true)
            [ -z "$hits" ] || { echo "::error file=$f::an access code value"; bad=1; }
            hits=$(grep -noE '\b[A-Za-z0-9_-]{28,}:[A-Za-z0-9_-]{28,}\b' "$f" | grep -vE "$ALLOW" || true)
            [ -z "$hits" ] || { echo "::error file=$f::a Drive file/folder id pair does not belong in Git"; bad=1; }
          done < /tmp/changed.txt
          [ "$bad" -eq 0 ] || exit 1
          echo "privacy sweep clean over $(wc -l < /tmp/changed.txt) changed files"
