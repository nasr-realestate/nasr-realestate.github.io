name: diag-built
on:
  push:
    branches: ["arena/e5ca88c1-nasr-realestate-github-io"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Integrity
        run: |
          set +e
          node scripts/check-built-site.mjs _site > /tmp/out.txt 2>&1
          code=$?
          echo "exit=$code"
          grep -E "^(✖|❌|-)" /tmp/out.txt | head -15 | while IFS= read -r l; do
            echo "::error title=INTEGRITY::$(echo "$l" | cut -c1-400)"
          done
          tail -30 /tmp/out.txt
          exit 0
