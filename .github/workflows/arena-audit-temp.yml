# ⚠️ مؤقت — أداة فحص فقط (لا تنشر أي شيء). يُحذف قبل التسليم النهائي.
name: "Arena Audit Temp"

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch raw HTML of key pages
        run: |
          mkdir -p audit/raw
          BASE="https://nasr-realestate.github.io"
          i=0
          for p in "/" "/properties/" "/properties/10th-district-180m/" "/requests/" "/agent.html" "/add-your-property.html" "/privacy-policy.html" "/about-us.html" "/contact-us.html" "/ai-feed.json" "/llms.txt" "/feed.xml" "/luxury-gallery.html" "/property-images.html" "/404.html"; do
            i=$((i+1))
            fn=$(echo "$p" | tr '/' '_')
            [ "$fn" = "_" ] && fn="home"
            code=$(curl -sS -L -A "Mozilla/5.0 (compatible; ArenaAudit/1.0)" -o "audit/raw/${fn}.html" -w "%{http_code}" "$BASE$p")
            echo "$p -> $code" | tee -a audit/http-status.txt
          done
          echo "--- headers ---" > audit/headers.txt
          curl -sS -I -L "$BASE/" >> audit/headers.txt 2>&1
          curl -sS -I -L "$BASE/assets/css/style.css" >> audit/headers.txt 2>&1

      - name: Extract head/meta for every page
        run: |
          mkdir -p audit/heads
          for f in audit/raw/*.html; do
            b=$(basename "$f")
            # grab everything up to </head>
            python3 - "$f" "audit/heads/$b" <<'PY'
          import sys,re
          src,dst=sys.argv[1],sys.argv[2]
          html=open(src,encoding='utf-8',errors='replace').read()
          m=re.search(r'(?is)<head.*?</head>',html)
          out=m.group(0) if m else html[:6000]
          open(dst,'w',encoding='utf-8').write(out)
          PY
          done

      - name: Install Lighthouse + Chrome
        run: |
          npm install -g lighthouse@12 chrome-launcher
          which google-chrome || true
          npx --yes @puppeteer/browsers install chrome@stable

      - name: Locate Chrome
        id: chrome
        run: |
          CH=$(ls -d $PWD/chrome/*/chrome-linux64/chrome 2>/dev/null | head -1)
          if [ -z "$CH" ]; then CH=$(which google-chrome || true); fi
          echo "path=$CH" >> $GITHUB_OUTPUT
          echo "chrome=$CH"

      - name: Run Lighthouse (mobile) — home
        run: |
          export CHROME_PATH=${{ steps.chrome.outputs.path }}
          lighthouse "https://nasr-realestate.github.io/" --quiet --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" --output=json --output=html --output-path=./audit/lh-home-mobile --preset=desktop --form-factor=mobile --screenEmulation.mobile --throttling-method=simulate --only-categories=performance,seo,accessibility,best-practices || true

      - name: Run Lighthouse (mobile) — properties
        run: |
          export CHROME_PATH=${{ steps.chrome.outputs.path }}
          lighthouse "https://nasr-realestate.github.io/properties/" --quiet --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" --output=json --output-path=./audit/lh-properties-mobile --form-factor=mobile --screenEmulation.mobile --throttling-method=simulate --only-categories=performance,seo,accessibility,best-practices || true

      - name: Run Lighthouse (mobile) — property detail
        run: |
          export CHROME_PATH=${{ steps.chrome.outputs.path }}
          lighthouse "https://nasr-realestate.github.io/properties/10th-district-180m/" --quiet --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" --output=json --output-path=./audit/lh-property-mobile --form-factor=mobile --screenEmulation.mobile --throttling-method=simulate --only-categories=performance,seo,accessibility,best-practices || true

      - name: Run Lighthouse (desktop) — home
        run: |
          export CHROME_PATH=${{ steps.chrome.outputs.path }}
          lighthouse "https://nasr-realestate.github.io/" --quiet --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" --output=json --output-path=./audit/lh-home-desktop --preset=desktop --only-categories=performance,seo,accessibility,best-practices || true

      - name: Summarize Lighthouse scores
        run: |
          mkdir -p audit/summaries
          for f in audit/*.report.json; do
            b=$(basename "$f")
            node -e "
              const r=require('./$f');
              const c=r.categories; const a=r.audits;
              const g=(id)=>a[id]&&a[id].displayValue?a[id].displayValue:'-';
              const row=(id)=>a[id]?Math.round(a[id].score*100):'-';
              console.log('FILE: $b');
              console.log('  perf='+row('performance')+' seo='+row('seo')+' a11y='+row('accessibility')+' bp='+row('best-practices'));
              console.log('  FCP='+g('first-contentful-paint')+' LCP='+g('largest-contentful-paint')+' TBT='+g('total-blocking-time')+' CLS='+g('cumulative-layout-shift')+' SI='+g('speed-index')+' TTI='+g('interactive'));
              const fails=Object.values(a).filter(x=>x.score!==null&&x.score<0.9&&x.scoreDisplayMode!=='informative'&&x.scoreDisplayMode!=='notApplicable').map(x=>x.id+':'+x.title);
              console.log('  LOW SCORE AUDITS: '+fails.length);
              fails.slice(0,60).forEach(x=>console.log('   - '+x));
            " >> audit/summaries/$b.txt || true
            cat audit/summaries/$b.txt
          done

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arena-audit-output
          path: audit/
          retention-days: 3
