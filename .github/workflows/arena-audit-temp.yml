# ⚠️ مؤقت — أداة فحص فقط (لا تنشر أي شيء). يُحذف قبل التسليم النهائي.
name: "Arena Audit Temp"

on:
  push:
    branches: ["arena/**"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[audit-results]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Lighthouse category scores from committed JSONs
        run: |
          mkdir -p audit/out
          : > audit/out/scores.txt
          for f in audit/out/lh-*.json; do
            [ -f "$f" ] || continue
            node -e "
              const fs=require('fs');
              const r=JSON.parse(fs.readFileSync('$f','utf8'));
              const c=r.categories,a=r.audits;
              const s=k=>c[k]?Math.round(c[k].score*100):'-';
              const g=k=>a[k]&&a[k].displayValue?a[k].displayValue:'-';
              console.log('=== $f ===');
              console.log('  Performance='+s('performance')+' SEO='+s('seo')+' Accessibility='+s('accessibility')+' BestPractices='+s('best-practices'));
              console.log('  FCP='+g('first-contentful-paint')+' LCP='+g('largest-contentful-paint')+' TBT='+g('total-blocking-time')+' CLS='+g('cumulative-layout-shift')+' SI='+g('speed-index')+' TTI='+g('interactive'));
              const keys=Object.keys(a).filter(k=>a[k].score!==null&&a[k].score<1&&a[k].scoreDisplayMode!=='informative'&&a[k].scoreDisplayMode!=='notApplicable'&&a[k].scoreDisplayMode!=='manual');
              console.log('  failing audits: '+keys.join(', '));
              console.log('  SEo group detail:');
              ['is-crawlable','robots-txt','http-status-code','link-text','crawlable-anchors','document-title','meta-description','hreflang','canonical','font-size','tap-targets','image-alt','heading-order','structured-data'].forEach(k=>{ if(a[k]) console.log('    '+k+'='+(a[k].score===null?'n/a':a[k].score)+(a[k].displayValue?' ('+a[k].displayValue+')':'')); });
              console.log('  top opportunities:');
              Object.values(a).filter(x=>x.details&&x.details.overallSavingsMs>50).sort((x,y)=>y.details.overallSavingsMs-x.details.overallSavingsMs).slice(0,10).forEach(x=>console.log('    '+x.id+' saves '+Math.round(x.details.overallSavingsMs)+'ms'));
              const items=x=>x&&x.details&&x.details.items?x.details.items:[];
              console.log('  --- render-blocking-resources ---');
              items(a['render-blocking-resources']).forEach(i=>console.log('    '+i.url+' ('+Math.round(i.wastedMs)+'ms, '+i.totalBytes+'B)'));
              console.log('  --- third-party-summary ---');
              items(a['third-party-summary']).forEach(i=>console.log('    '+i.entity+' blocking='+i.blockingTime+'ms bytes='+i.transferSize));
              console.log('  --- errors-in-console ---');
              items(a['errors-in-console']).forEach(i=>console.log('    '+JSON.stringify(i).slice(0,300)));
              console.log('  --- uses-responsive-images ---');
              items(a['uses-responsive-images']).slice(0,6).forEach(i=>console.log('    '+i.url+' '+(i.totalBytes-i.wastedBytes)+'/'+i.totalBytes));
              console.log('  --- image-alt failures ---');
              items(a['image-alt']).forEach(i=>console.log('    '+JSON.stringify(i).slice(0,200)));
              console.log('  --- heading-order ---');
              items(a['heading-order']).forEach(i=>console.log('    '+JSON.stringify(i).slice(0,300)));
              console.log('  --- structured-data (errors) ---');
              const sd=a['structured-data'];
              if(sd&&sd.details&&sd.details.items){sd.details.items.forEach(i=>console.log('    '+JSON.stringify(i).slice(0,500)));}              
            " >> audit/out/scores.txt 2>&1
          done
          cat audit/out/scores.txt

      - name: Probe Cloudflare Worker backend
        run: |
          : > audit/out/worker-probe.txt
          W="https://royal-snow-ea32.footcai-555.workers.dev/"
          echo "=== OPTIONS ===" >> audit/out/worker-probe.txt
          curl -sS -i -X OPTIONS "$W" -H "Origin: https://nasr-realestate.github.io" -m 30 >> audit/out/worker-probe.txt 2>&1 || echo "FAILED" >> audit/out/worker-probe.txt
          echo "" >> audit/out/worker-probe.txt
          echo "=== POST / (chat ping) ===" >> audit/out/worker-probe.txt
          curl -sS -i -X POST "$W" -H "Content-Type: application/json" -H "Origin: https://nasr-realestate.github.io" -m 40 \
            -d '{"source":"arena-audit","message":"ping","history":[]}' >> audit/out/worker-probe.txt 2>&1 || echo "FAILED" >> audit/out/worker-probe.txt
          echo "" >> audit/out/worker-probe.txt
          echo "=== POST /upload-images (empty) ===" >> audit/out/worker-probe.txt
          curl -sS -i -X POST "${W}upload-images" -H "Content-Type: application/json" -m 30 -d '{"images":[]}' >> audit/out/worker-probe.txt 2>&1 || echo "FAILED" >> audit/out/worker-probe.txt
          cat audit/out/worker-probe.txt

      - name: PageSpeed Insights API (mobile)
        run: |
          : > audit/out/psi.txt
          for u in "https://nasr-realestate.github.io/" "https://nasr-realestate.github.io/properties/" "https://nasr-realestate.github.io/properties/10th-district-180m/"; do
            echo "=== $u ===" >> audit/out/psi.txt
            curl -sS -m 180 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$u")&strategy=mobile&category=performance&category=seo&category=accessibility&category=best-practices" -o psi_tmp.json || echo "PSI FAILED" >> audit/out/psi.txt
            if [ -f psi_tmp.json ]; then
              node -e "
                try{
                  const r=require('./psi_tmp.json');
                  const lr=r.lighthouseResult;
                  if(!lr){console.log('no lighthouseResult', Object.keys(r));process.exit(0)}
                  const c=lr.categories,a=lr.audits;
                  const s=k=>c[k]?Math.round(c[k].score*100):'-';
                  const g=k=>a[k]&&a[k].displayValue?a[k].displayValue:'-';
                  console.log('  perf='+s('performance')+' seo='+s('seo')+' a11y='+s('accessibility')+' bp='+s('best-practices'));
                  console.log('  FCP='+g('first-contentful-paint')+' LCP='+g('largest-contentful-paint')+' TBT='+g('total-blocking-time')+' CLS='+g('cumulative-layout-shift')+' SI='+g('speed-index'));
                  console.log('  env: '+JSON.stringify(lr.configSettings.formFactor)+' '+(lr.configSettings.throttling||''));
                }catch(e){console.log('parse error: '+e.message)}
              " >> audit/out/psi.txt
              rm -f psi_tmp.json
            fi
          done
          cat audit/out/psi.txt

      - name: Commit results
        run: |
          git config user.name "Arena Audit Bot"
          git config user.email "audit@arena.local"
          git add -f audit
          git commit -m "chore(audit): scores + worker probe + psi [audit-results]" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
