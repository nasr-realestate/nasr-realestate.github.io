name: "Arena Audit Temp"
on:
  push:
    branches: ["arena/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[audit-results]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Install gems and inspect jekyll-seo-tag
        run: |
          set +e
          mkdir -p audit/out
          : > audit/out/seotag.txt
          bundle install --jobs 4 >> audit/out/seotag.txt 2>&1
          echo "=== gem which ===" >> audit/out/seotag.txt
          bundle exec gem which jekyll-seo-tag >> audit/out/seotag.txt 2>&1
          echo "=== contents ===" >> audit/out/seotag.txt
          bundle exec gem contents jekyll-seo-tag >> audit/out/seotag.txt 2>&1
          echo "=== seo.html template ===" >> audit/out/seotag.txt
          cat "$(bundle exec gem contents jekyll-seo-tag 2>/dev/null | grep 'seo.html' | head -1)" >> audit/out/seotag.txt 2>&1
          echo "=== jekyll version ===" >> audit/out/seotag.txt
          bundle exec jekyll -v >> audit/out/seotag.txt 2>&1
          exit 0
      - name: Commit
        run: |
          git config user.name "Arena Audit Bot"
          git config user.email "audit@arena.local"
          git add -f audit
          git commit -m "probe seo tag [audit-results]" || echo "nothing"
          git push origin HEAD:${{ github.ref_name }}
