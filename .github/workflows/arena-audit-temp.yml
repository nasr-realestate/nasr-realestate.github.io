name: "Arena Audit Temp"
on:
  push:
    branches: ["arena/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[audit-results]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Inspect jekyll-seo-tag
        run: |
          mkdir -p audit/out
          : > audit/out/seotag.txt
          echo "=== gem version ===" >> audit/out/seotag.txt
          gem list jekyll-seo-tag >> audit/out/seotag.txt
          echo "=== contents ===" >> audit/out/seotag.txt
          gem contents jekyll-seo-tag >> audit/out/seotag.txt 2>&1
          echo "=== seo.html template ===" >> audit/out/seotag.txt
          cat "$(gem contents jekyll-seo-tag | grep 'seo.html' | head -1)" >> audit/out/seotag.txt 2>&1
          echo "=== seo_tag.rb ===" >> audit/out/seotag.txt
          cat "$(gem contents jekyll-seo-tag | grep 'seo_tag.rb' | head -1)" >> audit/out/seotag.txt 2>&1
          echo "=== jekyll version ===" >> audit/out/seotag.txt
          bundle exec jekyll -v >> audit/out/seotag.txt 2>&1
          gzip -c audit/out/seotag.txt | base64 -w0 > audit/out/seotag.txt.b64
      - name: Commit
        run: |
          git config user.name "Arena Audit Bot"
          git config user.email "audit@arena.local"
          git add -f audit
          git commit -m "probe seo tag [audit-results]" || echo "nothing"
          git push origin HEAD:${{ github.ref_name }}
