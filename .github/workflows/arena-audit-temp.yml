name: "Arena Audit Temp"
on:
  push:
    branches: ["arena/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[audit-results]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Install gems and dump template.html + drop.rb
        run: |
          set +e
          mkdir -p audit/out
          : > audit/out/seotag3.txt
          bundle install --jobs 4 >/dev/null 2>&1
          G="/opt/hostedtoolcache/Ruby/3.1.7/x64/lib/ruby/gems/3.1.0/gems/jekyll-seo-tag-2.8.0"
          G=$(find /opt -maxdepth 8 -type d -name "jekyll-seo-tag-*" 2>/dev/null | head -1)
          echo "GEM=$G" >> audit/out/seotag3.txt
          echo "=========== template.html ===========" >> audit/out/seotag3.txt
          cat "$G/lib/template.html" >> audit/out/seotag3.txt 2>&1
          echo "=========== drop.rb ===========" >> audit/out/seotag3.txt
          cat "$G/lib/jekyll-seo-tag/drop.rb" >> audit/out/seotag3.txt 2>&1
          exit 0
      - name: Commit
        run: |
          git config user.name "Arena Audit Bot"
          git config user.email "audit@arena.local"
          git add -f audit
          git commit -m "probe seo template [audit-results]" || echo "nothing"
          git push origin HEAD:${{ github.ref_name }}
