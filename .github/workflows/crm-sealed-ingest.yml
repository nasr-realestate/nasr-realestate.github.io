name: CRM sealed encrypted ingest (nasr-crm-test-db only)

on:
  push:
    branches:
      - master
      - 'arena/**'
    paths:
      - .github/workflows/crm-sealed-ingest.yml
      - _worker/ingest-queue/sealed.txt
  workflow_dispatch:
    inputs:
      sealed_payload:
        description: 'RSA-OAEP-4096 + AES-256-GCM sealed envelope (enc_v1....) or READ_PUBLIC_KEY'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crm-sealed-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Authorize ticket and deliver sealed ciphertext to nasr-crm-api-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
      SEALED_PAYLOAD: ${{ inputs.sealed_payload }}
    outputs:
      result: ${{ steps.run_ingest.outputs.result }}
      processed: ${{ steps.run_ingest.outputs.processed }}
      updated: ${{ steps.run_ingest.outputs.updated }}
      contacts: ${{ steps.run_ingest.outputs.contacts }}
      cphones: ${{ steps.run_ingest.outputs.cphones }}
      phones: ${{ steps.run_ingest.outputs.phones }}
      opps: ${{ steps.run_ingest.outputs.opps }}
      linked: ${{ steps.run_ingest.outputs.linked }}
      listings: ${{ steps.run_ingest.outputs.listings }}
      tracks: ${{ steps.run_ingest.outputs.tracks }}
      pk1: ${{ steps.run_ingest.outputs.pk1 }}
      pk2: ${{ steps.run_ingest.outputs.pk2 }}
      pk3: ${{ steps.run_ingest.outputs.pk3 }}
      pk4: ${{ steps.run_ingest.outputs.pk4 }}
      pk5: ${{ steps.run_ingest.outputs.pk5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Authorize one-time D1 ticket and invoke /api/ingest/sealed
        id: run_ingest
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API='https://api.cloudflare.com/client/v4'
          TEST_DB_UUID='65bfcb14-4b48-423b-916f-00eefdb9ae1e'
          PROD_DB_UUID='ace5c9a2-c6b1-47b3-adf1-77e84ac50abf'
          WORKER_NAME='nasr-crm-api-test'
          WRANGLER_CFG='_worker/wrangler.crm.toml'
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT

          result='not-run'
          processed='0'
          updated='0'
          contacts='0'
          cphones='0'
          phones='0'
          opps='0'
          linked='0'
          listings='0'
          tracks='none'
          pk1=''
          pk2=''
          pk3=''
          pk4=''
          pk5=''

          finish() {
            {
              printf 'result=%s\n' "$result"
              printf 'processed=%s\n' "$processed"
              printf 'updated=%s\n' "$updated"
              printf 'contacts=%s\n' "$contacts"
              printf 'cphones=%s\n' "$cphones"
              printf 'phones=%s\n' "$phones"
              printf 'opps=%s\n' "$opps"
              printf 'linked=%s\n' "$linked"
              printf 'listings=%s\n' "$listings"
              printf 'tracks=%s\n' "$tracks"
              printf 'pk1=%s\n' "$pk1"
              printf 'pk2=%s\n' "$pk2"
              printf 'pk3=%s\n' "$pk3"
              printf 'pk4=%s\n' "$pk4"
              printf 'pk5=%s\n' "$pk5"
            } >> "$GITHUB_OUTPUT"
          }

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            result='missing-cloudflare-token'
            finish
            exit 1
          fi
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"

          if grep -Fq "$PROD_DB_UUID" "$WRANGLER_CFG" || grep -Fq 'nasr-market-db' "$WRANGLER_CFG"; then
            result='forbidden-production-db-in-config'
            finish
            exit 1
          fi
          if ! grep -Fq "database_id = \"$TEST_DB_UUID\"" "$WRANGLER_CFG"; then
            result='test-db-uuid-mismatch'
            finish
            exit 1
          fi

          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" -o "$TMP/accounts.json" -w '%{http_code}' "$API/accounts?per_page=100" 2>/dev/null || true)
          if [ "$status" != '200' ]; then
            result="accounts-http-$status"
            finish
            exit 1
          fi
          account_id=$(jq -r '.result[0].id // empty' "$TMP/accounts.json")
          export CLOUDFLARE_ACCOUNT_ID="$account_id"

          envelope=$(printf '%s' "${SEALED_PAYLOAD:-}" | tr -d '[:space:]')
          if [ -z "$envelope" ] && [ -f '_worker/ingest-queue/sealed.txt' ]; then
            envelope=$(grep -v '^[[:space:]]*#' _worker/ingest-queue/sealed.txt | tr -d '[:space:]' || true)
          fi
          if [ -z "$envelope" ] || [ "$envelope" = 'IDLE' ]; then
            COUNTS_SQL="SELECT
              (SELECT COUNT(*) FROM listings WHERE area_id=90001 AND external_id NOT LIKE 'crm-test-only-%') AS listings_cnt,
              (SELECT COUNT(*) FROM crm_contacts WHERE name NOT LIKE 'TEST ONLY%') AS contacts_cnt,
              (SELECT COUNT(DISTINCT contact_id) FROM crm_contact_phones WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS cphones_cnt,
              (SELECT COUNT(*) FROM crm_contact_phones WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS phones_cnt,
              (SELECT COUNT(*) FROM crm_opportunities WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS opps_cnt,
              (SELECT COUNT(*) FROM crm_opportunity_properties WHERE opportunity_id NOT IN (SELECT id FROM crm_opportunities WHERE contact_id IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%'))) AS linked_cnt,
              (SELECT COUNT(*) FROM crm_opportunities WHERE track='sale_apt' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS g_cnt,
              (SELECT COUNT(*) FROM crm_opportunities WHERE track='furnished_apt' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS r_cnt,
              (SELECT COUNT(*) FROM crm_opportunities WHERE track='new_rent_apt' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS b_cnt,
              (SELECT COUNT(*) FROM crm_opportunities WHERE track='admin_hq' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS y_cnt,
              (SELECT COUNT(*) FROM crm_opportunities WHERE track='transient' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS t_cnt;"
            npx --yes wrangler@4 d1 execute nasr-crm-test-db --remote --json --config "$WRANGLER_CFG" --command "$COUNTS_SQL" > "$TMP/counts.json" 2>/dev/null
            listings=$(jq -r '.. | objects | select(has("listings_cnt")) | .listings_cnt | tostring' "$TMP/counts.json" | head -n1)
            contacts=$(jq -r '.. | objects | select(has("contacts_cnt")) | .contacts_cnt | tostring' "$TMP/counts.json" | head -n1)
            cphones=$(jq -r '.. | objects | select(has("cphones_cnt")) | .cphones_cnt | tostring' "$TMP/counts.json" | head -n1)
            phones=$(jq -r '.. | objects | select(has("phones_cnt")) | .phones_cnt | tostring' "$TMP/counts.json" | head -n1)
            opps=$(jq -r '.. | objects | select(has("opps_cnt")) | .opps_cnt | tostring' "$TMP/counts.json" | head -n1)
            linked=$(jq -r '.. | objects | select(has("linked_cnt")) | .linked_cnt | tostring' "$TMP/counts.json" | head -n1)
            tracks=$(jq -r '.. | objects | select(has("g_cnt")) | "G\(.g_cnt)-R\(.r_cnt)-B\(.b_cnt)-Y\(.y_cnt)-T\(.t_cnt)"' "$TMP/counts.json" | head -n1)
            result='queue-idle-verified'
            finish
            exit 0
          fi
          if [ "$envelope" = 'READ_PUBLIC_KEY' ]; then
            COUNTS_SQL="SELECT
              (SELECT COUNT(*) FROM listings WHERE area_id=90001 AND external_id NOT LIKE 'crm-test-only-%') AS listings_cnt,
              (SELECT COUNT(*) FROM crm_contacts WHERE name NOT LIKE 'TEST ONLY%') AS contacts_cnt,
              (SELECT COUNT(*) FROM crm_contact_phones WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS phones_cnt,
              (SELECT COUNT(*) FROM crm_opportunities WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS opps_cnt,
              (SELECT COUNT(*) FROM crm_opportunity_properties WHERE opportunity_id NOT IN (SELECT id FROM crm_opportunities WHERE contact_id IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%'))) AS linked_cnt;"
            npx --yes wrangler@4 d1 execute nasr-crm-test-db --remote --json --config "$WRANGLER_CFG" --command "$COUNTS_SQL" > "$TMP/counts.json" 2>/dev/null
            listings=$(jq -r '.. | objects | select(has("listings_cnt")) | .listings_cnt | tostring' "$TMP/counts.json" | head -n1)
            contacts=$(jq -r '.. | objects | select(has("contacts_cnt")) | .contacts_cnt | tostring' "$TMP/counts.json" | head -n1)
            phones=$(jq -r '.. | objects | select(has("phones_cnt")) | .phones_cnt | tostring' "$TMP/counts.json" | head -n1)
            opps=$(jq -r '.. | objects | select(has("opps_cnt")) | .opps_cnt | tostring' "$TMP/counts.json" | head -n1)
            linked=$(jq -r '.. | objects | select(has("linked_cnt")) | .linked_cnt | tostring' "$TMP/counts.json" | head -n1)
            PUB_SQL="SELECT resource_id AS pub FROM crm_idempotency_receipts WHERE submission_key='system:ingest-public-key-v1' LIMIT 1;"
            npx --yes wrangler@4 d1 execute nasr-crm-test-db --remote --json --config "$WRANGLER_CFG" --command "$PUB_SQL" > "$TMP/pub.json" 2>/dev/null
            pub=$(jq -r '.. | objects | select(has("pub")) | .pub // empty' "$TMP/pub.json" | head -n1 | tr -cd 'A-Za-z0-9_-')
            if [ -z "$pub" ]; then
              result='public-key-not-found'
              finish
              exit 1
            fi
            pk1="${pub:0:160}"
            pk2="${pub:160:160}"
            pk3="${pub:320:160}"
            pk4="${pub:480:160}"
            pk5="${pub:640:160}"
            result='public-key-read-ok'
            finish
            exit 0
          fi

          if [ "${#envelope}" -gt 520000 ] || [[ ! "$envelope" =~ ^enc_v1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
            result='invalid-envelope-format'
            finish
            exit 1
          fi

          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 -H "$AUTH" -o "$TMP/sub.json" -w '%{http_code}' "$API/accounts/$account_id/workers/subdomain" 2>/dev/null || true)
          subdomain=$(jq -r '.result.subdomain // empty' "$TMP/sub.json")
          BASE_URL="https://${WORKER_NAME}.${subdomain}.workers.dev"

          printf '%s' "$envelope" > "$TMP/env.txt"
          ticket_hash=$(sha256sum "$TMP/env.txt" | awk '{print $1}')
          TICKET_SQL="INSERT INTO crm_idempotency_receipts(submission_key,resource_type,resource_id) VALUES('sealed-ticket:${ticket_hash}','opportunity','authorized_pending') ON CONFLICT(submission_key) DO NOTHING;"
          if ! npx --yes wrangler@4 d1 execute nasr-crm-test-db --remote --config "$WRANGLER_CFG" --command "$TICKET_SQL" > "$TMP/ticket.log" 2>&1; then
            result='d1-ticket-insert-failed'
            finish
            exit 1
          fi

          jq -Rs '{sealed_payload: .}' "$TMP/env.txt" > "$TMP/req.json"
          http_code=$(curl --silent --show-error --connect-timeout 15 --max-time 90 \
            -X POST -H 'Content-Type: application/json' \
            --data-binary "@$TMP/req.json" \
            -o "$TMP/resp.json" -w '%{http_code}' \
            "$BASE_URL/api/ingest/sealed" 2>/dev/null || true)

          if [ "$http_code" != '200' ]; then
            err_code=$(jq -r '.error // "unknown"' "$TMP/resp.json" 2>/dev/null | tr -cd 'A-Za-z0-9_-' | cut -c1-40 || true)
            result="ingest-http-${http_code}-${err_code:-unknown}"
            finish
            exit 1
          fi

          processed=$(jq -r '(.processed // 0) | tostring' "$TMP/resp.json")
          updated=$(jq -r '(.updated_contacts // 0) | tostring' "$TMP/resp.json")

          COUNTS_SQL="SELECT
            (SELECT COUNT(*) FROM listings WHERE area_id=90001 AND external_id NOT LIKE 'crm-test-only-%') AS listings_cnt,
            (SELECT COUNT(*) FROM crm_contacts WHERE name NOT LIKE 'TEST ONLY%') AS contacts_cnt,
            (SELECT COUNT(DISTINCT contact_id) FROM crm_contact_phones WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS cphones_cnt,
            (SELECT COUNT(*) FROM crm_contact_phones WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS phones_cnt,
            (SELECT COUNT(*) FROM crm_opportunities WHERE contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS opps_cnt,
            (SELECT COUNT(*) FROM crm_opportunity_properties WHERE opportunity_id NOT IN (SELECT id FROM crm_opportunities WHERE contact_id IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%'))) AS linked_cnt,
            (SELECT COUNT(*) FROM crm_opportunities WHERE track='sale_apt' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS g_cnt,
            (SELECT COUNT(*) FROM crm_opportunities WHERE track='furnished_apt' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS r_cnt,
            (SELECT COUNT(*) FROM crm_opportunities WHERE track='new_rent_apt' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS b_cnt,
            (SELECT COUNT(*) FROM crm_opportunities WHERE track='admin_hq' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS y_cnt,
            (SELECT COUNT(*) FROM crm_opportunities WHERE track='transient' AND contact_id NOT IN (SELECT id FROM crm_contacts WHERE name LIKE 'TEST ONLY%')) AS t_cnt;"
          npx --yes wrangler@4 d1 execute nasr-crm-test-db --remote --json --config "$WRANGLER_CFG" --command "$COUNTS_SQL" > "$TMP/counts.json" 2>/dev/null
          listings=$(jq -r '.. | objects | select(has("listings_cnt")) | .listings_cnt | tostring' "$TMP/counts.json" | head -n1)
          contacts=$(jq -r '.. | objects | select(has("contacts_cnt")) | .contacts_cnt | tostring' "$TMP/counts.json" | head -n1)
          cphones=$(jq -r '.. | objects | select(has("cphones_cnt")) | .cphones_cnt | tostring' "$TMP/counts.json" | head -n1)
          phones=$(jq -r '.. | objects | select(has("phones_cnt")) | .phones_cnt | tostring' "$TMP/counts.json" | head -n1)
          opps=$(jq -r '.. | objects | select(has("opps_cnt")) | .opps_cnt | tostring' "$TMP/counts.json" | head -n1)
          linked=$(jq -r '.. | objects | select(has("linked_cnt")) | .linked_cnt | tostring' "$TMP/counts.json" | head -n1)
          tracks=$(jq -r '.. | objects | select(has("g_cnt")) | "G\(.g_cnt)-R\(.r_cnt)-B\(.b_cnt)-Y\(.y_cnt)-T\(.t_cnt)"' "$TMP/counts.json" | head -n1)

          result='sealed-ingest-verified'
          finish

  pk1:
    if: needs.ingest.outputs.pk1 != ''
    needs: ingest
    name: 'PK1:${{ needs.ingest.outputs.pk1 }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]
  pk2:
    if: needs.ingest.outputs.pk2 != ''
    needs: ingest
    name: 'PK2:${{ needs.ingest.outputs.pk2 }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]
  pk3:
    if: needs.ingest.outputs.pk3 != ''
    needs: ingest
    name: 'PK3:${{ needs.ingest.outputs.pk3 }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]
  pk4:
    if: needs.ingest.outputs.pk4 != ''
    needs: ingest
    name: 'PK4:${{ needs.ingest.outputs.pk4 }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]
  pk5:
    if: needs.ingest.outputs.pk5 != ''
    needs: ingest
    name: 'PK5:${{ needs.ingest.outputs.pk5 }}'
    runs-on: ubuntu-latest
    steps: [{ run: echo ok }]

  report:
    name: 'CRM sealed ingest — ${{ needs.ingest.outputs.result }} (processed=${{ needs.ingest.outputs.processed }}, updated=${{ needs.ingest.outputs.updated }}, contacts=${{ needs.ingest.outputs.contacts }}, cphones=${{ needs.ingest.outputs.cphones }}, phones=${{ needs.ingest.outputs.phones }}, opps=${{ needs.ingest.outputs.opps }}, tracks=${{ needs.ingest.outputs.tracks }}, linked=${{ needs.ingest.outputs.linked }}, listings=${{ needs.ingest.outputs.listings }})'
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Aggregate non-PII verification counts only; zero customer PII in logs.'
