name: CRM Cloudflare read-only preflight

# Dispatch only (2026-11-05). This file used to carry a `push` trigger pinned to the single arena
# branch `arena/fc5d95ec-...`: a leftover from the session that wrote it, not a control. It meant a
# push to one stale working branch could run a job that is handed ARENA_CLOUDFLARE_TOKEN with nobody
# deciding anything — the exact failure mode the deploy workflow removed its own push trigger for.
# A read-only probe is still a token-holding job: it must be started by a human, every time.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-cloudflare-readonly-preflight
  cancel-in-progress: true

jobs:
  probe:
    name: Read-only Cloudflare GET probes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
    outputs:
      outcome: ${{ steps.probe.outputs.outcome }}
      verify: ${{ steps.probe.outputs.verify }}
      groups: ${{ steps.probe.outputs.groups }}
      accounts: ${{ steps.probe.outputs.accounts }}
      d1: ${{ steps.probe.outputs.d1 }}
      workers: ${{ steps.probe.outputs.workers }}
      access: ${{ steps.probe.outputs.access }}
      zones: ${{ steps.probe.outputs.zones }}
      zero_trust: ${{ steps.probe.outputs.zero_trust }}
      identity_providers: ${{ steps.probe.outputs.identity_providers }}
      workers_subdomain: ${{ steps.probe.outputs.workers_subdomain }}
    steps:
      - name: Verify exact secret and inventory read access (GET only)
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API='https://api.cloudflare.com/client/v4'
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          outcome='not-run'
          verify='not-run'
          groups='not-returned'
          accounts='not-run'
          d1='not-run'
          workers='not-run'
          access='not-run'
          zones='not-run'
          zero_trust='not-run'
          identity_providers='not-run'
          workers_subdomain='not-run'
          finish() {
            {
              echo "outcome=$outcome"
              echo "verify=$verify"
              echo "groups=$groups"
              echo "accounts=$accounts"
              echo "d1=$d1"
              echo "workers=$workers"
              echo "access=$access"
              echo "zones=$zones"
              echo "zero_trust=$zero_trust"
              echo "identity_providers=$identity_providers"
              echo "workers_subdomain=$workers_subdomain"
            } >> "$GITHUB_OUTPUT"
          }
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            outcome='secret-unavailable-to-workflow'
            verify='not-requested'
            accounts='not-requested'
            finish
            exit 0
          fi
          echo '::add-mask::'"$CLOUDFLARE_API_TOKEN"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          get_json() {
            local url="$1" destination="$2" code
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "$auth_header" --output "$destination" --write-out '%{http_code}' "$url" 2>/dev/null || true)
            printf '%s' "${code:-000}"
          }
          verify_code=$(get_json "$API/user/tokens/verify" "$TMP/verify.json")
          token_status=$(jq -r '.result.status // "unknown"' "$TMP/verify.json" 2>/dev/null || echo unknown)
          verify_error_code=$(jq -r '(.errors[0].code // "unknown")|tostring' "$TMP/verify.json" 2>/dev/null | tr -cd '0-9' | cut -c1-12 || true)
          verify="http=$verify_code;active=$([ "$token_status" = active ] && echo yes || echo no);error=${verify_error_code:-none}"
          if [ "$verify_code" = 200 ] && [ "$token_status" = active ]; then
            outcome='token-verify-endpoint-accepted'
          else
            outcome='token-verify-endpoint-rejected;testing-account-read'
          fi
          accounts_code=$(get_json "$API/accounts?per_page=100" "$TMP/accounts.json")
          if [ "$accounts_code" != 200 ]; then
            accounts="http=$accounts_code;inventory=denied-or-unavailable"
            outcome="$outcome;account-read-failed"
            finish
            exit 0
          fi
          account_count=$(jq -r '.result | length' "$TMP/accounts.json")
          case "$account_count" in ''|*[!0-9]*) accounts='http=200;count=unparseable'; outcome="$outcome;account-response-invalid"; finish; exit 0;; esac
          accounts="http=200;count=$account_count"
          if [ "$account_count" -ne 1 ]; then
            outcome="$outcome;account-selection-required"
            finish
            exit 0
          fi
          account_id=$(jq -r '.result[0].id' "$TMP/accounts.json")
          account_verify_code=$(get_json "$API/accounts/$account_id/tokens/verify" "$TMP/account-verify.json")
          account_verify_status=$(jq -r '.result.status // "unknown"' "$TMP/account-verify.json" 2>/dev/null || echo unknown)
          if [ "$account_verify_code" = 200 ] && [ "$account_verify_status" = active ]; then
            groups=$(jq -r '[.result.policies[]?.permission_groups[]?.name] | unique | join(",")' "$TMP/account-verify.json" 2>/dev/null | tr -d '\r\n' | cut -c1-180 || true)
            [ -n "$groups" ] || groups='active-no-groups-returned'
          else
            groups="account_verify_http=$account_verify_code;status=$account_verify_status"
          fi
          inventory_probe() {
            local url="$1" destination="$2" code count names err_code
            code=$(get_json "$url" "$destination")
            if [ "$code" = 200 ]; then
              count=$(jq -r 'if (.result|type)=="array" then (.result|length) else "unknown" end' "$destination" 2>/dev/null || echo unknown)
              names=$(jq -r '[.result[]? | (.name // .id // .script_name // empty)] | map(gsub("[\\r\\n]";" ")) | join(",")' "$destination" 2>/dev/null | tr -cd '[:alnum:] _.,-/' | cut -c1-100 || true)
              printf 'http=%s;count=%s;names=%s' "$code" "$count" "${names:-none-or-hidden}"
            else
              err_code=$(jq -r '[.errors[]?.code|tostring] | unique | join(",")' "$destination" 2>/dev/null | tr -cd '0-9,' | cut -c1-32 || true)
              printf 'http=%s;error=%s;read-denied-or-unavailable' "$code" "${err_code:-unknown}"
            fi
          }
          d1=$(inventory_probe "$API/accounts/$account_id/d1/database?per_page=100" "$TMP/d1.json")
          workers=$(inventory_probe "$API/accounts/$account_id/workers/scripts?per_page=100" "$TMP/workers.json")
          access=$(inventory_probe "$API/accounts/$account_id/access/apps?per_page=100" "$TMP/access.json")
          zones=$(inventory_probe "$API/zones?account.id=$account_id&per_page=100" "$TMP/zones.json")
          org_code=$(get_json "$API/accounts/$account_id/access/organizations" "$TMP/organization.json")
          if [ "$org_code" = 200 ] && jq -e '.result | type == "object"' "$TMP/organization.json" >/dev/null 2>&1; then
            has_auth_domain=$(jq -r 'if ((.result.auth_domain // "")|length)>0 then "yes" else "no" end' "$TMP/organization.json")
            zero_trust="http=200;configured=yes;auth-domain=$has_auth_domain"
          else
            org_error_code=$(jq -r '[.errors[]?.code|tostring] | unique | join(",")' "$TMP/organization.json" 2>/dev/null | tr -cd '0-9,' | cut -c1-32 || true)
            if [ "$org_code" = 403 ]; then
              zero_trust="http=403;error=${org_error_code:-unknown};configured=unknown"
            else
              zero_trust="http=$org_code;error=${org_error_code:-unknown};configured=no-or-unavailable"
            fi
          fi
          idp_code=$(get_json "$API/accounts/$account_id/access/identity_providers?per_page=100" "$TMP/idps.json")
          if [ "$idp_code" = 200 ]; then
            idp_count=$(jq -r 'if (.result|type)=="array" then (.result|length) else 0 end' "$TMP/idps.json" 2>/dev/null || echo unknown)
            idp_types=$(jq -r '[.result[]?.type // empty] | unique | join(",")' "$TMP/idps.json" 2>/dev/null | tr -cd '[:alnum:]_,-' | cut -c1-120 || true)
            identity_providers="http=200;count=$idp_count;types=${idp_types:-none}"
          else
            identity_providers="http=$idp_code;read-denied-or-unavailable"
          fi
          subdomain_code=$(get_json "$API/accounts/$account_id/workers/subdomain" "$TMP/subdomain.json")
          if [ "$subdomain_code" = 200 ] && jq -e '(.result.subdomain // "")|length>0' "$TMP/subdomain.json" >/dev/null 2>&1; then
            workers_subdomain='http=200;configured=yes'
          else
            workers_subdomain="http=$subdomain_code;configured=no-or-unavailable"
          fi
          finish
          {
            echo '## CRM Cloudflare preflight — read-only'
            echo '- Secret: `ARENA_CLOUDFLARE_TOKEN` was passed to this job; its value was not printed or saved as an artifact.'
            echo '- Requests: GET only. No resources, routes, policies, DNS, D1 rows, or Worker code were created or changed.'
            echo "- Authentication: $outcome; verification $verify"
            echo "- Token permission metadata: $groups"
            echo "- Accounts: $accounts"
            echo "- D1: $d1"
            echo "- Workers: $workers"
            echo "- Access applications: $access"
            echo "- Zones: $zones"
            echo "- Zero Trust organization: $zero_trust"
            echo "- Access identity provider types: $identity_providers"
            echo "- workers.dev subdomain: $workers_subdomain (value intentionally omitted)"
          } >> "$GITHUB_STEP_SUMMARY"
  report-auth:
    name: 'CRM auth — ${{ needs.probe.outputs.outcome }} — ${{ needs.probe.outputs.verify }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret auth result is encoded in this check name.'
  report-permissions:
    name: 'CRM token permissions — ${{ needs.probe.outputs.groups }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret permission metadata is encoded in this check name.'
  report-accounts:
    name: 'CRM accounts — ${{ needs.probe.outputs.accounts }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret account inventory is encoded in this check name.'
  report-d1:
    name: 'CRM D1 inventory — ${{ needs.probe.outputs.d1 }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret D1 inventory is encoded in this check name.'
  report-workers:
    name: 'CRM Worker inventory — ${{ needs.probe.outputs.workers }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret Worker inventory is encoded in this check name.'
  report-access:
    name: 'CRM Access inventory — ${{ needs.probe.outputs.access }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret Access inventory is encoded in this check name.'
  report-zones:
    name: 'CRM Zone inventory — ${{ needs.probe.outputs.zones }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret Zone inventory is encoded in this check name.'
  report-zero-trust:
    name: 'CRM Zero Trust — ${{ needs.probe.outputs.zero_trust }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret Zero Trust organization status is encoded in this check name.'
  report-access-idp:
    name: 'CRM Access IdP — ${{ needs.probe.outputs.identity_providers }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Non-secret identity-provider types are encoded in this check name.'
  report-workers-subdomain:
    name: 'CRM workers.dev — ${{ needs.probe.outputs.workers_subdomain }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The workers.dev subdomain value is intentionally omitted.'

  # ── Mirror of the deploy preflight, read-only (2026-11-05) ────────────────────────────────────
  # The deploy workflow failed on 2026-11-05T19:40Z inside its `Preflight isolation, required-secret
  # inventory, and read-only reference backup` step, BEFORE any A5 work and before any write. That
  # step contains twelve hard stops; without its log, "the deploy fails" is not a diagnosis. This job
  # re-runs the same twelve gates with GET requests and two read-only SELECTs, and publishes the
  # identifiers of the failing gates in a check name — readable on a phone, no log download, no write.
  #
  # It cannot prove a gate that depends on a value only the deploy job can read (nothing here is a
  # secret value): it reports `pass`, `fail:<why>`, or `unknown:<why>` — never a guess dressed as a pass.
  mirror:
    name: Read-only mirror of the deploy preflight gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.m.outputs.summary }}
      gates: ${{ steps.m.outputs.gates }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Twelve gates, read-only
        id: m
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
          OWNER_CRM_ACCESS_CODE: ${{ secrets.CRM_ACCESS_CODE }}
          API: https://api.cloudflare.com/client/v4
          TEST_DB_NAME: nasr-crm-test-db
          TEST_DB_UUID: 65bfcb14-4b48-423b-916f-00eefdb9ae1e
          REF_BACKUP_NAME: nasr-crm-test-db-backup-20261101
          REF_BACKUP_UUID: a7681217-32a3-48fd-b8f5-8a54ac7b35e7
          WORKER_NAME: nasr-crm-api-test
          WRANGLER_CFG: _worker/wrangler.crm.toml
        run: |
          set -euo pipefail
          umask 077
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          fails=''
          gates=''
          record() { # $1=gate id, $2=ok|info|fail|unknown, $3=short reason
            gates="${gates}${1}=${2}${3:+(${3})};"
            # `info` is a measurement that cannot fail a run: it records what happened without
            # pretending it is a deploy gate. Added 2026-11-05 after a gate marked `fail` on a
            # non-gate stopped the mirror at its first line and measured nothing else.
            case "$2" in
              ok|info) ;;
              *) fails="${fails}${1}${3:+(${3})}," ;;
            esac
          }
          publish() {
            local summary
            if [ -z "$fails" ]; then summary='all-gates-ok'; else summary="fail:${fails%,}"; fi
            {
              echo "summary=$summary"
              echo "gates=$gates"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY-PREFLIGHT-MIRROR $summary"
          }
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            record token fail secret-unavailable
            publish
            exit 0
          fi
          echo "::add-mask::${CLOUDFLARE_API_TOKEN}"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          get_json() {
            local url="$1" out="$2" code
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "$AUTH" --output "$out" --write-out '%{http_code}' "$url" 2>/dev/null || true)
            printf '%s' "${code:-000}"
          }
          post_sql() { # read-only SELECT only; every call site below passes a SELECT
            local uuid="$1" sql="$2" out="$3" code
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --request POST --header "$AUTH" --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg s "$sql" '{sql:$s}')" --output "$out" --write-out '%{http_code}' \
              "${API}/accounts/${account_id}/d1/database/${uuid}/query" 2>/dev/null || true)
            printf '%s' "${code:-000}"
          }

          # 0 — INFORMATIONAL, never a gate: `/user/tokens/verify` only accepts USER-owned tokens.
          # ARENA_CLOUDFLARE_TOKEN is account-owned, so 401 with Cloudflare error 1000 is the correct
          # answer for it, not a defect. Measured, labelled, and allowed to fail — because a probe that
          # treats a non-gate as a gate reports a problem that does not exist and hides the ones that do.
          utok_code=$(get_json "$API/user/tokens/verify" "$TMP/uv.json")
          record userTokenEndpoint info "http=$utok_code,not-a-gate-for-account-owned-tokens"

          # 1 — exactly one account. This IS the deploy preflight's first Cloudflare stop, and the
          # first point at which a run can legitimately end.
          accounts_code=$(get_json "$API/accounts?per_page=100" "$TMP/a.json")
          account_count=$(jq -r '.result | length' "$TMP/a.json" 2>/dev/null || echo x)
          if [ "$accounts_code" = 200 ] && [ "$account_count" = 1 ]; then
            account_id=$(jq -r '.result[0].id' "$TMP/a.json")
            record token ok ''
          else
            cf_code=$(jq -r '(.errors[0].code // "?" )|tostring' "$TMP/a.json" 2>/dev/null | tr -cd '0-9' | cut -c1-8)
            record token fail "accounts-http=$accounts_code,count=$account_count,cf=${cf_code:-?}"
            publish
            echo "::error::GET /accounts is not readable with this token. The deploy preflight stops here too. Add 'Account Settings: Read' (Cloudflare error ${cf_code:-?})."
            exit 1
          fi

          # 3 — workers.dev subdomain matches the allowed origin pinned in the config
          sub_code=$(get_json "$API/accounts/${account_id}/workers/subdomain" "$TMP/s.json")
          subdomain=$(jq -r '.result.subdomain // empty' "$TMP/s.json" 2>/dev/null || true)
          config_origin=$(grep -oE 'CRM_ALLOWED_ORIGIN = "[^"]+"' "$WRANGLER_CFG" | head -1 | sed -E 's/.*"(.*)"/\1/')
          expected_origin="https://${WORKER_NAME}.${subdomain}.workers.dev"
          if [ "$sub_code" = 200 ] && [ "$config_origin" = "$expected_origin" ]; then
            record subdomain ok ''
          else
            record subdomain fail "http=$sub_code,config-matches-runner=no"
          fi

          # 4 — D1 inventory readable
          d1_code=$(get_json "$API/accounts/${account_id}/d1/database?per_page=100" "$TMP/d.json")
          if [ "$d1_code" = 200 ]; then record d1 ok ''; else record d1 fail "http=$d1_code"; fi

          # 5 — the authorised test database is present under both name and uuid
          if [ "$d1_code" = 200 ] && jq -e --arg u "$TEST_DB_UUID" --arg n "$TEST_DB_NAME" \
               '.result[] | select(.uuid == $u and .name == $n)' "$TMP/d.json" >/dev/null 2>&1; then
            record testdb ok ''
          else
            record testdb fail missing-or-renamed
          fi

          # 5b — the production database must be visible in the inventory. The deploy preflight does not
          # read its rows: it takes a name/size/tables signature and re-checks it after the run. If the
          # token cannot even see the row, the deploy stops with
          # `production DB nasr-market-db signature unreadable` before any A5 work. This gate reads
          # presence only — never a query against the production database.
          PROD_DB_UUID=ace5c9a2-c6b1-47b3-adf1-77e84ac50abf
          if [ "$d1_code" = 200 ] && jq -e --arg u "$PROD_DB_UUID" \
               '.result[] | select(.uuid == $u)' "$TMP/d.json" >/dev/null 2>&1; then
            record proddb ok visible-not-queried
          else
            record proddb fail not-visible-to-this-token
          fi

          # 6 — the read-only reference backup still exists (a stopped gate if it was deleted)
          if [ "$d1_code" = 200 ] && jq -e --arg u "$REF_BACKUP_UUID" --arg n "$REF_BACKUP_NAME" \
               '.result[] | select(.uuid == $u and .name == $n)' "$TMP/d.json" >/dev/null 2>&1; then
            record refbackup ok ''
          else
            record refbackup fail not-in-inventory
          fi

          # 7 — that backup answers a read-only COUNT and is non-empty
          if [ "$d1_code" = 200 ]; then
            bak_code=$(post_sql "$REF_BACKUP_UUID" \
              "SELECT COUNT(*) AS cnt FROM crm_contacts WHERE name NOT LIKE 'TEST ONLY%';" "$TMP/b.json")
            bak_cnt=$(jq -r '.result[0].results[0].cnt // empty' "$TMP/b.json" 2>/dev/null || true)
            if [ "$bak_code" = 200 ] && [ -n "$bak_cnt" ] && [ "$bak_cnt" -ge 1 ] 2>/dev/null; then
              record backuprows ok ""
            else
              record backuprows fail "http=$bak_code,rows=${bak_cnt:-unreadable}"
            fi
          else
            record backuprows unknown d1-inventory-unreadable
          fi

          # 8 — required Worker secret NAMES are present (values are never requested)
          sec_code=$(get_json "$API/accounts/${account_id}/workers/scripts/${WORKER_NAME}/secrets" "$TMP/x.json")
          if [ "$sec_code" = 200 ]; then
            miss=''
            for name in CRM_SESSION_SECRET CRM_INGEST_PRIVATE_KEY CRM_VAPID_PRIVATE_KEY CRM_VAPID_PUBLIC_KEY; do
              jq -e --arg s "$name" '[.result[]?.name] | index($s) != null' "$TMP/x.json" >/dev/null 2>&1 || miss="${miss}${name} "
            done
            if [ -z "$miss" ]; then record secrets ok ''; else record secrets fail "missing=$(echo "$miss" | tr ' ' '+')"; fi
          else
            record secrets fail "http=$sec_code"
          fi

          # 9 — the auth mode the deploy job needs: worker code, or worker verifier + GitHub code
          if [ "$sec_code" = 200 ]; then
            has_code=$(jq -r '[.result[]?.name] | index("CRM_ACCESS_CODE") != null' "$TMP/x.json")
            has_verifier=$(jq -r '[.result[]?.name] | index("CRM_ACCESS_CODE_VERIFIER") != null' "$TMP/x.json")
            if [ "$has_code" = true ]; then
              record authmode ok worker-direct-code
            elif [ "$has_verifier" = true ] && [ -n "${OWNER_CRM_ACCESS_CODE:-}" ]; then
              record authmode ok worker-verifier+github-code
            else
              record authmode fail "worker-code=$has_code,worker-verifier=$has_verifier,github-code=$([ -n "${OWNER_CRM_ACCESS_CODE:-}" ] && echo present || echo absent)"
            fi
          else
            record authmode unknown secrets-unreadable
          fi

          # 10 — the public ingest key row exists in the test database (read-only SELECT)
          if [ "$d1_code" = 200 ]; then
            pub_code=$(post_sql "$TEST_DB_UUID" \
              "SELECT resource_id AS pub FROM crm_idempotency_receipts WHERE submission_key='system:ingest-public-key-v1' LIMIT 1;" \
              "$TMP/p.json")
            pub_val=$(jq -r '.result[0].results[0].pub // empty' "$TMP/p.json" 2>/dev/null || true)
            if [ "$pub_code" = 200 ] && [ -n "$pub_val" ]; then record pubkey ok ''; else record pubkey fail "http=$pub_code,row=absent"; fi
          else
            record pubkey unknown d1-inventory-unreadable
          fi

          publish
          if [ -n "$fails" ]; then
            echo "::error::Deploy preflight would stop at: ${fails}. Each identifier above is one hard stop in crm-cloudflare-test-deploy.yml."
            exit 1
          fi

  report-preflight-mirror:
    name: 'CRM deploy preflight mirror — ${{ needs.mirror.outputs.summary }}'
    needs: mirror
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Non-secret gate results are encoded in this check name
        run: |
          echo 'Every gate, in order:' "${{ needs.mirror.outputs.gates }}"
          echo 'Any identifier in the check name is one hard stop in crm-cloudflare-test-deploy.yml.'
