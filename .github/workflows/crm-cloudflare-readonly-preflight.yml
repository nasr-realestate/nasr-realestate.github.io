name: CRM Cloudflare read-only preflight

on:
  push:
    branches:
      - arena/a9241018-nasr-realestate-github-io
    paths:
      - .github/workflows/crm-cloudflare-readonly-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-cloudflare-readonly-preflight
  cancel-in-progress: true

jobs:
  probe:
    name: Read-only Cloudflare GET probes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ARENA_CLOUDFLARE_TOKEN }}
    outputs:
      outcome: ${{ steps.probe.outputs.outcome }}
      details: ${{ steps.probe.outputs.details }}
    steps:
      - name: Verify exact secret and inventory read access (GET only)
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          API='https://api.cloudflare.com/client/v4'
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          outcome=''
          details=''
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            outcome='secret-unavailable-to-workflow'
            details='no-request-made'
            printf 'outcome=%s\ndetails=%s\n' "$outcome" "$details" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo '::add-mask::'"$CLOUDFLARE_API_TOKEN"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          get_json() {
            local url="$1" destination="$2" code
            code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --header "$auth_header" --output "$destination" --write-out '%{http_code}' "$url" 2>/dev/null || true)
            printf '%s' "${code:-000}"
          }
          verify_code=$(get_json "$API/user/tokens/verify" "$TMP/verify.json")
          token_status=$(jq -r '.result.status // "unknown"' "$TMP/verify.json" 2>/dev/null || echo unknown)
          verify_error_code=$(jq -r '(.errors[0].code // "unknown")|tostring' "$TMP/verify.json" 2>/dev/null | tr -cd '0-9' | cut -c1-12 || true)
          if [ "$verify_code" != 200 ] || [ "$token_status" != active ]; then
            outcome='token-verification-failed'
            details="verify_http=$verify_code;error_code=${verify_error_code:-unknown};status_active=no"
            printf 'outcome=%s\ndetails=%s\n' "$outcome" "$details" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          permission_groups=$(jq -r '[.result.policies[]?.permission_groups[]?.name] | unique | join(",")' "$TMP/verify.json" 2>/dev/null | tr -d '\r\n' | cut -c1-200 || true)
          account_code=$(get_json "$API/accounts?per_page=50" "$TMP/accounts.json")
          if [ "$account_code" != 200 ]; then
            outcome='token-valid-account-inventory-denied'
            details="verify_http=200;account_http=$account_code;groups=${permission_groups:-not-returned}"
            printf 'outcome=%s\ndetails=%s\n' "$outcome" "$details" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          account_count=$(jq -r '.result | length' "$TMP/accounts.json")
          if [ "$account_count" -ne 1 ]; then
            outcome='token-valid-account-selection-required'
            details="accounts_visible=$account_count;groups=${permission_groups:-not-returned}"
            printf 'outcome=%s\ndetails=%s\n' "$outcome" "$details" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          account_id=$(jq -r '.result[0].id' "$TMP/accounts.json")
          inventory_probe() {
            local label="$1" url="$2" destination="$3" code count
            code=$(get_json "$url" "$destination")
            if [ "$code" = 200 ]; then count=$(jq -r 'if (.result|type)=="array" then (.result|length) else "unknown" end' "$destination" 2>/dev/null || echo unknown); else count='unavailable'; fi
            printf '%s=%s:%s' "$label" "$code" "$count"
          }
          d1=$(inventory_probe d1 "$API/accounts/$account_id/d1/database?per_page=100" "$TMP/d1.json")
          workers=$(inventory_probe workers "$API/accounts/$account_id/workers/scripts?per_page=100" "$TMP/workers.json")
          access=$(inventory_probe access "$API/accounts/$account_id/access/apps?per_page=100" "$TMP/access.json")
          zones=$(inventory_probe zones "$API/zones?account.id=$account_id&per_page=100" "$TMP/zones.json")
          outcome='token-valid-read-probes-completed'
          details="accounts_visible=1;$d1;$workers;$access;$zones;groups=${permission_groups:-not-returned}"
          printf 'outcome=%s\ndetails=%s\n' "$outcome" "$details" >> "$GITHUB_OUTPUT"
          {
            echo '## CRM Cloudflare preflight — read-only'
            echo '- Secret: `ARENA_CLOUDFLARE_TOKEN` was passed to this job; its value was not printed or saved as an artifact.'
            echo '- Requests: GET only. No resources, routes, policies, DNS, D1 rows, or Worker code were created or changed.'
            echo "- Outcome: $outcome"
            echo "- Inventory/permission metadata: $details"
          } >> "$GITHUB_STEP_SUMMARY"
  report:
    name: 'CRM preflight — ${{ needs.probe.outputs.outcome }} — ${{ needs.probe.outputs.details }}'
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record non-secret result
        env:
          OUTCOME: ${{ needs.probe.outputs.outcome }}
          DETAILS: ${{ needs.probe.outputs.details }}
        run: |
          printf 'Preflight outcome: %s\nDetails: %s\n' "${OUTCOME:-unknown}" "${DETAILS:-unavailable}"
