# مؤقت — فحص بناء Jekyll على فرع الجلسة قبل الدمج. يُحذف بعد النجاح.
name: TMP Jekyll build check
on:
  push:
    paths:
      - ".github/workflows/tmp-jekyll-build-check.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Assert key outputs exist
        run: |
          set -e
          test -f _site/notifications.html
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/assets/js/push-notifications.js
          grep -q "فعّل التنبيهات" _site/notifications.html
          grep -q "push-notifications.js" _site/index.html
          grep -q "notificationclick" _site/sw.js
          echo "BUILD_OK"
          echo "::notice title=Jekyll build::BUILD_OK"
