# إرسال إشعار Web Push عند إضافة عقار أو طلب جديد — 2026-10-10 (نظام Cloudflare/VAPID)
#
# ◦ مشغّل خفيف: بلا npm install — سكربت Node فقط (.github/scripts/push-notify.mjs).
# ◦ يُرسل عند إضافة ملف جديد فقط إلى _properties/ أو _requests/ (لا تعديل/حذف).
# ◦ إعادة تشغيل الـWorkflow يدويًا لا تُرسل شيئًا إلا بوضع test-single
#   ومعرّف جهاز واحد (لا إرسال جماعي تجريبي).
# ◦ الإرسال idempotent عبر commit SHA + مسار الملف (الـWorker يمنع التكرار في KV).
# ◦ فشل الإرسال يفشل الـWorkflow فعليًا (exit 1).
#
# الأسرار:
#   PUSH_SEND_SECRET (اختياري) — سر مشترك صريح بين GitHub و Worker.
#   إن لم يوجد، يُشتق السر من ARENA_CLOUDFLARE (نفس التحويل في push-notify-setup.yml)
#   عبر HMAC-SHA256 — القيمة لا تُطبع في السجلات إطلاقًا.
name: إرسال إشعار عند إضافة عقار أو طلب جديد

on:
  push:
    branches:
      - master
    paths:
      - '_properties/**'
      - '_requests/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "وضع التشغيل (الافتراضي: لا إرسال)"
        type: choice
        options:
          - none
          - test-single
        default: none
      target:
        description: "معرّف اشتراك جهاز واحد للاختبار (من صفحة التنبيهات)"
        type: string
        required: false
        default: ""
      file_path:
        description: "مسار ملف md واحد اختياري للاختبار (مثل _properties/example.md)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# منع التوازي حتى لا يتسابق تشغيلان على نفس الـidempotency keys
concurrency:
  group: send-notification
  cancel-in-progress: false

jobs:
  send-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4
        with:
          # تاريخ كامل صغير الحجم — حتى يظهر فرق «المُضافة فقط» حتى مع دفعات متعددة الكوميتات
          fetch-depth: 0

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إعداد سر الإرسال (لا يُطبع أبدًا)
        env:
          S_ARENA_CLOUDFLARE: ${{ secrets.ARENA_CLOUDFLARE }}
          S_PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "${S_PUSH_SEND_SECRET:-}" ]; then
            TOKEN="$S_PUSH_SEND_SECRET"
          elif [ -n "${S_ARENA_CLOUDFLARE:-}" ]; then
            TOKEN=$(node -e 'const c=require("crypto");process.stdout.write(c.createHmac("sha256",process.argv[1]).update("nasr-realestate/push-send/v1").digest("hex"))' "$S_ARENA_CLOUDFLARE")
          else
            echo "::error title=PUSH_AUTH_MISSING::لا يوجد سر إرسال (PUSH_SEND_SECRET أو ARENA_CLOUDFLARE) — أضفه من إعدادات المستودع."
            exit 1
          fi
          echo "PUSH_SEND_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "send-auth: ready (hidden)"

      - name: إرسال الإشعارات (الملفات المُضافة فقط)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/push-notify.mjs
