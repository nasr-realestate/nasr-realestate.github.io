name: Deploy Jekyll with Plugins

on:
  # ناشر واحد فقط: master عبر هذا الملف. لا يوجد فرع main (2026-10-18)،
  # وإزالته من هنا تمنع مسار نشر ثانيًا لو أُنشئ مستقبلًا بالخطأ.
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# مجموعة واحدة لكل عمليات Pages: لا يتداخل نشران أبدًا. لا نلغي نشرًا
# جاريًا في منتصفه (cancel-in-progress: false) حتى لا يبقى الموقع على نسخة
# نصف مبنية؛ التشغيلات التالية تنتظر بالترتيب.
concurrency:
  group: "pages-production"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # ══════════════════════════════════════════════════════════════
      #  طبقة الذكاء الاصطناعي (2026-10-16)
      # ──────────────────────────────────────────────────────────────
      #  تُبنى **بعد** Jekyll ومباشرةً داخل _site، وسببها أن Jekyll وحده
      #  لا يستطيع توليد ملف واحد لكل عقار (Liquid لا يُنشئ ملفات)، وإضافة
      #  إضافة Ruby جديدة (_plugins) كانت ستُخاطر ببناء الموقع كله.
      #  هذا المُولّد هو ملف Node واحد يقرأ _properties/*.md مباشرة:
      #     ai-feed.json · llms-full.txt · api/** · search-data.json · .well-known/**
      #  ويفشل بـ exit code غير صفري لو لم يجد أي عقار — أي أن نشرًا
      #  بلا بيانات عقارية يتوقف بدل أن ينشر طبقة فارغة.
      # ══════════════════════════════════════════════════════════════
      - name: Setup Node (for the AI layer)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⚠️ بلا `npm install` عن قصد (تصحيح 2026-10-18):
      #    package-lock.json **مُتتبَّع في Git** (كان التعليق القديم يقول العكس)،
      #    فـ`npm ci` كان سينجح. لكن المُولّد ومعه بوابة الصوت والاختبارات
      #    مستقلّة تمامًا — بلا أي حزمة خارجية — فالتثبيت يكلّف دقيقة مقابل لا شيء.
      #    لو أُضيفت حزمة إلى scripts/* في المستقبل، أضف خطوة `npm ci` هنا.
      - name: Generate AI discovery layer into _site
        run: node scripts/build-ai-artifacts.mjs --out=_site

      # ختم النشر: ملف عام صغير يقرأه التحقق بعد النشر ليتأكد أن CDN قدّم
      # نسخة هذا الـcommit بالتحديد (بدل افتراض أن النشر تم).
      - name: Stamp deploy info (commit SHA) into the artifact
        run: |
          mkdir -p _site/.well-known
          printf '{"sha":"%s","ref":"%s","run_id":"%s","built_at":"%s"}\n' \
            "${{ github.sha }}" "${{ github.ref_name }}" "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > _site/.well-known/deploy-info.json
          cat _site/.well-known/deploy-info.json

      - name: Verify the AI layer is complete and valid JSON
        run: |
          node --test _worker/tests/ai-artifacts.test.mjs
          node --test _worker/tests/mcp-gateway.test.mjs
          node --test scripts/tests/front-matter.test.mjs

      # 🎙️ بوابة الهوية الصوتية — تسبق الرفع فلا يُنشر انحراف صامت.
      #    تتحقق من: بصمة المرجع الذي اختاره المالك، بصمة إعدادات الصوت
      #    (encoding/id3/engine) مقابل سجل الإنتاج، أن كل MP3 مقيد في السجل،
      #    أن لا ملف منشور استُبدل، وأن وسوم كل ملف ونصه ومدته مطابقة لصفحته.
      #    تعمل على المصدر فقط: لا _site ولا حزم خارجية (مثل المُولّد أعلاه).
      - name: Verify the audio voice identity gate (reference, production log, every MP3)
        run: node scripts/audio/verify-voice-identity.mjs

      - name: Test the voice identity pipeline, gate and MPEG/ID3 tooling
        run: node --test scripts/tests/voice-identity.test.mjs

      # ⚠️ لا ترفع هذا الإصدار إلى upload-pages-artifact@v4 بلا تعديل:
      #    v4 يحجب كل ما يبدأ بنقطة افتراضيًا (`--exclude=.[^/]*`) فيختفي
      #    مجلد .well-known بالكامل وبلا أي رسالة خطأ. v3 لا يحجب إلا .git
      #    و .github. وللتأمين الإضافي يُنتج المُولّد نسختين جذريتين
      #    (ai.txt · mcp.json) بنفس المحتوى تمامًا.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ══════════════════════════════════════════════════════════════════
  #  تحقّق ما بعد النشر — قراءة فقط، ويفشل بصوت عالٍ.
  #  لا يوقف النشر (وقع بالفعل) ولا يعدّل أي شيء منشور؛ مجرد فشل واضح في
  #  سجل التشغيل لو قدّم CDN نسخة قديمة أو نقص الصوت أو اختلف عدد MCP.
  # ══════════════════════════════════════════════════════════════════
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout (قائمة الصوت للتحقق من الأحجام)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify the live deployment (SHA · feed · MCP · every MP3)
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOY_VERIFY_TIMEOUT_S: "300"
        run: node scripts/verify-deployment.mjs
