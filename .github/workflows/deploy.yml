name: Deploy Jekyll with Plugins

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-jekyll-own"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # ══════════════════════════════════════════════════════════════
      #  طبقة الذكاء الاصطناعي (2026-10-16)
      # ──────────────────────────────────────────────────────────────
      #  تُبنى **بعد** Jekyll ومباشرةً داخل _site، وسببها أن Jekyll وحده
      #  لا يستطيع توليد ملف واحد لكل عقار (Liquid لا يُنشئ ملفات)، وإضافة
      #  إضافة Ruby جديدة (_plugins) كانت ستُخاطر ببناء الموقع كله.
      #  هذا المُولّد هو ملف Node واحد يقرأ _properties/*.md مباشرة:
      #     ai-feed.json · llms-full.txt · api/** · search-data.json · .well-known/**
      #  ويفشل بـ exit code غير صفري لو لم يجد أي عقار — أي أن نشرًا
      #  بلا بيانات عقارية يتوقف بدل أن ينشر طبقة فارغة.
      # ══════════════════════════════════════════════════════════════
      - name: Setup Node (for the AI layer)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ⚠️ بلا `npm install` عن قصد:
      #    package-lock.json مستثنى من Git في هذا المستودع (انظر .gitignore)،
      #    لذلك `npm ci` يفشل هنا. والمُولّد مستقل تمامًا — بلا أي حزمة خارجية —
      #    فخطوة التثبيت تكلّف دقيقة كاملة مقابل لا شيء.
      - name: Generate AI discovery layer into _site
        run: node scripts/build-ai-artifacts.mjs --out=_site

      - name: Verify the AI layer is complete and valid JSON
        run: |
          node --test _worker/tests/ai-artifacts.test.mjs
          node --test _worker/tests/mcp-gateway.test.mjs
          node --test scripts/tests/front-matter.test.mjs

      # 🎙️ بوابة الهوية الصوتية — تسبق الرفع فلا يُنشر انحراف صامت.
      #    تتحقق من: بصمة المرجع الذي اختاره المالك، بصمة إعدادات الصوت
      #    (encoding/id3/engine) مقابل سجل الإنتاج، أن كل MP3 مقيد في السجل،
      #    أن لا ملف منشور استُبدل، وأن وسوم كل ملف ونصه ومدته مطابقة لصفحته.
      #    تعمل على المصدر فقط: لا _site ولا حزم خارجية (مثل المُولّد أعلاه).
      - name: Verify the audio voice identity gate (reference, production log, every MP3)
        run: node scripts/audio/verify-voice-identity.mjs

      - name: Test the voice identity pipeline, gate and MPEG/ID3 tooling
        run: node --test scripts/tests/voice-identity.test.mjs

      # ⚠️ لا ترفع هذا الإصدار إلى upload-pages-artifact@v4 بلا تعديل:
      #    v4 يحجب كل ما يبدأ بنقطة افتراضيًا (`--exclude=.[^/]*`) فيختفي
      #    مجلد .well-known بالكامل وبلا أي رسالة خطأ. v3 لا يحجب إلا .git
      #    و .github. وللتأمين الإضافي يُنتج المُولّد نسختين جذريتين
      #    (ai.txt · mcp.json) بنفس المحتوى تمامًا.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
